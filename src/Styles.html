<style>
  :root {
    --fundo: #f3f4f6;
    --superficie: #ffffff;
    --borda: #dfe2e6;
    --borda-forte: #c9cdd3;
    --texto: #16181b;
    --texto-2: #5b6068;
    --primario: #16181b;
    --primario-texto: #ffffff;
    --destaque: #fff7d6;
    --raio: 8px;
    --sombra: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 16px rgba(0, 0, 0, .06);
    --fonte: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --fonte-etq: Nunito, "Segoe UI", Arial, sans-serif; /* a mesma das etiquetas da planta */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font: 14px/1.4 var(--fonte);
    display: flex;
    flex-direction: column;
  }
  [hidden] { display: none !important; }

  /* ---------- topo ---------- */
  .topo {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    padding: 10px 16px;
    background: var(--superficie);
    border-bottom: 1px solid var(--borda);
  }
  .identidade { display: flex; align-items: center; gap: 10px; min-width: 190px; }
  .identidade h1 { margin: 0; font-size: 15px; letter-spacing: .2px; }
  .identidade p { margin: 0; font-size: 12px; color: var(--texto-2); }
  .logo { width: 26px; height: 26px; color: var(--texto); }

  .seletores { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; flex: 1 1 auto; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; }

  .campo { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--texto-2); }
  .campo > span, .campo > legend { font-weight: 600; text-transform: uppercase; letter-spacing: .4px; font-size: 11px; }
  .campo.bloco { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin: 0 0 14px; border: 0; padding: 0; }

  select, input[type="text"] {
    font: inherit;
    color: var(--texto);
    background: var(--superficie);
    border: 1px solid var(--borda-forte);
    border-radius: var(--raio);
    padding: 7px 10px;
    min-width: 170px;
  }
  select:focus-visible, input:focus-visible, .btn:focus-visible, .aba:focus-visible, .chip:focus-visible {
    outline: 2px solid #3b82f6;
    outline-offset: 1px;
  }

  .abas { display: inline-flex; background: #eceef1; border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .aba {
    border: 0;
    background: transparent;
    font: 600 12px var(--fonte);
    letter-spacing: .4px;
    padding: 7px 12px;
    border-radius: 8px;
    color: var(--texto-2);
    cursor: pointer;
  }
  .aba:hover { color: var(--texto); }
  .aba[aria-selected="true"] { background: var(--primario); color: var(--primario-texto); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 600 13px var(--fonte);
    padding: 7px 12px;
    border-radius: var(--raio);
    border: 1px solid var(--borda-forte);
    background: var(--superficie);
    color: var(--texto);
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: #f5f6f8; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.primario { background: var(--primario); border-color: var(--primario); color: var(--primario-texto); }
  .btn.primario:hover { background: #2b2f35; }
  .btn.fantasma { border-color: transparent; background: transparent; color: var(--texto-2); }
  .btn.fantasma:hover { color: var(--texto); background: #f0f1f3; }
  .btn.pequeno { padding: 5px 10px; font-size: 12px; }
  .btn[aria-pressed="true"] { background: var(--destaque); border-color: #e2c64a; }

  /* ---------- legenda e avisos ---------- */
  .faixa {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px 16px;
    padding: 8px 16px 0;
  }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .zoom { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; }
  .zoom .btn { min-width: 32px; justify-content: center; }
  .zoom #zoomNivel { min-width: 56px; font-variant-numeric: tabular-nums; }
  .legenda .rotulo { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-2); margin-right: 4px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--borda);
    background: var(--superficie);
    border-radius: 999px;
    padding: 3px 10px 3px 4px;
    font: 600 12px var(--fonte);
    color: var(--texto);
    cursor: pointer;
  }
  .chip .cor { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .15); }
  .chip[aria-pressed="true"] { border-color: var(--texto); box-shadow: inset 0 0 0 1px var(--texto); }
  .chip.inativo { opacity: .6; }
  .chip.inativo .cor { filter: grayscale(1); }
  .legenda .dica { font-size: 12px; color: var(--texto-2); }
  /* Filtros por tipo de movimento e por movimento (menus suspensos, ao lado das marcas). */
  .filtro-mov { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--borda); }
  .filtro-mov .rotulo { margin-right: 0; }
  .filtro-mov select { min-width: 0; max-width: 240px; padding: 5px 8px; font-size: 13px; border-radius: 999px; }
  .filtro-mov select.ativo { border-color: #3346b8; box-shadow: inset 0 0 0 1px #3346b8; font-weight: 600; }

  .avisos { font-size: 12px; color: #7a4b00; background: #fff8e6; border: 1px solid #f1d58a; border-radius: var(--raio); padding: 4px 10px; max-width: 640px; }
  .avisos summary { cursor: pointer; font-weight: 600; }
  .avisos ul { margin: 6px 0 4px; padding-left: 18px; max-height: 180px; overflow: auto; }

  .aviso-local { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texto-2); background: #eef2ff; border: 1px solid #c7d2fe; border-radius: var(--raio); padding: 2px 4px 2px 10px; }
  .bloco-opcao { margin: 0 0 14px; }

  .barra-edicao {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin: 8px 16px 0;
    padding: 8px 12px;
    background: var(--destaque);
    border: 1px solid #e2c64a;
    border-radius: var(--raio);
    font-size: 13px;
  }
  .grupo-botoes { display: inline-flex; gap: 6px; flex-wrap: wrap; }

  /* Em destaque (Comunicações ER e Analytics), separados das outras ações. */
  .acoes { align-items: center; }
  .acoes-paineis { display: inline-flex; gap: 4px; padding: 3px; border-radius: 10px; background: #eef2ff; border: 1px solid #d5ddfb; }
  .btn.painel-botao { border-color: transparent; background: transparent; color: #27367a; }
  .btn.painel-botao:hover { background: #e0e7ff; }
  .btn.painel-botao[aria-pressed="true"] { background: #3346b8; border-color: #3346b8; color: #FFFFFF; }
  .acoes-divisor { width: 1px; align-self: stretch; margin: 2px 4px; background: var(--borda); }
  .btn.icone { padding: 7px; position: relative; }
  .btn.icone svg { width: 18px; height: 18px; }
  .btn.icone .badge { position: absolute; top: -4px; right: -4px; }

  /* ================= Desenvolvedor (Desenvolvedor.html): visual próprio, sempre escuro ================= */
  :root {
    --dev-fundo: #0b0f14;
    --dev-painel: #121821;
    --dev-painel-2: #18202b;
    --dev-borda: #263142;
    --dev-texto: #e6edf3;
    --dev-texto-2: #8b98a9;
    --dev-ambar: #f5a524;
    --dev-ambar-2: #ffcf6e;
    --dev-verde: #3ddc97;
    --dev-perigo: #ff6b6b;
    --dev-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  #btnConfig .dev-rotulo-btn { display: none; }
  body.modo-dev #btnConfig { background: var(--dev-ambar); color: #1a1205; border-color: var(--dev-ambar); width: auto; padding: 0 10px; gap: 6px; }
  body.modo-dev #btnConfig .dev-rotulo-btn { display: inline; font: 800 11px var(--dev-mono); letter-spacing: 1px; }
  body.modo-dev .topo { box-shadow: inset 0 -2px 0 var(--dev-ambar); }

  /* Faixa no alto enquanto a sessão do desenvolvedor está aberta. */
  .dev-faixa {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 16px;
    background: repeating-linear-gradient(135deg, #14100a 0 14px, #1d1608 14px 28px); color: var(--dev-texto);
    border-bottom: 1px solid #3a2a08; font-size: 12px;
  }
  .dev-faixa-selo { font: 800 11px var(--dev-mono); letter-spacing: 1.2px; text-transform: uppercase; color: #1a1205; background: var(--dev-ambar); padding: 3px 8px; border-radius: 4px; }
  .dev-faixa-texto { color: #d8c79f; flex: 1 1 auto; }
  .dev-faixa-btn { font: 700 12px var(--fonte); color: var(--dev-ambar-2); background: transparent; border: 1px solid #5a4410; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .dev-faixa-btn:hover, .dev-faixa-btn:focus-visible { background: #2a1f08; outline: none; }

  /* Diálogo da senha com o selo do desenvolvedor. */
  .dialogo.dev-acesso { border-top: 4px solid var(--dev-ambar); }

  /* Painel do desenvolvedor: tela quase inteira, escura, com âmbar e fonte mono nos rótulos. */
  .dev-console {
    border: 1px solid var(--dev-borda); border-radius: 14px; padding: 0;
    width: min(1180px, calc(100vw - 24px)); height: min(860px, calc(100vh - 24px)); max-width: none; max-height: none;
    background: var(--dev-fundo); color: var(--dev-texto); box-shadow: 0 30px 80px rgba(0, 0, 0, .55); color-scheme: dark;
  }
  .dev-console::backdrop { background: rgba(5, 8, 12, .72); backdrop-filter: blur(2px); }
  .dev-janela { height: 100%; display: flex; flex-direction: column; }
  .dev-topo {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 18px;
    background: linear-gradient(90deg, #17120a, var(--dev-painel) 45%); border-bottom: 1px solid var(--dev-borda);
  }
  .dev-marca { display: flex; align-items: center; gap: 12px; }
  .dev-selo { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--dev-ambar); color: #1a1205; font: 800 15px var(--dev-mono); }
  .dev-topo h2 { margin: 0; font-size: 17px; }
  .dev-topo p { margin: 2px 0 0; font: 12px var(--dev-mono); color: var(--dev-texto-2); }
  .dev-topo-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .dev-meio { flex: 1 1 auto; min-height: 0; display: flex; }
  .dev-abas { flex: 0 0 200px; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; border-right: 1px solid var(--dev-borda); background: var(--dev-painel); }
  .dev-aba {
    display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--dev-texto-2); font: 600 13px var(--fonte); cursor: pointer;
  }
  .dev-aba span { font: 700 11px var(--dev-mono); color: #5d6b7e; }
  .dev-aba:hover, .dev-aba:focus-visible { color: var(--dev-texto); background: var(--dev-painel-2); outline: none; }
  .dev-aba[aria-selected="true"] { color: var(--dev-texto); background: var(--dev-painel-2); border-color: var(--dev-borda); box-shadow: inset 3px 0 0 var(--dev-ambar); }
  .dev-aba[aria-selected="true"] span { color: var(--dev-ambar); }
  .dev-corpo { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 18px 22px 28px; }
  .dev-titulo { margin: 18px 0 10px; font: 700 12px var(--dev-mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--dev-ambar); }
  .dev-painel > .dev-titulo:first-child, .dev-secao-topo .dev-titulo { margin-top: 0; }
  .dev-nota { margin: 0 0 12px; color: var(--dev-texto-2); font-size: 13px; max-width: 760px; }
  .dev-vazio { color: var(--dev-texto-2); font-style: italic; font-size: 13px; }
  .dev-msg { margin: 0 0 14px; padding: 9px 12px; border-radius: 8px; border: 1px solid #1f5a43; background: #0d2a20; color: var(--dev-verde); font-size: 13px; }
  .dev-msg.erro { border-color: #6b2a2a; background: #2a1212; color: #ffb4b4; }
  .dev-secao-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }

  .dev-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--dev-borda); background: var(--dev-painel-2); color: var(--dev-texto); font: 600 13px var(--fonte); cursor: pointer;
  }
  .dev-btn:hover:not(:disabled), .dev-btn:focus-visible { border-color: #3a4a61; background: #1e2835; outline: none; }
  .dev-btn:disabled { opacity: .4; cursor: default; }
  .dev-btn.primario { background: var(--dev-ambar); border-color: var(--dev-ambar); color: #1a1205; }
  .dev-btn.primario:hover:not(:disabled), .dev-btn.primario:focus-visible { background: var(--dev-ambar-2); border-color: var(--dev-ambar-2); }
  .dev-btn.perigo { color: var(--dev-perigo); border-color: #4a2626; background: transparent; }
  .dev-btn.perigo:hover:not(:disabled) { background: #2a1212; border-color: #6b2a2a; }
  .dev-btn.pequeno { padding: 4px 9px; font-size: 12px; }
  .dev-btn.icone { width: 30px; height: 30px; padding: 0; font-size: 14px; }

  /* Módulos: cartões. */
  .dev-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .dev-card {
    position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 12px; text-align: left;
    border: 1px solid var(--dev-borda); background: var(--dev-painel); color: var(--dev-texto); cursor: pointer; text-decoration: none; font: inherit;
  }
  a.dev-card[hidden] { display: none; }
  .dev-card:hover, .dev-card:focus-visible { border-color: var(--dev-ambar); background: var(--dev-painel-2); outline: none; }
  .dev-card svg { flex: 0 0 auto; width: 22px; height: 22px; padding: 7px; box-sizing: content-box; border-radius: 9px; background: #1f1708; fill: none; stroke: var(--dev-ambar); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dev-card-texto { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .dev-card-texto strong { font-size: 14px; }
  .dev-card-texto small { color: var(--dev-texto-2); font-size: 12px; line-height: 1.35; }
  .dev-card .badge { position: absolute; top: 10px; right: 10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E8590C; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .dev-card-estado { display: none; position: absolute; right: 10px; bottom: 10px; font: 700 10px var(--dev-mono); letter-spacing: 1px; text-transform: uppercase; color: var(--dev-verde); }
  .dev-card[aria-pressed="true"] { border-color: #1f5a43; box-shadow: inset 0 0 0 1px #1f5a43; }
  .dev-card[aria-pressed="true"] .dev-card-estado { display: block; }

  /* Plantas. */
  .dev-plantas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: planta; }
  .dev-planta { border: 1px solid var(--dev-borda); border-radius: 12px; background: var(--dev-painel); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .dev-planta-cab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dev-id { font: 700 12px var(--dev-mono); color: #1a1205; background: var(--dev-ambar); border-radius: 5px; padding: 3px 7px; }
  .dev-console input[type="text"], .dev-console input[type="number"], .dev-console select {
    font: inherit; font-size: 13px; color: var(--dev-texto); background: var(--dev-fundo); border: 1px solid var(--dev-borda);
    border-radius: 7px; padding: 7px 9px; min-width: 0;
  }
  .dev-console input:focus-visible, .dev-console select:focus-visible { outline: 2px solid var(--dev-ambar); outline-offset: 1px; border-color: transparent; }
  .dev-console input.dev-nome { font-size: 15px; font-weight: 700; width: min(260px, 100%); }
  .dev-heranca { font: 12px var(--dev-mono); color: var(--dev-texto-2); }
  .dev-ordem { margin-left: auto; display: flex; gap: 4px; }
  .dev-planta-info, .dev-regras-planta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dev-chip { font: 12px var(--dev-mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--dev-borda); color: var(--dev-texto-2); background: var(--dev-fundo); }
  .dev-chip.forte { color: var(--dev-texto); border-color: #3a4a61; }
  .dev-chip.apelido { color: var(--dev-ambar-2); border-color: #5a4410; }
  .dev-chip.regra { color: #9fd8ff; border-color: #1f4060; }
  .dev-rotulo { font: 700 11px var(--dev-mono); letter-spacing: .8px; text-transform: uppercase; color: var(--dev-texto-2); margin-right: 4px; }
  .dev-campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .dev-campo { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--dev-texto-2); }
  .dev-campo.largo { grid-column: span 2; }
  .dev-planta-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .dev-confirmar { border: 1px solid #6b2a2a; background: #1c0e0e; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .dev-confirmar p { margin: 0; color: #ffb4b4; font-weight: 600; }
  .dev-opcao { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dev-texto); cursor: pointer; }
  .dev-opcao input { accent-color: var(--dev-ambar); width: 15px; height: 15px; }
  .dev-opcao.chip { padding: 4px 10px; border: 1px solid var(--dev-borda); border-radius: 999px; background: var(--dev-fundo); }
  .dev-opcao.chip:has(input:checked) { border-color: var(--dev-ambar); color: var(--dev-ambar-2); background: #1f1708; }

  /* Cascata. */
  .dev-fluxo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dev-no { font: 700 13px var(--dev-mono); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--dev-borda); background: var(--dev-painel); }
  .dev-no.com-regra { border-color: #1f4060; color: #9fd8ff; }
  .dev-seta { font: 12px var(--dev-mono); color: var(--dev-texto-2); }
  .dev-bloco { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--dev-borda); display: flex; flex-direction: column; gap: 10px; }
  .dev-regra { border: 1px solid var(--dev-borda); border-left: 3px solid var(--dev-ambar); border-radius: 10px; background: var(--dev-painel); padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .dev-regra > .dev-campos { width: 100%; }
  .dev-ers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dev-resumo { margin: 0; font: 12px var(--dev-mono); color: var(--dev-verde); align-self: end; }
  .dev-lista { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .dev-troca { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dev-troca input { flex: 1 1 220px; }
  .dev-link { color: var(--dev-ambar-2); font-weight: 700; text-decoration: none; word-break: break-word; }
  .dev-link:hover, .dev-link:focus-visible { text-decoration: underline; outline: none; }
  .dev-troca input[type="text"] { flex: 1 1 260px; }
  .dev-selo-estado { font: 700 10px var(--dev-mono); letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--dev-borda); color: var(--dev-texto-2); }
  .dev-selo-estado.mudou { color: var(--dev-ambar-2); border-color: #5a4410; background: #1f1708; }

  @media (max-width: 760px) {
    .dev-console { width: 100vw; height: 100vh; border-radius: 0; }
    .dev-meio { flex-direction: column; }
    .dev-abas { flex: 0 0 auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--dev-borda); }
    .dev-aba { white-space: nowrap; }
    .dev-corpo { padding: 14px 16px 24px; }
    .dev-campo.largo { grid-column: auto; }
  }
  .sp-campo { margin: 2px 0 10px 24px !important; }
  .sp-aviso { margin: 4px 0 8px !important; }

  /* Menu de configurações (engrenagem): validação, construção, ajuste das etiquetas, … e o modo desenvolvedor. */
  .menu-config { position: relative; }
  .menu-config:has(.menu-item[aria-pressed="true"]:not(#btnTema):not(#btnDesenvolvedor)) #btnConfig { color: var(--texto); background: var(--destaque); }
  .menu-lista {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 220px;
    display: flex; flex-direction: column; padding: 6px; gap: 2px;
    background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, .14);
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px;
    background: transparent; color: var(--texto); font: 600 13px var(--fonte); text-align: left; cursor: pointer; white-space: nowrap;
  }
  a.menu-item { color: inherit; text-decoration: none; }
  a.menu-item[hidden] { display: none; }
  .menu-item:hover, .menu-item:focus-visible { background: #f0f1f3; outline: none; }
  .menu-item:disabled { opacity: .5; cursor: default; background: transparent; }
  .menu-item[aria-pressed="true"] { background: var(--destaque); }
  .menu-item svg { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .menu-item .badge {
    margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E8590C; color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
  }
  .menu-divisor { height: 1px; margin: 4px 6px; background: var(--borda); }
  /* Modo desenvolvedor: o item com o selo âmbar (pede senha; com a sessão aberta, fica âmbar). */
  .menu-item.menu-dev svg { stroke: #b7791f; }
  .menu-item.menu-dev[aria-pressed="true"] { background: var(--dev-ambar); color: #1a1205; }
  .menu-item.menu-dev[aria-pressed="true"] svg { stroke: #1a1205; }

  /* Tamanho das etiquetas (modo ajuste). */
  .tamanho-etq { display: inline-flex; align-items: center; gap: 4px; }
  .tamanho-etq > span { font-size: 12px; margin-right: 4px; }
  #etqTamanho { min-width: 52px; justify-content: center; font-variant-numeric: tabular-nums; }

  /* ---------- palco (slide) ---------- */
  /* A planta ocupa toda a área abaixo do topo (sem moldura); o desenho fica centralizado nela. */
  .palco {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: stretch;
    padding: 8px 0 0;
  }
  /* A planta e o botão de baixar PNG, no canto de baixo dela. */
  .area-planta { position: relative; flex: 1 1 auto; min-width: 0; display: flex; }
  #slide {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    height: auto;
    min-height: 320px;
    background: #f3efea;
    user-select: none;
  }

  /* ---------- painéis laterais (Comunicações ER e Validação) ---------- */
  .painel-espaco {
    flex: 0 0 380px;
    min-height: 0;
    overflow: auto;
    background: var(--superficie);
    border-left: 1px solid var(--borda);
    font-size: 13px;
  }
  .esp-topo {
    position: sticky; top: 0; z-index: 1;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px 10px; background: var(--superficie); border-bottom: 1px solid var(--borda);
  }
  .esp-topo h2 { margin: 0; font-size: 16px; }
  .esp-topo span { color: var(--texto-2); font-size: 12px; }
  .esp-corpo { padding: 4px 18px 24px; }
  .esp-corpo h3 { margin: 20px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-2); }

  /* ---------- Analytics (meia tela, à direita da planta) ---------- */
  /* A planta continua na metade esquerda (com zoom e filtros); os painéis da direita saem enquanto ele está aberto. */
  .analytics {
    flex: 0 0 50%; width: 50%; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--fundo); border-left: 1px solid var(--borda); box-shadow: -8px 0 24px -18px rgba(0, 0, 0, .35);
  }
  body.com-analytics .painel-validacao, body.com-analytics .painel-construcao { display: none; }
  .analytics[hidden] { display: none; }
  .an-topo {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px clamp(16px, 2.5vw, 32px); background: var(--superficie); border-bottom: 1px solid var(--borda);
  }
  .an-topo h2 { margin: 0; font-size: 18px; }
  .an-topo span { color: var(--texto-2); font-size: 13px; }
  .an-topo-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  /* Aviso fixo no topo do Analytics (a página ainda está em construção). */
  .an-em-construcao {
    margin: 0; padding: 8px clamp(16px, 2.5vw, 32px); font-size: 13px; color: #7A4A00;
    background: #FFF4D6; border-bottom: 1px solid #F2D58A;
  }
  [data-tema="escuro"] .an-em-construcao { color: #FFD98A; background: #3A2E12; border-bottom-color: #5C4A1E; }
  #anInfo { display: inline-flex; align-items: center; gap: 6px; }
  .dialogo.an-info { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; }
  .an-info-regras { margin: 0 0 18px; padding-left: 18px; font-size: 13px; line-height: 1.5; display: grid; gap: 6px; }
  .an-info-legenda { border-top: 1px solid var(--borda); padding-top: 14px; }
  .an-info-legenda h3 { margin: 0; font-size: 14px; }
  .an-info-sub { margin: 2px 0 12px; color: var(--texto-2); font-size: 12px; }
  .an-corpo { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px clamp(16px, 2.5vw, 32px) 32px; font-size: 13px; }
  .an-vazio { color: var(--texto-2); font-style: italic; margin: 8px 0; }
  .an-nota { margin: 14px 0 0; color: var(--texto-2); font-size: 11.5px; line-height: 1.5; max-width: 980px; }

  .an-grade { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .an-cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; padding: 14px 16px 16px; min-width: 0; }
  .an-cartao-topo { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 16px; margin-bottom: 12px; }
  .an-cartao-topo h3 { margin: 0; font-size: 14px; flex: 0 0 auto; }
  .an-cartao-topo p { margin: 0; color: var(--texto-2); font-size: 12px; flex: 1 1 260px; }
  .an-controles { margin-left: auto; }
  .an-segmentado { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--fundo); border: 1px solid var(--borda); }
  .an-segmentado button {
    border: 0; background: transparent; padding: 4px 10px; border-radius: 6px;
    font: 600 12px var(--fonte); color: var(--texto-2); cursor: pointer;
  }
  .an-segmentado button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

  /* Mapa de calor movimento × ER */
  .an-tabela-rolagem { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  .an-mapa { width: 100%; border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
  .an-mapa th, .an-mapa td { padding: 0; font-weight: normal; }
  .an-mapa thead th { color: var(--texto-2); font-size: 12px; text-align: center; vertical-align: bottom; padding-bottom: 4px; }
  .an-mapa thead th.an-col-mov { text-align: left; font-weight: 600; }
  .an-mapa thead button {
    display: inline-flex; flex-direction: column; align-items: center; gap: 0; border: 0; background: none;
    padding: 2px 6px; border-radius: 6px; font: 600 12px var(--fonte); color: var(--texto); cursor: pointer;
  }
  .an-mapa thead button:hover { background: var(--fundo); }
  .an-mapa thead button small { font-weight: 400; color: var(--texto-2); font-size: 11px; }
  .an-mapa thead th.atual button > span:first-child { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .an-mapa th.an-col-mov { width: 30%; min-width: 160px; text-align: left; padding: 4px 8px 4px 0; }
  .an-mov-nome { display: flex; align-items: center; gap: 8px; font-weight: 600; font-family: var(--fonte-etq); }
  /* Bolinhas das marcas do movimento, ao lado do nome. */
  .an-marcas-mov { display: inline-flex; gap: 3px; flex: 0 0 auto; }
  .an-marcas-mov i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0, 0, 0, .12); }
  .an-mov-info { display: flex; flex-wrap: wrap; gap: 2px 8px; margin: 1px 0 0; font-size: 11px; color: var(--texto-2); }
  .an-mov-classe { display: inline-flex; align-items: center; gap: 4px; }
  .an-mov-classe::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: var(--cor-classe, transparent); }
  .an-mov-classe.sem::before { border: 1px dashed var(--borda-forte); }
  .an-gmv { font-weight: 600; color: var(--texto); }
  .an-celula { min-width: 44px; width: 50px; height: 30px; vertical-align: middle; }
  .an-celula > * {
    display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 30px;
    border: 0; border-radius: 5px; font: inherit; line-height: 1.1; color: var(--texto); background: none;
  }
  .an-celula button { cursor: pointer; }
  .an-celula button:hover { box-shadow: inset 0 0 0 2px var(--texto); }
  .an-celula button.escuro { color: #FFFFFF; }
  .an-celula strong { font-size: 11.5px; }
  .an-celula small { font-size: 9.5px; opacity: .75; }
  .an-cel-vazia { color: var(--borda-forte); }
  .an-mapa tbody td.atual > * { outline: 1.5px solid #27367a; outline-offset: -1px; }
  .an-mapa tbody tr.ativo th { box-shadow: inset 3px 0 0 #27367a; padding-left: 8px; }
  .an-mapa td.an-col-total { text-align: center; min-width: 70px; padding: 0 6px; border-left: 1px solid var(--borda); }
  .an-mapa td.an-col-total strong { display: block; font-size: 13px; }
  .an-mapa td.an-col-total small { color: var(--texto-2); font-size: 10.5px; }
  .an-mapa .an-col-moveis { width: 1%; padding: 0 8px; white-space: nowrap; }
  .an-mapa thead th.an-col-moveis { text-align: left; font-weight: 600; }
  .an-movel-icone { width: 34px; height: 26px; vertical-align: middle; margin-right: 2px; }
  .an-mapa .an-col-rede { width: 11%; min-width: 120px; padding: 0 10px 0 8px; border-right: 1px solid var(--borda); }
  .an-mapa thead th.an-col-rede { color: var(--texto); font-weight: 600; }
  .an-mapa thead th.an-col-rede small { display: block; font-weight: 400; color: var(--texto-2); font-size: 11px; }
  .an-rede-num { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
  .an-rede-num strong { font-size: 13px; }
  .an-rede-lojas { font-size: 11px; font-weight: 600; color: var(--texto); white-space: nowrap; }
  .an-rede-num small { flex: 1 0 100%; font-size: 10.5px; color: var(--texto-2); white-space: nowrap; }
  .an-rede-trilho { display: block; height: 4px; margin-top: 3px; border-radius: 2px; background: var(--fundo); }
  .an-rede-trilho span { display: block; height: 100%; border-radius: 2px; background: #3346B8; }
  .an-linha-livre th, .an-linha-livre td { border-top: 1px solid var(--borda); }
  .an-linha-livre .an-mov-nome { font-family: var(--fonte); color: var(--texto-2); font-style: italic; font-weight: 600; }
  .an-cel-livre { background: repeating-linear-gradient(135deg, #f1f2f4 0 6px, #e8eaed 6px 12px); color: var(--texto-2); }

  /* Barras 100% por ER */
  .an-espacos-grupo { margin: 14px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-2); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .an-espacos-grupo span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .an-espaco-nota { color: var(--texto-2); font-size: 11px; font-style: italic; }
  .an-secao { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--borda-forte); }
  .an-secao h3 { margin: 0; font-size: 16px; }
  .an-secao p { margin: 4px 0 0; color: var(--texto-2); font-size: 12.5px; }
  .an-espacos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 16px; }
  .an-espaco-tipo { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .an-espaco-tipo.fora { opacity: 0.6; }
  .an-espaco-mini { flex: 0 0 auto; width: 84px; height: 56px; }
  .an-espaco-texto { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 12px; }
  .an-espaco-texto strong { font-size: 12.5px; }
  .an-espaco-qtd { color: var(--texto-2); font-weight: 600; }
  .an-espaco-nomes { display: flex; flex-wrap: wrap; gap: 2px 8px; color: var(--texto-2); font-size: 11px; }
  .an-espaco-nomes > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .an-espaco-nomes i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .an-legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 10px; font-size: 12px; color: var(--texto-2); }
  .an-legenda > span { display: inline-flex; align-items: center; gap: 6px; }
  .an-legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .an-legenda i.borda, .an-seg.borda { box-shadow: inset 0 0 0 1px var(--borda-forte); }
  .an-barras { display: flex; flex-direction: column; gap: 8px; }
  .an-barra-linha { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; gap: 10px; }
  .an-barra-nome { font-weight: 600; font-size: 12px; }
  .an-barra-linha.atual .an-barra-nome { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .an-barra { display: flex; gap: 2px; height: 24px; }
  .an-seg {
    display: flex; align-items: center; justify-content: center; min-width: 3px; height: 100%; padding: 0; border: 0;
    font: 700 11px var(--fonte); color: #FFFFFF; overflow: hidden; white-space: nowrap;
  }
  .an-seg:first-child { border-radius: 4px 0 0 4px; }
  .an-seg:last-child { border-radius: 0 4px 4px 0; }
  .an-seg:only-child { border-radius: 4px; }
  .an-seg span { text-shadow: 0 0 3px rgba(0, 0, 0, .35); }
  .an-seg.borda, .an-seg.clara { color: var(--texto); }
  .an-seg.borda span, .an-seg.clara span { text-shadow: none; }
  button.an-seg { cursor: pointer; }
  button.an-seg:hover { filter: brightness(.9); }

  /* GMV × espaço */
  .an-indice { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--texto-2); }
  .an-indice.alto { color: #1d6b47; }
  .an-indice.baixo { color: #8a4510; }
  .an-disp { position: relative; }
  .an-disp-svg { display: block; overflow: visible; font-family: var(--fonte); }
  .an-disp-zona.alto { fill: #2F9E6B; opacity: .06; }
  .an-disp-zona.baixo { fill: #D9822B; opacity: .06; }
  .an-disp-zona-txt { fill: var(--texto-2); font-size: 11px; font-weight: 600; }
  .an-disp-grade { stroke: var(--borda); stroke-width: 1; }
  .an-disp-eixo { stroke: var(--borda-forte); stroke-width: 1; }
  .an-disp-diagonal { stroke: var(--texto-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .an-disp-tick { fill: var(--texto-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .an-disp-titulo-eixo { fill: var(--texto-2); font-size: 11.5px; font-weight: 600; }
  .an-disp-nome { fill: var(--texto); font: 600 11px var(--fonte-etq); pointer-events: none; }
  .an-disp-ponto { cursor: pointer; outline: none; }
  .an-disp-alvo { fill: transparent; }
  .an-disp-marca { stroke: var(--superficie); stroke-width: 2; }
  .an-disp-ponto:hover .an-disp-marca, .an-disp-ponto:focus-visible .an-disp-marca { stroke: var(--texto); }
  .an-disp-ponto.alto .an-disp-marca, .an-disp-cor.alto { fill: #2F9E6B; background: #2F9E6B; }
  .an-disp-ponto.medio .an-disp-marca, .an-disp-cor.medio { fill: #8C93A3; background: #8C93A3; }
  .an-disp-ponto.baixo .an-disp-marca, .an-disp-cor.baixo { fill: #D9822B; background: #D9822B; }
  .an-legenda i.an-disp-cor { border-radius: 50%; }
  .an-legenda i.an-disp-diag { width: 18px; height: 0; border-radius: 0; border-top: 1.5px dashed var(--texto-2); }
  .an-disp-dica {
    position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 1px; max-width: 260px; padding: 7px 10px;
    background: var(--superficie); border: 1px solid var(--borda-forte); border-radius: 8px; box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
    font-size: 12px; color: var(--texto-2); pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .an-disp-dica strong { color: var(--texto); font-family: var(--fonte-etq); }
  .an-disp-idx { margin-top: 2px; color: var(--texto); }
  .an-disp-idx.alto { color: #1d6b47; }
  .an-disp-idx.baixo { color: #8a4510; }

  /* Telas estreitas: a página rola; o Analytics ocupa a largura toda e a planta fica invisível por baixo. */
  @media (max-width: 900px) {
    body.com-analytics .palco { position: relative; }
    .analytics { flex: 1 1 auto; width: auto; border-left: 0; box-shadow: none; }
    .an-corpo { overflow: visible; }
    body.com-analytics .area-planta { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
    body.com-analytics .painel-loja, body.com-analytics .painel-validacao, body.com-analytics .painel-construcao { display: none; }
  }
  @media (max-width: 600px) {
    .an-topo { flex-wrap: wrap; }
  }
  .chip.chip-etiqueta { padding-left: 10px; }

  #slide:not(.construindo) { touch-action: none; }
  #slide:not(.construindo) .movel,
  #slide:not(.construindo) .grupo-etiquetas:not(.arrastavel) { cursor: pointer; }
  #slide.com-zoom.arrastando, #slide.com-zoom.arrastando * { cursor: grabbing; }
  /* Com zoom, as linhas-guia não engrossam (as caixas de destaque também mantêm o tamanho na tela). */
  #slide .guia-callout line { stroke-width: calc(1.3px / var(--zoom, 1)); }
  #slide .guia-callout circle { r: calc(4px / var(--zoom, 1)); stroke-width: calc(1.3px / var(--zoom, 1)); }
  #slide .guia .guia-linha { stroke-width: calc(1.3px / var(--zoom, 1)); }
  #slide .guia .guia-halo { stroke-width: calc(3.6px / var(--zoom, 1)); }
  #slide .guia .guia-ponto { r: calc(4.4px / var(--zoom, 1)); stroke-width: calc(1.6px / var(--zoom, 1)); }
  #slide .guia .guia-centro { r: calc(1.7px / var(--zoom, 1)); }
  #slide .movel:hover polygon { stroke-width: 2.2; }
  /* Destaque ao passar o mouse num móvel ou na ficha dele: a ficha ganha contorno e a linha-guia escurece. */
  #slide .grupo-etiquetas, #slide .camada-guias .guia { transition: opacity .15s ease; }
  #slide.destacando .grupo-etiquetas:not(.destaque),
  #slide.destacando .camada-guias .guia:not(.destaque) { opacity: .35; }
  #slide.destacando .grupo-etiquetas.destaque .ficha-fundo { stroke: #1C1C1C; stroke-width: 2; }
  #slide.destacando .grupo-etiquetas.destaque .etq { stroke: #111; stroke-width: 1.6; }
  #slide.destacando .camada-guias .guia.destaque .guia-linha { stroke: #111; stroke-width: calc(2.2px / var(--zoom, 1)); }
  #slide.destacando .movel.destaque polygon { stroke-width: 2.2; }
  @media (prefers-reduced-motion: reduce) { #slide .grupo-etiquetas, #slide .camada-guias .guia { transition: none; } }
  #slide .arrastavel { cursor: grab; }
  #slide .arrastavel:hover .ficha-fundo { stroke: #111; stroke-width: 1.5; }
  #slide .arrastavel:hover .etq { stroke: #111; stroke-width: 1.5; }
  #slide .arrastavel:active { cursor: grabbing; }

  #slide .movel.selecionado polygon { stroke: #ff6a00; stroke-width: 2.6; }
  #slide.construindo .movel { cursor: move; }
  #slide.construindo .camada-etiquetas,
  #slide.construindo .camada-guias { opacity: .35; pointer-events: none; }
  #slide.construindo .camada-sobreposta { pointer-events: none; }

  /* ---------- construir loja ---------- */
  body.construindo .palco { gap: 14px; align-items: flex-start; position: relative; padding: 8px 16px 16px; }
  body.construindo .area-planta { align-self: flex-start; }
  body.construindo #slide { width: auto; height: auto; aspect-ratio: 16 / 9; align-self: flex-start; }
  #slide.construindo .movel:hover polygon { stroke: #ff9a52; }
  .construtor {
    flex: 0 0 336px;
    max-height: calc(100vh - 140px);
    overflow: hidden; /* só o meio (.cns-corpo) rola; o rodapé fica fixo embaixo */
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 10px;
    box-shadow: var(--sombra);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  .construtor > *, .cns-corpo > * { padding-left: 14px; padding-right: 14px; }
  .construtor > .cns-corpo { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0; overscroll-behavior: contain; }
  .cns-topo { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--borda); flex: 0 0 auto; }
  .cns-topo h2 { margin: 0; font-size: 15px; }
  #cnsPlanta { font-size: 12px; color: var(--texto-2); font-weight: 600; }
  .cns-dica, .cns-ajuda { margin: 6px 0 10px; font-size: 12px; color: var(--texto-2); }
  kbd { font: 600 11px var(--fonte); background: #f0f1f3; border: 1px solid var(--borda-forte); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  .construtor section { border-top: 1px solid var(--borda); padding-top: 10px; padding-bottom: 10px; }
  .construtor h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-2); }

  .cns-salvos { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 0 0 10px; padding: 8px 10px; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; font-size: 12px; color: var(--texto-2); }
  .cns-paleta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cns-paleta button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 1px solid var(--borda); background: #fafbfc; border-radius: 8px;
    padding: 7px 4px 6px; font: 600 11px var(--fonte); color: var(--texto); cursor: pointer;
  }
  .cns-paleta button:hover { border-color: var(--texto); background: #fff; }
  .cns-paleta svg { width: 28px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }

  #cnsEspacos { word-break: break-word; font-weight: 600; color: var(--texto); }
  .cns-vazio { margin: 4px 0; color: var(--texto-2); font-style: italic; }
  .cns-campo { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 600; color: var(--texto-2); margin-bottom: 8px; }
  .cns-grupo { margin-bottom: 4px; }
  .cns-grupo > span { font-size: 11px; font-weight: 600; color: var(--texto-2); }
  .construtor .campos { display: grid; gap: 8px; margin: 4px 0 8px; }
  .construtor .campos.dois { grid-template-columns: 1fr 1fr; }
  .construtor .campos.tres { grid-template-columns: repeat(3, 1fr); }
  .construtor .campos label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--texto-2); }
  .construtor input[type="number"], .construtor input[type="text"], .construtor select { min-width: 0; width: 100%; padding: 5px 7px; font-size: 13px; }
  .cns-mais summary, .cns-secao summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--texto-2); padding: 2px 0; }
  .cns-mais { margin-top: 2px; }
  .cns-secao { border-top: 1px solid var(--borda); padding-top: 9px; padding-bottom: 9px; }
  .cns-secao[open] summary { margin-bottom: 8px; color: var(--texto); }
  .construtor #cnsLista { height: auto; }
  .construtor .linha-botoes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .construtor .campo-linha { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--texto-2); margin: 6px 0; }
  .construtor .campo-linha select { width: auto; }
  .construtor .campo-linha input[type="range"] { flex: 1; }

  .cns-rodape {
    flex: 0 0 auto;
    background: var(--superficie); border-top: 1px solid var(--borda);
    box-shadow: 0 -6px 12px -10px rgba(0, 0, 0, .25);
    padding-top: 10px; padding-bottom: 6px;
  }
  #cnsStatus { display: block; font-size: 12px; font-weight: 600; color: #15803d; margin-bottom: 6px; }
  #cnsStatus.sujo, #cnsStatus.salvando { color: #b45309; }
  #cnsStatus.erro { color: #b42318; cursor: pointer; }

  .cns-flutuante {
    position: absolute; z-index: 5; display: flex; gap: 2px;
    background: #16181b; border-radius: 8px; padding: 3px; box-shadow: var(--sombra);
    transform: translate(-50%, -100%);
  }
  .cns-flutuante button { border: 0; background: transparent; color: #fff; font: 600 12px var(--fonte); padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .cns-flutuante button:hover { background: rgba(255, 255, 255, .15); }
  .cns-flutuante button[data-acao="excluir"]:hover { background: #b42318; }

  @media (max-width: 1100px) {
    body.construindo .palco { flex-wrap: wrap; }
    body.construindo .area-planta, body.construindo #slide { width: 100%; }
    .construtor { flex: 1 1 100%; max-height: none; overflow: visible; }
    .construtor > .cns-corpo { overflow: visible; }
  }

  .vazio {
    max-width: 520px;
    margin: 40px auto;
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--sombra);
    text-align: center;
  }
  .vazio h2 { margin: 0 0 8px; font-size: 18px; }
  .vazio p { color: var(--texto-2); }

  /* ---------- diálogos ---------- */
  .dialogo {
    border: 0;
    border-radius: 12px;
    padding: 22px 22px 16px;
    width: min(460px, calc(100vw - 32px));
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    color: var(--texto);
  }
  .dialogo::backdrop { background: rgba(15, 17, 20, .45); }
  .dialogo h2 { margin: 0 0 4px; font-size: 17px; }
  .dialogo .sub { margin: 0 0 16px; color: var(--texto-2); font-size: 13px; }
  .dialogo input[type="text"], .dialogo select { width: 100%; }
  .opcao { display: flex; align-items: center; gap: 8px; color: var(--texto); font-size: 13px; padding: 3px 0; cursor: pointer; }
  .opcao small { color: var(--texto-2); font-size: 12px; }
  .opcao:has(input:disabled) { opacity: .5; cursor: default; }
  .rodape-dialogo { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  /* estratégia do móvel (clique no móvel): ocupa a tela inteira */
  .tela-movel {
    border: 0; padding: 0; margin: 0;
    width: 100vw; height: 100vh; max-width: none; max-height: none;
    background: var(--superficie); color: var(--texto);
  }
  .tela-movel::backdrop { background: var(--superficie); }
  .tela-movel form { height: 100%; display: flex; flex-direction: column; }
  .mv-topo {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 18px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--borda);
  }
  .mv-topo h2 { margin: 0; font-size: clamp(22px, 2.4vw, 32px); }
  .mv-topo p { margin: 2px 0 0; color: var(--texto-2); font-size: 15px; }
  .mv-corpo { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; } /* o móvel no topo; o planograma embaixo, na largura toda */
  /* Aviso fixo no topo da tela do móvel (não rola com o conteúdo). */
  .mv-aviso {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px 16px;
    background: #ffd84d; color: #3d2a00; border-bottom: 2px solid #e0a800;
    font-size: 16px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase;
  }
  .mv-aviso svg { flex: 0 0 auto; width: 20px; height: 20px; }
  [data-tema="escuro"] .mv-aviso { background: #6b5000; color: #ffe9a3; border-color: #a77d00; }
  /* Balão do mouse sobre o móvel (aba Inventario): lojas da rede. */
  .balao-rede {
    position: absolute; top: 14px; right: 14px; z-index: 5; display: flex; flex-direction: column; gap: 1px; padding: 8px 14px;
    background: var(--superficie); color: var(--texto); border: 1px solid var(--borda); border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .16); font-size: 13px; line-height: 1.35; pointer-events: none; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .balao-rede span:first-child { font-weight: 700; }
  .balao-rede span + span { color: var(--texto-2); }
  .balao-rede[hidden] { display: none; }
  .mv-desenho { flex: 0 0 auto; width: 100%; height: clamp(120px, 20vh, 200px); background: #f3efea; }
  .mv-estrategia {
    flex: 1 1 auto; min-width: 0; min-height: 0; overflow: auto;
    padding: 8px clamp(16px, 4vw, 56px) 40px;
  }
  .mv-bloco { padding: 22px 0; border-bottom: 1px solid var(--borda); }
  .mv-bloco:last-child { border-bottom: 0; }
  .mv-bloco h3 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--texto-2); }
  .mv-linha { display: flex; gap: 16px; align-items: baseline; font-size: 18px; padding: 5px 0; }
  .mv-rotulo { flex: 0 0 120px; color: var(--texto-2); font-size: 14px; }
  .mv-marca { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
  .mv-marca i { width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .2); align-self: center; }
  .mv-etiquetas ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .mv-etiquetas li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .mv-pos { font-size: 14px; color: var(--texto-2); min-width: 120px; }
  .mv-etiqueta {
    color: #fff; font: 800 19px/1.25 var(--fonte-etq); letter-spacing: .2px; padding: 6px 16px; border-radius: 14px;
    white-space: pre-line; box-shadow: 0 1px 3px rgba(0, 0, 0, .2), inset 0 0 0 1px rgba(0, 0, 0, .12);
  }
  /* planograma: prateleiras de cada espaço (1 = a de cima), com a cor e as etiquetas de cada uma */
  .pg { overflow-x: auto; padding-bottom: 4px; }
  .pg-grade { display: grid; column-gap: 8px; min-width: min-content; }
  .pg-rot { align-self: center; padding-right: 10px; font-size: 12px; color: var(--texto-2); text-align: right; white-space: nowrap; }
  .pg-celula {
    position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    padding: 8px 8px 12px;
    background: linear-gradient(rgba(255, 255, 255, .78), rgba(255, 255, 255, .78)), var(--cor); /* cor clara da marca */
    border-left: 2px solid #8a8f96; border-right: 2px solid #8a8f96;
  }
  .pg-celula.neutra { background: var(--cor); }
  .pg-tabua { align-self: end; height: 6px; border-radius: 2px; background: #5d6168; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); position: relative; z-index: 1; pointer-events: none; }
  .pg-etq {
    position: relative; z-index: 2; /* por cima das tábuas */
    max-width: 100%; color: #fff; font: 800 14px/1.25 var(--fonte-etq); letter-spacing: .15px; text-align: center;
    padding: 4px 12px; border-radius: 12px; white-space: pre-line; overflow-wrap: anywhere;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .2), inset 0 0 0 1px rgba(0, 0, 0, .12);
  }
  .pg-etq.neutra { background: #4a4a4a; }
  .pg-sem { position: relative; z-index: 2; font-size: 12px; font-style: italic; color: var(--texto-2); }
  .pg-nome { padding-top: 6px; font-size: 12px; font-weight: 600; text-align: center; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-2); }
  .pg-testeiras { display: flex; gap: 4px; margin-bottom: 8px; }
  .pg-testeira { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; align-items: center; padding: 6px; border-radius: 6px; background: #ECEAE6; }
  .pg-testeira .pg-etq { box-shadow: none; padding: 2px 6px; font-size: 13px; background: transparent !important; }
  .pg-testeira .pg-sem { color: rgba(255, 255, 255, .8); }
  .pg-testeira.neutra .pg-sem { color: var(--texto-2); }
  .pg-nota { margin: 10px 0 0; font-size: 13px; color: var(--texto-2); }
  /* prateleiras: o desenho de cada prateleira (Prateleira.html): quadrados em % da prateleira, com os produtos */
  .pr-dica { margin: 0 0 12px; font-size: 14px; color: var(--texto-2); }
  .pr-aviso { margin: 0 0 10px; padding: 8px 12px; border-radius: 8px; background: var(--destaque); font-size: 13px; }
  .pr-espaco { border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; background: var(--superficie); outline: none; }
  .pr-espaco.editando { border-color: var(--borda-forte); box-shadow: var(--sombra); }
  .pr-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .pr-titulo { flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
  .pr-titulo strong { font-size: 15px; text-transform: uppercase; letter-spacing: .4px; margin-right: 4px; }
  .pr-chip {
    color: #fff; font: 800 12px/1.25 var(--fonte-etq); padding: 3px 10px; border-radius: 10px;
    white-space: pre-line; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
  }
  .pr-resumo { font-size: 13px; color: var(--texto-2); font-variant-numeric: tabular-nums; }
  .pr-vazio { margin: 8px 0 0; font-size: 13px; font-style: italic; color: var(--texto-2); }
  .pr-estante { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .pr-prateleira { display: flex; gap: 10px; align-items: stretch; }
  .pr-num { flex: 0 0 44px; align-self: center; text-align: right; font-size: 12px; color: var(--texto-2); }
  /* a prateleira: fundo claro com a tábua embaixo; os quadrados ficam em cima, em % dela */
  .pr-tela {
    position: relative; flex: 1 1 auto; min-width: 0; height: 112px; border-radius: 6px 6px 0 0;
    background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0, 0, 0, .04) calc(10% - 1px) 10%), #f4f2ef;
    border-bottom: 7px solid #5d6168;
  }
  .pr-tela.desenho { cursor: crosshair; touch-action: none; user-select: none; height: 128px; }
  .pr-tela-vazia { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-style: italic; color: var(--texto-2); pointer-events: none; }
  .pr-quadrado {
    position: absolute; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; gap: 3px;
    padding: 4px 6px; border-radius: 4px; border: 2px solid var(--cor, #9aa0a6);
    background: linear-gradient(rgba(255, 255, 255, .84), rgba(255, 255, 255, .84)), var(--cor, #9aa0a6);
  }
  .pr-quadrado.editavel { cursor: move; touch-action: none; }
  .pr-quadrado.escolhido { box-shadow: 0 0 0 2px var(--superficie), 0 0 0 4px #E8590C; z-index: 2; }
  .pr-quadrado.fantasma { border-style: dashed; background: rgba(232, 89, 12, .12); border-color: #E8590C; pointer-events: none; }
  .pr-quadrado.fantasma.invalido { background: rgba(180, 35, 24, .15); border-color: #b42318; }
  .pr-q-mov {
    align-self: flex-start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #fff; background: var(--cor); font: 800 10px/1.3 var(--fonte-etq); padding: 1px 6px; border-radius: 6px;
  }
  .pr-q-produtos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; min-height: 0; }
  .pr-q-produtos li { display: flex; gap: 4px; font-size: 11px; line-height: 1.25; color: #1C1F24; }
  .pr-q-produtos li.fora { color: #b42318; text-decoration: line-through; }
  .pr-q-nome { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .pr-q-fr { flex: 0 0 auto; color: #5B6068; font-variant-numeric: tabular-nums; }
  .pr-q-vazio { font-size: 11px; font-style: italic; color: #5B6068; }
  .pr-q-produtos li.pr-q-mais { font-weight: 700; color: #5B6068; }
  /* no planograma: a prateleira desenhada na construção, com os quadrados por cima da tábua */
  .pg-celula.pg-desenhada { padding: 0; }
  .pg-quadrados { position: absolute; inset: 4px 3px 10px; z-index: 2; }
  .pg-quadrados .pr-tela-vazia { font-size: 11px; }
  .pr-borda { position: absolute; z-index: 1; }
  .pr-borda.e, .pr-borda.w { top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
  .pr-borda.e { right: -2px; }
  .pr-borda.w { left: -2px; }
  .pr-meta { margin: 10px 0 0; font-size: 12px; color: var(--texto-2); }
  /* edição */
  .pr-opcoes { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; margin: 12px 0 8px; }
  .pr-campo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--texto-2); }
  .pr-ed-dica { margin: 0 0 10px; font-size: 12px; color: var(--texto-2); }
  .pr-ed-prateleira { display: flex; flex-direction: column; gap: 6px; }
  .pr-ed-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .pr-ed-cab strong { font-size: 13px; }
  .pr-ed-dividir { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texto-2); }
  .pr-ed-mov.fora { border-color: #E8590C; box-shadow: inset 0 0 0 1px #E8590C; color: #9a3a06; }
  /* painel do quadrado escolhido */
  .pr-painel { border: 1px solid var(--borda-forte); border-left: 6px solid var(--cor, #9aa0a6); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .pr-painel-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .pr-painel-topo .btn { margin-left: auto; }
  .pr-painel-campos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .pr-painel-campos select, .pr-painel-campos input { min-width: 0; width: 100%; box-sizing: border-box; }
  .pr-painel-produtos { display: flex; flex-direction: column; gap: 4px; }
  .pr-ed-linha { display: grid; grid-template-columns: minmax(0, 1fr) 70px auto auto auto; gap: 4px; align-items: center; }
  .pr-ed-linha.fora .pr-ed-nome { color: #b42318; }
  .pr-ed-nome { display: flex; flex-direction: column; font-size: 13px; font-weight: 600; min-width: 0; }
  .pr-ed-nome small { font-weight: 400; font-size: 11px; color: var(--texto-2); }
  .pr-ed-linha input, .pr-busca { font: inherit; font-size: 13px; padding: 5px 7px; border: 1px solid var(--borda-forte); border-radius: 6px; background: var(--superficie); color: var(--texto); min-width: 0; box-sizing: border-box; }
  .pr-escolha { display: flex; flex-direction: column; gap: 6px; }
  .pr-escolha-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .pr-busca { flex: 1 1 260px; }
  .pr-resultados { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px; max-height: 220px; overflow: auto; }
  .pr-resultado {
    display: grid; grid-template-columns: 10px minmax(0, 1fr); column-gap: 8px; align-items: center; text-align: left;
    padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; background: var(--superficie); color: var(--texto); cursor: pointer; font: inherit;
  }
  .pr-resultado:hover { border-color: var(--borda-forte); background: #f5f6f8; }
  .pr-resultados > .pr-vazio, .pr-resultados > .btn { grid-column: 1 / -1; justify-self: start; margin: 0; }
  .pr-resultado.ja { border-color: #2f9e44; }
  .pr-resultado i { grid-row: 1 / 3; width: 10px; height: 10px; border-radius: 50%; }
  .pr-r-nome { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-resultado small { grid-column: 2; font-size: 11px; color: var(--texto-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-ed-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  @media (max-width: 760px) {
    .pr-num { flex-basis: 28px; }
    .pr-painel-campos { grid-template-columns: 1fr; }
  }
  .mv-marca-etq { font-size: 14px; color: var(--texto-2); }
  .mv-simbolo-etq { font-size: 12px; color: var(--texto-2); white-space: nowrap; }
  .mv-obs { white-space: pre-line; }
  .mv-vazio { color: var(--texto-2); font-style: italic; margin: 0; font-size: 16px; }
  @media (max-width: 760px) {
    .mv-corpo { flex-direction: column; overflow: auto; }
    .mv-desenho { height: 18vh; }
    .mv-estrategia { overflow: visible; }
    .mv-linha { flex-wrap: wrap; gap: 4px 12px; }
    .mv-rotulo { flex-basis: 100%; }
  }

  /* ---------- validação da estratégia ---------- */
  .btn .badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E8590C; color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
  }
  .acesso-papeis { border: 0; padding: 0; margin: 0 0 12px; display: flex; gap: 16px; flex-wrap: wrap; }

  #slide .marcador-comentario { cursor: pointer; }

  .lista-avisos { max-height: 240px; overflow: auto; font-size: 12px; color: #7a4b00; padding-left: 18px; }

  /* ---------- carregando / toast ---------- */
  .carregando {
    position: fixed;
    inset: 0;
    background: rgba(243, 244, 246, .72);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-weight: 600;
    z-index: 20;
  }

    width: 34px;
    height: 34px;
    border: 3px solid #cfd3d8;
    border-top-color: var(--texto);
    border-radius: 50%;
    animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #16181b;
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: var(--sombra);
    z-index: 30;
    max-width: calc(100vw - 32px);
  }
  .toast.erro { background: #b42318; }

  /* ---------- painel da ER (menu da esquerda) ---------- */

  .lj-letra { display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1.8px solid var(--texto); border-radius: 50%; font-size: 12px; font-weight: 600; color: var(--texto); }
  .lj-chips { display: flex; flex-direction: column; gap: 5px; }
  .lj-chip { display: block; padding: 5px 10px; border-radius: 7px; color: #fff; font: 800 11.5px/1.3 Nunito, 'Segoe UI', Arial, sans-serif; letter-spacing: .2px; }
  .lj-destaque { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--borda); }

  .lj-mini { width: 64px; height: 44px; flex: 0 0 auto; }

  .lj-extra:first-of-type { border-top: 0; padding-top: 0; }
  .lj-extra-nome { font-size: 12px; font-style: italic; color: var(--texto-2); }

  /* Ciclos em construção (Rascunho.html). */
  /* Faixa em destaque do ciclo em construção / aguardando aprovação (topo do app). */
  .barra-rascunho { background: #FFF1D6; border: 1px solid #F0B44C; border-left: 5px solid #E8590C; padding: 8px 14px; }
  .barra-rascunho #rascunhoInfo { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; color: #5C3300; }
  .rs-faixa-icone { font-size: 18px; line-height: 1; }
  .rs-faixa-msg { color: #7A4A00; font-size: 13px; }
  .rs-status { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .rs-status.em_construcao { background: #fde6d8; color: #9a3a06; }
  .rs-status.enviado { background: #e0e7ff; color: #27367a; }
  .rs-secao { margin: 14px 0 6px; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo); }
  .rs-secao-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .rs-secao h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-2); }
  .rs-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--borda); }
  .rs-item.atual .rs-item-txt strong { text-decoration: underline; text-underline-offset: 3px; }
  .rs-item-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .rs-item-txt strong { font-size: 13px; }
  .rs-item-txt span { font-size: 11.5px; color: var(--texto-2); }
  /* Antecipações (Antecipacao.html): itens do próximo ciclo que entram antes, com a data */
  .an-item { display: flex; flex-direction: column; gap: 5px; padding: 8px 0; border-top: 1px solid var(--borda); }
  .lj-secao .an-item:first-of-type { border-top: 0; padding-top: 0; }
  .an-item-topo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .an-data { flex: 0 0 auto; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #ffedd5; color: #9a3412; white-space: nowrap; }
  .an-item .val-movel { flex: 1 1 auto; min-width: 0; text-align: left; }
  .an-item .lj-chip { align-self: flex-start; }
  .an-meta { font-size: 11.5px; color: var(--texto-2); }
  .an-item .val-acoes { margin-top: 2px; }
  .an-atual { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 12px; }
  .an-atual .mv-rotulo { flex: none; font-size: 12px; }
  .an-atual .an-meta { flex-basis: 100%; }
  .an-lista-detalhe { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .an-lista-detalhe li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 15px; }
  .an-lista-detalhe .an-meta { flex-basis: 100%; font-size: 13px; }
  .mv-etiqueta.an-antes { opacity: .55; margin-right: 6px; }
  .dialogo.antecipacao input[type="date"] { font: inherit; font-size: 14px; color: var(--texto); background: var(--superficie); padding: 6px 9px; border: 1px solid var(--borda); border-radius: var(--raio); }
  .lj-editar { margin: 12px 0 0; }
  /* Formulário de um espaço na tela do móvel. */
  .rs-espaco { display: grid; gap: 10px; }
  .rs-espaco h3 { margin-bottom: 2px; }
  .rs-herdado { margin: 0; font-size: 13px; color: #7a4b00; background: #fff8e6; border: 1px solid #f1d58a; border-radius: var(--raio); padding: 4px 10px; }
  .rs-linha { display: flex; gap: 16px; align-items: flex-start; }
  .rs-linha > select, .rs-linha > textarea { min-width: 0; flex: 0 1 360px; }
  .rs-linha > textarea { font: inherit; padding: 7px 10px; border: 1px solid var(--borda-forte); border-radius: var(--raio); background: var(--superficie); color: var(--texto); resize: vertical; }
  .rs-etiquetas { display: grid; gap: 6px; flex: 1 1 auto; max-width: 620px; }
  .rs-etq { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) 200px; gap: 6px; }
  .rs-etq input, .rs-etq select { min-width: 0; width: 100%; }
  .rs-espaco .val-acoes { justify-content: flex-start; }
  /* Diálogo (novo ciclo, Comunicações ER, Tipos de movimento, devolver). */
  .dialogo.rascunho { width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--superficie); }
  .dialogo.rascunho .acesso-campo select { width: 100%; }
  .dialogo.rascunho textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 9px; border: 1px solid var(--borda-forte); border-radius: var(--raio); background: var(--superficie); color: var(--texto); resize: vertical; }
  .rs-painel { margin: 0 0 12px; padding: 8px 12px 10px; border: 1px solid var(--borda); border-radius: 10px; }
  .rs-painel legend { padding: 0 4px; font-weight: 700; font-size: 13px; }
  .rs-painel .val-dica { margin: 0 0 6px; }
  .rs-painel-linhas { display: grid; gap: 6px; }
  .rs-painel-linha { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 6px; align-items: start; }
  .rs-painel-linha:has(.rs-alvo) { grid-template-columns: minmax(0, 1fr) 150px 170px auto; }
  .rs-painel-linha select { min-width: 0; width: 100%; }
  .rs-add { margin-top: 6px; }
  .rs-tipos { display: grid; grid-template-columns: minmax(140px, 1.3fr) minmax(130px, 1fr) 120px minmax(120px, 1fr) auto; gap: 6px 8px; align-items: center; }
  .rs-tipos input.falta { border-color: #E8590C; box-shadow: inset 0 0 0 1px #E8590C; }
  .rs-etq select.fora { border-color: #E8590C; box-shadow: inset 0 0 0 1px #E8590C; color: #9a3a06; }
  .rs-copiar { margin: 4px 0 0; }
  .rs-copiar:disabled { opacity: .5; }
  /* Os três passos do ciclo em construção, na faixa acima da planta. */
  .rs-passos { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 0 10px; padding: 0; list-style: none; counter-reset: passo; vertical-align: middle; }
  .rs-passos li { counter-increment: passo; display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; }
  .rs-passos li::before {
    content: counter(passo); display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
    font-size: 11px; font-weight: 700; background: var(--borda-forte); color: var(--superficie);
  }
  .rs-passos li.ok::before { content: '✓'; background: #2F9E6B; color: #fff; }
  .rs-passos li span { color: var(--texto-2); }
  .rs-tipos-cab { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-2); }
  .rs-tipos-nome { font-family: var(--fonte-etq); font-size: 13px; overflow-wrap: anywhere; }
  .rs-tipos select, .rs-tipos input { min-width: 0; width: 100%; padding: 5px 7px; font-size: 13px; }
  @media (max-width: 640px) {
    .rs-linha { flex-direction: column; gap: 4px; }
    .rs-etq, .rs-painel-linha, .rs-painel-linha:has(.rs-alvo) { grid-template-columns: minmax(0, 1fr); }
    .rs-tipos { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
    .rs-tipos-cab { display: none; }
  }
  [data-tema="escuro"] .barra-rascunho { background: #3A2A10; border-color: #8A5A1A; border-left-color: #E8590C; }
  [data-tema="escuro"] .barra-rascunho #rascunhoInfo, [data-tema="escuro"] .rs-faixa-msg { color: #FFD9A0; }
  [data-tema="escuro"] .rs-status.em_construcao { background: #4a2510; color: #ffb38a; }
  [data-tema="escuro"] .rs-status.enviado { background: #2a3260; color: #c5cef8; }
  [data-tema="escuro"] .an-data { background: #4a2510; color: #ffb38a; }
  [data-tema="escuro"] .rs-etq select.fora { color: #ffb38a; }
  [data-tema="escuro"] .rs-herdado { color: #f1c76b; background: #2e2512; border-color: #6b5520; }

  /* Painel de construção do ciclo (lateral direita, Rascunho.html). */
  .painel-construcao { flex: 0 0 410px; }
  .pc-topo { flex-direction: column; align-items: stretch; gap: 8px; }
  .pc-titulo { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pc-titulo h2 { font-size: 16px; }
  .pc-gravacao { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--texto-2); }
  .pc-gravacao::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #2F9E6B; }
  .pc-gravacao.pendente::before, .pc-gravacao.salvando::before { background: #D9822B; }
  .pc-gravacao.salvando::before { animation: pc-pulso 1s ease-in-out infinite; }
  .pc-gravacao.erro { color: #b42318; }
  .pc-gravacao.erro::before { background: #b42318; }
  @keyframes pc-pulso { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .pc-gravacao.salvando::before { animation: none; } }
  .pc-passos { display: flex; flex-direction: column; gap: 3px; margin: 12px 0 10px; }
  .pc-acoes { display: flex; flex-wrap: wrap; gap: 6px; }
  .pc-secao { padding: 4px 0 14px; border-bottom: 1px solid var(--borda); }
  .pc-secao:last-child { border-bottom: 0; }
  .pc-secao h3 { margin: 14px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-2); }
  .pc-movel { display: flex; align-items: flex-start; gap: 6px; margin: 12px 0 6px; }
  .pc-movel > div { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .pc-movel h3 { margin: 0; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--texto); }
  .pc-movel span { font-size: 12px; color: var(--texto-2); }
  .pc-espaco { padding: 10px 12px; margin: 0 0 8px; border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo); gap: 7px; }
  .pc-espaco h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .pc-linha { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 8px; }
  .pc-linha .mv-rotulo, .pc-etiquetas .mv-rotulo { font-size: 12px; flex: none; }
  .pc-linha select, .pc-linha textarea { min-width: 0; width: 100%; padding: 5px 7px; font-size: 13px; }
  .pc-linha textarea { font: inherit; font-size: 13px; border: 1px solid var(--borda-forte); border-radius: var(--raio); background: var(--superficie); color: var(--texto); resize: vertical; }
  .pc-etiquetas { max-width: none; gap: 4px; }
  .pc-etiquetas .rs-etq { grid-template-columns: minmax(0, 1fr) 118px auto; }
  .pc-etiquetas .rs-etq .pc-tirar-etq { padding: 0 8px; }
  .pc-etq-lista { display: grid; gap: 8px; }
  .pc-etiquetas .pc-add-etq { justify-self: start; margin-top: 2px; }
  .pc-espaco-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pc-espaco-cab .pc-dividir { font-size: 12px; padding: 2px 8px; }
  /* Select de marca com a cor da marca escolhida no fundo (as opções também levam a cor). */
  select.com-cor-marca { font-weight: 600; border-color: transparent; }
  .pc-etiquetas .rs-etq .rs-etq-obs { grid-column: 1 / -1; order: 3; font-size: 12px; }
  /* Símbolo da etiqueta e, com a antecipação, a data (embaixo da observação). */
  .pc-etiquetas .rs-etq .pc-etq-simbolo { grid-column: 1 / -1; order: 4; display: flex; gap: 6px; }
  .pc-etq-simbolo select { flex: 1 1 auto; min-width: 0; }

  .pc-etq-simbolo input[hidden] { display: none; }
  .pc-etiquetas select { padding: 5px 7px; font-size: 13px; }
  .pc-espaco .val-acoes { margin: 0; }
  /* Espaço que muda conforme a ER (ponta B da gôndola 1): a parte fixa e a livre, separadas. */
  .pc-parte.atual { border-color: var(--texto-2); box-shadow: inset 3px 0 0 var(--texto-2); }
  .pc-parte:not(.atual) { border-style: dashed; }
  .pc-parte-ers { margin: 0; font-size: 12px; line-height: 1.45; color: var(--texto-2); }
  .pc-parte-ers strong { color: var(--texto); }
  .pc-parte-outra {
    display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--borda);
    background: var(--superficie); font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .pc-bloco { margin: 0 0 16px; }
  .pc-bloco h4 { margin: 0 0 6px; font-size: 13px; }
  .pc-sub { margin: -2px 0 8px; font-size: 11.5px; color: var(--texto-2); }
  .pc-prog-texto { font-size: 13px; margin-bottom: 6px; }
  .pc-progresso { height: 8px; border-radius: 4px; background: var(--borda); overflow: hidden; }
  .pc-progresso i { display: block; height: 100%; background: #2F9E6B; border-radius: 4px; transition: width .3s ease; }
  @media (prefers-reduced-motion: reduce) { .pc-progresso i { transition: none; } }
  .pc-alertas { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  .pc-alertas li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 12px; background: var(--fundo); }
  .pc-alertas li.erro { background: #fde6d8; color: #9a3a06; }
  .pc-alertas li.aviso { background: #fff8e6; color: #7a4b00; }
