<style>
  :root {
    --fundo: #f3f4f6;
    --superficie: #ffffff;
    --borda: #dfe2e6;
    --borda-forte: #c9cdd3;
    --texto: #16181b;
    --texto-2: #5b6068;
    --primario: #16181b;
    --primario-texto: #ffffff;
    --destaque: #fff7d6;
    --raio: 8px;
    --sombra: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 16px rgba(0, 0, 0, .06);
    --fonte: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --fonte-etq: Nunito, "Segoe UI", Arial, sans-serif; /* a mesma das etiquetas da planta */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font: 14px/1.4 var(--fonte);
    display: flex;
    flex-direction: column;
  }
  [hidden] { display: none !important; }

  /* ---------- topo ---------- */
  .topo {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    padding: 10px 16px;
    background: var(--superficie);
    border-bottom: 1px solid var(--borda);
  }
  .identidade { display: flex; align-items: center; gap: 10px; min-width: 190px; }
  .identidade h1 { margin: 0; font-size: 15px; letter-spacing: .2px; }
  .identidade p { margin: 0; font-size: 12px; color: var(--texto-2); }
  .logo { width: 26px; height: 26px; color: var(--texto); }

  .seletores { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; flex: 1 1 auto; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; }

  .campo { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--texto-2); }
  .campo > span, .campo > legend { font-weight: 600; text-transform: uppercase; letter-spacing: .4px; font-size: 11px; }
  .campo.bloco { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin: 0 0 14px; border: 0; padding: 0; }

  select, input[type="text"] {
    font: inherit;
    color: var(--texto);
    background: var(--superficie);
    border: 1px solid var(--borda-forte);
    border-radius: var(--raio);
    padding: 7px 10px;
    min-width: 170px;
  }
  select:focus-visible, input:focus-visible, .btn:focus-visible, .aba:focus-visible, .chip:focus-visible {
    outline: 2px solid #3b82f6;
    outline-offset: 1px;
  }

  .abas { display: inline-flex; background: #eceef1; border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .aba {
    border: 0;
    background: transparent;
    font: 600 12px var(--fonte);
    letter-spacing: .4px;
    padding: 7px 12px;
    border-radius: 8px;
    color: var(--texto-2);
    cursor: pointer;
  }
  .aba:hover { color: var(--texto); }
  .aba[aria-selected="true"] { background: var(--primario); color: var(--primario-texto); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 600 13px var(--fonte);
    padding: 7px 12px;
    border-radius: var(--raio);
    border: 1px solid var(--borda-forte);
    background: var(--superficie);
    color: var(--texto);
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: #f5f6f8; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.primario { background: var(--primario); border-color: var(--primario); color: var(--primario-texto); }
  .btn.primario:hover { background: #2b2f35; }
  .btn.fantasma { border-color: transparent; background: transparent; color: var(--texto-2); }
  .btn.fantasma:hover { color: var(--texto); background: #f0f1f3; }
  .btn.pequeno { padding: 5px 10px; font-size: 12px; }
  .btn[aria-pressed="true"] { background: var(--destaque); border-color: #e2c64a; }

  /* ---------- legenda e avisos ---------- */
  .faixa {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px 16px;
    padding: 8px 16px 0;
  }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .zoom { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; }
  .zoom .btn { min-width: 32px; justify-content: center; }
  .zoom #zoomNivel { min-width: 56px; font-variant-numeric: tabular-nums; }
  .legenda .rotulo { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-2); margin-right: 4px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--borda);
    background: var(--superficie);
    border-radius: 999px;
    padding: 3px 10px 3px 4px;
    font: 600 12px var(--fonte);
    color: var(--texto);
    cursor: pointer;
  }
  .chip .cor { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .15); }
  .chip[aria-pressed="true"] { border-color: var(--texto); box-shadow: inset 0 0 0 1px var(--texto); }
  .chip.inativo { opacity: .6; }
  .chip.inativo .cor { filter: grayscale(1); }
  .legenda .dica { font-size: 12px; color: var(--texto-2); }

  .avisos { font-size: 12px; color: #7a4b00; background: #fff8e6; border: 1px solid #f1d58a; border-radius: var(--raio); padding: 4px 10px; max-width: 640px; }
  .avisos summary { cursor: pointer; font-weight: 600; }
  .avisos ul { margin: 6px 0 4px; padding-left: 18px; max-height: 180px; overflow: auto; }

  .aviso-local { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texto-2); background: #eef2ff; border: 1px solid #c7d2fe; border-radius: var(--raio); padding: 2px 4px 2px 10px; }
  .bloco-opcao { margin: 0 0 14px; }

  .barra-edicao {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin: 8px 16px 0;
    padding: 8px 12px;
    background: var(--destaque);
    border: 1px solid #e2c64a;
    border-radius: var(--raio);
    font-size: 13px;
  }
  .grupo-botoes { display: inline-flex; gap: 6px; flex-wrap: wrap; }

  /* Em destaque (Comunicações ER e Analytics), separados das outras ações. */
  .acoes { align-items: center; }
  .acoes-paineis { display: inline-flex; gap: 4px; padding: 3px; border-radius: 10px; background: #eef2ff; border: 1px solid #d5ddfb; }
  .btn.painel-botao { border-color: transparent; background: transparent; color: #27367a; }
  .btn.painel-botao:hover { background: #e0e7ff; }
  .btn.painel-botao[aria-pressed="true"] { background: #3346b8; border-color: #3346b8; color: #FFFFFF; }
  .acoes-divisor { width: 1px; align-self: stretch; margin: 2px 4px; background: var(--borda); }
  .btn.icone { padding: 7px; position: relative; }
  .btn.icone svg { width: 18px; height: 18px; }
  .btn.icone .badge { position: absolute; top: -4px; right: -4px; }

  /* Menu de configurações (ícone de engrenagem): validação e ajuste das etiquetas. */
  .menu-config { position: relative; }
  .menu-config:has(.menu-item[aria-pressed="true"]:not(#btnTema)) #btnConfig { color: var(--texto); background: var(--destaque); }
  .menu-lista {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 210px;
    display: flex; flex-direction: column; padding: 6px; gap: 2px;
    background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, .14);
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px;
    background: transparent; color: var(--texto); font: 600 13px var(--fonte); text-align: left; cursor: pointer;
  }
  .menu-item:hover, .menu-item:focus-visible { background: #f0f1f3; outline: none; }
  .menu-item:disabled { opacity: .5; cursor: default; background: transparent; }
  .menu-item[aria-pressed="true"] { background: var(--destaque); }
  .menu-item svg { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .menu-item .badge {
    margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E8590C; color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
  }

  /* Tamanho das etiquetas (modo ajuste). */
  .tamanho-etq { display: inline-flex; align-items: center; gap: 4px; }
  .tamanho-etq > span { font-size: 12px; margin-right: 4px; }
  #etqTamanho { min-width: 52px; justify-content: center; font-variant-numeric: tabular-nums; }

  /* ---------- palco (slide) ---------- */
  /* A planta ocupa toda a área abaixo do topo (sem moldura); o desenho fica centralizado nela. */
  .palco {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: stretch;
    padding: 8px 0 0;
  }
  /* A planta e o botão de baixar PNG, no canto de baixo dela. */
  .area-planta { position: relative; flex: 1 1 auto; min-width: 0; display: flex; }
  .btn-png { position: absolute; right: 14px; bottom: 14px; z-index: 5; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); }
  #slide {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    height: auto;
    min-height: 320px;
    background: #f3efea;
    user-select: none;
  }

  /* ---------- painéis laterais (Comunicações ER e Validação) ---------- */
  .painel-espaco {
    flex: 0 0 380px;
    min-height: 0;
    overflow: auto;
    background: var(--superficie);
    border-left: 1px solid var(--borda);
    font-size: 13px;
  }
  .esp-topo {
    position: sticky; top: 0; z-index: 1;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px 10px; background: var(--superficie); border-bottom: 1px solid var(--borda);
  }
  .esp-topo h2 { margin: 0; font-size: 16px; }
  .esp-topo span { color: var(--texto-2); font-size: 12px; }
  .esp-corpo { padding: 4px 18px 24px; }
  .esp-corpo h3 { margin: 20px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-2); }

  /* ---------- Analytics (dashboard no lugar da planta) ---------- */
  /* Cobre a planta e os painéis laterais; a planta continua desenhada por baixo. */
  body.com-analytics .palco { position: relative; }
  .analytics {
    position: absolute; inset: 8px 0 0; z-index: 8;
    display: flex; flex-direction: column; min-height: 0;
    background: var(--fundo); border-top: 1px solid var(--borda);
  }
  .analytics[hidden] { display: none; }
  .an-topo {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px clamp(16px, 2.5vw, 32px); background: var(--superficie); border-bottom: 1px solid var(--borda);
  }
  .an-topo h2 { margin: 0; font-size: 18px; }
  .an-topo span { color: var(--texto-2); font-size: 13px; }
  .an-topo-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  #anInfo { display: inline-flex; align-items: center; gap: 6px; }
  .dialogo.an-info { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; }
  .an-info-regras { margin: 0 0 18px; padding-left: 18px; font-size: 13px; line-height: 1.5; display: grid; gap: 6px; }
  .an-info-legenda { border-top: 1px solid var(--borda); padding-top: 14px; }
  .an-info-legenda h3 { margin: 0; font-size: 14px; }
  .an-info-sub { margin: 2px 0 12px; color: var(--texto-2); font-size: 12px; }
  .an-corpo { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px clamp(16px, 2.5vw, 32px) 32px; font-size: 13px; }
  .an-vazio { color: var(--texto-2); font-style: italic; margin: 8px 0; }
  .an-nota { margin: 14px 0 0; color: var(--texto-2); font-size: 11.5px; line-height: 1.5; max-width: 980px; }

  .an-numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .an-er { gap: 4px; }
  .an-er.atual { border-color: var(--texto-2); box-shadow: inset 0 0 0 1px var(--texto-2); }
  .an-er-topo { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }
  .an-er-topo strong { font-size: 18px; }
  .an-er-rede { color: var(--texto-2); font-size: 11.5px; font-weight: 600; }
  .an-er-linha { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--texto-2); }
  .an-er-linha b { color: var(--texto); font-variant-numeric: tabular-nums; }
  .an-ciclo .an-separa { margin-top: 8px; }
  .an-ciclo strong { font-size: 22px; }
  .an-rede-nota { margin-top: 8px; }
  .an-col-rede { display: block; }
  .an-numero {
    display: flex; flex-direction: column; gap: 2px; padding: 12px 14px;
    background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px;
  }
  .an-numero-rotulo { color: var(--texto-2); font-size: 12px; font-weight: 600; }
  .an-numero strong { font-size: 26px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .an-numero-sub { color: var(--texto-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  .an-grade { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 14px; }
  .an-dupla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .an-cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; padding: 14px 16px 16px; min-width: 0; }
  .an-cartao-topo { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 16px; margin-bottom: 12px; }
  .an-cartao-topo h3 { margin: 0; font-size: 14px; flex: 0 0 auto; }
  .an-cartao-topo p { margin: 0; color: var(--texto-2); font-size: 12px; flex: 1 1 260px; }
  .an-controles { margin-left: auto; }
  .an-segmentado { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--fundo); border: 1px solid var(--borda); }
  .an-segmentado button {
    border: 0; background: transparent; padding: 4px 10px; border-radius: 6px;
    font: 600 12px var(--fonte); color: var(--texto-2); cursor: pointer;
  }
  .an-segmentado button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

  /* Insights */
  .an-insights ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; }
  .an-insight {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; height: 100%; padding: 9px 11px;
    border: 1px solid var(--borda); border-radius: 8px; background: #fafbfc;
    font: inherit; color: var(--texto); text-align: left; line-height: 1.4;
  }
  button.an-insight { cursor: pointer; }
  button.an-insight:hover { border-color: var(--borda-forte); background: var(--superficie); }
  .an-tag {
    flex: 0 0 auto; margin-top: 1px; padding: 1px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; border: 1px solid transparent;
  }
  .an-tag-destaque { background: #e0e7ff; color: #27367a; }
  .an-tag-oportunidade { background: #dcf3e8; color: #1d6b47; }
  .an-tag-atencao { background: #fdecd8; color: #8a4510; }
  .an-tag-info { background: var(--fundo); color: var(--texto-2); border-color: var(--borda); }

  /* Mapa de calor movimento × ER */
  .an-tabela-rolagem { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  .an-mapa { width: 100%; border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
  .an-mapa th, .an-mapa td { padding: 0; font-weight: normal; }
  .an-mapa thead th { color: var(--texto-2); font-size: 12px; text-align: center; vertical-align: bottom; padding-bottom: 4px; }
  .an-mapa thead th.an-col-mov, .an-mapa thead th.an-col-marcas { text-align: left; font-weight: 600; }
  .an-mapa thead button {
    display: inline-flex; flex-direction: column; align-items: center; gap: 0; border: 0; background: none;
    padding: 2px 6px; border-radius: 6px; font: 600 12px var(--fonte); color: var(--texto); cursor: pointer;
  }
  .an-mapa thead button:hover { background: var(--fundo); }
  .an-mapa thead button small { font-weight: 400; color: var(--texto-2); font-size: 11px; }
  .an-mapa thead th.atual button > span:first-child { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .an-mapa th.an-col-mov { width: 26%; min-width: 190px; text-align: left; padding: 5px 10px 5px 0; }
  .an-mov-nome { display: flex; align-items: center; gap: 8px; font-weight: 600; font-family: var(--fonte-etq); }
  .an-mov-nome i { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .an-mov-nome i.sem { border: 1.5px dashed var(--borda-forte); }
  .an-mov-info { display: flex; gap: 8px; margin: 1px 0 0 18px; font-size: 11px; color: var(--texto-2); }
  .an-gmv { font-weight: 600; color: var(--texto); }
  .an-celula { min-width: 64px; height: 40px; }
  .an-celula > * {
    display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; min-height: 40px;
    border: 0; border-radius: 6px; font: inherit; color: var(--texto); background: none;
  }
  .an-celula button { cursor: pointer; }
  .an-celula button:hover { box-shadow: inset 0 0 0 2px var(--texto); }
  .an-celula button.escuro { color: #FFFFFF; }
  .an-celula strong { font-size: 13px; }
  .an-celula small { font-size: 10.5px; opacity: .75; }
  .an-cel-vazia { color: var(--borda-forte); }
  .an-mapa tbody td.atual > * { outline: 1.5px solid #27367a; outline-offset: -1px; }
  .an-mapa tbody tr.ativo th { box-shadow: inset 3px 0 0 #27367a; padding-left: 8px; }
  .an-mapa td.an-col-total { text-align: center; min-width: 70px; padding: 0 6px; border-left: 1px solid var(--borda); }
  .an-mapa td.an-col-total strong { display: block; font-size: 13px; }
  .an-mapa td.an-col-total small { color: var(--texto-2); font-size: 10.5px; }
  .an-mapa .an-col-marcas { width: 16%; min-width: 110px; padding-left: 8px; }
  .an-pilha { display: flex; gap: 2px; height: 10px; }
  .an-pilha span { display: block; min-width: 2px; height: 100%; }
  .an-pilha span:first-child { border-radius: 4px 0 0 4px; }
  .an-pilha span:last-child { border-radius: 0 4px 4px 0; }
  .an-pilha span:only-child { border-radius: 4px; }
  .an-linha-livre th, .an-linha-livre td { border-top: 1px solid var(--borda); }
  .an-linha-livre .an-mov-nome { font-family: var(--fonte); color: var(--texto-2); font-style: italic; font-weight: 600; }
  .an-cel-livre { background: repeating-linear-gradient(135deg, #f1f2f4 0 6px, #e8eaed 6px 12px); color: var(--texto-2); }

  /* Barras 100% por ER */
  .an-espacos-grupo { margin: 14px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-2); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .an-espacos-grupo span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .an-espaco-nota { color: var(--texto-2); font-size: 11px; font-style: italic; }
  .an-secao { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--borda-forte); }
  .an-secao h3 { margin: 0; font-size: 16px; }
  .an-secao p { margin: 4px 0 0; color: var(--texto-2); font-size: 12.5px; }
  .an-espacos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 16px; }
  .an-espaco-tipo { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .an-espaco-tipo.fora { opacity: 0.6; }
  .an-espaco-mini { flex: 0 0 auto; width: 84px; height: 56px; }
  .an-espaco-texto { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 12px; }
  .an-espaco-texto strong { font-size: 12.5px; }
  .an-espaco-qtd { color: var(--texto-2); font-weight: 600; }
  .an-espaco-nomes { display: flex; flex-wrap: wrap; gap: 2px 8px; color: var(--texto-2); font-size: 11px; }
  .an-espaco-nomes > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .an-espaco-nomes i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .an-legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 10px; font-size: 12px; color: var(--texto-2); }
  .an-legenda > span { display: inline-flex; align-items: center; gap: 6px; }
  .an-legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .an-legenda i.borda, .an-seg.borda { box-shadow: inset 0 0 0 1px var(--borda-forte); }
  .an-barras { display: flex; flex-direction: column; gap: 8px; }
  .an-barra-linha { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; gap: 10px; }
  .an-barra-nome { font-weight: 600; font-size: 12px; }
  .an-barra-nome small { display: block; font-weight: 400; font-size: 10.5px; color: var(--texto-2); }
  .an-barra-linha.atual .an-barra-nome { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .an-barra { display: flex; gap: 2px; height: 24px; }
  .an-seg {

  .an-seg:last-child { border-radius: 0 4px 4px 0; }

  .an-seg span { text-shadow: 0 0 3px rgba(0, 0, 0, .35); }
  .an-seg.borda, .an-seg.clara { color: var(--texto); }

  /* GMV × espaço */
  .an-gmv-lista { display: flex; flex-direction: column; gap: 2px; }
  .an-gmv-linha {
    display: grid; grid-template-columns: minmax(140px, 240px) minmax(0, 1fr) 64px; align-items: center; gap: 12px;
    padding: 5px 6px; margin: 0 -6px; border: 0; border-radius: 6px; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }

  .an-gmv-trilho small { font-size: 10.5px; color: var(--texto-2); font-variant-numeric: tabular-nums; }

    .an-dupla { grid-template-columns: minmax(0, 1fr); }

  /* Telas estreitas: a página rola; o Analytics entra no fluxo e a planta fica invisível por baixo. */
  @media (max-width: 900px) {
    .analytics { position: static; flex: 1 1 auto; border-top: 0; }
    .an-corpo { overflow: visible; }
    body.com-analytics .area-planta { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
    body.com-analytics .painel-loja, body.com-analytics .painel-validacao { display: none; }
  }
  @media (max-width: 600px) {
    .an-topo { flex-wrap: wrap; }
    .an-insights ul { grid-template-columns: minmax(0, 1fr); }
    .an-insight { flex-direction: column; gap: 4px; }
    .an-gmv-linha { grid-template-columns: minmax(0, 1fr) 54px; }
    .an-gmv-barras { grid-column: 1 / -1; grid-row: 2; }
  }
  .chip.chip-etiqueta { padding-left: 10px; }

  #slide:not(.construindo) { touch-action: none; }
  #slide:not(.construindo) .movel,
  #slide:not(.construindo) .grupo-etiquetas:not(.arrastavel) { cursor: pointer; }
  #slide.com-zoom.arrastando, #slide.com-zoom.arrastando * { cursor: grabbing; }
  /* Com zoom, as linhas-guia não engrossam (as caixas de destaque também mantêm o tamanho na tela). */
  #slide .guia-callout line { stroke-width: calc(1.3px / var(--zoom, 1)); }
  #slide .guia-callout circle { r: calc(4px / var(--zoom, 1)); stroke-width: calc(1.3px / var(--zoom, 1)); }
  #slide .guia .guia-linha { stroke-width: calc(1.3px / var(--zoom, 1)); }
  #slide .guia .guia-halo { stroke-width: calc(3.6px / var(--zoom, 1)); }
  #slide .guia .guia-ponto { r: calc(4.4px / var(--zoom, 1)); stroke-width: calc(1.6px / var(--zoom, 1)); }
  #slide .guia .guia-centro { r: calc(1.7px / var(--zoom, 1)); }
  #slide .movel:hover polygon { stroke-width: 2.2; }
  /* Destaque ao passar o mouse num móvel ou na ficha dele: a ficha ganha contorno e a linha-guia escurece. */
  #slide .grupo-etiquetas, #slide .camada-guias .guia { transition: opacity .15s ease; }
  #slide.destacando .grupo-etiquetas:not(.destaque),
  #slide.destacando .camada-guias .guia:not(.destaque) { opacity: .35; }
  #slide.destacando .grupo-etiquetas.destaque .ficha-fundo { stroke: #1C1C1C; stroke-width: 2; }
  #slide.destacando .grupo-etiquetas.destaque .etq { stroke: #111; stroke-width: 1.6; }
  #slide.destacando .camada-guias .guia.destaque .guia-linha { stroke: #111; stroke-width: calc(2.2px / var(--zoom, 1)); }
  #slide.destacando .movel.destaque polygon { stroke-width: 2.2; }
  @media (prefers-reduced-motion: reduce) { #slide .grupo-etiquetas, #slide .camada-guias .guia { transition: none; } }
  #slide .arrastavel { cursor: grab; }
  #slide .arrastavel:hover .ficha-fundo { stroke: #111; stroke-width: 1.5; }
  #slide .arrastavel:hover .etq { stroke: #111; stroke-width: 1.5; }
  #slide .arrastavel:active { cursor: grabbing; }

  #slide .movel.selecionado polygon { stroke: #ff6a00; stroke-width: 2.6; }
  #slide.construindo .movel { cursor: move; }
  #slide.construindo .camada-etiquetas,
  #slide.construindo .camada-guias { opacity: .35; pointer-events: none; }
  #slide.construindo .camada-sobreposta { pointer-events: none; }

  /* ---------- construir loja ---------- */
  body.construindo .palco { gap: 14px; align-items: flex-start; position: relative; padding: 8px 16px 16px; }
  body.construindo .area-planta { align-self: flex-start; }
  body.construindo #slide { width: auto; height: auto; aspect-ratio: 16 / 9; align-self: flex-start; }
  #slide.construindo .movel:hover polygon { stroke: #ff9a52; }
  .construtor {
    flex: 0 0 336px;
    max-height: calc(100vh - 140px);
    overflow: auto;
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 10px;
    box-shadow: var(--sombra);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  .construtor > * { padding-left: 14px; padding-right: 14px; }
  .cns-topo { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 12px; }
  .cns-topo h2 { margin: 0; font-size: 15px; }
  #cnsPlanta { font-size: 12px; color: var(--texto-2); font-weight: 600; }
  .cns-dica, .cns-ajuda { margin: 6px 0 10px; font-size: 12px; color: var(--texto-2); }
  kbd { font: 600 11px var(--fonte); background: #f0f1f3; border: 1px solid var(--borda-forte); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  .construtor section { border-top: 1px solid var(--borda); padding-top: 10px; padding-bottom: 10px; }
  .construtor h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-2); }

  .cns-salvos { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 0 0 10px; padding: 8px 10px; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; font-size: 12px; color: var(--texto-2); }
  .cns-paleta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cns-paleta button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 1px solid var(--borda); background: #fafbfc; border-radius: 8px;
    padding: 7px 4px 6px; font: 600 11px var(--fonte); color: var(--texto); cursor: pointer;
  }
  .cns-paleta button:hover { border-color: var(--texto); background: #fff; }
  .cns-paleta svg { width: 28px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }

  #cnsEspacos { word-break: break-word; font-weight: 600; color: var(--texto); }
  .cns-vazio { margin: 4px 0; color: var(--texto-2); font-style: italic; }
  .cns-campo { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 600; color: var(--texto-2); margin-bottom: 8px; }
  .cns-grupo { margin-bottom: 4px; }
  .cns-grupo > span { font-size: 11px; font-weight: 600; color: var(--texto-2); }
  .construtor .campos { display: grid; gap: 8px; margin: 4px 0 8px; }
  .construtor .campos.dois { grid-template-columns: 1fr 1fr; }
  .construtor .campos.tres { grid-template-columns: repeat(3, 1fr); }
  .construtor .campos label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--texto-2); }
  .construtor input[type="number"], .construtor input[type="text"], .construtor select { min-width: 0; width: 100%; padding: 5px 7px; font-size: 13px; }
  .cns-mais summary, .cns-secao summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--texto-2); padding: 2px 0; }
  .cns-mais { margin-top: 2px; }
  .cns-secao { border-top: 1px solid var(--borda); padding-top: 9px; padding-bottom: 9px; }
  .cns-secao[open] summary { margin-bottom: 8px; color: var(--texto); }
  .construtor #cnsLista { height: auto; }
  .construtor .linha-botoes { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .construtor .campo-linha { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--texto-2); margin: 6px 0; }
  .construtor .campo-linha select { width: auto; }
  .construtor .campo-linha input[type="range"] { flex: 1; }

  .cns-rodape {
    position: sticky; bottom: 0; margin-top: auto;
    background: var(--superficie); border-top: 1px solid var(--borda);
    padding-top: 10px; padding-bottom: 6px;
  }
  #cnsStatus { display: block; font-size: 12px; font-weight: 600; color: #15803d; margin-bottom: 6px; }
  #cnsStatus.sujo { color: #b45309; }

  .cns-flutuante {
    position: absolute; z-index: 5; display: flex; gap: 2px;
    background: #16181b; border-radius: 8px; padding: 3px; box-shadow: var(--sombra);
    transform: translate(-50%, -100%);
  }
  .cns-flutuante button { border: 0; background: transparent; color: #fff; font: 600 12px var(--fonte); padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .cns-flutuante button:hover { background: rgba(255, 255, 255, .15); }
  .cns-flutuante button[data-acao="excluir"]:hover { background: #b42318; }

  @media (max-width: 1100px) {
    body.construindo .palco { flex-wrap: wrap; }
    body.construindo .area-planta, body.construindo #slide { width: 100%; }
    .construtor { flex: 1 1 100%; max-height: none; }
  }

  .vazio {
    max-width: 520px;
    margin: 40px auto;
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--sombra);
    text-align: center;
  }
  .vazio h2 { margin: 0 0 8px; font-size: 18px; }
  .vazio p { color: var(--texto-2); }

  /* ---------- diálogos ---------- */
  .dialogo {
    border: 0;
    border-radius: 12px;
    padding: 22px 22px 16px;
    width: min(460px, calc(100vw - 32px));
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    color: var(--texto);
  }
  .dialogo::backdrop { background: rgba(15, 17, 20, .45); }
  .dialogo h2 { margin: 0 0 4px; font-size: 17px; }
  .dialogo .sub { margin: 0 0 16px; color: var(--texto-2); font-size: 13px; }
  .dialogo input[type="text"], .dialogo select { width: 100%; }
  .opcao { display: flex; align-items: center; gap: 8px; color: var(--texto); font-size: 13px; padding: 3px 0; cursor: pointer; }
  .opcao small { color: var(--texto-2); font-size: 12px; }
  .opcao:has(input:disabled) { opacity: .5; cursor: default; }
  .rodape-dialogo { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  /* estratégia do móvel (clique no móvel): ocupa a tela inteira */
  .tela-movel {
    border: 0; padding: 0; margin: 0;
    width: 100vw; height: 100vh; max-width: none; max-height: none;
    background: var(--superficie); color: var(--texto);
  }
  .tela-movel::backdrop { background: var(--superficie); }
  .tela-movel form { height: 100%; display: flex; flex-direction: column; }
  .mv-topo {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 18px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--borda);
  }
  .mv-topo h2 { margin: 0; font-size: clamp(22px, 2.4vw, 32px); }
  .mv-topo p { margin: 2px 0 0; color: var(--texto-2); font-size: 15px; }
  .mv-corpo { flex: 1 1 auto; min-height: 0; display: flex; }
  .mv-desenho { flex: 0 0 42%; height: 100%; background: #f3efea; }
  .mv-estrategia {
    flex: 1 1 auto; min-width: 0; overflow: auto;
    padding: 8px clamp(16px, 4vw, 56px) 40px;
  }
  .mv-bloco { padding: 22px 0; border-bottom: 1px solid var(--borda); }
  .mv-bloco:last-child { border-bottom: 0; }
  .mv-bloco h3 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--texto-2); }
  .mv-linha { display: flex; gap: 16px; align-items: baseline; font-size: 18px; padding: 5px 0; }
  .mv-rotulo { flex: 0 0 120px; color: var(--texto-2); font-size: 14px; }
  .mv-marca { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
  .mv-marca i { width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .2); align-self: center; }
  .mv-etiquetas ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .mv-etiquetas li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .mv-pos { font-size: 14px; color: var(--texto-2); min-width: 120px; }
  .mv-etiqueta {
    color: #fff; font: 800 19px/1.25 var(--fonte-etq); letter-spacing: .2px; padding: 6px 16px; border-radius: 14px;
    white-space: pre-line; box-shadow: 0 1px 3px rgba(0, 0, 0, .2), inset 0 0 0 1px rgba(0, 0, 0, .12);
  }
  /* planograma: prateleiras de cada espaço (1 = a de cima), com a cor e as etiquetas de cada uma */
  .pg { overflow-x: auto; padding-bottom: 4px; }
  .pg-grade { display: grid; column-gap: 8px; min-width: min-content; }
  .pg-rot { align-self: center; padding-right: 10px; font-size: 12px; color: var(--texto-2); text-align: right; white-space: nowrap; }
  .pg-celula {
    position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    padding: 8px 8px 12px;
    background: linear-gradient(rgba(255, 255, 255, .78), rgba(255, 255, 255, .78)), var(--cor); /* cor clara da marca */
    border-left: 2px solid #8a8f96; border-right: 2px solid #8a8f96;
  }
  .pg-celula.neutra { background: var(--cor); }
  .pg-tabua { align-self: end; height: 6px; border-radius: 2px; background: #5d6168; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); position: relative; z-index: 1; pointer-events: none; }
  .pg-etq {
    position: relative; z-index: 2; /* por cima das tábuas */
    max-width: 100%; color: #fff; font: 800 14px/1.25 var(--fonte-etq); letter-spacing: .15px; text-align: center;
    padding: 4px 12px; border-radius: 12px; white-space: pre-line; overflow-wrap: anywhere;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .2), inset 0 0 0 1px rgba(0, 0, 0, .12);
  }
  .pg-etq.neutra { background: #4a4a4a; }
  .pg-sem { position: relative; z-index: 2; font-size: 12px; font-style: italic; color: var(--texto-2); }
  .pg-nome { padding-top: 6px; font-size: 12px; font-weight: 600; text-align: center; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-2); }
  .pg-testeiras { display: flex; gap: 4px; margin-bottom: 8px; }
  .pg-testeira { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; align-items: center; padding: 6px; border-radius: 6px; background: #ECEAE6; }
  .pg-testeira .pg-etq { box-shadow: none; padding: 2px 6px; font-size: 13px; background: transparent !important; }
  .pg-testeira .pg-sem { color: rgba(255, 255, 255, .8); }
  .pg-testeira.neutra .pg-sem { color: var(--texto-2); }
  .pg-nota { margin: 10px 0 0; font-size: 13px; color: var(--texto-2); }
  .mv-marca-etq { font-size: 14px; color: var(--texto-2); }
  .mv-obs { white-space: pre-line; }
  .mv-vazio { color: var(--texto-2); font-style: italic; margin: 0; font-size: 16px; }
  @media (max-width: 760px) {
    .mv-corpo { flex-direction: column; overflow: auto; }
    .mv-desenho { flex: 0 0 auto; height: 38vh; width: 100%; }
    .mv-estrategia { overflow: visible; }
    .mv-linha { flex-wrap: wrap; gap: 4px 12px; }
    .mv-rotulo { flex-basis: 100%; }
  }

  /* ---------- validação da estratégia ---------- */
  .btn .badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E8590C; color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
  }
  .acesso-papeis { border: 0; padding: 0; margin: 0 0 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  .acesso-papeis legend { padding: 0; margin-bottom: 4px; font-size: 12px; color: var(--texto-2); }

  .dialogo input[type="password"], .acesso-campo input { width: 100%; font: inherit; font-size: 14px; color: var(--texto); padding: 7px 9px; border: 1px solid var(--borda); border-radius: var(--raio); }

  .val-quem strong { font-size: 13px; }
  .val-quem span { color: var(--texto-2); font-size: 12px; }
  .val-avatar {
    flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: #fde6d8; color: #9a3a06 !important; font-weight: 700; font-size: 13px !important;

    width: 100%; box-sizing: border-box; resize: vertical; font: inherit; font-size: 13px; padding: 8px 10px;
    border: 1px solid var(--borda); border-radius: var(--raio); background: var(--superficie); color: var(--texto);
  }
  .val-alvo { display: flex; gap: 6px; margin-bottom: 6px; }
  .val-alvo select { flex: 1 1 auto; min-width: 0; }
  .val-acoes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  .val-filtros { display: flex; gap: 6px; margin: 18px 0 10px; flex-wrap: wrap; }
  .btn.ativo { background: #fff4ec; border-color: #E8590C; color: #9a3a06; }
  .btn.perigo { color: #b42318; }
  .val-cartao {
    border: 1px solid var(--borda); border-left: 3px solid #E8590C; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    background: var(--superficie); transition: box-shadow .2s;

  .val-movel {
    font: 600 12px var(--fonte); color: var(--texto); background: #f1efec; border: 0; border-radius: 6px; padding: 3px 8px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }

  .val-status { flex: 0 0 auto; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 8px; border-radius: 9px; }
  .val-status.aberto { background: #fde6d8; color: #9a3a06; }
  .val-status.resolvido { background: #dff1e7; color: #1f6b43; }

  .val-msg.construtor { padding-left: 12px; }
  .val-meta { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 12px; }
