<script>
/**
 * ============================================================================
 *  BRIEFING DO PLANOGRAMA (PDF)
 * ============================================================================
 *  O botão "Briefing (PDF)", ao lado do "Baixar PNG", gera no navegador um PDF
 *  com o planograma desenhado nos móveis do ciclo, para quem monta o planograma
 *  no programa apropriado:
 *   - uma capa com o ciclo, as ERs, o índice dos móveis e como ler;
 *   - uma página por móvel de cada ER (as gôndolas, as pirâmides e os outros
 *     móveis com prateleiras desenhadas): o planograma (na gôndola, Ponta A,
 *     Meio A, Ponta B, Meio B, com as metades de um meio dividido juntas, só com
 *     um pontilhado entre elas; na pirâmide, os 4 lados do mesmo tamanho), com
 *     cada bloco numerado 1, 2, 3… (a numeração recomeça em cada espaço) e, de
 *     cada espaço, uma tabelinha por movimento: bloco, SKU, frentes e observação.
 *  Os espaços ainda sem desenho saem com a divisão automática pelas etiquetas.
 *  A biblioteca jsPDF é carregada sob demanda do cdnjs (como o ExcelJS).
 *  O arquivo leva o ciclo e a ER no nome ("Briefing - C15-2026 - ER M.pdf"). Com uma pasta do Drive vinculada
 *  (Desenvolvedor › Planilhas), quem entrou na Construção pode salvar o PDF nela, na subpasta do ciclo, no lugar
 *  do briefing anterior com o mesmo nome (salvarBriefingNoDrive, Code.gs).
 */
const Briefing = (() => {
  const $ = (id) => document.getElementById(id);
  const JSPDF = {
    src: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    integrity: 'sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==',
  };
  // { estado, chamar, toast, erro, carregando, plantaAtual, planogramaDoMovel, corDaMarca, nomeDaMarca, acesso, mostrarResultado }
  let app = null;
  let promessa = null;

  /** Página A4 deitada, em mm. */
  const PAG = { w: 297, h: 210, m: 12 };
  const TINTA = [28, 31, 36];
  const TINTA2 = [91, 96, 104];
  const BORDA = [201, 196, 188];
  const TABUA = [93, 97, 104];

  function carregarJsPDF() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
    if (!promessa) {
      promessa = new Promise((ok, falha) => {
        const s = document.createElement('script');
        s.src = JSPDF.src;
        s.integrity = JSPDF.integrity;
        s.crossOrigin = 'anonymous';
        s.referrerPolicy = 'no-referrer';
        s.onload = () => ok(window.jspdf.jsPDF);
        s.onerror = () => {
          promessa = null;
          falha(new Error('Não foi possível carregar a biblioteca de PDF (jsPDF). Verifique a conexão.'));
        };
        document.head.appendChild(s);
      });
    }
    return promessa;
  }

  const dados = () => app.estado.dados;

  /** Texto nas fontes padrão do PDF (Latin-1): troca o que elas não têm. */
  const pdfTexto = (t) => String(t == null ? '' : t)
    .replace(/\u2026/g, '...').replace(/[\u2013\u2014]/g, '-').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
    .replace(/\u2022/g, '-').replace(/[^\n\u0020-\u00FF]/g, '');

  /** Cor da marca (hex do slide, sem o modo noturno); combinações usam a primeira. */
  function rgbDaMarca(marca) {
    const codigo = String(marca || '').split('+')[0].trim();
    const m = dados().marcas[codigo];
    const hex = /^#[0-9a-f]{6}$/i.test(codigo) ? codigo : m && m.etiqueta;
    if (!hex || codigo === 'NEUTRO') return [138, 143, 151];
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  /** A cor clareada (fundo dos quadrados). */
  const clara = (rgb, f) => rgb.map((c) => Math.round(c + (255 - c) * (f === undefined ? 0.82 : f)));

  const numero = (v, casas) => (Math.round(v * Math.pow(10, casas || 0)) / Math.pow(10, casas || 0)).toLocaleString('pt-BR', { minimumFractionDigits: casas || 0, maximumFractionDigits: casas || 0 });
  const chaveMov = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();

  /** Os móveis do briefing: as gôndolas e as pirâmides (sempre) e os outros móveis com prateleiras desenhadas. */
  const TIPOS = ['GONDOLA', 'PIRAMIDE'];
  const ehPiramide = (m) => m.tipo === 'PIRAMIDE';
  /** O móvel tem algum espaço com as prateleiras desenhadas na construção? */
  function temDesenho(planta, m, ciclo) {
    const plano = m.tipo !== 'CAIXA' && app.planogramaDoMovel(planta, m, ciclo);
    return !!plano && plano.colunas.some((c) => c.desenhada);
  }
  /** Móveis do briefing numa ER: primeiro as gôndolas, depois as pirâmides e os outros, cada tipo em ordem de número. */
  function moveisDe(planta, ciclo) {
    const ordem = (m) => (TIPOS.indexOf(m.tipo) >= 0 ? TIPOS.indexOf(m.tipo) : TIPOS.length);
    return planta.moveis.filter((m) => TIPOS.indexOf(m.tipo) >= 0 || temDesenho(planta, m, ciclo))
      .sort((a, b) => ordem(a) - ordem(b) || a.id.localeCompare(b.id, 'pt-BR', { numeric: true }));
  }
  /** "3 gôndolas, 2 pirâmides e 1 outro móvel". */
  const contarTipos = (moveis) => {
    const qtd = (n, um, varios) => (n ? n + ' ' + (n === 1 ? um : varios) : '');
    const g = moveis.filter((m) => m.tipo === 'GONDOLA').length;
    const p = moveis.filter(ehPiramide).length;
    const partes = [qtd(g, 'gôndola', 'gôndolas'), qtd(p, 'pirâmide', 'pirâmides'), qtd(moveis.length - g - p, 'outro móvel', 'outros móveis')].filter(Boolean);
    return partes.length > 1 ? partes.slice(0, -1).join(', ') + ' e ' + partes[partes.length - 1] : partes[0] || '';
  };
  /** Nome do tipo do móvel ("Gôndola", "Mesa destaque"…). */
  const nomeDoTipo = (m) => String((dados().tipos && dados().tipos[m.tipo]) || m.tipo).split(':')[0].trim();

  /**
   * Medidas pelo layout (em metros): a largura da frente de cada espaço e a altura. Os 4 lados da pirâmide têm o
   * mesmo tamanho: a largura de um lado dela. Na mesa, a frente do nicho não sai do layout (sem cm).
   */
  function medidasDe(m, id) {
    if (m.tipo === 'GONDOLA') return Render.medidasGondola(m, id);
    if (m.tipo === 'MESA' || m.tipo === 'MESA_3') return null;
    return { largura: Math.max(m.w, m.d), altura: m.h };
  }

  /** A coluna i é a metade 2 de um meio dividido, logo depois da metade 1 (as duas ficam juntas no desenho). */
  const metadeDaDireita = (colunas, i) => {
    const m = /^(MEIO-[AB])-2$/.exec((colunas[i] || {}).id || '');
    return !!m && i > 0 && colunas[i - 1].id === m[1] + '-1';
  };
  /** "Meio A (metade 1)" → "metade 1". */
  const nomeDaMetade = (nome) => ((/\((metade \d)\)/i.exec(nome) || [])[1] || nome);

  /**
   * O que vai no PDF para um móvel: as colunas do planograma e, de cada espaço, uma seção com uma tabela por
   * movimento. Os blocos (quadrados) de cada espaço são numerados 1, 2, 3…, de cima para baixo e da esquerda para a
   * direita (o número aparece no desenho e na tabela); as duas metades de um meio dividido são um espaço só.
   * @return {{m, plano, colunas: Array<{col, id, medidas, desenhada}>, secoes: Array}}
   */
  function montarMovel(planta, m, ciclo) {
    const plano = app.planogramaDoMovel(planta, m, ciclo);
    const colunas = plano.colunas.map((col) => {
      const id = col.id && col.id.indexOf('/') >= 0 ? col.id.split('/')[1] : '';
      return { col, id, medidas: medidasDe(m, id), desenhada: !!col.desenhada };
    });
    // Espaços: cada coluna, com as duas metades de um meio dividido juntas.
    const espacos = [];
    colunas.forEach((c, i) => {
      if (metadeDaDireita(colunas, i)) espacos[espacos.length - 1].colunas.push(c);
      else espacos.push({ colunas: [c] });
    });
    const secoes = espacos.filter((e) => e.colunas.some((c) => c.col.id)).map((e) => {
      const dividido = e.colunas.length > 1;
      const nome = dividido ? e.colunas[0].col.nome.replace(/\s*\(metade \d\)/i, '') + ' (dividido em 2)' : e.colunas[0].col.nome;
      const largura = e.colunas.reduce((s, c) => (s === null || !c.medidas ? null : s + c.medidas.largura), 0);
      const secao = { nome, largura, tabelas: [], semDesenho: [] };
      let bloco = 0;
      const tabelaDe = (c, mov) => {
        const chave = (dividido ? c.id + '|' : '') + chaveMov(mov);
        let t = secao.tabelas.find((x) => x.chave === chave);
        if (!t) {
          t = { chave, movimento: mov || 'Sem movimento', marca: mov ? marcaDe(c.col, mov) : '', nota: dividido ? nomeDaMetade(c.col.nome) : '', linhas: [] };
          secao.tabelas.push(t);
        }
        return t;
      };
      e.colunas.filter((c) => !c.desenhada).forEach((c) => {
        const etq = c.col.etiquetas.map((x) => x.texto).join(' / ');
        secao.semDesenho.push((dividido ? nomeDaMetade(c.col.nome) + ': ' : '') + (etq ? 'sem desenho; as etiquetas dividem as prateleiras (' + etq + ')' : 'sem desenho e sem etiqueta'));
      });
      // Prateleira por prateleira (1 = a de cima); em cada uma, da esquerda para a direita, passando pelas duas metades.
      for (let k = 0; k < plano.n; k++) {
        e.colunas.filter((c) => c.desenhada).forEach((c) => {
          const cel = c.col.celulas[k];
          (cel ? cel.quadrados : []).forEach((q) => {
            bloco++;
            q.codigo = String(bloco);
            const t = tabelaDe(c, q.movimento);
            const obs = q.observacao || '';
            if (!q.produtos.length) t.linhas.push({ bloco, primeira: true, sku: '', frentes: '', obs, vazio: true });
            q.produtos.forEach((x, j) => t.linhas.push({
              bloco, primeira: j === 0, sku: x.sku + (x.foraDoCatalogo ? ' *' : ''), frentes: String(x.frentes), obs: j === 0 ? obs : '',
            }));
          });
        });
      }
      return secao;
    });
    return { m, plano, colunas, secoes };
  }

  /* ------------------------------- desenho -------------------------------- */

  /** Corta o texto com "..." para caber em w (na fonte atual). */
  function caber(doc, t, w) {
    let s = pdfTexto(t);
    if (doc.getTextWidth(s) <= w) return s;
    while (s.length > 1 && doc.getTextWidth(s + '...') > w) s = s.slice(0, -1);
    return s.trim() + '...';
  }

  function fonte(doc, tam, peso, cor) {
    doc.setFont('helvetica', peso || 'normal');
    doc.setFontSize(tam);
    doc.setTextColor.apply(doc, cor || TINTA);
  }

  function cabecalho(doc, titulo, sub, direita) {
    fonte(doc, 16, 'bold');
    doc.text(pdfTexto(titulo), PAG.m, PAG.m + 6);
    fonte(doc, 9, 'normal', TINTA2);
    if (sub) doc.text(caber(doc, sub, PAG.w - 2 * PAG.m), PAG.m, PAG.m + 12);
    if (direita) {
      fonte(doc, 10, 'bold');
      doc.text(pdfTexto(direita), PAG.w - PAG.m, PAG.m + 6, { align: 'right' });
    }
    doc.setDrawColor.apply(doc, BORDA);
    doc.setLineWidth(0.3);
    doc.line(PAG.m, PAG.m + 15, PAG.w - PAG.m, PAG.m + 15);
  }

  /**
   * O planograma do móvel: uma coluna por espaço (na gôndola, o meio com o dobro da largura da ponta; as metades de um
   * meio dividido juntas, com um pontilhado entre elas), as prateleiras de cima para baixo, com os quadrados e o número
   * de cada um (ou a divisão automática, sem desenho).
   */
  function desenharPlanograma(doc, g, x0, y0, w0, h) {
    // A pirâmide e os móveis de uma coluna só não ocupam a largura toda da página.
    const w = ehPiramide(g.m) ? Math.min(w0, 150) : g.colunas.length === 1 ? Math.min(w0, 120) : w0;
    const rotW = 8;
    const nomeH = 6;
    const vao = (i) => (i === 0 || metadeDaDireita(g.colunas, i) ? 0 : 3);
    const pesos = g.colunas.reduce((s, c) => s + c.col.peso, 0);
    const util = w - rotW - g.colunas.reduce((s, c, i) => s + vao(i), 0);
    const n = g.plano.n;
    const linhaH = (h - nomeH) / n;
    // Número das prateleiras (1 = a de cima).
    fonte(doc, 8, 'bold', TINTA2);
    for (let k = 0; k < n; k++) doc.text(String(k + 1), x0 + rotW - 3, y0 + k * linhaH + linhaH / 2 + 1.2, { align: 'right' });
    let cx = x0 + rotW;
    const pontilhados = [];
    g.colunas.forEach((c, i) => {
      cx += vao(i);
      if (metadeDaDireita(g.colunas, i)) pontilhados.push(cx);
      const cw = (c.col.peso / pesos) * util;
      // Fundo e laterais da coluna.
      doc.setFillColor(244, 242, 239);
      doc.setDrawColor.apply(doc, BORDA);
      doc.setLineWidth(0.3);
      doc.rect(cx, y0, cw, n * linhaH, 'FD');
      if (c.desenhada) {
        c.col.celulas.forEach((cel, k) => {
          const sy = y0 + k * linhaH;
          const area = { x: cx + 0.8, y: sy + 0.8, w: cw - 1.6, h: linhaH - 2.6 };
          cel.quadrados.forEach((q) => {
            const cor = rgbDaMarca(marcaDe(c.col, q.movimento));
            const bx = area.x + (q.x / 100) * area.w;
            const by = area.y + (q.y / 100) * area.h;
            const bw = (q.w / 100) * area.w;
            const bh = (q.h / 100) * area.h;
            doc.setFillColor.apply(doc, clara(cor));
            doc.setDrawColor.apply(doc, cor);
            doc.setLineWidth(0.45);
            doc.rect(bx + 0.3, by + 0.3, bw - 0.6, bh - 0.6, 'FD');
            const tw = bw - 2;
            let ty = by + 4;
            if (ty < by + bh - 0.5) {
              // O número liga o desenho à tabela: diminui até caber e nunca é cortado.
              let tam = 9;
              fonte(doc, tam, 'bold');
              while (tam > 4.5 && doc.getTextWidth(q.codigo) > tw) { tam -= 0.5; fonte(doc, tam, 'bold'); }
              doc.text(q.codigo, bx + 1, ty);
            }
            ty += 3;
            if (q.movimento && ty < by + bh - 0.5) { fonte(doc, 5.6, 'bold', cor); doc.text(caber(doc, q.movimento, tw), bx + 1, ty); }
            ty += 2.8;
            if (ty < by + bh - 0.5) {
              fonte(doc, 5.6, 'normal', TINTA2);
              const qtd = q.produtos.length;
              doc.text(caber(doc, qtd ? qtd + (qtd === 1 ? ' produto' : ' produtos') + ' · ' + q.produtos.reduce((s, x) => s + x.frentes, 0) + ' fr.' : 'sem produtos', tw), bx + 1, ty);
            }
          });
        });
      } else {
        // Sem desenho: a divisão automática pelas etiquetas, em cinza claro, com o texto.
        c.col.celulas.forEach((cel) => {
          const sy = y0 + cel.de * linhaH;
          const sh = (cel.ate - cel.de) * linhaH;
          const e = cel.etiquetas[0];
          const cor = rgbDaMarca(e ? e.marca : '');
          doc.setFillColor.apply(doc, clara(cor, 0.88));
          doc.rect(cx + 0.15, sy + 0.15, cw - 0.3, sh - 0.3, 'F');
          // O texto no alto da célula (no meio, ele cairia numa tábua quando a etiqueta ocupa duas prateleiras).
          fonte(doc, 7, 'bold', e ? cor : TINTA2);
          const txt = cel.etiquetas.map((x) => x.texto).join(' / ') || 'sem etiqueta';
          doc.text(caber(doc, txt, cw - 3), cx + cw / 2, sy + 5, { align: 'center' });
          fonte(doc, 5.6, 'italic', TINTA2);
          doc.text('sem desenho', cx + cw / 2, sy + 8.2, { align: 'center' });
        });
      }
      // Tábuas das prateleiras.
      doc.setFillColor.apply(doc, TABUA);
      for (let k = 0; k < n; k++) doc.rect(cx, y0 + (k + 1) * linhaH - 1.4, cw, 1.4, 'F');
      // Nome do espaço e a largura da frente (pelo layout).
      fonte(doc, 7.5, 'bold');
      const med = c.medidas ? ' · ' + numero(c.medidas.largura * 100) + ' cm' : '';
      doc.text(caber(doc, c.col.nome.toUpperCase() + med, cw), cx + cw / 2, y0 + n * linhaH + 4.2, { align: 'center' });
      cx += cw;
    });
    // Entre as metades de um meio dividido: só um pontilhado (por cima das laterais das duas colunas).
    pontilhados.forEach((x) => {
      doc.setFillColor(244, 242, 239);
      doc.rect(x - 0.4, y0, 0.8, n * linhaH, 'F');
      doc.setDrawColor.apply(doc, TINTA2);
      doc.setLineWidth(0.4);
      doc.setLineDashPattern([1.2, 1], 0);
      doc.line(x, y0, x, y0 + n * linhaH);
      doc.setLineDashPattern([], 0);
    });
  }

  /** Marca de um movimento: a da etiqueta do espaço com esse texto. */
  function marcaDe(col, mov) {
    const e = col.etiquetas.find((x) => chaveMov(x.texto) === chaveMov(mov));
    return e ? e.marca : '';
  }

  /** Colunas das tabelinhas (fração da largura da coluna da página). */
  const COLS = [{ t: 'Bloco', f: 0.13, a: 'center' }, { t: 'SKU', f: 0.27 }, { t: 'Frentes', f: 0.15, a: 'center' }, { t: 'Observação', f: 0.45 }];
  /** As tabelas ocupam a página em colunas, uma depois da outra. */
  const FLUXO = { colunas: 3, vao: 6, linha: 4.4 };

  /**
   * Monta os pedaços da página (títulos, cabeçalhos e linhas) com a altura de cada um, para o fluxo em colunas.
   * Cada pedaço: { h, junto (altura que precisa vir junto na mesma coluna), desenhar(x, y, w), repetir (o que
   * redesenhar no alto da coluna seguinte, quando a tabela continua nela) }.
   */
  function pedacos(doc, g, larg) {
    const lista = [];
    const ws = COLS.map((c) => c.f * larg);
    const obsW = ws[3] - 2.4;
    g.secoes.forEach((s) => {
      lista.push({
        h: 8, junto: 13.6,
        desenhar: (x, y, w) => {
          fonte(doc, 9, 'bold');
          doc.text(caber(doc, s.nome.toUpperCase(), w - 22), x, y + 5);
          if (s.largura) { fonte(doc, 7.5, 'normal', TINTA2); doc.text(numero(s.largura * 100) + ' cm', x + w, y + 5, { align: 'right' }); }
          doc.setDrawColor.apply(doc, TINTA);
          doc.setLineWidth(0.4);
          doc.line(x, y + 6.6, x + w, y + 6.6);
        },
      });
      s.semDesenho.forEach((t) => {
        fonte(doc, 6.8, 'italic', TINTA2);
        const linhas = doc.splitTextToSize(pdfTexto(t), larg);
        lista.push({ h: linhas.length * 3 + 1.6, desenhar: (x, y) => { fonte(doc, 6.8, 'italic', TINTA2); doc.text(linhas, x, y + 3); } });
      });
      s.tabelas.forEach((t) => {
        const cor = t.movimento === 'Sem movimento' ? TINTA2 : rgbDaMarca(t.marca);
        // Título da tabela: o movimento (na cor da marca) e, no meio dividido, a metade.
        const titulo = (x, y, w, cont) => {
          doc.setFillColor.apply(doc, cor);
          doc.rect(x, y + 0.8, 1.6, 4, 'F');
          const nota = pdfTexto((t.nota ? ' · ' + t.nota : '') + (cont ? ' (continuação)' : ''));
          fonte(doc, 7, 'normal', TINTA2);
          const notaW = doc.getTextWidth(nota);
          fonte(doc, 7.8, 'bold', cor);
          const mov = caber(doc, t.movimento, w - 4 - notaW);
          doc.text(mov, x + 3, y + 4);
          if (nota) { const movW = doc.getTextWidth(mov); fonte(doc, 7, 'normal', TINTA2); doc.text(nota, x + 3 + movW, y + 4); }
        };
        const cab = (x, y, w) => {
          doc.setFillColor(32, 33, 36);
          doc.rect(x, y, w, 4.2, 'F');
          fonte(doc, 6.6, 'bold', [255, 255, 255]);
          let cx = x;
          COLS.forEach((c, i) => {
            const cw = ws[i];
            doc.text(c.t, c.a === 'center' ? cx + cw / 2 : cx + 1.2, y + 2.9, { align: c.a || 'left' });
            cx += cw;
          });
        };
        const repetir = { h: 10, desenhar: (x, y, w) => { titulo(x, y, w, true); cab(x, y + 5.6, w); } };
        lista.push({ h: 5.6, junto: 4.2 + FLUXO.linha, desenhar: (x, y, w) => titulo(x, y, w, false) });
        lista.push({ h: 4.2, junto: FLUXO.linha, desenhar: cab });
        let faixa = false;
        let ultimo = null;
        t.linhas.forEach((l) => {
          fonte(doc, 6.8, 'normal');
          const obs = l.obs ? doc.splitTextToSize(pdfTexto(l.obs), obsW).slice(0, 4) : [];
          const h = Math.max(FLUXO.linha, obs.length * 2.9 + 1.6);
          if (l.bloco !== ultimo) { faixa = !faixa; ultimo = l.bloco; }
          const zebra = faixa;
          lista.push({
            h, repetir,
            desenhar: (x, y, w) => {
              if (zebra) { doc.setFillColor(244, 245, 247); doc.rect(x, y, w, h, 'F'); }
              if (l.primeira) { doc.setDrawColor.apply(doc, BORDA); doc.setLineWidth(0.15); doc.line(x, y, x + w, y); }
              const vals = [l.primeira ? String(l.bloco) : '', l.vazio ? 'sem produtos' : l.sku, l.frentes];
              let cx = x;
              vals.forEach((v, i) => {
                fonte(doc, i === 0 ? 7.6 : 6.8, i === 0 ? 'bold' : 'normal', l.vazio && i === 1 ? TINTA2 : TINTA);
                doc.text(caber(doc, v, ws[i] - 2.4), COLS[i].a === 'center' ? cx + ws[i] / 2 : cx + 1.2, y + 3.1, { align: COLS[i].a || 'left' });
                cx += ws[i];
              });
              if (obs.length) { fonte(doc, 6.8, 'normal', TINTA2); doc.text(obs, cx + 1.2, y + 3.1, { lineHeightFactor: 1.2 }); }
            },
          });
        });
        lista.push({ h: 3, desenhar: () => {} });
      });
      lista.push({ h: 2, desenhar: () => {} });
    });
    return lista;
  }

  /** Página(s) de um móvel: o planograma no alto e, embaixo, as tabelas de cada espaço, em colunas. */
  function paginaMovel(doc, planta, g, ciclo) {
    const m = g.m;
    const titulo = m.id + (m.descricao && chaveMov(m.descricao) !== chaveMov(m.id) ? ' · ' + m.descricao : '');
    const n = g.plano.n;
    const medida = (ehPiramide(m) ? '4 lados de ' + numero(Math.max(m.w, m.d) * 100) + ' cm · ' : '')
      + (n > 1 ? n + ' prateleiras de cerca de ' + numero((m.h * 100) / n) + ' cm (1 = a de cima)' : 'um nível');
    const dims = nomeDoTipo(m) + ' ' + numero(Math.max(m.w, m.d), 2) + ' × ' + numero(Math.min(m.w, m.d), 2) + ' m, ' + numero(m.h, 2) + ' m de altura · '
      + medida + ' · medidas em cm pelo layout: confira no móvel';
    const direita = planta.nome + ' · ' + (/^ciclo\b/i.test(ciclo) ? ciclo : 'Ciclo ' + ciclo);
    cabecalho(doc, titulo, dims, direita);
    const yPlano = PAG.m + 19;
    const alturaPlano = n > 1 ? 84 : 44; // um nível só (o nicho da mesa): mais baixo, sobra lugar para as tabelas
    desenharPlanograma(doc, g, PAG.m, yPlano, PAG.w - 2 * PAG.m, alturaPlano);
    const larg = (PAG.w - 2 * PAG.m - (FLUXO.colunas - 1) * FLUXO.vao) / FLUXO.colunas;
    const fundo = PAG.h - PAG.m - 6;
    let topo = yPlano + alturaPlano + 6;
    let col = 0;
    let y = topo;
    const lista = pedacos(doc, g, larg);
    lista.forEach((p, i) => {
      if (y + p.h + (p.junto || 0) > fundo && y > topo) {
        col++;
        if (col >= FLUXO.colunas) {
          doc.addPage();
          cabecalho(doc, titulo + ' (continuação)', 'Tabelas dos blocos, continuação.', direita);
          topo = PAG.m + 19;
          col = 0;
        }
        y = topo;
        // A tabela continua na coluna nova: repete o título (continuação) e o cabeçalho.
        const ant = lista[i - 1];
        if (p.repetir && ant && (ant.repetir === p.repetir)) {
          p.repetir.desenhar(PAG.m + col * (larg + FLUXO.vao), y, larg);
          y += p.repetir.h;
        }
      }
      p.desenhar(PAG.m + col * (larg + FLUXO.vao), y, larg);
      y += p.h;
    });
  }

  /** Linhas do índice que cabem na capa (a 1ª página da capa, depois do "Como ler", e as seguintes). */
  const INDICE = { primeira: 14, demais: 32 };
  const paginasDaCapa = (n) => 1 + Math.max(0, Math.ceil((n - INDICE.primeira) / INDICE.demais));

  /** Capa: ciclo, ERs, como ler e o índice dos móveis (com a página de cada um), nas páginas reservadas. */
  function capa(doc, ciclo, ers, indice) {
    cabecalho(doc, 'Briefing do planograma', 'Planograma desenhado no Plano de Varejo, para reproduzir no programa de planograma.',
      /^ciclo\b/i.test(ciclo) ? ciclo : 'Ciclo ' + ciclo);
    let y = PAG.m + 24;
    fonte(doc, 10, 'bold');
    doc.text('Como ler', PAG.m, y);
    fonte(doc, 8.5, 'normal');
    const como = [
      'Cada página é um móvel de uma ER: as gôndolas, as pirâmides e os outros móveis com prateleiras desenhadas. No alto, o planograma, de cima para baixo (1 = a de cima). Na gôndola: Ponta A, Meio A, Ponta B e Meio B (cada meio com o dobro da largura de uma ponta); um meio dividido aparece com as duas metades juntas, separadas por um pontilhado. Na pirâmide: os 4 lados, do mesmo tamanho (Lado 1 a Lado 4), cada um com as 4 prateleiras.',
      'Cada bloco desenhado tem um número: 1, 2, 3..., de cima para baixo e da esquerda para a direita. A numeração recomeça em cada espaço (as duas metades de um meio dividido seguem a mesma numeração).',
      'Embaixo do planograma, cada espaço tem uma tabela por movimento: o número do bloco, o SKU e as frentes de cada produto (na ordem da esquerda para a direita) e a observação do bloco.',
      'Os espaços sem desenho aparecem com a divisão automática pelas etiquetas do espaço (sem produtos definidos).',
    ];
    y += 5;
    como.forEach((p) => {
      const linhas = doc.splitTextToSize(pdfTexto('• ' + p), PAG.w - 2 * PAG.m);
      doc.text(linhas, PAG.m, y);
      y += linhas.length * 3.8 + 1.5;
    });
    y += 4;
    fonte(doc, 10, 'bold');
    doc.text('Móveis', PAG.m, y);
    y += 3;
    const cols = [['ER', 22], ['Móvel', 60], ['Espaços desenhados', 90], ['Blocos', 22], ['Produtos', 22], ['Página', 20]];
    doc.setFillColor(32, 33, 36);
    doc.rect(PAG.m, y, cols.reduce((s, c) => s + c[1], 0), 5.4, 'F');
    fonte(doc, 7.5, 'bold', [255, 255, 255]);
    let x = PAG.m;
    cols.forEach((c) => { doc.text(pdfTexto(c[0]), x + 1.5, y + 3.8); x += c[1]; });
    y += 5.4;
    let pagina = 1;
    let naPagina = 0;
    indice.forEach((it, i) => {
      if (naPagina >= (pagina === 1 ? INDICE.primeira : INDICE.demais)) {
        pagina++;
        naPagina = 0;
        doc.setPage(pagina);
        y = PAG.m + 4;
      }
      naPagina++;
      if (i % 2) { doc.setFillColor(244, 245, 247); doc.rect(PAG.m, y, cols.reduce((s, c) => s + c[1], 0), 5, 'F'); }
      fonte(doc, 7.5, 'normal');
      const vals = [it.er, it.gondola, it.desenhados || 'nenhum', String(it.quadrados), String(it.produtos), String(it.pagina)];
      x = PAG.m;
      cols.forEach((c, j) => { doc.text(caber(doc, vals[j], c[1] - 3), x + 1.5, y + 3.5); x += c[1]; });
      y += 5;
    });
    if (!indice.length) {
      fonte(doc, 9, 'italic', TINTA2);
      doc.text('Nenhum móvel com planograma nas ERs escolhidas.', PAG.m, y + 6);
    }
    doc.setPage(1);
    fonte(doc, 7.5, 'normal', TINTA2);
    doc.text(pdfTexto('ERs: ' + ers.map((p) => p.nome).join(', ')), PAG.m, PAG.h - PAG.m - 2);
  }

  /** Rodapé de todas as páginas: o que é, quando foi gerado e a página. */
  function rodapes(doc, ciclo) {
    const total = doc.internal.getNumberOfPages();
    const agora = new Date();
    const p2 = (n) => (n < 10 ? '0' : '') + n;
    const quando = p2(agora.getDate()) + '/' + p2(agora.getMonth() + 1) + '/' + agora.getFullYear() + ' ' + p2(agora.getHours()) + ':' + p2(agora.getMinutes());
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      fonte(doc, 7, 'normal', TINTA2);
      doc.text(pdfTexto('Plano de Varejo · Briefing do planograma · ' + ciclo + ' · gerado em ' + quando), PAG.m, PAG.h - PAG.m + 4);
      doc.text('Página ' + i + ' de ' + total, PAG.w - PAG.m, PAG.h - PAG.m + 4, { align: 'right' });
    }
  }

  /**
   * Gera o PDF dos móveis das ERs dadas (gôndolas, pirâmides e os outros móveis desenhados), no ciclo da tela.
   * @return {Promise<{blob, nome, paginas, gondolas, resumo}>}  gondolas: quantos móveis; resumo: "3 gôndolas e 2 pirâmides"
   */
  async function gerar(plantas) {
    const ciclo = app.estado.ciclo;
    if (!ciclo) throw new Error('Escolha um ciclo para baixar o briefing.');
    const JsPDF = await carregarJsPDF();
    const doc = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
    doc.setProperties({ title: 'Briefing do planograma · ' + ciclo, subject: 'Planograma dos móveis', creator: 'Plano de Varejo' });
    const grupos = plantas.map((planta) => ({ planta, gondolas: moveisDe(planta, ciclo).map((m) => montarMovel(planta, m, ciclo)) }));
    // A capa vem primeiro; o índice precisa das páginas das gôndolas, então as páginas dela ficam reservadas e ela é
    // desenhada no fim.
    const total = grupos.reduce((s, gr) => s + gr.gondolas.length, 0);
    for (let i = 1; i < paginasDaCapa(total); i++) doc.addPage();
    const indice = [];
    grupos.forEach((gr) => gr.gondolas.forEach((g) => {
      doc.addPage();
      const quadrados = [].concat(...g.colunas.filter((c) => c.desenhada).map((c) => [].concat(...c.col.celulas.map((cel) => cel.quadrados))));
      indice.push({
        er: gr.planta.nome, gondola: g.m.id, pagina: doc.internal.getNumberOfPages(),
        desenhados: g.colunas.filter((c) => c.desenhada).map((c) => c.col.nome).join(', '),
        quadrados: quadrados.length, produtos: quadrados.reduce((s, q) => s + q.produtos.length, 0),
      });
      paginaMovel(doc, gr.planta, g, ciclo);
    }));
    doc.setPage(1);
    capa(doc, ciclo, plantas, indice);
    doc.setPage(doc.internal.getNumberOfPages());
    rodapes(doc, ciclo);
    const nome = nomeDoArquivo(ciclo, plantas.length === 1 ? plantas[0].nome : '');
    const moveis = [].concat(...grupos.map((gr) => gr.gondolas.map((g) => g.m)));
    return { blob: doc.output('blob'), nome, paginas: doc.internal.getNumberOfPages(), gondolas: indice.length, resumo: contarTipos(moveis) };
  }

  /** Texto sem os caracteres que o Drive e o Windows não aceitam bem: "C15/2026" → "C15-2026". */
  const parteDoNome = (v) => String(v || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
  /** Subpasta do ciclo na pasta do Drive (o mesmo do nomePastaCiclo_ do Code.gs). */
  const nomeDaPasta = (ciclo) => parteDoNome(ciclo).slice(0, 100);
  /** "Briefing - C15-2026 - ER M.pdf" (sem ER: "… - Todas as ERs.pdf"); o mesmo nome do nomeBriefing_ do Code.gs. */
  const nomeDoArquivo = (ciclo, er) => 'Briefing - ' + nomeDaPasta(ciclo) + ' - ' + (parteDoNome(er) || 'Todas as ERs') + '.pdf';

  /** Quem pode salvar no Drive: com a pasta vinculada e o login da Construção. */
  function podeSalvarNoDrive() {
    const a = app.acesso && app.acesso();
    return { pasta: !!dados().pastaBriefings, construtor: !!a && a.papel === 'CONSTRUTOR' };
  }

  function baixarBlob(blob, nome) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  function abrirDialogo() {
    const planta = app.plantaAtual();
    if (!planta) return;
    if (!app.estado.ciclo) { app.toast('Escolha um ciclo para baixar o briefing.', true); return; }
    const dlg = $('dlgBriefing');
    $('briefingEsta').textContent = planta.nome;
    // Destino: o Drive aparece com a pasta vinculada e só fica ligado para quem entrou na Construção.
    const drive = podeSalvarNoDrive();
    const rDrive = dlg.querySelector('input[name="briefingDestino"][value="drive"]');
    $('briefingDestinos').hidden = !drive.pasta;
    rDrive.disabled = !drive.construtor;
    $('briefingDriveOpcao').title = drive.construtor ? '' : 'Só quem entrou na Construção (engrenagem › Construção) salva na pasta do Drive';
    if (!drive.pasta || !drive.construtor) dlg.querySelector('input[name="briefingDestino"][value="baixar"]').checked = true;
    const atualizar = () => {
      const todas = dlg.querySelector('input[name="briefingErs"]:checked').value === 'todas';
      const naPasta = dlg.querySelector('input[name="briefingDestino"]:checked').value === 'drive';
      const moveis = [].concat(...(todas ? dados().plantas : [planta]).map((p) => moveisDe(p, app.estado.ciclo)));
      $('briefingResumo').textContent = moveis.length ? contarTipos(moveis) + ' · ' + (/^ciclo\b/i.test(app.estado.ciclo) ? app.estado.ciclo : 'Ciclo ' + app.estado.ciclo) : 'Nenhum móvel com planograma nesta escolha.';
      const nome = nomeDoArquivo(app.estado.ciclo, todas ? '' : planta.nome);
      $('briefingNome').textContent = 'Arquivo: ' + (naPasta ? nomeDaPasta(app.estado.ciclo) + ' / ' : '') + nome;
      $('briefingBaixar').textContent = naPasta ? 'Salvar no Drive' : 'Baixar PDF';
      $('briefingBaixar').disabled = !moveis.length;
    };
    dlg.querySelectorAll('input[name="briefingErs"], input[name="briefingDestino"]').forEach((r) => { r.onchange = atualizar; });
    atualizar();
    dlg.returnValue = '';
    dlg.showModal();
  }

  async function baixar() {
    const dlg = $('dlgBriefing');
    if (dlg.returnValue !== 'baixar') return;
    const todas = dlg.querySelector('input[name="briefingErs"]:checked').value === 'todas';
    const naPasta = dlg.querySelector('input[name="briefingDestino"]:checked').value === 'drive' && !$('briefingDestinos').hidden;
    const plantas = todas ? dados().plantas : [app.plantaAtual()];
    app.carregando(true, 'Gerando o briefing em PDF…');
    try {
      const r = await gerar(plantas);
      if (naPasta) {
        app.carregando(true, 'Salvando na pasta do Drive…');
        const base64 = await new Promise((ok, falha) => {
          const leitor = new FileReader();
          leitor.onload = () => ok(String(leitor.result).replace(/^data:[^,]*,/, ''));
          leitor.onerror = falha;
          leitor.readAsDataURL(r.blob);
        });
        const s = await app.chamar('salvarBriefingNoDrive', app.acesso(), { ciclo: app.estado.ciclo, er: todas ? '' : plantas[0].nome, base64 });
        app.mostrarResultado('Briefing salvo no Drive',
          s.nome + ' (' + r.resumo + ', ' + r.paginas + ' páginas) está na pasta ' + s.pasta + (s.substituidos ? ', no lugar do briefing anterior com o mesmo nome.' : '.'),
          [{ texto: 'Abrir o arquivo', url: s.url }, { texto: 'Abrir a pasta ' + s.pasta, url: s.pastaUrl }]);
        return;
      }
      baixarBlob(r.blob, r.nome);
      app.toast('Download iniciado: ' + r.nome + ' (' + r.resumo + ', ' + r.paginas + ' páginas)');
    } catch (e) {
      app.erro(e);
    } finally {
      app.carregando(false);
    }
  }

  function iniciar(contexto) {
    app = contexto;
    $('btnBriefing').addEventListener('click', () => { if (dados()) abrirDialogo(); });
    $('dlgBriefing').addEventListener('close', baixar);
  }

  return { iniciar, gerar };
})();
</script>
