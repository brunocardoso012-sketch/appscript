<script>
/**
 * ============================================================================
 *  SLIDE DA ESTRATÉGIA (PNG): o espaço da ER por marca, movimento e classificação, em gráficos, 16:9
 * ============================================================================
 *  Estrategia.desenhar(svg, dados, { recorte }) monta, num SVG de 1920×1080, um compilado do painel:
 *   - números principais (espaços, móveis, movimentos e GMV esperado);
 *   - Por marca: barra 100% com a divisão dos espaços e uma linha por marca;
 *   - Por movimentos: uma barra por movimento (empilhada pelas marcas), com o selo da classificação
 *     e o GMV esperado;
 *   - Por classificação: espaços e GMV esperado de cada uma (duas barras, cada uma na sua escala).
 *  recorte: sem o fundo e sem o título do slide (só os cartões), para recortar no conteúdo.
 *  Os dados vêm prontos da aplicação (App.dadosEstrategia); aqui só o desenho. Todo o estilo vai em
 *  atributos SVG, para o PNG sair igual.
 */
const Estrategia = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const FONTE = 'Arial, Helvetica, sans-serif';
  const FONTE_ETQ = "Nunito, 'Segoe UI', Arial, sans-serif";
  const W = 1920;
  const H = 1080;
  const M = 64; // margem do slide
  const COR = {
    fundo: '#F3EFEA', cartao: '#FFFFFF', borda: '#E4DED6',
    tinta: '#1C1F24', tinta2: '#5B6068', tinta3: '#8A8F97', trilho: '#EEEAE4',
  };

  function el(tag, attrs, pai) {
    const e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach((k) => { if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); });
    if (pai) pai.appendChild(e);
    return e;
  }

  function texto(pai, x, y, conteudo, attrs) {
    const t = el('text', Object.assign({ x, y, 'font-family': FONTE, fill: COR.tinta }, attrs), pai);
    t.textContent = conteudo;
    return t;
  }

  const medidor = document.createElement('canvas').getContext('2d');
  function largura(txt, tam, peso, fonte) {
    medidor.font = (peso || 400) + ' ' + tam + 'px ' + (fonte || FONTE);
    return medidor.measureText(txt).width;
  }

  /** Corta o texto com "…" para caber em maxW. */
  function caber(txt, maxW, tam, peso, fonte) {
    let t = String(txt);
    if (largura(t, tam, peso, fonte) <= maxW) return t;
    while (t.length > 1 && largura(t + '…', tam, peso, fonte) > maxW) t = t.slice(0, -1);
    return t.trim() + '…';
  }

  /** Barra com as pontas de dados arredondadas (4px) e a base reta, na horizontal. */
  function barra(pai, x, y, w, h, cor, arredondar) {
    if (w <= 0) return null;
    const r = arredondar ? Math.min(4, w / 2, h / 2) : 0;
    const d = 'M' + x + ',' + y + 'h' + (w - r) + (r ? 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r : '') +
      'v' + (h - 2 * r) + (r ? 'a' + r + ',' + r + ' 0 0 1 ' + -r + ',' + r : '') + 'h' + -(w - r) + 'z';
    return el('path', { d, fill: cor }, pai);
  }

  /**
   * Segmentos empilhados (na ordem dada), com 2px de vão da cor do fundo entre eles; só a última
   * ponta é arredondada. @return largura total desenhada
   */
  function pilha(pai, x, y, w, h, partes) {
    const total = partes.reduce((s, p) => s + p.valor, 0);
    if (!total || w <= 0) return 0;
    const vao = 2;
    const visiveis = partes.filter((p) => p.valor > 0);
    const util = w - vao * (visiveis.length - 1);
    let cx = x;
    visiveis.forEach((p, i) => {
      const pw = Math.max(1, (p.valor / total) * util);
      barra(pai, cx, y, pw, h, p.cor, i === visiveis.length - 1);
      cx += pw + vao;
    });
    return w;
  }

  function cartao(pai, x, y, w, h, titulo, nota) {
    const g = el('g', null, pai);
    el('rect', { x, y, width: w, height: h, rx: 16, fill: COR.cartao, stroke: COR.borda, 'stroke-width': 1.5 }, g);
    texto(g, x + 28, y + 44, titulo.toUpperCase(), { 'font-size': 17, 'font-weight': 700, fill: COR.tinta2, 'letter-spacing': 1.2 });
    if (nota) texto(g, x + w - 28, y + 44, nota, { 'font-size': 15, fill: COR.tinta3, 'text-anchor': 'end' });
    return g;
  }

  /** Selo da classificação (pílula colorida com texto branco). @return largura */
  function selo(pai, x, y, rotulo, cor, tam) {
    const fs = tam || 14;
    const w = largura(rotulo, fs, 800, FONTE_ETQ) + 18;
    const h = fs + 9;
    el('rect', { x, y: y - h / 2, width: w, height: h, rx: h / 2, fill: cor }, pai);
    texto(pai, x + w / 2, y + fs * 0.36, rotulo, {
      'font-family': FONTE_ETQ, 'font-size': fs, 'font-weight': 800, fill: '#FFFFFF', 'text-anchor': 'middle',
    });
    return w;
  }

  function seloVazio(pai, x, y, rotulo, tam) {
    const fs = tam || 14;
    const w = largura(rotulo, fs, 700, FONTE) + 18;
    const h = fs + 9;
    el('rect', { x, y: y - h / 2, width: w, height: h, rx: h / 2, fill: 'none', stroke: '#C9C4BC', 'stroke-dasharray': '4 3' }, pai);
    texto(pai, x + w / 2, y + fs * 0.36, rotulo, { 'font-size': fs, 'font-weight': 700, fill: COR.tinta3, 'text-anchor': 'middle' });
    return w;
  }

  /* ------------------------------ seções ------------------------------- */

  function numeros(pai, x, y, w, d) {
    const itens = [
      [String(d.total), 'espaços na ER'],
      [String(d.moveis), 'móveis'],
      [String(d.movimentos.length + d.movimentosOcultos), 'movimentos'],
      [d.gmvTotal ? d.fmt.gmvCurto(d.gmvTotal) : '—', 'GMV esperado dos movimentos'],
    ];
    const vao = 24;
    const tw = (w - vao * (itens.length - 1)) / itens.length;
    itens.forEach(([v, rot], i) => {
      const tx = x + i * (tw + vao);
      el('rect', { x: tx, y, width: tw, height: 112, rx: 16, fill: COR.cartao, stroke: COR.borda, 'stroke-width': 1.5 }, pai);
      texto(pai, tx + 28, y + 64, v, { 'font-size': 46, 'font-weight': 700 });
      texto(pai, tx + 28, y + 94, rot, { 'font-size': 18, fill: COR.tinta2 });
    });
    return 112;
  }

  function porMarca(pai, x, y, w, d) {
    const linhas = d.marcas;
    const rowH = 34;
    const h = 72 + 26 + 22 + linhas.length * rowH + 14;
    const g = cartao(pai, x, y, w, h, 'Por marca', d.fmt.espacos(d.total));
    const ix = x + 28;
    const iw = w - 56;
    // Barra 100%: como os espaços da ER se dividem entre as marcas.
    pilha(g, ix, y + 72, iw, 26, linhas.map((m) => ({ valor: m.valor, cor: m.cor })));
    let ly = y + 72 + 26 + 22;
    const colNome = ix + 26;
    const colValor = ix + iw * 0.44; // fim do texto "12 espaços"
    const colPct = ix + iw * 0.54; // fim do "35%"
    const barraX = ix + iw * 0.58;
    const barraW = iw * 0.42;
    linhas.forEach((m) => {
      const cy = ly + rowH / 2;
      el('rect', { x: ix, y: cy - 8, width: 16, height: 16, rx: 4, fill: m.cor }, g);
      texto(g, colNome, cy + 6, caber(m.nome, colValor - colNome - 120, 19, 600), { 'font-size': 19, 'font-weight': 600 });
      texto(g, colValor, cy + 6, d.fmt.espacos(m.valor), { 'font-size': 18, fill: COR.tinta, 'text-anchor': 'end' });
      texto(g, colPct, cy + 6, d.fmt.pct(m.valor, d.total), { 'font-size': 18, fill: COR.tinta2, 'text-anchor': 'end', 'font-weight': 700 });
      el('rect', { x: barraX, y: cy - 6, width: barraW, height: 12, rx: 4, fill: COR.trilho }, g);
      barra(g, barraX, cy - 6, d.total ? (m.valor / d.total) * barraW : 0, 12, m.cor, true);
      ly += rowH;
    });
    return h;
  }

  function porClassificacao(pai, x, y, w, hMax, d) {
    const lista = d.classificacoes;
    if (!lista.length) return 0;
    const topo = 92;
    const rowH = Math.max(26, Math.min(52, (hMax - topo - 14) / lista.length));
    const h = Math.min(hMax, topo + lista.length * rowH + 14);
    const g = cartao(pai, x, y, w, h, 'Por classificação', d.gmvTotal ? 'GMV esperado: ' + d.fmt.gmvCompleto(d.gmvTotal) : '');
    const ix = x + 28;
    const iw = w - 56;
    const colNome = ix;
    const nomeW = iw * 0.38;
    const b1x = ix + nomeW + 12;
    const bw = (iw - nomeW - 12 - 40) / 2;
    const b2x = b1x + bw + 40;
    texto(g, b1x, y + 80, 'Espaços (% da ER)', { 'font-size': 15, fill: COR.tinta3 });
    texto(g, b2x, y + 80, 'GMV esperado (% do total)', { 'font-size': 15, fill: COR.tinta3 });
    const maiorEsp = Math.max.apply(null, lista.map((c) => c.espacos).concat([1]));
    const maiorGmv = Math.max.apply(null, lista.map((c) => c.gmv).concat([1]));
    let ly = y + topo;
    lista.forEach((c) => {
      const cy = ly + rowH / 2;
      // Selo da classificação e, ao lado, quantos movimentos ela tem.
      const fs = rowH >= 34 ? 14 : 12;
      const sw = c.sem ? seloVazio(g, colNome, cy, c.nome, fs) : selo(g, colNome, cy, caber(c.nome, nomeW - 110, fs, 800, FONTE_ETQ), c.cor, fs);
      texto(g, colNome + sw + 8, cy + 5, String(c.movimentos) + ' mov.', { 'font-size': 14, fill: COR.tinta2 });
      // Espaços (escala própria) e GMV (escala própria): duas barras, nunca dois eixos no mesmo gráfico.
      const e = (c.espacos / maiorEsp) * (bw - 120);
      barra(g, b1x, cy - 7, e, 14, c.cor, true);
      texto(g, b1x + e + 8, cy + 6, d.fmt.espacos(c.espacos) + ' · ' + d.fmt.pct(c.espacos, d.total), { 'font-size': 16 });
      if (c.sem) {
        texto(g, b2x, cy + 6, '—', { 'font-size': 16, fill: COR.tinta3 });
      } else if (c.gmv) {
        const gw = (c.gmv / maiorGmv) * (bw - 120);
        barra(g, b2x, cy - 7, gw, 14, c.cor, true);
        texto(g, b2x + gw + 8, cy + 6, d.fmt.gmvCurto(c.gmv) + ' · ' + d.fmt.pct(c.gmv, d.gmvTotal), { 'font-size': 16 });
      } else {
        texto(g, b2x, cy + 6, 'não informado', { 'font-size': 15, fill: COR.tinta3 });
      }
      ly += rowH;
    });
    return h;
  }

  function porMovimentos(pai, x, y, w, h, d) {
    const g = cartao(pai, x, y, w, h, 'Por movimentos', 'espaços (barra pelas marcas)' + (d.gmvTotal ? ' · GMV esperado' : ''));
    const ix = x + 28;
    const iw = w - 56;
    const topo = 72;
    const disponivel = h - topo - 44; // embaixo fica a legenda das marcas
    let lista = d.movimentos;
    let resto = null;
    const minH = 34;
    if (lista.length * minH > disponivel) {
      const cabem = Math.max(1, Math.floor(disponivel / minH) - 1);
      const fora = lista.slice(cabem);
      resto = { n: fora.length + d.movimentosOcultos, espacos: fora.reduce((s, m) => s + m.espacos, 0) };
      lista = lista.slice(0, cabem);
    } else if (d.movimentosOcultos) {
      resto = { n: d.movimentosOcultos, espacos: 0 };
    }
    const n = lista.length + (resto ? 1 : 0);
    const rowH = Math.max(minH, Math.min(58, disponivel / Math.max(1, n)));
    const grande = rowH >= 50; // linhas altas: selo embaixo do nome; baixas: na mesma linha
    const nomeW = iw * 0.38;
    const barX = ix + nomeW + 16;
    const valorW = 100; // "5 espaços"
    const gmvW = d.gmvTotal ? 92 : 0; // "R$ 1,8 mi"
    const barW = iw - nomeW - 16 - valorW - gmvW - 12;
    const maior = Math.max.apply(null, lista.map((m) => m.espacos).concat([1]));
    let ly = y + topo;
    lista.forEach((m) => {
      const cy = ly + rowH / 2;
      const fs = rowH >= 42 ? 18 : 16;
      if (grande) {
        texto(g, ix, cy - 4, caber(m.texto, nomeW, fs, 700), { 'font-size': fs, 'font-weight': 700 });
        let sx = ix;
        if (m.classificacao) selo(g, sx, cy + 15, caber(m.classificacao.nome, nomeW * 0.6, 12, 800, FONTE_ETQ), m.classificacao.cor, 12);
        else seloVazio(g, sx, cy + 15, 'Sem classificação', 12);
      } else {
        const seloW = m.classificacao ? largura(m.classificacao.nome, 11, 800, FONTE_ETQ) + 18 : 0;
        texto(g, ix, cy + 6, caber(m.texto, nomeW - seloW - 10, fs, 700), { 'font-size': fs, 'font-weight': 700 });
        if (m.classificacao) selo(g, ix + nomeW - seloW, cy, m.classificacao.nome, m.classificacao.cor, 11);
      }
      const bw = (m.espacos / maior) * barW;
      el('rect', { x: barX, y: cy - 7, width: barW, height: 14, rx: 4, fill: COR.trilho }, g);
      pilha(g, barX, cy - 7, bw, 14, m.marcas);
      texto(g, ix + iw - gmvW, cy + 6, d.fmt.espacos(m.espacos), { 'font-size': 16, 'text-anchor': 'end', 'font-weight': 700 });
      if (gmvW) texto(g, ix + iw, cy + 6, m.gmv ? d.fmt.gmvCurto(m.gmv) : '—', { 'font-size': 15, fill: m.gmv ? COR.tinta2 : COR.tinta3, 'text-anchor': 'end' });
      ly += rowH;
    });
    if (resto) {
      texto(g, ix, ly + rowH / 2 + 6, '+ ' + resto.n + (resto.n === 1 ? ' movimento' : ' movimentos')
        + (resto.espacos ? ' (' + d.fmt.espacos(resto.espacos) + ')' : '') + ' — veja o painel no app', { 'font-size': 16, fill: COR.tinta2, 'font-style': 'italic' });
    }
    // Legenda das marcas das barras (identidade nunca só pela cor: os nomes ficam aqui).
    const marcas = d.marcas.filter((mc) => d.movimentos.some((m) => m.marcas.some((p) => p.cor === mc.cor && p.valor)));
    let lx = ix;
    const legY = y + h - 6;
    marcas.forEach((mc) => {
      const lw = largura(mc.nome, 14, 400) + 34;
      if (lx + lw > ix + iw) return;
      el('rect', { x: lx, y: legY - 22, width: 12, height: 12, rx: 3, fill: mc.cor }, g);
      texto(g, lx + 18, legY - 12, mc.nome, { 'font-size': 14, fill: COR.tinta2 });
      lx += lw;
    });
  }

  /**
   * @param {SVGSVGElement} svg
   * @param {{er, ciclo, total, moveis, marcas, movimentos, movimentosOcultos, classificacoes, gmvTotal, nota, fmt}} d
   * @param {{recorte?: boolean}} op
   * @return {{w: number, h: number}}
   */
  function desenhar(svg, d, op) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const recorte = op && op.recorte;
    if (!recorte) {
      el('rect', { x: 0, y: 0, width: W, height: H, fill: COR.fundo }, svg);
      texto(svg, M, 74, 'Estratégia · ' + d.er, { 'font-size': 40, 'font-weight': 700 });
      const ciclo = d.ciclo ? (/^ciclo\b/i.test(d.ciclo) ? d.ciclo : 'Ciclo ' + d.ciclo) + ' · ' : '';
      texto(svg, M, 108, ciclo + 'espaço por marca, movimentos e classificação', { 'font-size': 21, fill: COR.tinta2 });
    }
    const topo = recorte ? M : 140;
    numeros(svg, M, topo, W - 2 * M, d);
    const corpoY = topo + 112 + 24;
    const fim = recorte ? H - M : H - 56;
    const colW = (W - 2 * M - 32) / 2;
    const esqX = M;
    const dirX = M + colW + 32;
    const hMarca = porMarca(svg, esqX, corpoY, colW, d);
    porClassificacao(svg, esqX, corpoY + hMarca + 24, colW, fim - (corpoY + hMarca + 24), d);
    porMovimentos(svg, dirX, corpoY, colW, fim - corpoY, d);
    if (!recorte && d.nota) texto(svg, M, H - 22, d.nota, { 'font-size': 14, fill: COR.tinta3 });
    return { w: W, h: H };
  }

  return { desenhar, W, H };
})();
</script>
