<script>
/**
 * ============================================================================
 *  SLIDE DA ESTRATÉGIA (PNG / PowerPoint): um resumo do Analytics, 16:9, com a ER do slide em destaque
 * ============================================================================
 *  Estrategia.desenhar(svg, dados, { recorte }) monta, num SVG de 1920×1080:
 *   - à esquerda, os principais movimentos em cada ER (o mapa de calor do Analytics, resumido): uma linha
 *     por movimento, com as bolinhas das marcas, a classificação e o GMV esperado, e uma coluna por ER com a
 *     fatia do espaço de exposição da ER (mais escuro = maior fatia); a ER do slide fica em destaque e
 *     ordena as linhas; embaixo, quantos movimentos ficaram de fora e a linha "Sem movimento";
 *   - à direita, os números da ER do slide (espaços, móveis, movimentos e GMV esperado) e as barras 100%
 *     "Marcas em cada ER" e "Classificação em cada ER", uma em cima da outra.
 *  recorte: sem o fundo e sem o título do slide (só os cartões), para recortar no conteúdo.
 *  Os dados vêm prontos da aplicação (App.dadosEstrategia, a partir do dadosAnalytics); aqui só o desenho.
 *  Todo o estilo vai em atributos SVG, para o PNG sair igual.
 */
const Estrategia = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const FONTE = 'Arial, Helvetica, sans-serif';
  const FONTE_ETQ = "Nunito, 'Segoe UI', Arial, sans-serif";
  const W = 1920;
  const H = 1080;
  const M = 64; // margem do slide
  const COR = {
    fundo: '#F3EFEA', cartao: '#FFFFFF', borda: '#E4DED6',
    tinta: '#1C1F24', tinta2: '#5B6068', tinta3: '#8A8F97', trilho: '#EEEAE4',
    mapa: [51, 70, 184], // o azul do mapa de calor do Analytics (#3346B8)
    destaque: '#27367A', semMovimento: '#E6E8EB',
  };

  function el(tag, attrs, pai) {
    const e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach((k) => { if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); });
    if (pai) pai.appendChild(e);
    return e;
  }

  function texto(pai, x, y, conteudo, attrs) {
    const t = el('text', Object.assign({ x, y, 'font-family': FONTE, fill: COR.tinta }, attrs), pai);
    t.textContent = conteudo;
    return t;
  }

  const medidor = document.createElement('canvas').getContext('2d');
  function largura(txt, tam, peso, fonte) {
    medidor.font = (peso || 400) + ' ' + tam + 'px ' + (fonte || FONTE);
    return medidor.measureText(txt).width;
  }

  /** Corta o texto com "…" para caber em maxW. */
  function caber(txt, maxW, tam, peso, fonte) {
    let t = String(txt);
    if (largura(t, tam, peso, fonte) <= maxW) return t;
    while (t.length > 1 && largura(t + '…', tam, peso, fonte) > maxW) t = t.slice(0, -1);
    return t.trim() + '…';
  }

  /** Cor clara (texto escuro em cima dela)? */
  function corClara(hex) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || ''));
    if (!m) return false;
    const [r, g, b] = m.slice(1).map((x) => parseInt(x, 16));
    return 0.299 * r + 0.587 * g + 0.114 * b > 170;
  }

  function cartao(pai, x, y, w, h, titulo, nota) {
    const g = el('g', null, pai);
    el('rect', { x, y, width: w, height: h, rx: 16, fill: COR.cartao, stroke: COR.borda, 'stroke-width': 1.5 }, g);
    texto(g, x + 28, y + 44, titulo.toUpperCase(), { 'font-size': 17, 'font-weight': 700, fill: COR.tinta2, 'letter-spacing': 1.2 });
    if (nota) texto(g, x + w - 28, y + 44, nota, { 'font-size': 15, fill: COR.tinta3, 'text-anchor': 'end' });
    return g;
  }

  /* ------------------------------ seções ------------------------------- */

  /** Números da ER do slide, em quatro quadros (2 × 2). @return altura */
  function numeros(pai, x, y, w, d) {
    const n = d.numeros;
    const itens = [
      [d.fmt.num(n.total), 'espaços de exposição'],
      [String(n.moveis), 'móveis'],
      [String(n.movimentos), 'movimentos'],
      [n.gmv ? d.fmt.gmvCurto(n.gmv) : '—', 'GMV esperado'],
    ];
    const vao = 16;
    const tw = (w - vao) / 2;
    const th = 92;
    itens.forEach(([v, rot], i) => {
      const tx = x + (i % 2) * (tw + vao);
      const ty = y + Math.floor(i / 2) * (th + vao);
      el('rect', { x: tx, y: ty, width: tw, height: th, rx: 14, fill: COR.cartao, stroke: COR.borda, 'stroke-width': 1.5 }, pai);
      texto(pai, tx + 22, ty + 50, v, { 'font-size': 38, 'font-weight': 700 });
      texto(pai, tx + 22, ty + 76, rot, { 'font-size': 16, fill: COR.tinta2 });
    });
    return th * 2 + vao;
  }

  const fatia = (m, er) => (er.total ? (m.porEr[er.id] || 0) / er.total : 0);

  /**
   * Os principais movimentos em cada ER: as linhas seguem a ER do slide (as que ela não tem vêm depois,
   * pela maior fatia em outra ER) e cabem quantas der no cartão.
   */
  function mapaMovimentos(pai, x, y, w, h, d) {
    const ers = d.ers;
    const atual = ers.find((e) => e.id === d.erId) || ers[0];
    const g = cartao(pai, x, y, w, h, 'Principais movimentos em cada ER', '% do espaço de exposição da ER · em ordem pela ' + atual.nome);
    const ix = x + 28;
    const iw = w - 56;
    const cabecalho = 64;
    const topo = y + 64 + cabecalho;
    const rodape = 96; // "+ N movimentos" e "Sem movimento"
    const rowH = 58;
    const cabem = Math.max(1, Math.floor((h - (topo - y) - rodape) / rowH));
    const maxFatia = (m) => Math.max.apply(null, ers.map((e) => fatia(m, e)));
    const ordenados = d.movimentos.slice().sort((a, b) => (fatia(b, atual) - fatia(a, atual)) || (maxFatia(b) - maxFatia(a)));
    const lista = ordenados.slice(0, cabem);
    const fora = ordenados.length - lista.length;

    const cellW = Math.min(150, Math.max(92, (iw * 0.5) / Math.max(1, ers.length)));
    const nomeW = iw - cellW * ers.length;
    const colX = (i) => ix + nomeW + i * cellW;
    const iAtual = ers.indexOf(atual);
    // Coluna da ER do slide: fundo claro de cima a baixo.
    el('rect', { x: colX(iAtual) + 2, y: y + 62, width: cellW - 4, height: h - 74, rx: 10, fill: '#EEF1FB' }, g);
    // Cabeçalho: o nome de cada ER e quantos espaços ela tem.
    texto(g, ix, topo - 16, 'Movimento', { 'font-size': 15, 'font-weight': 700, fill: COR.tinta2 });
    ers.forEach((e, i) => {
      const cx = colX(i) + cellW / 2;
      const destaque = i === iAtual;
      texto(g, cx, topo - 36, e.nome, { 'font-size': 18, 'font-weight': 700, 'text-anchor': 'middle', fill: destaque ? COR.destaque : COR.tinta });
      texto(g, cx, topo - 14, d.fmt.num(e.total) + ' espaços', { 'font-size': 13, 'text-anchor': 'middle', fill: COR.tinta3 });
    });
    el('line', { x1: ix, y1: topo - 4, x2: ix + iw, y2: topo - 4, stroke: COR.borda, 'stroke-width': 1.5 }, g);

    const maior = Math.max.apply(null, lista.reduce((acc, m) => acc.concat(ers.map((e) => fatia(m, e))), [0.0001]));
    lista.forEach((m, k) => {
      const ry = topo + k * rowH;
      const cy = ry + rowH / 2;
      // Nome e, ao lado, as bolinhas das marcas; embaixo, a classificação e o GMV esperado.
      const bolinhas = m.marcas.length;
      const nome = caber(m.texto, nomeW - 30 - bolinhas * 16, 19, 800, FONTE_ETQ);
      texto(g, ix, cy - 3, nome, { 'font-family': FONTE_ETQ, 'font-size': 19, 'font-weight': 800 });
      let bx = ix + largura(nome, 19, 800, FONTE_ETQ) + 12;
      m.marcas.forEach((mc) => {
        el('circle', { cx: bx + 6, cy: cy - 9, r: 6, fill: mc.cor, stroke: 'rgba(0,0,0,.15)', 'stroke-width': 1 }, g);
        bx += 16;
      });
      let lx = ix;
      if (m.classe) {
        el('rect', { x: lx, y: cy + 9, width: 10, height: 10, rx: 2.5, fill: m.classe.cor }, g);
        texto(g, lx + 16, cy + 18, m.classe.nome, { 'font-size': 14, fill: COR.tinta2 });
        lx += 16 + largura(m.classe.nome, 14) + 14;
      } else {
        texto(g, lx, cy + 18, 'Sem classificação', { 'font-size': 14, fill: COR.tinta3, 'font-style': 'italic' });
        lx += largura('Sem classificação', 14) + 14;
      }
      if (m.gmv > 0) texto(g, lx, cy + 18, 'GMV ' + d.fmt.gmvCurto(m.gmv), { 'font-size': 14, 'font-weight': 700, fill: COR.tinta });
      // Uma célula por ER: mais escuro = maior fatia da ER.
      ers.forEach((e, i) => {
        const v = fatia(m, e);
        const cx = colX(i) + 6;
        const cw = cellW - 12;
        const ch = rowH - 12;
        if (!v) {
          texto(g, cx + cw / 2, cy + 6, '—', { 'font-size': 18, fill: '#C9CDD3', 'text-anchor': 'middle' });
          return;
        }
        const alfa = 0.08 + 0.82 * (v / maior);
        el('rect', { x: cx, y: cy - ch / 2, width: cw, height: ch, rx: 8, fill: 'rgba(' + COR.mapa.join(',') + ',' + alfa.toFixed(3) + ')' }, g);
        if (i === iAtual) el('rect', { x: cx, y: cy - ch / 2, width: cw, height: ch, rx: 8, fill: 'none', stroke: COR.destaque, 'stroke-width': 2 }, g);
        const cor = alfa > 0.55 ? '#FFFFFF' : COR.tinta;
        texto(g, cx + cw / 2, cy + 2, d.fmt.pct(m.porEr[e.id], e.total), { 'font-size': 18, 'font-weight': 700, 'text-anchor': 'middle', fill: cor });
        texto(g, cx + cw / 2, cy + 18, d.fmt.num(m.porEr[e.id]) + ' esp.', { 'font-size': 12, 'text-anchor': 'middle', fill: cor, opacity: 0.8 });
      });
    });

    // Rodapé: os movimentos que ficaram de fora e a linha dos espaços sem movimento.
    let fy = topo + lista.length * rowH + 4;
    el('line', { x1: ix, y1: fy, x2: ix + iw, y2: fy, stroke: COR.borda, 'stroke-width': 1.5 }, g);
    if (fora) {
      texto(g, ix, fy + 30, '+ ' + fora + (fora === 1 ? ' movimento menor' : ' movimentos menores') + ' (veja o Analytics no app)',
        { 'font-size': 15, fill: COR.tinta2, 'font-style': 'italic' });
    }
    fy += 44;
    texto(g, ix, fy + 26, 'Sem movimento', { 'font-size': 16, 'font-weight': 700, fill: COR.tinta2, 'font-style': 'italic' });
    ers.forEach((e, i) => {
      const cx = colX(i) + 6;
      const cw = cellW - 12;
      el('rect', { x: cx, y: fy + 6, width: cw, height: 32, rx: 8, fill: COR.semMovimento }, g);
      texto(g, cx + cw / 2, fy + 28, d.fmt.pct(e.semMovimento, e.total), { 'font-size': 16, 'font-weight': 700, 'text-anchor': 'middle', fill: COR.tinta2 });
    });
  }

  /** Barras 100% por ER (marcas ou classificações), com a legenda em cima e a ER do slide em destaque. @return altura */
  function barrasPorEr(pai, x, y, w, d, titulo, chave, legenda) {
    const ix = x + 28;
    const iw = w - 56;
    // Legenda (pode quebrar em duas linhas).
    const itens = [];
    let lx = ix;
    let ly = y + 78;
    legenda.forEach((it) => {
      const lw = largura(it.nome, 14) + 34;
      if (lx + lw > ix + iw) { lx = ix; ly += 24; }
      itens.push({ it, lx, ly });
      lx += lw;
    });
    const barrasY = ly + 22;
    const rowH = 40;
    const h = barrasY - y + d.ers.length * rowH + 14;
    const g = cartao(pai, x, y, w, h, titulo);
    itens.forEach(({ it, lx: px, ly: py }) => {
      el('rect', { x: px, y: py - 11, width: 12, height: 12, rx: 3, fill: it.cor, stroke: it.borda ? '#C9CDD3' : 'none' }, g);
      texto(g, px + 18, py, it.nome, { 'font-size': 14, fill: COR.tinta2 });
    });
    const nomeW = 92;
    d.ers.forEach((e, i) => {
      const cy = barrasY + i * rowH + rowH / 2;
      const destaque = e.id === d.erId;
      texto(g, ix, cy + 6, e.nome, { 'font-size': 17, 'font-weight': destaque ? 800 : 600, fill: destaque ? COR.destaque : COR.tinta });
      if (destaque) el('line', { x1: ix, y1: cy + 11, x2: ix + largura(e.nome, 17, 800), y2: cy + 11, stroke: COR.destaque, 'stroke-width': 2 }, g);
      const valores = legenda.map((it) => ({ it, valor: (e[chave] || {})[it.cod] || 0 })).filter((p) => p.valor > 0);
      const bx = ix + nomeW;
      const bw = iw - nomeW;
      const total = valores.reduce((t, p) => t + p.valor, 0);
      if (!total) return;
      const vao = 2;
      const util = bw - vao * (valores.length - 1);
      let cx = bx;
      valores.forEach((p) => {
        const pw = Math.max(1, (p.valor / total) * util);
        el('rect', { x: cx, y: cy - 13, width: pw, height: 26, fill: p.it.cor }, g);
        const pct = p.valor / e.total;
        if (pct >= 0.09 && pw > 40) {
          const claro = p.it.borda || corClara(p.it.cor);
          texto(g, cx + pw / 2, cy + 5, d.fmt.pct(p.valor, e.total), { 'font-size': 13, 'font-weight': 700, 'text-anchor': 'middle', fill: claro ? COR.tinta2 : '#FFFFFF' });
        }
        cx += pw + vao;
      });
    });
    return h;
  }

  /**
   * @param {SVGSVGElement} svg
   * @param {{er, erId, ciclo, ers, movimentos, marcas, classes, numeros, nota, fmt}} d
   * @param {{recorte?: boolean}} op
   * @return {{w: number, h: number}}
   */
  function desenhar(svg, d, op) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const recorte = op && op.recorte;
    if (!recorte) {
      el('rect', { x: 0, y: 0, width: W, height: H, fill: COR.fundo }, svg);
      texto(svg, M, 74, 'Estratégia · ' + d.er, { 'font-size': 40, 'font-weight': 700 });
      const ciclo = d.ciclo ? (/^ciclo\b/i.test(d.ciclo) ? d.ciclo : 'Ciclo ' + d.ciclo) + ' · ' : '';
      texto(svg, M, 108, ciclo + 'os principais movimentos em cada ER, as marcas e as classificações (resumo do Analytics)', { 'font-size': 21, fill: COR.tinta2 });
    }
    const topo = recorte ? M : 136;
    const fim = recorte ? H - M : H - 52;
    const vao = 28;
    const dirW = 660;
    const esqW = W - 2 * M - vao - dirW;
    const dirX = M + esqW + vao;
    mapaMovimentos(svg, M, topo, esqW, fim - topo, d);
    let y = topo + numeros(svg, dirX, topo, dirW, d) + 20;
    const legMarcas = d.marcas.map((m) => ({ cod: m.cod, nome: m.nome, cor: m.cor, borda: m.cod === 'NEUTRO' }));
    y += barrasPorEr(svg, dirX, y, dirW, d, 'Marcas em cada ER', 'porMarca', legMarcas) + 20;
    const legClasses = d.classes.map((c) => ({ cod: c.cod, nome: c.nome, cor: c.cor }))
      .concat([{ cod: '__LIVRE__', nome: 'Sem movimento', cor: COR.semMovimento, borda: true }]);
    barrasPorEr(svg, dirX, y, dirW, d, 'Classificação em cada ER', 'porClasse', legClasses);
    if (!recorte && d.nota) texto(svg, M, H - 20, caber(d.nota, W - 2 * M, 14), { 'font-size': 14, fill: COR.tinta3 });
    return { w: W, h: H };
  }

  return { desenhar, W, H };
})();
</script>
