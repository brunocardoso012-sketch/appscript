          nomeCalendario: (cal.calendarios[m.calendario] || {}).nome || m.calendario,
        });
      });
      const inicio = Object.values(porCal).map((x) => x.inicio).sort()[0];
      const salva = (estado.dados.ordemCalendario || {})[app];
      return { cicloApp: app, inicio, movimentos, ordemSalva: salva ? salva.movimentos : null, ordemPor: salva ? salva.por + (salva.em ? ', ' + salva.em : '') : '' };
    });
    return {
      calendarios,
      grupos,
      feriados,
      ers: estado.dados.plantas.map((p) => ({ id: p.id, nome: p.nome })),
      cicloAtual: estado.ciclo,
      semDatas: todosOsCiclos().filter((c) => !datasDoApp[c]),
      medalhas: estado.dados.medalhas || {},
    };
  }

  /** Calendário dos ciclos: ocupa a área da planta inteira (a planta continua desenhada por baixo). */
  function atualizarCalendario() {
    const painel = $('painelCalendario');
    if (!painel) return;
    const aberto = estado.calendario && !!estado.dados && !Editor.contexto();
    painel.hidden = !aberto;
    document.body.classList.toggle('com-calendario', aberto);
    if ($('btnCalendario')) $('btnCalendario').setAttribute('aria-pressed', String(aberto));
    if (!aberto) { $('calCorpo').innerHTML = ''; return; } // ao abrir de novo, rola até o ciclo da tela
    const cal = estado.dados.calendario || { ciclos: {} };
    const n = Object.keys(cal.ciclos || {}).reduce((s, k) => s + cal.ciclos[k].length, 0);
    $('calSub').textContent = n ? n + (n === 1 ? ' ciclo' : ' ciclos') + ' no calendário' + (estado.ciclo ? ' · na tela: ' + estado.ciclo : '') : '';
    Calendario.desenhar($('calCorpo'), {
      dados: dadosCalendario,
      abrirCiclo: (ciclo) => {
        alternarCalendario(false);
        if (ciclo !== estado.ciclo) { estado.ciclo = ciclo; montarCiclos(); desenhar(); }
      },
      verMovimento: (o) => {
        alternarCalendario(false);
        if (o.ciclo !== estado.ciclo) { estado.ciclo = o.ciclo; montarCiclos(); }
        verNaPlanta({ etiqueta: o.texto, er: o.er });
      },
      // Construção: o construtor muda a ordem dos movimentos de um ciclo e salva (movimentos null = volta à automática).
      construtor: () => !!Validacao.acesso() && Validacao.acesso().papel === 'CONSTRUTOR',
      salvarOrdem: async (ciclo, movimentos) => {
        carregando(true, 'Salvando a ordem…');
        try {
          estado.dados.ordemCalendario = await chamar('salvarOrdemCalendario', Validacao.acesso(),
            movimentos ? { ciclo, movimentos } : { ciclo, limpar: true });
          toast(movimentos ? 'Ordem do ' + ciclo + ' salva.' : 'O ' + ciclo + ' voltou à ordem automática.');
          return true;
        } catch (e) {
          erro(e);
          return false;
        } finally {
          carregando(false);
        }
      },
      // Selos (hotspot e medalha) dos movimentos de um ciclo: [{ movimento, hotspot, medalha }].
      salvarSelos: async (ciclo, selos) => {
        carregando(true, 'Salvando os selos…');
        try {
          estado.dados.selosCalendario = await chamar('salvarSelosCalendario', Validacao.acesso(), { ciclo, selos });
          toast('Selos do ' + ciclo + ' salvos.');
          return true;
        } catch (e) {
          erro(e);
          return false;
        } finally {
          carregando(false);
        }
      },
    });
  }

  function alternarCalendario(aberto) {
    estado.calendario = aberto === undefined ? !estado.calendario : !!aberto;
    if (estado.calendario && estado.analytics) alternarAnalytics(false);
    esconderBalao();
    atualizarCalendario();
  }

  /* -------------------- estatísticas da construção do ciclo ------------------- */

  /**
   * Números de uma ER no ciclo, para guiar a construção (Rascunho.html): só espaço de exposição (sem VM),
   * com as mesmas contas do Analytics.
   * @return {{total, preenchidos, vazios: Array<{id, nome}>, marcas, classes, gmv: Array<{texto, cor, espaco, gmv, indice}>}}
   *   marcas / classes: [{nome, cor, valor}] (valor em espaços); gmv: fatias (0 a 1) do espaço e do GMV e o índice
   */
  function estatisticasConstrucao(planta, ciclo) {
    const partes = partesDeEspaco(planta, ciclo).filter((p) => !p.vm);
    const cheia = (p) => p.etiquetas.length || p.marcas.some((c) => c !== 'NEUTRO');
    const vazios = partes.filter((p) => !cheia(p)).map((p) => ({
      id: p.movel.id, nome: (p.movel.descricao || p.movel.id) + (p.espaco ? ' · ' + p.espaco.nome : ''),
    }));
    const r = resumoDeEspaco(partes);
    const grupos = Object.values(r.porEtiqueta).sort((a, b) => b.espacos - a.espacos || a.texto.localeCompare(b.texto, 'pt-BR'));
    const gmvDe = (g) => (g.tipo && typeof g.tipo.gmv === 'number' ? g.tipo.gmv : 0);
    const totalGmv = grupos.reduce((s, g) => s + gmvDe(g), 0);
    // GMV × espaço: só o espaço dos movimentos com GMV entra na conta (os sem GMV e os vazios ficam de fora).
    const totalEsp = grupos.reduce((s, g) => s + (gmvDe(g) > 0 ? g.espacos : 0), 0);
    return {
      total: partes.reduce((s, p) => s + p.peso, 0),
      preenchidos: partes.filter(cheia).reduce((s, p) => s + p.peso, 0),
      vazios,
      marcas: ordemDasMarcas().filter((c) => r.porMarca[c]).map((c) => ({ nome: nomeMarcaPainel(c), cor: corMarcaPainel(c), valor: r.porMarca[c] })),
      classes: ordemDasClassificacoes(Object.keys(r.porClassificacao))
        .map((c) => ({ nome: nomeClassificacao(c), cor: corClassificacao(c), valor: r.porClassificacao[c] })),
      gmv: grupos.map((g) => {
        const espaco = totalEsp && gmvDe(g) > 0 ? g.espacos / totalEsp : 0;
        const gmv = totalGmv ? gmvDe(g) / totalGmv : 0;
        const principal = Object.keys(g.marcas).sort((a, b) => g.marcas[b] - g.marcas[a])[0];
        return { texto: g.texto, cor: principal ? corMarcaPainel(principal) : COR_SEM_MARCA, espaco, gmv, semGmv: !gmvDe(g), indice: espaco ? gmv / espaco : 0 };
      }),
    };
  }

  /* ------------------- painel da ER (menu da esquerda) -------------------- */

  const ICONES_LOJA = {
    TV: '<svg class="lj-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M9 20.5h6M12 17v3.5"/></svg>',
    RADIO: '<svg class="lj-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M5 8 17 3M3 12h18"/><circle cx="8" cy="16.5" r="2.3"/><path d="M13 15.5h5M13 18h5"/></svg>',
  };

  /** Cor de uma etiqueta do painel: a da marca (com uma marca no filtro, as outras em cinza, como no slide). */
  function corEtiquetaPainel(marca) {
    const fora = estado.filtro && String(marca || '').split('+').map((p) => p.trim()).indexOf(estado.filtro) < 0;
    return fora ? '#8C8C8C' : corDaMarca(marca, 'etiqueta');
  }

  function chipsLoja(pai, itens) {

    itens.forEach((it) => { novo('span', 'lj-chip', it.texto, box).style.background = corEtiquetaPainel(it.marca); });

  /**
   * Menu da esquerda ("Comunicações ER"): o que no PNG do slide fica no painel lateral e no canto de
   * baixo — nome da ER, ciclo, TV / rádio, (A), (C), destaques (com a miniatura do móvel) e itens fora
   * da planta. As notas e a legenda dos símbolos ficam no desenho da planta.
   */
  function atualizarPainelLoja() {
    const painel = $('painelLoja');
    if (!painel) return;
    const planta = plantaAtual();
    const aberto = estado.painelLoja && !!planta && !Editor.contexto();
    painel.hidden = !aberto;
    document.body.classList.toggle('com-painel-loja', aberto);
    $('btnLoja').setAttribute('aria-pressed', String(!!estado.painelLoja));
    if (!aberto) return;
    $('lojaTitulo').textContent = planta.nome;
    $('lojaSub').textContent = estado.ciclo ? 'Ciclo: ' + estado.ciclo : 'Sem ciclo escolhido';
    const corpo = $('lojaCorpo');
    corpo.innerHTML = '';
    if (!estado.ciclo) {
      novo('p', 'mv-vazio', 'Escolha um ciclo no seletor para ver as comunicações da ER.', corpo);

    }
    if (Rascunho.editavel()) {
      const b = novo('button', 'btn pequeno lj-editar', 'Editar comunicações desta ER', corpo);
      b.type = 'button';
      b.addEventListener('click', () => Rascunho.editarPaineis());

    const pain = paineisDe(estado.ciclo, planta.id);
    const secao = (titulo) => {

      const h = novo('h3', null, null, sec);

    };
    // Antecipações do ciclo nesta ER (itens do próximo ciclo que entram antes).
    const antecipadas = Antecipacao.daEr(estado.ciclo, planta);
    if (antecipadas.length) Antecipacao.montarLista(secao('Antecipações').sec, antecipadas, planta, false);
    if (pain.TV.length) {
      const s = secao('TV e rádio');
      s.h.insertAdjacentHTML('afterbegin', ICONES_LOJA.TV + ICONES_LOJA.RADIO);
      chipsLoja(s.sec, pain.TV);

    ['A', 'C'].forEach((letra) => {
      if (!pain[letra].length) return;
      const s = secao('');
      novo('span', 'lj-letra', letra, s.h);
      chipsLoja(s.sec, pain[letra]);
    });
    if (pain.CALLOUT.length) {
      // Destaques (aba Painéis, seção CALLOUT): o texto e a miniatura do móvel a que ele se refere.
      const sec = secao('Destaques').sec;
      pain.CALLOUT.forEach((c) => {
        const m = c.movel && planta.moveis.find((x) => x.id === c.movel);
        const bloco = novo('div', 'lj-destaque', null, sec);
        const ref = novo('div', 'lj-destaque-ref', null, bloco);
        if (m && m.tipo !== 'EXTRA') {
          const mini = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          mini.setAttribute('class', 'lj-mini');
          mini.setAttribute('aria-hidden', 'true');
          Render.miniatura(mini, m, c.marca, 64, 44);
          ref.appendChild(mini);
        }
        novo('span', 'lj-destaque-nome', m ? m.descricao || m.id : 'Geral', ref);
        const txt = novo('div', 'lj-chip lj-destaque-texto', c.texto, bloco);
        txt.style.background = corEtiquetaPainel(c.marca);
      });
    }
    const extras = planta.moveis.filter((m) => m.tipo === 'EXTRA');
    if (extras.length) {
      const sec = secao('Fora da planta').sec;
      extras.forEach((m) => {
        const bloco = novo('div', 'lj-extra', null, sec);
        novo('span', 'lj-extra-nome', m.descricao || m.id, bloco);
        const info = movimentoDe(estado.ciclo, planta.id, m.id);
        const etiquetas = info && info.etiquetas.length ? info.etiquetas.slice(0, 3) : [];
        if (!etiquetas.length) novo('span', 'mv-vazio', '—', bloco);
        else chipsLoja(bloco, etiquetas.map((e) => ({ texto: e.texto, marca: e.marca || (info.marca !== 'NEUTRO' ? info.marca : '') })));
      });
    }
  }

  /* ------------------------- estratégia do móvel -------------------------- */

  function novo(tag, classe, conteudo, pai) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (conteudo !== undefined && conteudo !== null) n.textContent = conteudo;
    if (pai) pai.appendChild(n);
    return n;
  }

  /** Cor (para o quadradinho / etiqueta) de um valor de marca: "BOT", "BOT+QDB" ou "#FF8800". */
  function corDaMarca(valor, tipo) {
    const cores = String(valor || '').split('+').map((p) => p.trim()).map((p) => {
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(p)) return p;
      const m = estado.dados.marcas[p];
      return m ? m[tipo] : null;
    }).filter(Boolean).map((c) => Render.corDaTela(c, tipo)); // no modo noturno, a versão escura
    if (!cores.length) return estado.dados.marcas.NEUTRO ? estado.dados.marcas.NEUTRO[tipo] : '#4A4A4A';
    return cores.length === 1 ? cores[0] : 'linear-gradient(90deg, ' + cores.join(', ') + ')';
  }

  /**
   * Select de marca com a cor de cada marca no fundo (nas opções e no próprio select, pela marca escolhida),
   * para achar a marca pela cor. As opções sem marca ficam com o fundo normal.
   */
  function colorirSelectMarca(sel) {
    const pintar = (el, valor) => {
      const comCor = !!valor && valor !== 'NEUTRO';
      el.style.background = comCor ? corDaMarca(valor, 'etiqueta') : '';
      el.style.color = comCor ? '#FFFFFF' : '';
    };
    Array.from(sel.options).forEach((o) => pintar(o, o.value));
    const atualizar = () => {
      pintar(sel, sel.value);
      sel.classList.toggle('com-cor-marca', !!sel.value && sel.value !== 'NEUTRO');
    };
    sel.addEventListener('change', atualizar);
    sel.addEventListener('input', atualizar);
    atualizar();
    return atualizar;
  }

  const nomeDaMarca = (valor) => String(valor).split('+').map((p) => {
    const m = estado.dados.marcas[p.trim()];
    return m ? m.nome : p.trim();
  }).join(' + ');

  /** Bloco da tela com o que uma linha da planilha define (marca, símbolo, etiquetas, observação). */
  /** Ícone de cada símbolo nos textos (tela do móvel, listas). */
  const ICONES_SIMBOLO = { FIXO: '🔒 ', EXPOSICAO: 'Ⓔ ', NOVO: 'NEW · ', ANTECIPADO: '⏩ ' };

  function blocoEstrategia(pai, titulo, i, opcoes) {
    const op = opcoes || {};
    const sec = novo('section', 'mv-bloco', null, pai);
    novo('h3', null, titulo, sec);
    if (!i) {
      novo('p', 'mv-vazio', op.vazio || 'Sem linha neste ciclo.', sec);
      return;
    }
    const marca = novo('div', 'mv-linha', null, sec);
    novo('span', 'mv-rotulo', 'Marca', marca);
    if (i.marca) {
      const sw = novo('span', 'mv-marca', null, marca);
      novo('i', null, null, sw).style.background = corDaMarca(i.marca, 'movel');
      novo('span', null, nomeDaMarca(i.marca), sw);
    } else {
      novo('span', 'mv-vazio', '— (branco)', marca);
    }
    if (i.simbolo) {
      const sim = novo('div', 'mv-linha', null, sec);
      novo('span', 'mv-rotulo', 'Símbolo', sim);
      const d = estado.dados.simbolos[i.simbolo];
      novo('span', null, (ICONES_SIMBOLO[i.simbolo] || '') + (d ? d.descricao : i.simbolo), sim);
    }
    // Antecipação: quando entra, de onde vem e o que o espaço tinha antes.
    if (i.antecipacoes) Antecipacao.montarDetalhe(sec, i);
    const etiquetas = i.etiquetas.slice(0, op.limite || i.etiquetas.length);
    const lista = novo('div', 'mv-linha mv-etiquetas', null, sec);
    novo('span', 'mv-rotulo', 'Etiquetas', lista);
    if (!etiquetas.length) novo('span', 'mv-vazio', 'nenhuma', lista);
    const ul = etiquetas.length ? novo('ul', null, null, lista) : null;
    etiquetas.forEach((e, k) => {
      const li = novo('li', null, null, ul);
      novo('span', 'mv-pos', 'Etiqueta ' + (k + 1), li);
      const marcaEtq = e.marca || (i.marca && i.marca !== 'NEUTRO' ? i.marca : '');
      const chip = novo('span', 'mv-etiqueta', e.texto, li);
      chip.style.background = corDaMarca(marcaEtq, 'etiqueta');
      if (e.marca && e.marca !== i.marca) novo('span', 'mv-marca-etq', nomeDaMarca(e.marca), li);
      // Símbolo próprio da etiqueta; com a antecipação, a data em que entra.
      if (e.simbolo) {
        const d = estado.dados.simbolos[e.simbolo];
        const data = e.data ? ' · entra em ' + e.data.split('-').reverse().join('/') : '';
        novo('span', 'mv-simbolo-etq', (ICONES_SIMBOLO[e.simbolo] || '') + (d ? d.descricao : e.simbolo) + data, li);
      }
    });
    if (i.observacao) {
      const obs = novo('div', 'mv-linha', null, sec);
      novo('span', 'mv-rotulo', 'Observação', obs);
      novo('span', 'mv-obs', i.observacao, obs);
    }
  }

  /* ------------------------------ planograma ------------------------------ */

  /**
   * Divide as prateleiras de uma coluna entre as etiquetas, na ordem (a 1ª fica em cima).
   * Menos etiquetas que prateleiras: cada etiqueta ocupa um grupo de prateleiras seguidas;
   * mais etiquetas que prateleiras: cada prateleira recebe mais de uma.
   * @return {Array<{de, ate, etiquetas}>} de/ate = índices das prateleiras (0 = a de cima; ate exclusivo)
   */
  function dividirPrateleiras(n, etiquetas) {
    const k = etiquetas.length;
    if (!k) return [{ de: 0, ate: n, etiquetas: [] }];
    if (k <= n) return etiquetas.map((e, i) => ({ de: Math.floor((i * n) / k), ate: Math.floor(((i + 1) * n) / k), etiquetas: [e] }));
    return Array.from({ length: n }, (_, j) => ({ de: j, ate: j + 1, etiquetas: etiquetas.slice(Math.floor((j * k) / n), Math.floor(((j + 1) * k) / n)) }));
  }

  /** Texto de comparação de um movimento (sem acento, maiúsculas e espaços simples). */
  const chaveMovimento = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();

  /**
   * Colunas do planograma do móvel (mesmas regras da planta): uma por espaço da gôndola e por frente
   * da mesa, cada uma com as etiquetas da linha do próprio espaço; uma por bloco do balcão (Etiqueta N
   * da linha dele); o totem tem uma coluna com um painel por linha; o móvel make, as testeiras por
   * cima e o corpo sem marca; os demais, uma coluna só com a linha do móvel.
   * Cada coluna que leva produtos tem o id do espaço (o da aba Prateleiras) e as etiquetas dele; quando as
   * prateleiras dela foram desenhadas na construção (detalhe(id)), cada prateleira mostra os quadrados desenhados,
   * com os produtos (celula.quadrados), no lugar da divisão automática pelas etiquetas.
   * @return {{n, rotulos, colunas: Array<{id, nome, peso, marca, etiquetas, celulas, desenhada}>, testeiras}|null}
   */
  function planogramaDe(m, mov, linha, temLinha, detalhe) {
    const config = estado.dados.config || {};
    const limBloco = (config.etiquetasPorBloco || {})[m.tipo] || 1;
    /** Linha própria do espaço (a metade sem linha usa a do meio). */
    const propriaDe = (e) => {
      const meio = /^MEIO-[AB]-\d$/.test(e.id) ? m.id + '/' + e.id.slice(0, 6) : null;
      const id = [m.id + '/' + e.id, meio].filter(Boolean).find(temLinha);
      return id ? linha(id) : null;
    };
    /** Etiqueta pronta para o planograma: texto e marca (a dela ou a da linha). */
    const etq = (e, i) => ({ texto: e.texto, marca: e.marca || (i && i.marca !== 'NEUTRO' ? i.marca : '') });
    const coluna = (id, nome, peso, n, i, etiquetas, outras) => {
      const lista = etiquetas.map((e) => etq(e, i));
      const det = id && detalhe ? detalhe(id) : null;
      const desenhada = !!(det && det.prateleiras.some((p) => p.quadrados.length));
      const quadradosDe = (k) => ((det.prateleiras.find((p) => p.numero === k + 1) || {}).quadrados || []);
      return {
        id, nome, peso, marca: i ? i.marca : '', etiquetas: lista.length ? lista : outras || [], desenhada,
        celulas: desenhada
          ? Array.from({ length: n }, (_, k) => ({ de: k, ate: k + 1, etiquetas: [], quadrados: quadradosDe(k) }))
          : dividirPrateleiras(n, lista),
      };
    };
    const doEspaco = (e) => {
      const p = propriaDe(e);
      return { p, etiquetas: p ? p.etiquetas.slice(0, limBloco) : [] };
    };
    const n = Render.PRATELEIRAS[m.tipo] || 1;
    const rotulos = Array.from({ length: n }, (_, k) => String(k + 1));
    if (m.tipo === 'CAIXA') return null;
    if (m.tipo === 'GONDOLA') {
      // Na ordem Ponta A, Meio A, Ponta B, Meio B; cada meio tem o dobro da largura de uma ponta (a metade de um
      // meio dividido, a mesma da ponta).
      const ordem = (id) => ['PONTA-A', 'MEIO-A', 'PONTA-B', 'MEIO-B'].indexOf(id.replace(/^(MEIO-[AB])-\d$/, '$1'));
      const colunas = Render.caixasGondola(mov).slice()
        .sort((a, b) => ordem(a.espaco.id) - ordem(b.espaco.id) || a.espaco.id.localeCompare(b.espaco.id))
        .map((b) => {
          const { p, etiquetas } = doEspaco(b.espaco);
          const peso = /^MEIO-[AB]$/.test(b.espaco.id) ? 2 : 1;
          return coluna(m.id + '/' + b.espaco.id, b.espaco.nome, peso, n, p, etiquetas);
        });
      return { n, rotulos, colunas, testeiras: null };
    }
    if (m.tipo === 'TOTEM') {
      // Uma coluna, um painel por linha (1 = o de cima), cada um com a linha do próprio painel. Painel não leva produto.
      const celulas = Render.espacos(m).map((e, k) => {
        const { p, etiquetas } = doEspaco(e);
        return { de: k, ate: k + 1, marca: p ? p.marca : '', etiquetas: etiquetas.map((x) => etq(x, p)) };
      });
      return { n: 3, rotulos: ['Painel 1', 'Painel 2', 'Painel 3'], colunas: [{ id: null, nome: 'Totem', peso: 1, marca: '', etiquetas: [], celulas }], testeiras: null };
    }
    if (m.tipo === 'MESA' || m.tipo === 'MESA_3') {
      // O verso não é nicho: fica só na lista de espaços, abaixo do planograma.
      const colunas = Render.espacos(m).filter((e) => !e.vm).map((e) => {
        const { p, etiquetas } = doEspaco(e);
        return coluna(m.id + '/' + e.id, e.nome, 1, 1, p, etiquetas);
      });
      return { n: 1, rotulos: ['Nicho'], colunas, testeiras: null };
    }
    if (m.tipo === 'MAKE') {
      const testeiras = Render.espacos(m).map((e) => {
        const p = propriaDe(e);
        return { nome: e.nome, marca: p ? p.marca : '', etiquetas: p ? p.etiquetas.slice(0, 1).map((x) => etq(x, p)) : [] };
      });
      // As prateleiras do corpo não têm linha: os movimentos delas são os das testeiras.
      const dasTesteiras = [].concat(...testeiras.map((t) => t.etiquetas));
      return { n, rotulos, colunas: [coluna(m.id, 'Prateleiras', 1, n, null, [], dasTesteiras)], testeiras };
    }
    const geral = linha(m.id);
    const lim = (config.etiquetasPorTipo || {})[m.tipo];
    if (m.tipo === 'PIRAMIDE') {
      // Os 4 lados, do mesmo tamanho, cada um com as 4 prateleiras e as etiquetas da pirâmide (um espaço de
      // prateleira cada: PIRAMIDE 1/LADO-1…4).
      const etiquetas = geral ? geral.etiquetas.slice(0, lim || geral.etiquetas.length) : [];
      const colunas = [1, 2, 3, 4].map((k) => coluna(m.id + '/LADO-' + k, 'Lado ' + k, 1, n, geral, etiquetas));
      return { n, rotulos, colunas, testeiras: null };
    }
    return { n, rotulos, colunas: [coluna(m.tipo === 'EXTRA' ? null : m.id, 'Móvel', 1, n, geral, geral ? geral.etiquetas.slice(0, lim || geral.etiquetas.length) : [])], testeiras: null };
  }

  /** Seção "Planograma" da tela do móvel: as prateleiras de cada espaço, com a cor e as etiquetas de cada uma. */
  function blocoPlanograma(pai, plano) {
    const sec = novo('section', 'mv-bloco mv-plano', null, pai);
    novo('h3', null, 'Planograma · como as prateleiras estão divididas', sec);
    const fundo = (marca) => (marca && marca !== 'NEUTRO' ? corDaMarca(marca, 'etiqueta') : '');
    const caixa = novo('div', 'pg', null, sec);
    const grade = novo('div', 'pg-grade', null, caixa);
    // Espaços desenhados na construção: colunas mais largas e prateleiras mais altas, para caberem os produtos.
    const desenho = plano.colunas.some((c) => c.desenhada);
    // A largura mínima segue o peso de cada coluna, para a proporção valer também em telas estreitas.
    const base = desenho ? 150 : 90;
    grade.style.gridTemplateColumns = 'auto ' + plano.colunas.map((c) => 'minmax(' + Math.round(base * c.peso) + 'px, ' + c.peso.toFixed(2) + 'fr)').join(' ');
    const linhaTopo = plano.testeiras ? 1 : 0;
    grade.style.gridTemplateRows = (linhaTopo ? 'auto ' : '') + 'repeat(' + plano.n + ', minmax(' + (desenho ? 112 : 58) + 'px, auto)) auto';
    const pos = (n, col, row, rowFim) => {
      n.style.gridColumn = String(col);
      n.style.gridRow = row + (rowFim ? ' / ' + rowFim : '');
      return n;
    };
    const conteudo = (cel, etiquetas) => {
      if (!etiquetas.length) { novo('span', 'pg-sem', 'sem etiqueta', cel); return; }
      etiquetas.forEach((e) => {
        const chip = novo('span', 'pg-etq', e.texto, cel);
        const cor = fundo(e.marca);
        if (cor) chip.style.background = cor;
        else chip.classList.add('neutra');
      });
    };
    if (plano.testeiras) {
      pos(novo('span', 'pg-rot', 'Testeiras', grade), 1, 1);
      const faixa = pos(novo('div', 'pg-testeiras', null, grade), '2 / -1', 1);
      plano.testeiras.forEach((t) => {
        const cel = novo('div', 'pg-testeira', null, faixa);
        cel.title = t.nome;
        const cor = fundo(t.marca);
        if (cor) cel.style.background = cor;
        else cel.classList.add('neutra');
        conteudo(cel, t.etiquetas);
      });
    }
    plano.rotulos.forEach((r, k) => pos(novo('span', 'pg-rot', r, grade), 1, linhaTopo + k + 1));
    plano.colunas.forEach((c, ci) => {
      const col = ci + 2;
      c.celulas.forEach((cel) => {
        if (cel.quadrados) {
          // Prateleira desenhada: os quadrados no lugar e no tamanho definidos, com os produtos (Prateleira.html).
          const n = pos(novo('div', 'pg-celula pg-desenhada neutra', null, grade), col, linhaTopo + cel.de + 1, linhaTopo + cel.ate + 1);
          n.style.setProperty('--cor', '#F4F2EF');
          n.dataset.espaco = c.id;
          n.dataset.numero = String(cel.de + 1);
          Prateleira.desenharQuadrados(novo('div', 'pg-quadrados', null, n), c, cel.quadrados);
          return;
        }
        const n = pos(novo('div', 'pg-celula', null, grade), col, linhaTopo + cel.de + 1, linhaTopo + cel.ate + 1);
        const cor = fundo(cel.etiquetas.length ? cel.etiquetas[0].marca : cel.marca || c.marca);
        n.style.setProperty('--cor', cor || '#ECEAE6');
        if (!cor) n.classList.add('neutra');
        conteudo(n, cel.etiquetas);
      });
      // Tábuas das prateleiras (por cima das cores, no pé de cada nível).
      for (let k = 0; k < plano.n; k++) pos(novo('i', 'pg-tabua', null, grade), col, linhaTopo + k + 1);
      pos(novo('span', 'pg-nome', c.nome, grade), col, linhaTopo + plano.n + 1);
    });
    if (desenho) Prateleira.ajustarTextos(grade);
  }

  /** Desenho só do móvel (com as cores reais do ciclo, sem o filtro de marca), recortado nele. */
  function desenharMovelSozinho(alvo, planta, id) {
    Render.desenhar(alvo, Object.assign(contextoDesenho(), {
      filtro: '', somentePlanta: true, edicao: false, selecionado: '', grade: false, referencia: null, ajustes: {},
    }));
    // Os degradês e as hachuras têm ids (grad0, hach0…) que se repetem no slide principal: renomeia os deste desenho.
    alvo.querySelectorAll('linearGradient, pattern').forEach((g) => {
      const antigo = g.id;
      g.id = 'mv-' + antigo;
      alvo.querySelectorAll('[fill="url(#' + antigo + ')"]').forEach((n) => n.setAttribute('fill', 'url(#mv-' + antigo + ')'));
    });
    const camada = alvo.querySelector('.camada-planta');
    Array.from(alvo.children).forEach((n) => { if (n !== camada && n.tagName.toLowerCase() !== 'defs') n.remove(); });
    Array.from(camada.children).forEach((n) => { if (n.getAttribute('data-movel') !== id) n.remove(); });
    if (!camada.children.length) return false;
    const bb = camada.getBBox();
    const m = Math.max(bb.width, bb.height) * 0.12 + 4;
    alvo.setAttribute('viewBox', [bb.x - m, bb.y - m, bb.width + m * 2, bb.height + m * 2].join(' '));
    return true;
  }

  /**
   * Meios divididos de uma gôndola ('', 'A', 'B' ou 'AB'): pelo layout, quando o ciclo tem linha para uma das
   * metades ou quando o construtor dividiu o meio no ciclo em construção (ainda sem nada nas metades).
   */
  function meiosDivididos(planta, m, temLinha, ciclo) {
    const doRascunho = Rascunho.meiosDivididos(ciclo === undefined ? estado.ciclo : ciclo, planta.id, m.id);
    return ['A', 'B'].filter((l) => String(m.dividido || '').toUpperCase().indexOf(l) >= 0 || doRascunho.indexOf(l) >= 0
      || temLinha(m.id + '/MEIO-' + l + '-2') || temLinha(m.id + '/MEIO-' + l + '-1')).join('');
  }

  /** Clique no móvel: abre a tela com a estratégia do ciclo para ele (a linha do móvel ou a de cada espaço). */
  /**
   * O que um móvel tem no ciclo, numa ER: um bloco por espaço (gôndola — com o meio dividido quando o ciclo
   * tem linha para a metade —, mesas, totem, make) ou um só, do móvel inteiro.
   * @return {Array<{titulo, chave, espaco, info, propria, limite}>} chave: "MOVEL" ou "MOVEL/ESPACO"; info: o que
   *   vale nesta ER (com a cascata); propria: a ER tem linha própria (senão vem de uma ER menor ou de TODAS)
   */
  function blocosDoMovel(planta, m, ciclo) {
    const config = estado.dados.config || {};
    const linha = (x) => (ciclo ? movimentoDe(ciclo, planta.id, x) : null);
    const temLinha = (x) => { const i = linha(x); return !!(i && (i.marca || i.etiquetas.length || i.simbolo)); };
    const daEr = ((estado.dados.movimentos[ciclo] || {})[planta.id]) || {};
    const mov = m.tipo === 'GONDOLA' ? Object.assign({}, m, { dividido: meiosDivididos(planta, m, temLinha, ciclo) }) : m;
    const espacos = Render.espacos(mov);
    if (!espacos.length) {
      return [{
        titulo: 'Móvel', chave: m.id, espaco: null, info: linha(m.id), propria: !!daEr[m.id],
        limite: (config.etiquetasPorTipo || {})[m.tipo] || config.maxEtiquetas || 4,
      }];
    }
    return espacos.map((e) => {
      const meio = /^MEIO-[AB]-\d$/.test(e.id) ? m.id + '/' + e.id.slice(0, 6) : null;
      const propria = [m.id + '/' + e.id, meio].filter(Boolean).find(temLinha);
      // Espaço que muda conforme a ER: o título diz qual parte vale nesta ER (ex.: "Ponta B · Fixo O.U.i").
      const porEr = espacoPorEr(m.id + '/' + e.id);
      // De onde vem o que vale aqui (outra ER, talvez outro espaço) e se o espaço é definido de novo nesta ER.
      const de = propria && !daEr[propria] && ciclo ? origemDe(ciclo, planta.id, propria) : null;
      const corte = regraDaHeranca(planta.id, m.id + '/' + e.id);
      return {
        titulo: e.nome + (porEr ? ' · ' + porEr.parte(planta.id).nome : ''), chave: m.id + '/' + e.id, espaco: e, info: propria ? linha(propria) : null,
        propria: !!(propria && daEr[propria]), limite: (config.etiquetasPorBloco || {})[m.tipo] || 1,
        origem: de ? { er: nomeDaEr(de.planta), espaco: nomeDoEspaco(de.planta, de.id), outro: de.id !== propria } : null,
        redefinir: corte && corte.tipo === 'corta' ? nomeDaEr(corte.regra.de) : '',
      };
    });
  }

  /**
   * Planograma de um móvel numa ER e num ciclo (a tela do móvel e o briefing das gôndolas usam este): com os
   * meios divididos da gôndola e as prateleiras desenhadas na construção.
   */
  function planogramaDoMovel(planta, m, ciclo) {
    const linha = (x) => (ciclo ? movimentoDe(ciclo, planta.id, x) : null);
    const temLinha = (x) => { const i = linha(x); return !!(i && (i.marca || i.etiquetas.length || i.simbolo)); };
    // Gôndola: o meio também fica dividido quando o ciclo tem linha para uma das metades (como na planta).
    const mov = m.tipo === 'GONDOLA' ? Object.assign({}, m, { dividido: meiosDivididos(planta, m, temLinha, ciclo) }) : m;
    const detalhe = (id) => Prateleira.doEspaco(ciclo, planta.id, id);
    return planogramaDe(m, mov, linha, temLinha, detalhe);
  }

  function abrirMovel(id) {
    const planta = plantaAtual();
    const m = planta && planta.moveis.find((x) => x.id === id);
    if (!m) return;
    const dlg = $('dlgMovel');
    const ciclo = estado.ciclo;
    const tipo = (estado.dados.tipos && estado.dados.tipos[m.tipo]) || m.tipo;

    $('mvTitulo').textContent = m.id;
    const simples = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
    const descricao = simples(m.descricao) === simples(m.id) ? '' : m.descricao;
    $('mvSub').textContent = [descricao, String(tipo).split(':')[0], planta.nome, ciclo || 'sem ciclo selecionado'].filter(Boolean).join(' · ');
    const corpo = $('mvEstrategia');
    corpo.innerHTML = '';
    // Comentários da validação deste móvel (só aparece para quem entrou na validação).
    Validacao.montarSecaoMovel(novo('section', 'mv-bloco mv-validacao', null, corpo), m.id);
    if (!ciclo) {
      novo('p', 'mv-vazio', 'Escolha um ciclo no seletor para ver a estratégia deste móvel.', corpo);
    } else {
      const config = estado.dados.config || {};
      const plano = planogramaDoMovel(planta, m, ciclo);
      if (plano) {
        // O planograma ocupa a tela (sem a lista dos espaços embaixo); para o construtor, a edição das prateleiras.
        blocoPlanograma(corpo, plano);
        Prateleira.montarSecao(corpo, { ciclo, planta, movel: m, plano });
      }
      // Móvel sem planograma (móvel de atendimento): a linha do móvel.
      if (!plano) blocosDoMovel(planta, m, ciclo).forEach((b) => blocoEstrategia(corpo, b.titulo, b.info, {
        vazio: b.espaco ? 'Sem linha neste ciclo: o espaço fica branco (neutro).' : 'Sem linha neste ciclo: o móvel fica branco (neutro).',
        limite: b.espaco ? b.limite : (config.etiquetasPorTipo || {})[m.tipo],
      }));
    }
    if (!dlg.open) dlg.showModal();
    // O desenho precisa da tela visível para medir o móvel (getBBox).
    const desenho = $('mvDesenho');
    try {
      desenho.hidden = !desenharMovelSozinho(desenho, planta, m.id);
    } catch (e) {
      desenho.hidden = true;
    }
  }

    const dlg = $('dlgModelo');
    if (dlg.returnValue !== 'baixar') return;
    const copiar = dlg.querySelector('input[value="copiar"]').checked;
    const plantaSel = $('mdPlantas').value;

      ciclo: $('mdCiclo').value.trim(),

      plantas: plantaSel === '*' ? estado.dados.plantas.map((p) => p.id) : [plantaSel],

    };
    carregando(true, 'Gerando planilha…');
    try {
      const nome = await Planilha.baixarModelo(estado.dados, op, {
        movimento: movimentoDaPlanilha,
        linhasPaineis,
        linhasTipos,
      });
      toast('Download iniciado: ' + nome);
    } catch (e) {
      erro(e);
    } finally {
      carregando(false);
    }
  }

  async function importar(arquivo) {
    if (!arquivo) return;
    carregando(true, 'Lendo a planilha…');
    try {
      const payload = await Planilha.ler(arquivo, estado.dados);
      carregando(true, 'Gravando na planilha…');
      const r = await chamar('importarPlanilha', Desenvolvedor.acesso(), payload);
      await carregar({ ciclo: r.ciclos.length ? r.ciclos[r.ciclos.length - 1] : '' });
      mostrarResultado(r);
    } catch (e) {
      erro(e);
    } finally {
      carregando(false);
      $('arquivo').value = '';
    }
  }

  function mostrarResultado(r) {
    $('resTitulo').textContent = 'Importação concluída';
    const partes = [];
    if (r.movimentos) partes.push(r.movimentos + ' linha(s) de movimentos');
    if (r.paineis) partes.push(r.paineis + ' linha(s) de painéis');
    if (r.tipos) partes.push(r.tipos + ' linha(s) de tipos de movimento');
    if (r.layout) partes.push(r.layout + ' linha(s) de layout');
    if (r.produtos) partes.push(r.produtos + ' produto(s) no catálogo');
    $('resTexto').textContent = (partes.join(' e ') || 'Nenhuma linha') + ' gravada(s)' +
      (r.ciclos.length ? ' — ciclo(s): ' + r.ciclos.join(', ') + '.' : '.') +
      (r.avisos.length ? ' Confira os avisos:' : '');
    const ul = $('resAvisos');
    ul.textContent = '';
    r.avisos.forEach((a) => {
      const li = document.createElement('li');
      li.textContent = a;
      ul.appendChild(li);
    });
    $('dlgResultado').showModal();
  }

  /**
   * Dados do slide da estratégia: um resumo do Analytics (Estrategia.desenhar) com a ER do slide em destaque —
   * os principais movimentos em cada ER, as marcas e as classificações em cada ER e os números da ER.
   * Não usa os filtros da tela: é o ciclo inteiro.
   */
  function dadosEstrategia(planta, ciclo) {
    const d = dadosAnalytics(ciclo);
    const r = resumoDeEspaco(partesDeEspaco(planta, ciclo).filter((p) => !p.vm));
    const daEr = d.movimentos.filter((m) => m.porEr[planta.id]);
    return {
      er: planta.nome,
      erId: planta.id,
      ciclo,
      ers: d.ers,
      movimentos: d.movimentos,
      marcas: d.marcas,
      classes: d.classes,
      numeros: { total: r.total, moveis: r.moveis.size, movimentos: daEr.length, gmv: daEr.reduce((t, m) => t + (m.gmv || 0), 0) },
      nota: 'Espaço de exposição: na gôndola, cada ponta e cada meio; na mesa, cada frente; na pirâmide, o espaço se divide entre as etiquetas. '
        + 'Espaços de VM ficam de fora. Cada ER é um tamanho médio da rede: nenhuma conta soma ERs. GMV esperado: aba Tipos de movimento.',
      fmt: {
        espacos: qtdEspacos,
        pct: porcento,
        num: (v) => (Math.round(v * 10) / 10).toLocaleString('pt-BR'),
        gmvCurto,
      },
    };
  }

  /**
   * SVG a exportar, desenhado à parte (sem o zoom e sem os marcadores da validação). "slide": o slide
   * inteiro, com os painéis (nome da ER, TV / rádio, A, C, notas, legenda e itens extras), que na tela
   * ficam no menu da esquerda. "planta": só a loja, os móveis e as etiquetas, sem fundo e recortada no
   * conteúdo. Os dois com as mesmas cores da tela (inclusive o filtro de marca) e na visão da tela.
   */
  function svgParaPng(modo, conteudo, planta) {
    planta = planta || plantaAtual();
    const ns = 'http://www.w3.org/2000/svg';
    const temp = document.createElementNS(ns, 'svg');
    // Fora da tela, mas renderizado (getBBox não funciona com display: none).
    temp.setAttribute('style', 'position:absolute;left:-10000px;top:0;width:' + estado.tela.w + 'px;height:' + estado.tela.h + 'px;visibility:hidden');
    document.body.appendChild(temp);
    try {
      const soPlanta = modo === 'planta';
      const r = conteudo === 'estrategia'
        ? { tela: Estrategia.desenhar(temp, dadosEstrategia(planta, estado.ciclo), { recorte: soPlanta }) }
        : conteudo === 'calendario'
          // O calendário do ciclo, com as escolhas do calendário da tela (ordem e exposição).
          ? { tela: Calendario.slide(temp, dadosCalendario(Calendario.vista().er), { ciclo: $('pngCicloCal').value, recorte: soPlanta }) }
          : Render.desenhar(temp, Object.assign(contextoDesenho(planta), {
          somentePlanta: soPlanta, paineis: !soPlanta, edicao: false, selecionado: '', grade: false, referencia: null, escuro: false,
          visao: conteudo === 'simplificada' ? 'simplificada' : 'planta',
        }));
      let caixa = { x: 0, y: 0, w: r.tela.w, h: r.tela.h };
      if (soPlanta) {
        const bb = temp.getBBox();
        const m = 12;
        const x = Math.max(0, Math.floor(bb.x - m));
        const y = Math.max(0, Math.floor(bb.y - m));
        caixa = {
          x, y,
          w: Math.min(r.tela.w, Math.ceil(bb.x + bb.width + m)) - x,
          h: Math.min(r.tela.h, Math.ceil(bb.y + bb.height + m)) - y,
        };
      }
      const clone = temp.cloneNode(true);
      clone.removeAttribute('style');
      clone.setAttribute('viewBox', [caixa.x, caixa.y, caixa.w, caixa.h].join(' '));
      return { clone, caixa };
    } finally {
      temp.remove();
      Render.paleta(document.documentElement.dataset.tema === 'escuro'); // volta às cores da tela
    }
  }

  const URL_FONTE_ETQ = 'https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap';
  let fonteEmbutida = null;

  /**
   * @font-face da fonte das etiquetas com os arquivos embutidos (data:), para o PNG sair com a mesma
   * fonte da tela (uma imagem SVG não carrega arquivos de fora). Sem internet, o PNG usa Arial.
   */
  function cssFonteEmbutida() {
    if (!fonteEmbutida) {
      const paraDataUrl = (blob) => new Promise((ok, falha) => {
        const r = new FileReader();
        r.onload = () => ok(r.result);
        r.onerror = falha;
        r.readAsDataURL(blob);
      });
      fonteEmbutida = (async () => {
        const css = await (await fetch(URL_FONTE_ETQ)).text();
        // Só os blocos "latin" e "latin-ext" (os acentos do português estão neles).
        const blocos = css.split(/(?=\/\*)/).filter((b) => /^\/\*\s*latin(-ext)?\s*\*\//.test(b));
        const partes = await Promise.all(blocos.map(async (b) => {
          const url = (b.match(/url\(([^)]+)\)/) || [])[1];
          if (!url) return '';
          const dados = await paraDataUrl(await (await fetch(url.replace(/['"]/g, ''))).blob());
          return b.replace(url, '"' + dados + '"');
        }));
        return partes.join('\n');
      })().catch((e) => {
        console.warn('PNG sem a fonte das etiquetas embutida:', e);
        fonteEmbutida = null;
        return '';
      });
    }
    return fonteEmbutida;
  }

  /** Desenha e rasteriza um PNG (Blob): "slide" sempre com 3840 px de largura (16:9); "planta" em 2×. */
  async function gerarPng(modo, conteudo, planta) {
    const { clone, caixa } = svgParaPng(modo, conteudo, planta);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', caixa.w);
    clone.setAttribute('height', caixa.h);
    clone.querySelectorAll('title').forEach((t) => t.remove());
    const css = await cssFonteEmbutida();
    if (css) {
      const estilo = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      estilo.textContent = css;
      clone.insertBefore(estilo, clone.firstChild);
    }
    const xml = new XMLSerializer().serializeToString(clone);
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    await img.decode();
    // Slide completo: sempre 3840 px de largura (16:9), mesmo quando o slide cresceu para caber as fichas.
    // O calendário do ciclo cresce com os movimentos: recortado, fica com até 3840 px de largura.
    const escala = modo === 'planta' ? (conteudo === 'calendario' ? Math.min(2, 3840 / caixa.w) : 2) : 3840 / caixa.w;
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(caixa.w * escala);
    canvas.height = Math.round(caixa.h * escala);
    const ctx = canvas.getContext('2d');
    ctx.scale(escala, escala);
    ctx.drawImage(img, 0, 0, caixa.w, caixa.h);
    return new Promise((ok) => canvas.toBlob(ok, 'image/png'));
  }

  /** Nome de arquivo sem os caracteres que o Windows não aceita. */
  const nomeDeArquivo = (partes, ext) => partes.filter(Boolean).join(' - ').replace(/[\\/:*?"<>|]+/g, '-') + ext;

  async function baixarPng() {
    const dlg = $('dlgPng');
    if (dlg.returnValue !== 'baixar') return;
    const planta = plantaAtual();
    if (!planta) return;
    const conteudo = dlg.querySelector('input[name="pngConteudo"]:checked').value;
    if (dlg.querySelector('input[name="pngErs"]:checked').value === 'todas') {
      baixarPptx(conteudo);
      return;
    }
    // "png": só o conteúdo, recortado e sem fundo; "slide": o slide 16:9 completo.
    const modo = dlg.querySelector('input[name="pngFormato"]:checked').value === 'png' ? 'planta' : 'slide';
    carregando(true, 'Gerando imagem…');
    try {
      const blob = await gerarPng(modo, conteudo, planta);
      const marca = estado.filtro && estado.dados.marcas[estado.filtro];
      const estrategia = conteudo === 'estrategia';
      if (conteudo === 'calendario') {
        baixarArquivo(blob, nomeDeArquivo(['Calendario', $('pngCicloCal').value, modo === 'slide' ? 'slide' : ''], '.png'));
        return;
      }
      baixarArquivo(blob, nomeDeArquivo([planta.nome, estado.ciclo, estrategia ? 'estrategia' : conteudo === 'simplificada' ? 'visao simplificada' : 'planta',
        modo === 'slide' ? 'slide' : '', !estrategia && marca ? marca.nome : ''], '.png'));
    } catch (e) {
      erro(e);
    } finally {
      carregando(false);
    }
  }

  /* --------------------- todas as ERs num PowerPoint ---------------------- */

  // PptxGenJS (carregada sob demanda, como o ExcelJS da planilha base): monta o .pptx no navegador.
  const PPTXGENJS = {
    src: 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    integrity: 'sha384-Cck14aA9cifjYolcnjebXRfWGkz5ltHMBiG4px/j8GS+xQcb7OhNQWZYyWjQ+UwQ',
  };
  let promessaPptx = null;

  function carregarPptxGenJS() {
    if (window.PptxGenJS) return Promise.resolve(window.PptxGenJS);
    if (!promessaPptx) {
      promessaPptx = new Promise((ok, falha) => {
        const s = document.createElement('script');
        s.src = PPTXGENJS.src;
        s.integrity = PPTXGENJS.integrity;
        s.crossOrigin = 'anonymous';
        s.referrerPolicy = 'no-referrer';
        s.onload = () => ok(window.PptxGenJS);
        s.onerror = () => {
          promessaPptx = null;
          falha(new Error('Não foi possível carregar a biblioteca do PowerPoint (PptxGenJS). Verifique a conexão.'));
        };
        document.head.appendChild(s);
      });
    }
    return promessaPptx;
  }

  const blobParaDataUrl = (blob) => new Promise((ok, falha) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = falha;
    r.readAsDataURL(blob);
  });

  /** Um slide 16:9 por ER (ER P → ER GG), com o slide completo de cada uma, como no PNG "Slide completo". */
  async function baixarPptx(conteudo) {
    carregando(true, 'Gerando o PowerPoint…');
    try {
      const PptxGenJS = await carregarPptxGenJS();
      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_WIDE'; // 13,33 × 7,5 pol (16:9)
      pptx.title = ['Plano de Varejo', estado.ciclo].filter(Boolean).join(' · ');
      for (const planta of estado.dados.plantas) {
        carregando(true, 'Gerando o PowerPoint… ' + planta.nome);
        const png = await gerarPng('slide', conteudo, planta);
        const slide = pptx.addSlide();
        slide.background = { color: 'FFFFFF' };
        slide.addImage({ data: await blobParaDataUrl(png), x: 0, y: 0, w: 13.333, h: 7.5 });
        slide.addNotes([planta.nome, estado.ciclo].filter(Boolean).join(' · '));
      }
      const blob = await pptx.write({ outputType: 'blob' });
      const marca = estado.filtro && estado.dados.marcas[estado.filtro];
      const estrategia = conteudo === 'estrategia';
      baixarArquivo(blob, nomeDeArquivo([estado.ciclo || 'sem ciclo', 'todas as ERs',
        estrategia ? 'estrategia' : conteudo === 'simplificada' ? 'visao simplificada' : 'planta', !estrategia && marca ? marca.nome : ''], '.pptx'));
    } catch (e) {
      erro(e);
    } finally {
      carregando(false);
    }
  }

  /* ------------------------- link com o estado da tela ------------------------- */
  // O ciclo, a ER, a visão e os filtros vão no #hash da URL (ex.: #ciclo=C10&er=ER+M&marca=BOT), para
  // mandar um link que abre o app do mesmo jeito. No Apps Script a página roda num iframe: o hash é lido
  // e gravado pelo google.script.url / google.script.history.

  const noAppsScript = () => !!(window.google && google.script && google.script.url && google.script.history);

  /** Preferências do link (as que existirem): ciclo, planta (nome da ER), visão, marca, etiqueta. */
  function lerLink() {
    const converter = (hash) => {
      const q = new URLSearchParams(String(hash || '').replace(/^#/, ''));
      const pref = {};
      [['ciclo', 'ciclo'], ['er', 'planta'], ['visao', 'visao'], ['marca', 'marca'], ['etiqueta', 'etiqueta']]
        .forEach(([k, campo]) => { if (q.has(k)) pref[campo] = q.get(k); });
      return pref;
    };
    if (!noAppsScript()) return Promise.resolve(converter(window.location.hash));
    return new Promise((ok) => {
      try { google.script.url.getLocation((loc) => ok(converter(loc && loc.hash))); } catch (e) { ok({}); }
    });
  }

  function hashDoEstado() {
    const planta = plantaAtual();
    const q = new URLSearchParams();
    if (estado.ciclo) q.set('ciclo', estado.ciclo);
    if (planta) q.set('er', planta.nome);
    if (estado.visao === 'simplificada') q.set('visao', 'simplificada');
    if (estado.filtro) q.set('marca', estado.filtro);
    if (estado.filtroEtiqueta) q.set('etiqueta', estado.filtroEtiqueta);
    return q.toString();
  }

  let ultimoHash = null;
  function gravarLink() {
    const hash = hashDoEstado();
    if (hash === ultimoHash) return;
    ultimoHash = hash;
    try {
      if (noAppsScript()) google.script.history.replace(null, null, hash);
      else window.history.replaceState(null, '', window.location.pathname + window.location.search + (hash ? '#' + hash : ''));
    } catch (e) { /* sem histórico (ex.: página embutida): o link continua funcionando ao copiar */ }
  }

  async function copiarLink() {
    const hash = hashDoEstado();
    const base = noAppsScript() && estado.dados && estado.dados.appUrl
      ? estado.dados.appUrl : window.location.href.replace(/#.*$/, '');
    const link = base + (hash ? '#' + hash : '');
    try {
      await navigator.clipboard.writeText(link);
      toast('Link copiado: abre neste ciclo, ER e filtro.');
    } catch (e) {
      window.prompt('Copie o link:', link); // sem acesso à área de transferência (ex.: dentro do Apps Script)
    }
  }

  /* --------------------------- modo apresentação --------------------------- */

  let rotuloTimer = null;
  function mostrarRotuloApresentacao() {
    const planta = plantaAtual();
    const r = $('apresRotulo');
    r.textContent = [planta && planta.nome, estado.ciclo].filter(Boolean).join(' · ');
    r.hidden = false;
    r.classList.remove('some');
    clearTimeout(rotuloTimer);
    rotuloTimer = setTimeout(() => r.classList.add('some'), 2200);
  }

  /** Só a planta, na tela toda (tela cheia, quando o navegador deixa). As setas trocam a ER; F ou Esc saem. */
  let saindoDaTelaCheia = false; // a saída da tela cheia foi pedida pelo app (F, Esc, botão)

  function alternarApresentacao(ligar) {
    const ativo = document.body.classList.contains('apresentando');
    ligar = ligar === undefined ? !ativo : ligar;
    if (ligar === ativo || (ligar && (!estado.dados || Editor.ativo()))) return;
    if (ligar && estado.analytics) alternarAnalytics(false);
    if (ligar && estado.calendario) alternarCalendario(false);
    document.body.classList.toggle('apresentando', ligar);
    if (ligar) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => { /* sem tela cheia: fica só o layout limpo */ });
      mostrarRotuloApresentacao();
    } else {
      $('apresRotulo').hidden = true;
      if (document.fullscreenElement && document.exitFullscreen) {
        saindoDaTelaCheia = true; // o fullscreenchange desta saída chega depois: não desliga uma apresentação nova
        document.exitFullscreen().catch(() => { saindoDaTelaCheia = false; });
      }
    }
    estado.zoom = { k: 1, x: 0, y: 0 };
    desenhar();
  }

  /* -------------------------------- busca --------------------------------- */

  /** Texto para comparar na busca: sem acentos, maiúsculas nem espaços repetidos. */
  const paraBusca = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

  /**
   * O que dá para achar: as etiquetas do ciclo (com as ERs onde aparecem), as marcas e os móveis de
   * cada planta. Sem ciclo, só os móveis.
   */
  function indiceDeBusca() {
    const itens = [];
    if (estado.ciclo) {
      const etiquetas = {};
      estado.dados.plantas.forEach((pl) => espacosDaPlanta(pl, estado.ciclo).forEach((x) => {
        const i = linhaDoEspaco(estado.ciclo, pl.id, x.movel, x.espaco && x.espaco.id);
        ((i && i.etiquetas) || []).forEach((e) => {
          const k = chaveEtiqueta(e.texto);
          const it = etiquetas[k] || (etiquetas[k] = {
            tipo: 'etiqueta', texto: Render.movimentoDaEtiqueta(e.texto), marca: e.marca || (i.marca !== 'NEUTRO' ? i.marca : ''), ers: [], espacos: 0,
          });
          if (it.ers.indexOf(pl.id) < 0) it.ers.push(pl.id);
          it.espacos++;
        });
      }));
      Object.values(etiquetas).forEach((it) => {
        const nomes = estado.dados.plantas.filter((pl) => it.ers.indexOf(pl.id) >= 0).map((pl) => pl.nome);
        itens.push(Object.assign(it, { sub: 'Etiqueta · ' + nomes.join(', ') }));
      });
      Object.keys(estado.dados.marcas).filter((c) => c !== 'NEUTRO').forEach((c) => {
        // Acha também pelo nome completo e pelos outros nomes aceitos na planilha ("eudora" → EUD).
        const m = estado.dados.marcas[c];
        const completo = (m.apelidos || [])[0] || '';
        itens.push({ tipo: 'marca', texto: m.nome, marca: c, sub: 'Marca' + (completo && completo !== m.nome ? ' · ' + completo : ''), extra: (m.apelidos || []).join(' ') });
      });
    }
    estado.dados.plantas.forEach((pl) => pl.moveis.forEach((m) => {
      const nome = m.descricao || m.id;
      itens.push({ tipo: 'movel', texto: nome, sub: 'Móvel · ' + (nome !== m.id ? m.id + ' · ' : '') + pl.nome, id: m.id, er: pl.id, extra: m.id });
    }));
    itens.forEach((it) => { it.chave = paraBusca(it.texto + ' ' + (it.extra || '') + ' ' + (it.tipo === 'marca' ? it.marca : '')); });
    return itens;
  }

  const busca = { itens: [], achados: [], atual: 0 };

  function abrirBusca() {
    if (!estado.dados || document.querySelector('dialog[open]')) return;
    busca.itens = indiceDeBusca();
    $('buscaTexto').value = '';
    filtrarBusca();
    $('dlgBusca').showModal();
    $('buscaTexto').focus();
  }

  /** Todas as palavras precisam aparecer; o que começa com o texto vem antes, depois etiquetas, marcas e móveis. */
  function filtrarBusca() {
    const q = paraBusca($('buscaTexto').value);
    const palavras = q ? q.split(' ') : [];
    const ordemTipo = { etiqueta: 0, marca: 1, movel: 2 };
    busca.achados = !palavras.length ? [] : busca.itens
      .filter((it) => palavras.every((w) => it.chave.indexOf(w) >= 0))
      .sort((a, b) => (b.chave.indexOf(q) === 0) - (a.chave.indexOf(q) === 0)
        || ordemTipo[a.tipo] - ordemTipo[b.tipo]
        || (b.er === estado.planta) - (a.er === estado.planta) // móveis da ER atual primeiro
        || a.texto.localeCompare(b.texto, 'pt-BR'))
      .slice(0, 40);
    busca.atual = 0;
    const lista = $('buscaLista');
    lista.textContent = '';
    if (palavras.length && !busca.achados.length) novo('li', 'busca-vazio', 'Nada encontrado' + (estado.ciclo ? '.' : ' (escolha um ciclo para buscar etiquetas).'), lista);
    busca.achados.forEach((it, k) => {
      const li = novo('li', 'busca-item', null, lista);
      li.id = 'busca-' + k;
      li.setAttribute('role', 'option');
      const cor = novo('i', 'busca-cor ' + it.tipo, null, li);
      if (it.tipo !== 'movel' && it.marca) cor.style.background = corDaMarca(it.marca, 'etiqueta');
      const txt = novo('span', 'busca-txt', null, li);
      novo('strong', null, it.texto, txt);
      novo('small', null, it.sub, txt);
      li.addEventListener('mousemove', () => marcarBusca(k));
      li.addEventListener('click', () => irPara(it));
    });
    marcarBusca(0);
  }

  function marcarBusca(k) {
    busca.atual = Math.max(0, Math.min(k, busca.achados.length - 1));
    document.querySelectorAll('#buscaLista .busca-item').forEach((li, i) => li.setAttribute('aria-selected', String(i === busca.atual)));
    const li = $('busca-' + busca.atual);
    $('buscaTexto').setAttribute('aria-activedescendant', li ? li.id : '');
    if (li) li.scrollIntoView({ block: 'nearest' });
  }

  /** Etiqueta e marca: mostram na planta só onde aparecem (na ER atual, se aparecem nela); móvel: abre o móvel. */
  function irPara(it) {
    $('dlgBusca').close();
    if (it.tipo === 'movel') {
      if (it.er !== estado.planta) trocarPlanta(it.er);
      if (estado.planta === it.er) {
        if (estado.analytics) alternarAnalytics(false);
        if (estado.calendario) alternarCalendario(false);
        abrirMovel(it.id);
      }
      return;
    }
    if (it.tipo === 'etiqueta') {
      verNaPlanta({ etiqueta: it.texto, er: it.ers.indexOf(estado.planta) >= 0 ? estado.planta : it.ers[0] });
    } else {
      verNaPlanta({ marca: it.marca });
    }
  }

  function ligarBusca() {
    const entrada = $('buscaTexto');
    entrada.addEventListener('input', filtrarBusca);
    entrada.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        marcarBusca(busca.atual + (e.key === 'ArrowDown' ? 1 : -1));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (busca.achados[busca.atual]) irPara(busca.achados[busca.atual]);
      }
    });
    // Clique fora da caixa (no fundo do diálogo) fecha.
    $('dlgBusca').addEventListener('click', (e) => { if (e.target === $('dlgBusca')) $('dlgBusca').close(); });
    $('btnBusca').addEventListener('click', abrirBusca);
    // Ctrl/⌘+K de qualquer lugar; "/" fora dos campos de texto.
    document.addEventListener('keydown', (e) => {
      const emCampo = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
      if (((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'k') || (e.key === '/' && !emCampo && !e.ctrlKey && !e.metaKey)) {
        if (Editor.ativo() && e.key === '/') return;
        e.preventDefault();
        abrirBusca();
      }
    });
  }

  /* -------------------------------- início -------------------------------- */

  function ligarEventos() {
    // Botões que não estão na página são ignorados.
    const ao = (id, evento, fn) => { if ($(id)) $(id).addEventListener(evento, fn); };
    ao('selCiclo', 'change', (e) => {
      estado.ciclo = e.target.value;
      desenhar();
    });
    // Baixar planilha base, Importar planilha e Construir loja: só com o módulo Desenvolvedor liberado.

    ao('btnImportar', 'click', () => estado.dados && Desenvolvedor.ativo() && $('arquivo').click());
    ao('arquivo', 'change', (e) => importar(e.target.files[0]));
    ao('btnPng', 'click', () => estado.dados && abrirDialogoPng());
    ao('dlgPng', 'close', baixarPng);
    ao('dlgPng', 'change', atualizarDialogoPng);
    ao('btnEditar', 'click', () => estado.dados && alternarEdicao());
    ao('btnAnalytics', 'click', () => estado.dados && alternarAnalytics());
    ao('anFechar', 'click', () => alternarAnalytics(false));
    ao('btnCalendario', 'click', () => estado.dados && alternarCalendario());
    ao('calFechar', 'click', () => alternarCalendario(false));
    ao('anInfo', 'click', () => {
      if (!estado.dados || !estado.ciclo) return;
      Analytics.desenharInfo($('anInfoCorpo'), dadosAnalytics(estado.ciclo), { miniatura: Render.miniaturaEspacos });
      $('dlgAnInfo').showModal();
    });
    ao('btnLoja', 'click', () => {
      // Com o Analytics aberto, o botão volta para a planta com o menu da ER aberto.
      estado.painelLoja = estado.analytics || estado.calendario ? true : !estado.painelLoja;
      if (estado.analytics) alternarAnalytics(false);
      if (estado.calendario) alternarCalendario(false);
      memoria.gravar('painelLoja', estado.painelLoja ? '1' : '0');
      atualizarPainelLoja();
    });
    ao('lojaFechar', 'click', () => $('btnLoja').click());
    ao('zoomMais', 'click', () => zoomPara(estado.zoom.k * 1.5));
    ao('zoomMenos', 'click', () => zoomPara(estado.zoom.k / 1.5));
    ao('zoomNivel', 'click', () => zoomPara(1));
    ao('btnAutoOrganizar', 'click', autoOrganizar);
    ao('etqMenor', 'click', () => mudarTamanhoEtiquetas(tamanhoEtiquetas() - TAMANHO_ETQ.passo));
    ao('etqMaior', 'click', () => mudarTamanhoEtiquetas(tamanhoEtiquetas() + TAMANHO_ETQ.passo));
    ao('etqTamanho', 'click', () => mudarTamanhoEtiquetas(100));
    // Menu de configurações (engrenagem): abre e fecha; fecha ao escolher um item, clicar fora ou Esc.
    const menuCfg = $('menuConfigLista');
    const abrirMenuCfg = (abrir) => {
      menuCfg.hidden = !abrir;
      $('btnConfig').setAttribute('aria-expanded', String(abrir));
      if (abrir) { const i = menuCfg.querySelector('.menu-item:not(:disabled)'); if (i) i.focus(); }
    };
    ao('btnConfig', 'click', () => abrirMenuCfg(menuCfg.hidden));
    menuCfg.addEventListener('click', (e) => { if (e.target.closest('.menu-item')) abrirMenuCfg(false); });
    document.addEventListener('pointerdown', (e) => { if (!menuCfg.hidden && !e.target.closest('#menuConfig')) abrirMenuCfg(false); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !menuCfg.hidden) { abrirMenuCfg(false); $('btnConfig').focus(); }
    });
    ao('btnTema', 'click', () => {
      const escuro = document.documentElement.dataset.tema !== 'escuro';
      memoria.gravar('tema', escuro ? 'escuro' : 'claro');
      aplicarTema(escuro);
    });
    ao('btnApresentar', 'click', () => alternarApresentacao(true));
    ao('btnLink', 'click', () => estado.dados && copiarLink());
    // Esc do navegador sai da tela cheia: sai da apresentação junto.
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) return;
      if (saindoDaTelaCheia) { saindoDaTelaCheia = false; return; }
      alternarApresentacao(false); // saiu da tela cheia pelo navegador
    });
    ao('btnDescartar', 'click', () => { estado.ajustes = {}; atualizarBarraEdicao(); desenhar(); });
    // O menu fecha no clique; o tour começa depois, para não destacar o menu ainda aberto.
    ao('btnTutorial', 'click', () => estado.dados && setTimeout(() => Tutorial.iniciar(), 0));
    ao('btnSalvarAjustes', 'click', salvarAjustes);
    ao('btnBaixarPosicoes', 'click', baixarPosicoes);
    ao('btnConfigurar', 'click', configurar);
    ao('btnConstruir', 'click', () => {
      if (!estado.dados || !Desenvolvedor.ativo()) return;
      if (Editor.ativo()) { Editor.fechar(); return; }
      if (estado.edicao) alternarEdicao();
      if (estado.edicao) return; // usuário cancelou a saída do modo ajuste
      Editor.abrir();
    });
    ao('btnRestaurar', 'click', () => {
      if (window.confirm('Apagar os dados salvos neste navegador e voltar ao começo (sem ciclos)?')) configurar();
    });
    ao('btnAtualizar', 'click', () => {
      if (Object.keys(estado.ajustes).length && !window.confirm('Descartar ajustes de etiquetas não salvos?')) return;
      carregar().then(() => toast('Dados atualizados.'));
    });

    // Setas ← → trocam de planta (útil ao apresentar).
    document.addEventListener('keydown', (e) => {
      if (!estado.dados) return;
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName) || document.querySelector('dialog[open]')) return;
      if (Editor.ativo()) { Editor.tecla(e); return; }
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'f' || e.key === 'F') { alternarApresentacao(); return; }
      if (e.key === 'Escape' && document.body.classList.contains('apresentando')) { alternarApresentacao(false); return; }
      // Com o Analytics aberto (meia tela), Esc fecha ele; o zoom e as setas continuam valendo na planta.
      if (estado.analytics && e.key === 'Escape' && !document.querySelector('.tut-foco')) { alternarAnalytics(false); return; }
      // O calendário cobre a planta: Esc fecha; o zoom e as setas não valem enquanto ele está aberto.
      if (estado.calendario) { if (e.key === 'Escape' && !document.querySelector('.tut-foco')) alternarCalendario(false); return; }
      if (e.key === '+' || e.key === '=') { zoomPara(estado.zoom.k * 1.5); return; }
      if (e.key === '-' || e.key === '_') { zoomPara(estado.zoom.k / 1.5); return; }
      if (e.key === '0') { zoomPara(1); return; }
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const ids = estado.dados.plantas.map((p) => p.id);
      const i = ids.indexOf(estado.planta) + (e.key === 'ArrowRight' ? 1 : -1);
      if (i >= 0 && i < ids.length) trocarPlanta(ids[i]);
    });
  }

  // Modo noturno: o script do <head> já aplicou a escolha salva (ou a do sistema); aqui marca o botão
  // e redesenha a planta com as cores escuras e as marcas mais escuras (o PNG sai sempre com as cores do slide).
  function aplicarTema(escuro) {
    if (escuro) document.documentElement.dataset.tema = 'escuro';
    else delete document.documentElement.dataset.tema;
    $('btnTema').setAttribute('aria-pressed', String(escuro));
    Render.paleta(escuro);
    if (estado.dados) { montarLegenda(); desenhar(); }
  }
  aplicarTema(document.documentElement.dataset.tema === 'escuro');
  // Visão das etiquetas: lembra a última escolha (na planta, por padrão).
  if (memoria.ler('visao') === 'simplificada') estado.visao = 'simplificada';
  marcarVisao();
  document.querySelectorAll('#abasVisao .aba').forEach((b) => b.addEventListener('click', () => trocarVisao(b.dataset.visao)));
  // Menu da esquerda (painel da ER): lembra a última escolha; na primeira vez, abre em telas largas.
  const prefLoja = memoria.ler('painelLoja');
  estado.painelLoja = prefLoja ? prefLoja === '1' : window.innerWidth >= 1200;
  ligarEventos();
  ligarBusca();
  ligarZoom();
  ligarDestaque();
  // A fonte das etiquetas (Nunito) pode chegar depois do primeiro desenho: quando ela carregar, redesenha,
  // para o tamanho das etiquetas ser medido com a fonte certa.
  if (document.fonts && document.fonts.load) {
    Promise.all(['700 12px Nunito', '800 12px Nunito'].map((f) => document.fonts.load(f)))
      .then(() => { if (estado.dados) desenhar(); })
      .catch(() => { /* sem a fonte: as etiquetas usam a reserva (Segoe UI / Arial) */ });
  }
  Editor.iniciar({ estado, desenhar, chamar, toast, erro, carregar, carregando, plantaAtual, acesso: () => Desenvolvedor.acesso() });
  Desenvolvedor.iniciar({
    estado, chamar, toast, erro, carregar, carregando, plantaAtual, trocarPlanta,
    espacos: (m) => Render.espacos(m),
    layoutDe: (p) => Editor.layoutDe(p),
    // Nova planta: abre o Construir loja com uma planta em branco (o Salvar planta pergunta o nome).
    novaPlanta: () => { if (!Editor.ativo()) $('btnConstruir').click(); if (Editor.ativo()) Editor.novaPlanta(); },
    // Sair fecha o Construir loja (que pergunta antes, se houver alterações não salvas) e o ajuste das etiquetas.
    aoSair: () => {
      if (Editor.ativo()) Editor.fechar();
      if (Editor.ativo()) return false;
      if (estado.edicao) alternarEdicao();
      return !estado.edicao;
    },
  });
  Validacao.iniciar({
    estado, chamar, toast, erro, desenhar, plantaAtual, trocarPlanta,
    abrirMovel: (id) => abrirMovel(id),
    fecharAnalytics: () => { alternarAnalytics(false); alternarCalendario(false); },
    montarRascunhos: (corpo) => { Rascunho.montarSecao(corpo); Antecipacao.montarSecao(corpo); },
    construindo: () => Rascunho.painelVisivel(),
    aoEntrar: () => Rascunho.recarregar(),
    aoSair: () => Rascunho.limpar(),
  });
  Rascunho.iniciar({
    estado, ultimoAprovado, chamar, toast, erro, desenhar, plantaAtual, carregar, paineisDe, nomeDaMarca, montarCiclos,
    acesso: () => Validacao.acesso(),
    recarregarComentarios: () => Validacao.recarregar(),
    abrirMovel, blocosDoMovel, espacoPorEr, ersDaLinha, corDaMarca, colorirSelectMarca, movimentoDe,
    comentariosAbertos: () => Validacao.abertosNoCiclo(),
    abrirComentarios: () => Validacao.abrirPainel(),
    estatisticas: estatisticasConstrucao,
  });
  Antecipacao.iniciar({
    estado, chamar, toast, erro, desenhar, plantaAtual, trocarPlanta, abrirMovel, nomeDaMarca, corDaMarca, colorirSelectMarca,
    acesso: () => Validacao.acesso(),
    movimentoDaPlanilha,
  });
  Briefing.iniciar({
    estado, chamar, toast, erro, carregando, plantaAtual, planogramaDoMovel, corDaMarca, nomeDaMarca,
    acesso: () => Validacao.acesso(),
    // Resultado com links (ex.: o briefing salvo no Drive): título, texto e [{ texto, url }].
    mostrarResultado: (titulo, texto, links) => {
      $('resTitulo').textContent = titulo;
      $('resTexto').textContent = texto;
      const ul = $('resAvisos');
      ul.textContent = '';
      (links || []).forEach((l) => {
        const a = document.createElement('a');
        a.href = l.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = l.texto;
        ul.appendChild(document.createElement('li')).appendChild(a);
      });
      $('dlgResultado').showModal();
    },
  });
  Prateleira.iniciar({
    estado, chamar, toast, erro, abrirMovel, corDaMarca, dividirPrateleiras, chaveMovimento,
    acesso: () => Validacao.acesso(),
    rascunhos: () => Rascunho.lista(),
  });
  // Na primeira visita, depois de carregar, oferece o tutorial guiado.
  // O link (#ciclo=…&er=…) escolhe ciclo, ER, visão e filtros; sem link, abre como sempre.
  lerLink().then((pref) => carregar(pref)).then(() => {
    if (!estado.dados) return;
    marcarVisao();
    montarCiclos();
    montarLegenda();
    Tutorial.oferecer();
  });

  // resolver: usado também pelos testes end to end (dev/e2e.js).
  return { estado, carregar, resolver: { movimento: movimentoDaPlanilha, linhasPaineis, linhasTipos } };
})();
</script>
