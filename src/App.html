<script>
/**
 * ============================================================================
 *  APLICAÇÃO (estado, controles e chamadas ao servidor)
 * ============================================================================
 */
const App = (() => {
  const estado = {
    dados: null,
    ciclo: '',
    planta: '',
    filtro: '',
    filtroEtiqueta: '', // etiqueta escolhida em "Por movimentos" (só os espaços com ela ficam coloridos)
    filtroClassificacao: '', // classificação escolhida em "Por classificação" (lançamento, promoção…)
    edicao: false,
    ajustes: {}, // ajustes de etiquetas ainda não salvos (planta atual): id → {x, y}; LOJA → {escala} (tamanho, em %)
    grupos: [],
    analytics: false, // dashboard "Analytics" aberto (no lugar da planta)
    painelLoja: false, // menu da esquerda (nome da ER, TV / rádio, A, C, notas, símbolos, itens extras) aberto
    tela: { w: 1920, h: 1080 }, // tamanho do slide do último desenho (cresce em 16:9 quando as etiquetas pedem)
    simbolos: [], // símbolos usados na planta (legenda do menu da esquerda)
    visao: 'planta', // etiquetas "Na planta" ou em fichas ("simplificada")
    zoom: { k: 1, x: 0, y: 0 }, // zoom da tela: fator e canto de cima à esquerda da área visível (unidades do slide)
  };
  const $ = (id) => document.getElementById(id);
  const svg = $('slide');

  /**
   * Modo "Construir loja". A versão só de visualização (pasta visualizador/) não inclui
   * o Construtor.html: no lugar dele entra este substituto, que nunca está ativo.
   */
  const Editor = typeof Construtor !== 'undefined' ? Construtor : {
    iniciar() {}, sincronizar() {}, aposDesenhar() {}, fechar() {}, abrir() {}, tecla() {},
    contexto: () => null, ativo: () => false, podeSair: () => true,
  };

  /* ------------------------------ utilidades ------------------------------ */

  const memoria = {
    ler(k) { try { return window.localStorage.getItem('planoVarejo.' + k); } catch (e) { return null; } },
    gravar(k, v) { try { window.localStorage.setItem('planoVarejo.' + k, v); } catch (e) { /* sem armazenamento */ } },
  };

  /** Dispara o download de um Blob. */
  function baixarArquivo(blob, nome) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  /** google.script.run como Promise. */
  function chamar(funcao) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((ok, falha) => {
      if (!window.google || !google.script || !google.script.run) {
        falha(new Error('Esta página precisa ser aberta pelo Apps Script (App da Web ou menu da planilha).'));
        return;
      }
      const run = google.script.run.withSuccessHandler(ok).withFailureHandler(falha);
      run[funcao].apply(run, args);
    });
  }

  function carregando(ativo, mensagem) {
    $('carregando').hidden = !ativo;
    if (mensagem) $('carregandoTexto').textContent = mensagem;
  }

  let timerToast = null;
  function toast(msg, erro) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('erro', !!erro);
    t.hidden = false;
    clearTimeout(timerToast);
    timerToast = setTimeout(() => { t.hidden = true; }, erro ? 7000 : 3500);
  }

  function erro(e) {
    console.error(e);
    toast((e && e.message) || String(e), true);
  }

  /* -------------------------- resolução dos dados -------------------------- */

  const TODAS = () => estado.dados.config.plantaTodas;

  /**
   * Cascata: a planta e, depois, as anteriores (da mais próxima para a menor) — o que é
   * definido na ER P vale para ER M, ER G e ER GG, a não ser que a planta tenha linha própria.
   */
  function cascata(planta) {
    const ids = estado.dados.plantas.map((p) => p.id);
    const i = ids.indexOf(planta);
    return i < 0 ? [planta] : ids.slice(0, i + 1).reverse();
  }

  function movimentoDe(ciclo, planta, id) {
    const c = estado.dados.movimentos[ciclo] || {};
    const achada = cascata(planta).find((p) => c[p] && c[p][id]);
    return (achada && c[achada][id]) || (c[TODAS()] && c[TODAS()][id]) || null;
  }

  /** Painéis de uma planta: por seção, vale a planta mais próxima na cascata que tiver a seção; senão "TODAS". */
  function paineisDe(ciclo, planta) {
    const c = estado.dados.paineis[ciclo] || {};
    const todas = c[TODAS()] || [];
    const out = {};
    Object.keys(estado.dados.secoes).forEach((s) => {
      const daSecao = (p) => (c[p] || []).filter((x) => x.secao === s);
      const achada = cascata(planta).find((p) => daSecao(p).length);
      out[s] = achada ? daSecao(achada) : todas.filter((p) => p.secao === s);
    });
    return out;
  }

  /** Linhas da aba Painéis para a planilha base. */
  function linhasPaineis(ciclo, plantas) {
    const todasAsPlantas = estado.dados.plantas.length === plantas.length;
    const c = estado.dados.paineis[ciclo] || {};
    if (todasAsPlantas) {
      return Object.keys(c).reduce((acc, planta) => acc.concat(c[planta].map((p) => Object.assign({ planta }, p))), []);
    }
    return plantas.reduce((acc, planta) => {
      const r = paineisDe(ciclo, planta);
      Object.keys(r).forEach((s) => r[s].forEach((p) => acc.push(Object.assign({}, p, { planta }))));
      return acc;
    }, []);
  }

  /** Classificação e GMV esperado de um movimento (texto da etiqueta) no ciclo, ou null. */
  function tipoDe(ciclo, texto) {
    const c = (estado.dados.tiposMovimento || {})[ciclo] || {};
    return c[Render.chaveEtiqueta(texto)] || null;
  }

  /**
   * Linhas da aba Tipos de movimento para a planilha base: as já classificadas no ciclo e as demais
   * etiquetas dele (das plantas escolhidas), para o usuário só completar.
   */
  function linhasTipos(ciclo, plantas) {
    const linhas = {};
    Object.values((estado.dados.tiposMovimento || {})[ciclo] || {}).forEach((t) => { linhas[Render.chaveEtiqueta(t.texto)] = t; });
    const c = estado.dados.movimentos[ciclo] || {};
    Object.keys(c).filter((p) => p === TODAS() || plantas.indexOf(p) >= 0).forEach((p) => {
      Object.keys(c[p]).forEach((id) => c[p][id].etiquetas.forEach((e) => {
        const k = Render.chaveEtiqueta(e.texto);
        if (k && !linhas[k]) linhas[k] = { texto: String(e.texto).trim(), classificacao: '', gmv: null, observacao: '' };
      }));
    });
    return Object.values(linhas).sort((x, y) => x.texto.localeCompare(y.texto, 'pt-BR'));
  }

  const plantaAtual = () => estado.dados && estado.dados.plantas.find((p) => p.id === estado.planta);

  /* ------------------------------- carga ---------------------------------- */

  async function carregar(preferencias) {
    carregando(true, 'Carregando dados da planilha…');
    try {
      const dados = await chamar('getDados');
      if (dados.precisaConfigurar) {
        mostrarConfiguracao(dados.mensagem);
        return;
      }
      aplicarDados(dados, preferencias || {});
      Validacao.recarregar();
    } catch (e) {
      erro(e);
    } finally {
      carregando(false);
    }
  }

  function aplicarDados(dados, pref) {
    estado.dados = dados;
    $('telaConfig').hidden = true;
    svg.toggleAttribute('hidden', false); // SVG não tem a propriedade .hidden

    // O app abre sem ciclo (planta limpa, sem cores nem etiquetas) até o usuário escolher um.
    const cicloPref = 'ciclo' in pref ? pref.ciclo : estado.ciclo;
    estado.ciclo = dados.ciclos.indexOf(cicloPref) >= 0 ? cicloPref : '';
    const plantaPref = pref.planta || estado.planta || memoria.ler('planta');
    estado.planta = dados.plantas.some((p) => p.id === plantaPref) ? plantaPref : (dados.plantas[0] || {}).id || '';
    estado.ajustes = {};

    $('avisoLocal').hidden = !dados.modoLocal;
    const link = $('lnkPlanilha');
    link.hidden = !dados.planilhaUrl;
    if (dados.planilhaUrl) link.href = dados.planilhaUrl;

    montarCiclos();
    montarAbas();
    montarLegenda();
    montarAvisos(dados.avisos || []);
    Editor.sincronizar(plantaAtual());
    desenhar();
  }

  function mostrarConfiguracao(mensagem) {
    svg.toggleAttribute('hidden', true);
    $('telaConfig').hidden = false;
    $('msgConfig').textContent = mensagem || 'Crie as abas Movimentos, Painéis e Layout para começar.';
  }

  async function configurar() {
    carregando(true, 'Criando abas na planilha…');
    try {
      const r = await chamar('configurarPlanilha');
      toast(r.mensagem);
      await carregar();
    } catch (e) {
      erro(e);
    } finally {
      carregando(false);
    }
  }

  /* ------------------------------ controles ------------------------------- */

  function montarCiclos() {
    const sel = $('selCiclo');
    sel.textContent = '';
    if (!estado.dados.ciclos.length) {
      sel.appendChild(new Option('(nenhum ciclo na planilha)', ''));
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    sel.appendChild(new Option('Sem ciclo (planta limpa)', '', false, !estado.ciclo));
    estado.dados.ciclos.forEach((c) => sel.appendChild(new Option(c, c, false, c === estado.ciclo)));
  }

  function montarAbas() {
    const box = $('abasPlanta');
    box.textContent = '';
    estado.dados.plantas.forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'aba';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(p.id === estado.planta));
      b.textContent = p.nome;
      b.addEventListener('click', () => trocarPlanta(p.id));
      box.appendChild(b);
    });
  }

  function montarLegenda() {
    const box = $('legenda');
    box.textContent = '';
    const rotulo = document.createElement('span');
    rotulo.className = 'rotulo';
    rotulo.textContent = 'Marcas';
    box.appendChild(rotulo);
    const marcas = estado.dados.marcas;
    Object.keys(marcas).filter((cod) => cod !== 'NEUTRO').forEach((cod) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (estado.filtro && estado.filtro !== cod ? ' inativo' : '');
      chip.setAttribute('aria-pressed', String(estado.filtro === cod));
      chip.title = 'Mostrar só ' + marcas[cod].nome;
      const cor = document.createElement('span');
      cor.className = 'cor';
      cor.style.background = Render.corDaTela(marcas[cod].etiqueta, 'etiqueta');
      chip.appendChild(cor);
      chip.appendChild(document.createTextNode(marcas[cod].nome));
      chip.addEventListener('click', () => {
        estado.filtro = estado.filtro === cod ? '' : cod;
        estado.filtroEtiqueta = '';
        estado.filtroClassificacao = '';
        montarLegenda();
        desenhar();
      });
      box.appendChild(chip);
    });
    if (estado.filtroEtiqueta || estado.filtroClassificacao) {
      // Etiqueta (ou classificação) escolhida no Analytics: chip para voltar a ver todas.
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip chip-etiqueta';
      chip.setAttribute('aria-pressed', 'true');
      chip.title = 'Voltar a mostrar todas as etiquetas';
      chip.textContent = (estado.filtroEtiqueta ? 'Só a etiqueta: ' + estado.filtroEtiqueta
        : 'Só ' + nomeClassificacao(estado.filtroClassificacao)) + ' ✕';
      chip.addEventListener('click', () => (estado.filtroEtiqueta
        ? alternarFiltroEtiqueta(estado.filtroEtiqueta) : alternarFiltroClassificacao(estado.filtroClassificacao)));
      box.appendChild(chip);
    } else if (estado.filtro) {
      const dica = document.createElement('span');
      dica.className = 'dica';
      dica.textContent = 'Clique de novo para ver todas as marcas.';
      box.appendChild(dica);
    }
  }

  function montarAvisos(avisos) {
    const box = $('avisos');
    box.hidden = !avisos.length;
    if (!avisos.length) return;
    box.querySelector('summary').textContent = avisos.length + (avisos.length === 1 ? ' aviso' : ' avisos') + ' na planilha';
    const ul = box.querySelector('ul');
    ul.textContent = '';
    avisos.forEach((a) => {
      const li = document.createElement('li');
      li.textContent = a;
      ul.appendChild(li);
    });
  }

  function trocarPlanta(id) {
    if (id === estado.planta) return;
    if (Object.keys(estado.ajustes).length && !window.confirm('Há ajustes de etiquetas não salvos nesta planta. Descartar?')) return;
    if (!Editor.podeSair()) return;
    estado.ajustes = {};
    estado.planta = id;
    estado.zoom = { k: 1, x: 0, y: 0 };
    memoria.gravar('planta', id);
    Editor.sincronizar(plantaAtual());
    montarAbas();
    atualizarBarraEdicao();
    desenhar();
  }

  /** Troca entre as etiquetas na planta e a visão simplificada (fichas ao lado da planta). */
  function trocarVisao(visao) {
    if (visao === estado.visao) return;
    if (Object.keys(estado.ajustes).length && !window.confirm('Há ajustes de etiquetas não salvos nesta planta. Descartar?')) return;
    estado.ajustes = {};
    estado.visao = visao;
    estado.edicao = estado.edicao && visao === 'planta'; // as fichas da visão simplificada não se ajustam
    estado.zoom = { k: 1, x: 0, y: 0 };
    memoria.gravar('visao', visao);
    marcarVisao();
    atualizarBarraEdicao();
    desenhar();
  }

  function marcarVisao() {
    document.querySelectorAll('#abasVisao .aba').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.visao === estado.visao)));
    // Na visão simplificada as fichas ficam no arranjo por tipo: não há o que ajustar.
    const simplificada = estado.visao === 'simplificada';
    $('btnEditar').disabled = simplificada;
    $('btnEditar').title = simplificada ? 'Na visão simplificada as fichas ficam organizadas por tipo de móvel' : '';
  }

  /* ------------------------------- desenho -------------------------------- */

  /** Contexto do desenho da tela (também usado para gerar o PNG só da planta). */
  function contextoDesenho() {
    const construcao = Editor.contexto();
    const planta = construcao ? construcao.planta : plantaAtual();
    if (!planta) return null;
    const semConteudo = !!construcao && !construcao.mostrarCiclo;
    return {
      dados: estado.dados,
      planta,
      ciclo: estado.ciclo,
      filtro: estado.filtro,
      filtroEtiqueta: construcao ? '' : etiquetasDoFiltro(),
      ajustes: estado.ajustes,
      escalaEtiquetas: construcao ? 1 : tamanhoEtiquetas() / 100,
      edicao: estado.edicao,
      visao: construcao ? 'planta' : estado.visao, // a construção é sempre sobre a planta
      // Na tela, os painéis do slide ficam no menu da esquerda (na construção, no slide, como no PNG).
      paineis: !!construcao,
      // No modo construção os móveis ficam sem cor e sem etiqueta (a menos que se peça para mostrar o ciclo).
      obterMovimento: (m) => (semConteudo ? null : movimentoDe(estado.ciclo, planta.id, m.id)),
      obterPaineis: () => {
        const p = paineisDe(estado.ciclo, planta.id);
        if (semConteudo) p.CALLOUT = [];
        return p;
      },
      selecionado: construcao ? construcao.selecionado : '',
      grade: construcao ? construcao.grade : false,
      referencia: construcao ? construcao.referencia : null,
      escuro: document.documentElement.dataset.tema === 'escuro',
    };
  }

  function desenhar() {
    const ctx = contextoDesenho();
    if (!ctx) return;
    svg.classList.toggle('construindo', !!Editor.contexto());
    // Marcadores dos comentários abertos (só na validação e fora da construção).
    if (!Editor.contexto()) ctx.comentarios = Validacao.marcadores();
    const r = Render.desenhar(svg, ctx);
    estado.tela = r.tela;
    estado.simbolos = r.simbolos;
    destacarMovel('');
    Editor.aposDesenhar(r);
    estado.grupos = r.grupos;
    if (estado.edicao) ativarArraste();
    aplicarZoom();
    atualizarAnalytics();
    atualizarPainelLoja();
    Validacao.atualizar();
  }

  /* --------------------------------- zoom --------------------------------- */

  const ZOOM_MAX = 6;

  /**
   * Aproxima a planta mudando o viewBox do slide. As etiquetas crescem junto com a planta (para
   * ler melhor); as caixas de destaque encolhem na mesma proporção (em volta do ponto da
   * linha-guia) e continuam do mesmo tamanho na tela. No modo construção o zoom fica desligado.
   */
  function aplicarZoom() {
    const z = estado.zoom;
    const ativo = !Editor.contexto();
    if (!ativo) Object.assign(z, { k: 1, x: 0, y: 0 });
    const W = estado.tela.w;
    const H = estado.tela.h;
    const w = W / z.k;
    const h = H / z.k;
    z.x = Math.max(0, Math.min(z.x, W - w));
    z.y = Math.max(0, Math.min(z.y, H - h));
    svg.setAttribute('viewBox', [z.x, z.y, w, h].join(' '));
    svg.style.setProperty('--zoom', z.k);
    svg.classList.toggle('com-zoom', z.k > 1);
    const s = 1 / z.k;
    svg.querySelectorAll('.etq-zoom').forEach((g) => {
      if (z.k === 1) { g.removeAttribute('transform'); return; }
      const px = +g.getAttribute('data-px');
      const py = +g.getAttribute('data-py');
      g.setAttribute('transform', 'translate(' + px + ',' + py + ') scale(' + s + ') translate(' + -px + ',' + -py + ')');
    });
    if ($('zoomControles')) {
      $('zoomControles').hidden = !ativo || !estado.dados;
      $('zoomNivel').textContent = Math.round(z.k * 100) + '%';
      $('zoomMenos').disabled = z.k <= 1;
      $('zoomMais').disabled = z.k >= ZOOM_MAX;
    }
  }

  /** Zoom para o fator k, mantendo parado o ponto (cx, cy) do slide (por padrão, o centro da área visível). */
  function zoomPara(k, cx, cy) {
    const z = estado.zoom;
    const novo = Math.max(1, Math.min(ZOOM_MAX, k));
    if (cx === undefined) {
      cx = z.x + estado.tela.w / z.k / 2;
      cy = z.y + estado.tela.h / z.k / 2;
    }
    z.x = cx - (cx - z.x) * (z.k / novo);
    z.y = cy - (cy - z.y) * (z.k / novo);
    z.k = novo;
    aplicarZoom();
  }

  /** Roda do mouse, arrastar para mover a planta aproximada e pinça com dois dedos. */
  function ligarZoom() {
    svg.addEventListener('wheel', (ev) => {
      if (!estado.dados || Editor.contexto()) return;
      ev.preventDefault();
      const p = pontoSvg(ev);
      zoomPara(estado.zoom.k * Math.exp(-ev.deltaY * (ev.deltaMode ? 0.05 : 0.0015)), p.x, p.y);
    }, { passive: false });

    const toques = new Map(); // pointerId → {x, y} na tela
    let gesto = null;
    svg.addEventListener('pointerdown', (ev) => {
      if (!estado.dados || Editor.contexto() || ev.button > 0) return;
      if (estado.edicao && ev.target.closest('.arrastavel')) return; // arrastando uma etiqueta
      toques.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      gesto = { movel: false, zoom: Object.assign({}, estado.zoom), ctm: svg.getScreenCTM(), toques: new Map(toques) };
    });
    svg.addEventListener('pointermove', (ev) => {
      if (!gesto || !toques.has(ev.pointerId)) return;
      toques.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      // Captura só quando vira arraste: capturar no pointerdown tiraria o alvo do clique no móvel.
      const capturar = () => toques.forEach((_, id) => { try { svg.setPointerCapture(id); } catch (e) { /* ponteiro já solto */ } });
      // O slide ocupa a área toda e o desenho fica centralizado nela: converte pela matriz do início do gesto.
      const porPx = 1 / gesto.ctm.a; // unidades do slide por pixel
      const origem = { x: gesto.ctm.e + gesto.zoom.x * gesto.ctm.a, y: gesto.ctm.f + gesto.zoom.y * gesto.ctm.d }; // canto do zoom na tela
      const pts = Array.from(toques.values());
      const ini = Array.from(gesto.toques.values());
      if (pts.length >= 2 && ini.length >= 2) {
        const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) || 1;
        const meio = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
        const m0 = meio(ini[0], ini[1]);
        const m1 = meio(pts[0], pts[1]);
        const k = Math.max(1, Math.min(ZOOM_MAX, gesto.zoom.k * dist(pts[0], pts[1]) / dist(ini[0], ini[1])));
        // O ponto do slide que estava sob o meio dos dedos continua sob o meio dos dedos.
        const cx = gesto.zoom.x + (m0.x - origem.x) * porPx;
        const cy = gesto.zoom.y + (m0.y - origem.y) * porPx;
        const porPxNovo = porPx * gesto.zoom.k / k;
        Object.assign(estado.zoom, { k, x: cx - (m1.x - origem.x) * porPxNovo, y: cy - (m1.y - origem.y) * porPxNovo });
        gesto.movel = true;
        capturar();
        aplicarZoom();
        return;
      }
      const dx = ev.clientX - ini[0].x;
      const dy = ev.clientY - ini[0].y;
      if (!gesto.movel && Math.hypot(dx, dy) < 5) return;
      gesto.movel = true;
      if (gesto.zoom.k === 1) return;
      capturar();
      svg.classList.add('arrastando');
      Object.assign(estado.zoom, { x: gesto.zoom.x - dx * porPx, y: gesto.zoom.y - dy * porPx });
      aplicarZoom();
    });
    const soltar = (ev) => {
      if (!toques.has(ev.pointerId)) return;
      toques.delete(ev.pointerId);
      svg.classList.remove('arrastando');
      if (!gesto) return;
      if (gesto.movel) gesto.ignorarClique = true;
      // Ao tirar um dedo da pinça, o dedo que ficou recomeça o arraste dali.
      if (toques.size) {
        gesto = { movel: true, ignorarClique: true, zoom: Object.assign({}, estado.zoom), ctm: svg.getScreenCTM(), toques: new Map(toques) };
      } else {
        const fim = gesto;
        setTimeout(() => { if (gesto === fim) gesto = null; }, 0);
      }
    };
    svg.addEventListener('pointerup', soltar);
    svg.addEventListener('pointercancel', soltar);

    // Clique (sem arrastar) num móvel ou na etiqueta dele: mostra a estratégia do móvel.
    svg.addEventListener('click', (ev) => {
      const arrastou = gesto && gesto.ignorarClique;
      gesto = null;
      if (arrastou || !estado.dados || Editor.contexto()) return;
      if (estado.edicao && ev.target.closest('.arrastavel')) return;
      const marcador = ev.target.closest('.marcador-comentario');
      if (marcador) { Validacao.focar(marcador.getAttribute('data-movel')); return; }
      const alvo = ev.target.closest('[data-movel]');
      if (!alvo) return;
      const id = alvo.getAttribute('data-movel').split('/')[0];
      if (!Validacao.aoClicarMovel(id)) abrirMovel(id);
    });
  }

  /* ------------------------- destaque ao passar o mouse --------------------- */

  let destacado = ''; // móvel com as etiquetas destacadas ('' = nenhum)

  /** Destaca de leve as etiquetas (e linhas-guia) do móvel; as dos outros ficam um pouco apagadas. */
  function destacarMovel(id) {
    if (id === destacado) return;
    destacado = id;
    svg.classList.toggle('destacando', !!id);
    svg.querySelectorAll('.destaque').forEach((n) => n.classList.remove('destaque'));
    if (!id) return;
    svg.querySelectorAll('[data-movel-base], .movel').forEach((n) => {
      if ((n.getAttribute('data-movel-base') || n.getAttribute('data-movel')) === id) n.classList.add('destaque');
    });
  }

  /** Mouse sobre um móvel (ou uma etiqueta dele): destaca as etiquetas que estão nele. */
  function ligarDestaque() {
    svg.addEventListener('pointerover', (ev) => {
      // Fora do mouse (toque), no ajuste de etiquetas e na construção não há destaque.
      if (ev.pointerType !== 'mouse' || estado.edicao || Editor.contexto() || svg.classList.contains('arrastando')) {
        destacarMovel('');
        return;
      }
      const alvo = ev.target.closest('.movel, .grupo-etiquetas');
      destacarMovel(alvo ? alvo.getAttribute('data-movel-base') || alvo.getAttribute('data-movel') : '');
    });
    svg.addEventListener('pointerleave', () => destacarMovel(''));
  }

  /* --------------------------- ajuste de etiquetas ------------------------- */

  function pontoSvg(ev) {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function ativarArraste() {
    estado.grupos.forEach((gr) => {
      // Cada pilha se move sozinha: na gôndola, mesas, totem e móvel make, o ajuste é do espaço (id da
      // pilha, "GONDOLA 1/PONTA-A"); nos móveis de um espaço só, do móvel. No toque, o arraste não rola a página.
      gr.elemento.addEventListener('touchstart', (ev) => ev.preventDefault(), { passive: false });
      gr.elemento.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        const alvo = gr.elemento;
        alvo.setPointerCapture(ev.pointerId);
        const inicio = pontoSvg(ev);
        let dx = 0;
        let dy = 0;
        const mover = (e) => {
          const p = pontoSvg(e);
          dx = p.x - inicio.x;
          dy = p.y - inicio.y;
          alvo.setAttribute('transform', 'translate(' + dx + ',' + dy + ')');
        };
        const soltar = () => {
          alvo.removeEventListener('pointermove', mover);
          alvo.removeEventListener('pointerup', soltar);
          alvo.removeEventListener('pointercancel', soltar);
          if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
            alvo.removeAttribute('transform');
            return;
          }
          if (gr.modoFixo) {
            // Posição fixa: canto de baixo à esquerda da etiqueta mais baixa (a pilha cresce para cima).
            estado.ajustes[gr.id] = { x: Math.round(gr.x + dx), y: Math.round(gr.y + dy + gr.h) };
          } else {
            const base = gr.espacos ? gr.ajusteMovel : { x: 0, y: 0 }; // a pilha guarda só o que passa do ajuste do móvel
            estado.ajustes[gr.id] = { x: Math.round(gr.x + dx - gr.baseX - base.x), y: Math.round(gr.y + dy - gr.baseY - base.y) };
          }
          atualizarBarraEdicao();
          desenhar();
        };
        alvo.addEventListener('pointermove', mover);
        alvo.addEventListener('pointerup', soltar);
        alvo.addEventListener('pointercancel', soltar);
      });
    });
  }

  /* Tamanho das etiquetas na planta (em %), por planta: o salvo na linha LOJA do Layout ou o ainda não salvo. */
  const TAMANHO_ETQ = { min: 60, max: 250, passo: 10 };
  function tamanhoEtiquetas() {
    const a = estado.ajustes.LOJA;
    if (a && a.escala) return a.escala;
    const p = plantaAtual();
    return (p && p.loja && p.loja.escalaEtiquetas) || 100;
  }
  function mudarTamanhoEtiquetas(valor) {
    const p = plantaAtual();
    if (!p) return;
    const v = Math.max(TAMANHO_ETQ.min, Math.min(TAMANHO_ETQ.max, Math.round(valor / 5) * 5));
    if (v === ((p.loja && p.loja.escalaEtiquetas) || 100)) delete estado.ajustes.LOJA;
    else estado.ajustes.LOJA = { escala: v };
    atualizarBarraEdicao();
    desenhar();
  }

  function atualizarBarraEdicao() {
    $('barraEdicao').hidden = !estado.edicao;
    const tam = tamanhoEtiquetas();
    $('etqTamanho').textContent = tam + '%';
    $('etqMenor').disabled = tam <= TAMANHO_ETQ.min;
    $('etqMaior').disabled = tam >= TAMANHO_ETQ.max;
    $('btnEditar').setAttribute('aria-pressed', String(estado.edicao));
    const n = Object.keys(estado.ajustes).length;
    $('qtdAjustes').textContent = n ? '(' + n + (n === 1 ? ' alteração não salva)' : ' alterações não salvas)') : '';
    $('btnSalvarAjustes').disabled = !n;
    $('btnDescartar').disabled = !n;
  }

  function alternarEdicao() {
    if (!estado.edicao && Editor.ativo()) Editor.fechar();
    if (!estado.edicao && Editor.ativo()) return;
    if (estado.edicao && Object.keys(estado.ajustes).length && !window.confirm('Sair sem salvar os ajustes?')) return;
    estado.edicao = !estado.edicao;
    estado.ajustes = {};
    atualizarBarraEdicao();
    desenhar();
  }

  function autoOrganizar() {
    const planta = plantaAtual();
    planta.moveis.forEach((m) => {
      estado.ajustes[m.id] = { x: 0, y: 0 };
      Object.keys(m.ajustesEspacos || {}).forEach((k) => { estado.ajustes[m.id + '/' + k] = { x: 0, y: 0 }; });
    });
    (estado.grupos || []).forEach((gr) => { if (gr.espacos) estado.ajustes[gr.id] = { x: 0, y: 0 }; });
    atualizarBarraEdicao();
    desenhar();
  }

  /**
   * Ajustes a salvar. As posições ficam fixas (valem em qualquer ciclo): numa planta que ainda guarda
   * deslocamentos (sem largura do slide), todas as pilhas ficam na posição em que estão agora (as
   * ajustadas e as automáticas, para o desenho não mudar), e a largura do slide atual é salva junto;
   * os ajustes de pilhas que não aparecem neste ciclo são zerados.
   */
  function ajustesParaSalvar(planta) {
    const tamanho = tamanhoEtiquetas();
    if (planta.loja && planta.loja.slide) {
      return estado.ajustes.LOJA ? estado.ajustes : Object.assign({ LOJA: { escala: tamanho } }, estado.ajustes);
    }
    const ajustes = { LOJA: { escala: tamanho, slide: estado.tela.w } };
    planta.moveis.forEach((m) => {
      ajustes[m.id] = { x: 0, y: 0 };
      Object.keys(m.ajustesEspacos || {}).forEach((k) => { ajustes[m.id + '/' + k] = { x: 0, y: 0 }; });
    });
    (estado.grupos || []).forEach((gr) => { ajustes[gr.id] = { x: Math.round(gr.x), y: Math.round(gr.y + gr.h) }; });
    return ajustes;
  }

  async function salvarAjustes() {
    const planta = plantaAtual();
    carregando(true, 'Salvando posições…');
    try {
      estado.ajustes = ajustesParaSalvar(planta);
      const r = await chamar('salvarAjustesEtiquetas', planta.id, estado.ajustes);
      const L = estado.ajustes.LOJA;
      if (L) planta.loja = Object.assign({}, planta.loja, { escalaEtiquetas: L.escala }, L.slide ? { slide: L.slide } : {});
      planta.moveis.forEach((m) => {
        Object.keys(estado.ajustes).forEach((id) => {
          const a = estado.ajustes[id];
          if (id === m.id) {
            m.ajusteX = a.x;
            m.ajusteY = a.y;
          } else if (id.indexOf(m.id + '/') === 0) {
            const k = id.slice(m.id.length + 1);
            m.ajustesEspacos = Object.assign({}, m.ajustesEspacos);
            if (a.x || a.y) m.ajustesEspacos[k] = { x: a.x, y: a.y };
            else delete m.ajustesEspacos[k];
          }
        });
      });
      estado.ajustes = {};
      atualizarBarraEdicao();
      desenhar();
      toast('Posições salvas (' + r.atualizados + ' móveis).');
    } catch (e) {
      erro(e);
    } finally {
      carregando(false);
    }
  }

  /**
   * Ajustes de etiqueta de uma planta, já com os não salvos (estado.ajustes) quando é a planta aberta:
   * { tamanho, moveis: { ID: { x, y, espacos: { 'PONTA-A': { x, y } } } } } (só os que têm ajuste).
   */
  function ajustesDaPlanta(p) {
    const pendentes = p.id === (plantaAtual() || {}).id ? estado.ajustes : {};
    const tamanho = (pendentes.LOJA && pendentes.LOJA.escala) || (p.loja && p.loja.escalaEtiquetas) || 100;
    const moveis = {};
    p.moveis.forEach((m) => {
      const a = pendentes[m.id] || { x: m.ajusteX || 0, y: m.ajusteY || 0 };
      const espacos = Object.assign({}, m.ajustesEspacos);
      Object.keys(pendentes).forEach((id) => {
        if (id.indexOf(m.id + '/') !== 0) return;
        const k = id.slice(m.id.length + 1);
        if (pendentes[id].x || pendentes[id].y) espacos[k] = { x: pendentes[id].x, y: pendentes[id].y };
        else delete espacos[k];
      });
      if (!a.x && !a.y && !Object.keys(espacos).length) return;
      moveis[m.id] = { x: a.x || 0, y: a.y || 0 };
      if (Object.keys(espacos).length) moveis[m.id].espacos = espacos;
    });
    return { tamanho, slide: (pendentes.LOJA && pendentes.LOJA.slide) || (p.loja && p.loja.slide) || 0, moveis };
  }

  /** Baixa a posição das etiquetas de todas as plantas (para virar a base do código, em Layouts.gs). */
  function baixarPosicoes() {
    const plantas = {};
    estado.dados.plantas.forEach((p) => { plantas[p.id] = ajustesDaPlanta(p); });
    const L = [
      '{',
      '  "formato": "plano-varejo-etiquetas",',
      '  "versao": 1,',
      '  "geradoEm": ' + JSON.stringify(new Date().toISOString()) + ',',
      '  "ciclo": ' + JSON.stringify(estado.ciclo || '') + ',',
      '  "legenda": "por planta: tamanho das etiquetas (%), largura do slide (px) e, por móvel, a posição da pilha (x, y). Com slide: posição fixa = canto de baixo à esquerda da etiqueta mais baixa, em px do slide; sem slide (0): deslocamento a partir da posição automática. espacos = pilha de cada espaço",',
      '  "plantas": {',
    ];
    const ids = Object.keys(plantas);
    ids.forEach((id, i) => {
      const p = plantas[id];
      const movs = Object.keys(p.moveis);
      L.push('    ' + JSON.stringify(id) + ': {');
      L.push('      "tamanho": ' + p.tamanho + ',');
      L.push('      "slide": ' + p.slide + ',');
      L.push('      "moveis": {' + (movs.length ? '' : '}'));
      movs.forEach((m, j) => L.push('        ' + JSON.stringify(m) + ': ' + JSON.stringify(p.moveis[m]) + (j < movs.length - 1 ? ',' : '')));
      if (movs.length) L.push('      }');
      L.push('    }' + (i < ids.length - 1 ? ',' : ''));
    });
    L.push('  }', '}', '');
    const data = new Date().toISOString().slice(0, 10);
    Planilha.baixarBlob(new Blob([L.join('\n')], { type: 'application/json' }), 'posicoes-etiquetas-' + data + '.json');
    toast(Object.keys(estado.ajustes).length ? 'Posições baixadas (inclui as alterações ainda não salvas).' : 'Posições das etiquetas baixadas.');
  }

  /* ------------- contas do espaço (Analytics e slide da estratégia) ------------- */

  const COR_SEM_MARCA = '#C4C4C4';
  const COR_OUTRA = '#8A8A8A';
  /** Móveis que ficam fora da conta do espaço: atendimento, itens fora da planta, móveis de parede e make. */
  const FORA_DO_ESPACO = ['EXTRA', 'CAIXA', 'GONDOLA_PAREDE', 'MAKE'];
  /**
   * Espaços de VM (comunicação visual): não são espaço de exposição e ficam numa conta à parte. São o
   * PDV móvel, o totem (os três painéis), o balcão recepção e o verso da mesa destaque (espaço vm).
   */
  const MOVEIS_VM = ['CUBO', 'TOTEM', 'VITRINE_L'];
  /** Pirâmide: as etiquetas dividem o espaço (duas etiquetas = ½ espaço para cada). */
  const DIVIDE_ENTRE_ETIQUETAS = ['PIRAMIDE'];

  /**
   * Espaços de cada móvel da planta no ciclo (a conta é por quantidade de espaços, não por metros):
   *  - gôndola: cada ponta e cada meio é um espaço (meio dividido = ½ espaço para cada metade);
   *  - mesas: cada frente é um espaço de exposição e o verso, um espaço de VM;
   *  - totem: cada painel é um espaço de VM; PDV móvel e balcão recepção: um espaço de VM;
   *  - demais móveis: o móvel inteiro é um espaço (na pirâmide, dividido entre as etiquetas).
   * Ficam de fora o móvel de atendimento, os itens fora da planta, os móveis de parede e o móvel make.
   * Gôndola, mesas e totem: cada parte usa a linha do próprio espaço (sem ela, fica sem marca).
   * @return {Array<{movel, espaco, peso: number, vm: boolean, divide: boolean, marcas: string[],
   *   etiquetas: Array<{texto, marca}>}>}  peso = quanto do espaço a parte vale (1 ou ½)
   */
  function partesDeEspaco(planta, ciclo) {
    const linha = (x) => movimentoDe(ciclo, planta.id, x);
    const valida = (i) => !!(i && (i.marca || i.etiquetas.length || i.simbolo));
    const marcasDe = (valor) => {
      if (!valor || valor === 'NEUTRO') return ['NEUTRO'];
      return String(valor).split('+').map((p) => p.trim()).map((p) => (estado.dados.marcas[p] ? p : 'OUTRA'));
    };
    const partes = [];
    const parte = (m, espaco, i) => {
      const marca = i && i.marca && i.marca !== 'NEUTRO' ? i.marca : '';
      partes.push({
        movel: m, espaco, marcas: marcasDe(marca),
        peso: espaco && /^MEIO-[AB]-\d$/.test(espaco.id) ? 0.5 : 1,
        vm: MOVEIS_VM.indexOf(m.tipo) >= 0 || !!(espaco && espaco.vm),
        divide: DIVIDE_ENTRE_ETIQUETAS.indexOf(m.tipo) >= 0,
        etiquetas: ((i && i.etiquetas) || []).map((e) => ({ texto: e.texto, marca: e.marca || marca })),
      });
    };
    planta.moveis.forEach((m) => {
      if (FORA_DO_ESPACO.indexOf(m.tipo) >= 0) return;
      const propria = (id) => {
        const meio = /^MEIO-[AB]-\d$/.test(id) ? m.id + '/' + id.slice(0, 6) : null;
        const achada = [m.id + '/' + id, meio].filter(Boolean).find((x) => valida(linha(x)));
        return achada ? linha(achada) : null;
      };
      if (m.tipo === 'GONDOLA') {
        const div = ['A', 'B'].filter((l) => String(m.dividido || '').toUpperCase().indexOf(l) >= 0
          || valida(linha(m.id + '/MEIO-' + l + '-2')) || valida(linha(m.id + '/MEIO-' + l + '-1'))).join('');
        Render.espacos(Object.assign({}, m, { dividido: div })).forEach((e) => parte(m, e, propria(e.id)));
        return;
      }
      const blocos = Render.espacos(m); // frentes e verso das mesas, painéis do totem
      if (blocos.length) {
        blocos.forEach((e) => parte(m, e, propria(e.id)));
        return;
      }
      parte(m, null, linha(m.id));
    });
    return partes;
  }

  /** Mesmo texto de etiqueta, com variações de maiúsculas e espaços. */
  const chaveEtiqueta = Render.chaveEtiqueta;

  /**
   * Movimentos de uma parte, cada um com quanto do espaço ele leva: o peso da parte inteiro (um espaço
   * com dois movimentos conta nos dois) ou, na pirâmide, o peso dividido entre as etiquetas.
   * @return {Array<{chave, etiquetas: Array<{texto, marca}>, valor: number}>}
   */
  function movimentosDaParte(p) {
    const lista = [];
    p.etiquetas.forEach((e) => {
      const k = chaveEtiqueta(e.texto);
      if (!k) return;
      const g = lista.find((x) => x.chave === k);
      if (g) g.etiquetas.push(e);
      else lista.push({ chave: k, etiquetas: [e] });
    });
    lista.forEach((g) => { g.valor = p.divide ? p.peso / lista.length : p.peso; });
    return lista;
  }

  /**
   * Totais em quantidade de espaços: por marca (combinação de marcas divide o espaço igualmente), por
   * etiqueta (etiquetas com o mesmo texto se juntam) e por classificação (cada espaço conta uma vez em
   * cada classificação das etiquetas dele; na pirâmide, a parte das etiquetas daquela classificação).
   */
  function resumoDeEspaco(partes) {
    const r = { total: 0, porMarca: {}, porEtiqueta: {}, porClassificacao: {}, moveis: new Set() };
    partes.forEach((p) => {
      r.total += p.peso;
      r.moveis.add(p.movel.id);
      p.marcas.forEach((mc) => { r.porMarca[mc] = (r.porMarca[mc] || 0) + p.peso / p.marcas.length; });
      const movs = movimentosDaParte(p);
      const porClasse = {};
      movs.forEach((g) => {
        const c = classificacaoDe(g.etiquetas[0].texto);
        porClasse[c] = p.divide ? (porClasse[c] || 0) + g.valor : p.peso;
      });
      Object.keys(porClasse).forEach((c) => { r.porClassificacao[c] = (r.porClassificacao[c] || 0) + porClasse[c]; });
      movs.forEach((m) => {
        const e = m.etiquetas[0];
        const g = r.porEtiqueta[m.chave] || (r.porEtiqueta[m.chave] = {
          texto: String(e.texto).trim(), espacos: 0, marcas: {}, tipo: tipoDe(estado.ciclo, e.texto), classificacao: classificacaoDe(e.texto),
        });
        g.espacos += m.valor;
        const marcas = m.etiquetas.map((x) => x.marca).filter(Boolean)
          .reduce((lista, x) => lista.concat(String(x).split('+').map((c) => c.trim())), []);
        const codigos = marcas.length ? marcas.map((c) => (estado.dados.marcas[c] ? c : 'OUTRA')) : ['NEUTRO'];
        const unicos = codigos.filter((c, i) => codigos.indexOf(c) === i);
        unicos.forEach((c) => { g.marcas[c] = (g.marcas[c] || 0) + m.valor / unicos.length; });
      });
    });
    return r;
  }

  /** Classificação de um movimento no ciclo atual: código de CLASSIFICACOES, outro texto ou SEM (sem classificação). */
  function classificacaoDe(texto) {
    const t = tipoDe(estado.ciclo, texto);
    return (t && t.classificacao) || SEM_CLASSIFICACAO;
  }
  const SEM_CLASSIFICACAO = '__SEM__';
  const COR_CLASSIFICACAO_PROPRIA = '#7C6F64';
  const nomeClassificacao = (c) => (c === SEM_CLASSIFICACAO ? 'Sem classificação'
    : (estado.dados.classificacoes || {})[c] ? estado.dados.classificacoes[c].nome : c);
  const corClassificacao = (c) => (c === SEM_CLASSIFICACAO ? COR_SEM_MARCA
    : (estado.dados.classificacoes || {})[c] ? estado.dados.classificacoes[c].cor : COR_CLASSIFICACAO_PROPRIA);
  /** Classificações na ordem da configuração, depois as próprias da planilha e, por último, "Sem classificação". */
  function ordemDasClassificacoes(presentes) {
    const fixas = Object.keys(estado.dados.classificacoes || {});
    const proprias = presentes.filter((c) => fixas.indexOf(c) < 0 && c !== SEM_CLASSIFICACAO).sort((x, y) => x.localeCompare(y, 'pt-BR'));
    return fixas.filter((c) => presentes.indexOf(c) >= 0).concat(proprias, presentes.indexOf(SEM_CLASSIFICACAO) >= 0 ? [SEM_CLASSIFICACAO] : []);
  }
  const formatoGmv = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', notation: 'compact', maximumFractionDigits: 1 });
  const formatoGmvCompleto = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const gmvCurto = (v) => formatoGmv.format(v);

  /** Etiquetas que o filtro deixa na planta: a escolhida, ou as da classificação escolhida (null = todas). */
  function etiquetasDoFiltro() {
    if (estado.filtroEtiqueta) return estado.filtroEtiqueta;
    if (!estado.filtroClassificacao || !estado.ciclo) return '';
    const textos = {};
    const c = estado.dados.movimentos[estado.ciclo] || {};
    Object.keys(c).forEach((p) => Object.keys(c[p]).forEach((id) => c[p][id].etiquetas.forEach((e) => {
      if (classificacaoDe(e.texto) === estado.filtroClassificacao) textos[chaveEtiqueta(e.texto)] = e.texto;
    })));
    const lista = Object.values(textos);
    return lista.length ? lista : ['\u0000']; // nenhuma etiqueta da classificação: tudo em cinza
  }

  const qtdEspacos = (n) => (Math.round(n * 10) / 10).toLocaleString('pt-BR') + (n === 1 ? ' espaço' : ' espaços');
  const porcento = (v, total) => (total ? Math.round((v / total) * 100) : 0) + '%';

  /** Marcas na ordem fixa da configuração; depois outras cores e, por último, "Sem marca". */
  function ordemDasMarcas() {
    return Object.keys(estado.dados.marcas).filter((c) => c !== 'NEUTRO').concat(['OUTRA', 'NEUTRO']);
  }
  const nomeMarcaPainel = (c) => (c === 'NEUTRO' ? 'Sem marca' : c === 'OUTRA' ? 'Outras cores' : estado.dados.marcas[c].nome);
  const corMarcaPainel = (c) => (c === 'NEUTRO' ? COR_SEM_MARCA : c === 'OUTRA' ? COR_OUTRA : estado.dados.marcas[c].etiqueta);

  /** Mostra na planta só onde a etiqueta aparece (clique de novo para ver todas). */
  function alternarFiltroEtiqueta(texto) {
    const igual = chaveEtiqueta(texto) === chaveEtiqueta(estado.filtroEtiqueta);
    estado.filtroEtiqueta = igual ? '' : String(texto).trim();
    estado.filtro = '';
    estado.filtroClassificacao = '';
    montarLegenda();
    desenhar();
  }

  /** Mostra na planta só os espaços com movimentos da classificação (lançamento, promoção…). */
  function alternarFiltroClassificacao(c) {
    estado.filtroClassificacao = estado.filtroClassificacao === c ? '' : c;
    estado.filtro = '';
    estado.filtroEtiqueta = '';
    montarLegenda();
    desenhar();
  }

  /* ------------------------------ analytics ------------------------------ */

  /**
   * Dados do Analytics (Analytics.desenhar): o ciclo inteiro, ER por ER — espaços, marcas, classificações,
   * espaços sem movimento e a fatia da rede que cada ER representa. Cada ER é um tamanho médio da rede:
   * nenhuma conta soma ERs. Também cada movimento com os espaços dele em cada ER. Não usa os filtros da tela.
   * O espaço de exposição e o de VM têm contas separadas (vm: a mesma estrutura, só com os espaços de VM).
   * Na classificação, cada espaço se divide entre os tipos dos movimentos dele (para as barras somarem 100%).
   */
  function dadosAnalytics(ciclo) {
    const LIVRE = '__LIVRE__';
    const plantas = estado.dados.plantas.map((p) => ({ planta: p, partes: partesDeEspaco(p, ciclo) }));
    const ordemM = ordemDasMarcas();
    const marca = (c, valor) => ({ cod: c, nome: nomeMarcaPainel(c), cor: corMarcaPainel(c), valor, filtravel: c !== 'NEUTRO' && c !== 'OUTRA' });
    /** Contas de um grupo de espaços (exposição ou VM), ER por ER. */
    const contas = (doGrupo) => {
      const ers = plantas.map(({ planta: p, partes: todas }) => {
        const partes = todas.filter(doGrupo);
        const r = resumoDeEspaco(partes);
        const porClasse = {};
        let semMovimento = 0;
        partes.forEach((pt) => {
          const movs = movimentosDaParte(pt);
          if (!movs.length) {
            semMovimento += pt.peso;
            porClasse[LIVRE] = (porClasse[LIVRE] || 0) + pt.peso;
            return;
          }
          // Cada classificação leva a fatia dos movimentos dela (na pirâmide, pelas etiquetas).
          const soma = movs.reduce((s, g) => s + g.valor, 0);
          movs.forEach((g) => {
            const c = classificacaoDe(g.etiquetas[0].texto);
            porClasse[c] = (porClasse[c] || 0) + (pt.peso * g.valor) / soma;
          });
        });
        return { id: p.id, nome: p.nome, total: r.total, semMovimento, porMarca: r.porMarca, porClasse, porEtiqueta: r.porEtiqueta };
      });
      const movs = {};
      ers.forEach((e) => Object.keys(e.porEtiqueta).forEach((k) => {
        const g = e.porEtiqueta[k];
        const m = movs[k] || (movs[k] = { chave: k, texto: g.texto, porEr: {}, marcas: {}, nErs: 0, tipo: g.tipo, classificacao: g.classificacao });
        m.porEr[e.id] = g.espacos;
        m.nErs += 1;
        Object.keys(g.marcas).forEach((c) => { m.marcas[c] = (m.marcas[c] || 0) + g.marcas[c] / g.espacos; });
      }));
      Object.values(movs).forEach((m) => Object.keys(m.marcas).forEach((c) => { m.marcas[c] /= m.nErs; }));
      // Cada ER é um tamanho médio da rede: nada soma ERs. As marcas de cada movimento são a média da
      // divisão dele em cada ER onde aparece; a ordem é pela maior fatia que ele tem em alguma ER.
      const fatiaMax = (m) => Math.max.apply(null, ers.map((e) => (e.total ? (m.porEr[e.id] || 0) / e.total : 0)));
      return {
        ers,
        movimentos: Object.values(movs)
          .sort((a, b) => fatiaMax(b) - fatiaMax(a) || a.texto.localeCompare(b.texto, 'pt-BR'))
          .map((m) => ({
            chave: m.chave,
            texto: m.texto,
            porEr: m.porEr,
            gmv: m.tipo && typeof m.tipo.gmv === 'number' ? m.tipo.gmv : 0,
            classe: m.classificacao === SEM_CLASSIFICACAO ? null
              : { cod: m.classificacao, nome: nomeClassificacao(m.classificacao), cor: corClassificacao(m.classificacao) },
            marcas: ordemM.filter((c) => m.marcas[c]).map((c) => marca(c, m.marcas[c])),
          })),
      };
    };
    const rede = estado.dados.config.rede || { participacao: {} };
    const enxuta = (e) => ({
      id: e.id, nome: e.nome, total: e.total, semMovimento: e.semMovimento, porMarca: e.porMarca, porClasse: e.porClasse,
      rede: rede.participacao[e.id] || 0,
    });
    const expo = contas((pt) => !pt.vm);
    const vm = contas((pt) => pt.vm);
    const classes = ordemDasClassificacoes(expo.ers.reduce((acc, e) => acc.concat(Object.keys(e.porClasse)), [])
      .filter((c, i, l) => c !== LIVRE && l.indexOf(c) === i));
    return {
      ciclo,
      erAtual: estado.planta,
      abaTipos: estado.dados.config.abas.TIPOS,
      filtroEtiqueta: chaveEtiqueta(estado.filtroEtiqueta),
      rede: { lojas: rede.lojas || 0, ficticia: !!rede.ficticia },
      ers: expo.ers.map(enxuta),
      movimentos: expo.movimentos,
      marcas: ordemM.filter((c) => expo.ers.some((e) => e.porMarca[c])).map((c) => marca(c, 0)),
      classes: classes.map((c) => ({ cod: c, nome: nomeClassificacao(c), cor: corClassificacao(c) })),
      vm: { ers: vm.ers.map(enxuta), movimentos: vm.movimentos },
      tiposDeMovel: tiposDeMovelNasPlantas(),
    };
  }

  /**
   * Legenda "O que conta como espaço": um móvel de exemplo de cada tipo que aparece nas plantas (a gôndola
   * com meio dividido entra à parte), no grupo dele — exposição, VM ou fora da conta — com os espaços que
   * ele soma (peso ½ nas metades do meio). A mesa entra nos dois grupos: as frentes e, no VM, o verso.
   * @return {Array<{chave, movel, nome, grupo: 'expo'|'vm'|'fora', verso, nota, espacos: Array<{id, nome, peso}>}>}
   */
  function tiposDeMovelNasPlantas() {
    const exemplos = {};
    estado.dados.plantas.forEach((p) => p.moveis.forEach((m) => {
      if (m.tipo === 'EXTRA') return;
      const chave = m.tipo === 'GONDOLA' && String(m.dividido || '').trim() ? 'GONDOLA/DIVIDIDA' : m.tipo;
      if (!exemplos[chave]) exemplos[chave] = m;
    }));
    const ordem = Object.keys(estado.dados.tipos || {});
    const posicao = (c) => { const i = ordem.indexOf(c.split('/')[0]); return i < 0 ? ordem.length : i; };
    const nomeDe = (m) => String((estado.dados.tipos || {})[m.tipo] || m.tipo).split(':')[0].trim();
    const espaco = (e) => ({ id: e.id, nome: e.nome.replace(/\s*\(metade (\d)\)/, '.$1'), peso: /^MEIO-[AB]-\d$/.test(e.id) ? 0.5 : 1 });
    const inteiro = [{ id: '', nome: 'Móvel inteiro', peso: 1 }];
    const lista = [];
    Object.keys(exemplos).forEach((c) => {
      const m = exemplos[c];
      const item = (grupo, espacos, extra) => lista.push(Object.assign({ chave: c, movel: m, nome: nomeDe(m), grupo, espacos, verso: false, nota: '' }, extra));
      const esp = Render.espacos(m);
      if (FORA_DO_ESPACO.indexOf(m.tipo) >= 0) item('fora', []);
      else if (m.tipo === 'MESA' || m.tipo === 'MESA_3') {
        item('expo', esp.filter((e) => !e.vm).map(espaco));
        item('vm', esp.filter((e) => e.vm).map(espaco), { verso: true });
      } else {
        const grupo = MOVEIS_VM.indexOf(m.tipo) >= 0 ? 'vm' : 'expo';
        item(grupo, esp.length ? esp.map(espaco) : inteiro, {
          nome: nomeDe(m) + (c === 'GONDOLA/DIVIDIDA' ? ' (meio dividido)' : ''),
          nota: DIVIDE_ENTRE_ETIQUETAS.indexOf(m.tipo) >= 0 ? 'Com 2 etiquetas, ½ espaço para cada' : '',
        });
      }
    });
    const grupos = ['expo', 'vm', 'fora'];
    return lista.sort((a, b) => grupos.indexOf(a.grupo) - grupos.indexOf(b.grupo)
      || posicao(a.chave) - posicao(b.chave) || (a.chave < b.chave ? -1 : 1));
  }

  /** Analytics: o dashboard ocupa o lugar da planta (a planta continua desenhada por baixo). */
  function atualizarAnalytics() {
    const painel = $('painelAnalytics');
    if (!painel) return;
    const aberto = estado.analytics && !!estado.dados && !Editor.contexto();
    painel.hidden = !aberto;
    document.body.classList.toggle('com-analytics', aberto);
    if ($('btnAnalytics')) $('btnAnalytics').setAttribute('aria-pressed', String(aberto));
    if (!aberto) return;
    $('anInfo').disabled = !estado.ciclo;
    const n = estado.dados.plantas.length;
    const planta = plantaAtual();
    $('anSub').textContent = estado.ciclo
      ? estado.ciclo + ' · ' + n + (n === 1 ? ' ER' : ' ERs') + (planta && n > 1 ? ' · em destaque: ' + planta.nome : '') : '';
    const corpo = $('anCorpo');
    if (!estado.ciclo) {
      corpo.innerHTML = '';
      novo('p', 'an-vazio', 'Escolha um ciclo no seletor para ver como o espaço está dividido.', corpo);
      return;
    }
    Analytics.desenhar(corpo, dadosAnalytics(estado.ciclo), { verNaPlanta });
  }

  function alternarAnalytics(aberto) {
    estado.analytics = aberto === undefined ? !estado.analytics : !!aberto;
    atualizarAnalytics();
  }

  /** Fecha o Analytics e mostra na planta da ER só a etiqueta, a marca ou a classificação escolhida. */
  function verNaPlanta(o) {
    estado.analytics = false;
    estado.filtro = o.marca || '';
    estado.filtroEtiqueta = o.etiqueta ? String(o.etiqueta).trim() : '';
    estado.filtroClassificacao = o.classificacao || '';
    montarLegenda();
    const antes = estado.planta;
    if (o.er && o.er !== antes) trocarPlanta(o.er);
    if (estado.planta === antes) desenhar();
  }

  /* ------------------- painel da ER (menu da esquerda) -------------------- */

  const ICONES_LOJA = {
    TV: '<svg class="lj-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M9 20.5h6M12 17v3.5"/></svg>',
    RADIO: '<svg class="lj-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M5 8 17 3M3 12h18"/><circle cx="8" cy="16.5" r="2.3"/><path d="M13 15.5h5M13 18h5"/></svg>',
  };

  /** Cor de uma etiqueta do painel: a da marca (com uma marca no filtro, as outras em cinza, como no slide). */
  function corEtiquetaPainel(marca) {
    const fora = estado.filtro && String(marca || '').split('+').map((p) => p.trim()).indexOf(estado.filtro) < 0;
    return fora ? '#8C8C8C' : corDaMarca(marca, 'etiqueta');
  }

  function chipsLoja(pai, itens) {
    const box = novo('div', 'lj-chips', null, pai);
    itens.forEach((it) => { novo('span', 'lj-chip', it.texto, box).style.background = corEtiquetaPainel(it.marca); });

  /**
   * Menu da esquerda ("Comunicações ER"): o que no PNG do slide fica no painel lateral e no canto de
   * baixo — nome da ER, ciclo, TV / rádio, (A), (C), destaques (com a miniatura do móvel) e itens fora
   * da planta. As notas e a legenda dos símbolos ficam no desenho da planta.
   */
  function atualizarPainelLoja() {
    const painel = $('painelLoja');
    if (!painel) return;
    const planta = plantaAtual();
    const aberto = estado.painelLoja && !!planta && !Editor.contexto();
    painel.hidden = !aberto;
    document.body.classList.toggle('com-painel-loja', aberto);
    $('btnLoja').setAttribute('aria-pressed', String(!!estado.painelLoja));
    if (!aberto) return;
    $('lojaTitulo').textContent = planta.nome;
    $('lojaSub').textContent = estado.ciclo ? 'Ciclo: ' + estado.ciclo : 'Sem ciclo escolhido';
    const corpo = $('lojaCorpo');
    corpo.innerHTML = '';
    if (!estado.ciclo) {
      novo('p', 'mv-vazio', 'Escolha um ciclo no seletor para ver as comunicações da ER.', corpo);
      return;
    }
    const pain = paineisDe(estado.ciclo, planta.id);
    const secao = (titulo) => {
      const sec = novo('section', 'lj-secao', null, corpo);
      const h = novo('h3', null, null, sec);
      if (titulo) novo('span', null, titulo, h);
      return { sec, h };
    };
    if (pain.TV.length) {
      const s = secao('TV e rádio');
      s.h.insertAdjacentHTML('afterbegin', ICONES_LOJA.TV + ICONES_LOJA.RADIO);
      chipsLoja(s.sec, pain.TV);
    }
    ['A', 'C'].forEach((letra) => {
      if (!pain[letra].length) return;
      const s = secao('');
      novo('span', 'lj-letra', letra, s.h);
      chipsLoja(s.sec, pain[letra]);
    });
    if (pain.CALLOUT.length) {
      // Destaques (aba Painéis, seção CALLOUT): o texto e a miniatura do móvel a que ele se refere.
      const sec = secao('Destaques').sec;
      pain.CALLOUT.forEach((c) => {
        const m = c.movel && planta.moveis.find((x) => x.id === c.movel);
        const bloco = novo('div', 'lj-destaque', null, sec);
        const ref = novo('div', 'lj-destaque-ref', null, bloco);
        if (m && m.tipo !== 'EXTRA') {
          const mini = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          mini.setAttribute('class', 'lj-mini');
          mini.setAttribute('aria-hidden', 'true');
          Render.miniatura(mini, m, c.marca, 64, 44);
          ref.appendChild(mini);
        }
        novo('span', 'lj-destaque-nome', m ? m.descricao || m.id : 'Geral', ref);
        const txt = novo('div', 'lj-chip lj-destaque-texto', c.texto, bloco);
        txt.style.background = corEtiquetaPainel(c.marca);
      });
    }
    const extras = planta.moveis.filter((m) => m.tipo === 'EXTRA');
    if (extras.length) {
      const sec = secao('Fora da planta').sec;
      extras.forEach((m) => {
        const bloco = novo('div', 'lj-extra', null, sec);
        novo('span', 'lj-extra-nome', m.descricao || m.id, bloco);
        const info = movimentoDe(estado.ciclo, planta.id, m.id);
        const etiquetas = info && info.etiquetas.length ? info.etiquetas.slice(0, 3) : [];
        if (!etiquetas.length) novo('span', 'mv-vazio', '—', bloco);
        else chipsLoja(bloco, etiquetas.map((e) => ({ texto: e.texto, marca: e.marca || (info.marca !== 'NEUTRO' ? info.marca : '') })));
      });
    }
  }

  /* ------------------------- estratégia do móvel -------------------------- */

  function novo(tag, classe, conteudo, pai) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (conteudo !== undefined && conteudo !== null) n.textContent = conteudo;
    if (pai) pai.appendChild(n);
    return n;
  }

  /** Cor (para o quadradinho / etiqueta) de um valor de marca: "BOT", "BOT+QDB" ou "#FF8800". */
  function corDaMarca(valor, tipo) {
    const cores = String(valor || '').split('+').map((p) => p.trim()).map((p) => {
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(p)) return p;
      const m = estado.dados.marcas[p];
      return m ? m[tipo] : null;
    }).filter(Boolean).map((c) => Render.corDaTela(c, tipo)); // no modo noturno, a versão escura
    if (!cores.length) return estado.dados.marcas.NEUTRO ? estado.dados.marcas.NEUTRO[tipo] : '#4A4A4A';
    return cores.length === 1 ? cores[0] : 'linear-gradient(90deg, ' + cores.join(', ') + ')';
  }

  const nomeDaMarca = (valor) => String(valor).split('+').map((p) => {
    const m = estado.dados.marcas[p.trim()];
    return m ? m.nome : p.trim();
  }).join(' + ');

  /** Bloco da tela com o que uma linha da planilha define (marca, símbolo, etiquetas, observação). */
  function blocoEstrategia(pai, titulo, i, opcoes) {
    const op = opcoes || {};
    const sec = novo('section', 'mv-bloco', null, pai);
    novo('h3', null, titulo, sec);
    if (!i) {
      novo('p', 'mv-vazio', op.vazio || 'Sem linha neste ciclo.', sec);
      return;
    }
    const marca = novo('div', 'mv-linha', null, sec);
    novo('span', 'mv-rotulo', 'Marca', marca);
    if (i.marca) {
      const sw = novo('span', 'mv-marca', null, marca);
      novo('i', null, null, sw).style.background = corDaMarca(i.marca, 'movel');
      novo('span', null, nomeDaMarca(i.marca), sw);
    } else {
      novo('span', 'mv-vazio', '— (branco)', marca);
    }
    if (i.simbolo) {
      const sim = novo('div', 'mv-linha', null, sec);
      novo('span', 'mv-rotulo', 'Símbolo', sim);
      const d = estado.dados.simbolos[i.simbolo];
      novo('span', null, ({ FIXO: '🔒 ', EXPOSICAO: 'Ⓔ ', NOVO: 'NEW · ' }[i.simbolo] || '') + (d ? d.descricao : i.simbolo), sim);
    }
    const etiquetas = i.etiquetas.slice(0, op.limite || i.etiquetas.length);
    const lista = novo('div', 'mv-linha mv-etiquetas', null, sec);

    if (!etiquetas.length) novo('span', 'mv-vazio', 'nenhuma', lista);

    etiquetas.forEach((e, k) => {
      const li = novo('li', null, null, ul);
      novo('span', 'mv-pos', 'Etiqueta ' + (k + 1), li);
      const marcaEtq = e.marca || (i.marca && i.marca !== 'NEUTRO' ? i.marca : '');
      const chip = novo('span', 'mv-etiqueta', e.texto, li);
      chip.style.background = corDaMarca(marcaEtq, 'etiqueta');
      if (e.marca && e.marca !== i.marca) novo('span', 'mv-marca-etq', nomeDaMarca(e.marca), li);
    });
    if (i.observacao) {
      const obs = novo('div', 'mv-linha', null, sec);
      novo('span', 'mv-rotulo', 'Observação', obs);
      novo('span', 'mv-obs', i.observacao, obs);
    }
  }

  /* ------------------------------ planograma ------------------------------ */

  /**
   * Divide as prateleiras de uma coluna entre as etiquetas, na ordem (a 1ª fica em cima).
   * Menos etiquetas que prateleiras: cada etiqueta ocupa um grupo de prateleiras seguidas;
   * mais etiquetas que prateleiras: cada prateleira recebe mais de uma.
   * @return {Array<{de, ate, etiquetas}>} de/ate = índices das prateleiras (0 = a de cima; ate exclusivo)
   */
  function dividirPrateleiras(n, etiquetas) {
    const k = etiquetas.length;
    if (!k) return [{ de: 0, ate: n, etiquetas: [] }];
    if (k <= n) return etiquetas.map((e, i) => ({ de: Math.floor((i * n) / k), ate: Math.floor(((i + 1) * n) / k), etiquetas: [e] }));
    return Array.from({ length: n }, (_, j) => ({ de: j, ate: j + 1, etiquetas: etiquetas.slice(Math.floor((j * k) / n), Math.floor(((j + 1) * k) / n)) }));
  }

  /**
   * Colunas do planograma do móvel (mesmas regras da planta): uma por espaço da gôndola e por frente
   * da mesa, cada uma com as etiquetas da linha do próprio espaço; uma por bloco do balcão (Etiqueta N
   * da linha dele); o totem tem uma coluna com um painel por linha; o móvel make, as testeiras por
   * cima e o corpo sem marca; os demais, uma coluna só com a linha do móvel.
   * @return {{n, rotulos, colunas: Array<{nome, peso, marca, celulas}>, testeiras}|null}
   */
  function planogramaDe(m, mov, linha, temLinha) {
    const config = estado.dados.config || {};
    const limBloco = (config.etiquetasPorBloco || {})[m.tipo] || 1;
    /** Linha própria do espaço (a metade sem linha usa a do meio). */
    const propriaDe = (e) => {
      const meio = /^MEIO-[AB]-\d$/.test(e.id) ? m.id + '/' + e.id.slice(0, 6) : null;
      const id = [m.id + '/' + e.id, meio].filter(Boolean).find(temLinha);
      return id ? linha(id) : null;
    };
    /** Etiqueta pronta para o planograma: texto e marca (a dela ou a da linha). */
    const etq = (e, i) => ({ texto: e.texto, marca: e.marca || (i && i.marca !== 'NEUTRO' ? i.marca : '') });
    const coluna = (nome, peso, n, i, etiquetas) => ({
      nome, peso, marca: i ? i.marca : '',
      celulas: dividirPrateleiras(n, etiquetas.map((e) => etq(e, i))),
    });
    const doEspaco = (e) => {
      const p = propriaDe(e);
      return { p, etiquetas: p ? p.etiquetas.slice(0, limBloco) : [] };
    };
    const n = Render.PRATELEIRAS[m.tipo] || 1;
    const rotulos = Array.from({ length: n }, (_, k) => String(k + 1));
    if (m.tipo === 'CAIXA') return null;
    if (m.tipo === 'GONDOLA') {
      const colunas = Render.caixasGondola(mov).map((b) => {
        const { p, etiquetas } = doEspaco(b.espaco);
        return coluna(b.espaco.nome, Math.max(b.w, b.d), n, p, etiquetas);
      });
      return { n, rotulos, colunas, testeiras: null };
    }
    if (m.tipo === 'TOTEM') {
      // Uma coluna, um painel por linha (1 = o de cima), cada um com a linha do próprio painel.
      const celulas = Render.espacos(m).map((e, k) => {
        const { p, etiquetas } = doEspaco(e);
        return { de: k, ate: k + 1, marca: p ? p.marca : '', etiquetas: etiquetas.map((x) => etq(x, p)) };
      });
      return { n: 3, rotulos: ['Painel 1', 'Painel 2', 'Painel 3'], colunas: [{ nome: 'Totem', peso: 1, marca: '', celulas }], testeiras: null };
    }
    if (m.tipo === 'MESA' || m.tipo === 'MESA_3') {
      // O verso não é nicho: fica só na lista de espaços, abaixo do planograma.
      const colunas = Render.espacos(m).filter((e) => !e.vm).map((e) => {
        const { p, etiquetas } = doEspaco(e);
        return coluna(e.nome, 1, 1, p, etiquetas);
      });
      return { n: 1, rotulos: ['Nicho'], colunas, testeiras: null };
    }
    if (m.tipo === 'MAKE') {
      const testeiras = Render.espacos(m).map((e) => {
        const p = propriaDe(e);
        return { nome: e.nome, marca: p ? p.marca : '', etiquetas: p ? p.etiquetas.slice(0, 1).map((x) => etq(x, p)) : [] };
      });
      return { n, rotulos, colunas: [coluna('Prateleiras', 1, n, null, [])], testeiras };
    }
    const geral = linha(m.id);
    const lim = (config.etiquetasPorTipo || {})[m.tipo];
    return { n, rotulos, colunas: [coluna('Móvel', 1, n, geral, geral ? geral.etiquetas.slice(0, lim || geral.etiquetas.length) : [])], testeiras: null };
  }

  /** Seção "Planograma" da tela do móvel: as prateleiras de cada espaço, com a cor e as etiquetas de cada uma. */
  function blocoPlanograma(pai, plano) {
    const sec = novo('section', 'mv-bloco mv-plano', null, pai);
    novo('h3', null, 'Planograma · como as prateleiras estão divididas', sec);
    const fundo = (marca) => (marca && marca !== 'NEUTRO' ? corDaMarca(marca, 'etiqueta') : '');
    const caixa = novo('div', 'pg', null, sec);
    const grade = novo('div', 'pg-grade', null, caixa);
    grade.style.gridTemplateColumns = 'auto ' + plano.colunas.map((c) => 'minmax(120px, ' + c.peso.toFixed(2) + 'fr)').join(' ');
    const linhaTopo = plano.testeiras ? 1 : 0;
    grade.style.gridTemplateRows = (linhaTopo ? 'auto ' : '') + 'repeat(' + plano.n + ', minmax(58px, auto)) auto';
    const pos = (n, col, row, rowFim) => {
      n.style.gridColumn = String(col);
      n.style.gridRow = row + (rowFim ? ' / ' + rowFim : '');
      return n;
    };
    const conteudo = (cel, etiquetas) => {
      if (!etiquetas.length) { novo('span', 'pg-sem', 'sem etiqueta', cel); return; }
      etiquetas.forEach((e) => {
        const chip = novo('span', 'pg-etq', e.texto, cel);
        const cor = fundo(e.marca);
        if (cor) chip.style.background = cor;
        else chip.classList.add('neutra');
      });
    };
    if (plano.testeiras) {
      pos(novo('span', 'pg-rot', 'Testeiras', grade), 1, 1);
      const faixa = pos(novo('div', 'pg-testeiras', null, grade), '2 / -1', 1);
      plano.testeiras.forEach((t) => {
        const cel = novo('div', 'pg-testeira', null, faixa);
        cel.title = t.nome;
        const cor = fundo(t.marca);
        if (cor) cel.style.background = cor;
        else cel.classList.add('neutra');
        conteudo(cel, t.etiquetas);
      });
    }
    plano.rotulos.forEach((r, k) => pos(novo('span', 'pg-rot', r, grade), 1, linhaTopo + k + 1));
    plano.colunas.forEach((c, ci) => {
      const col = ci + 2;
      c.celulas.forEach((cel) => {
        const n = pos(novo('div', 'pg-celula', null, grade), col, linhaTopo + cel.de + 1, linhaTopo + cel.ate + 1);
        const cor = fundo(cel.etiquetas.length ? cel.etiquetas[0].marca : cel.marca || c.marca);
        n.style.setProperty('--cor', cor || '#ECEAE6');
        if (!cor) n.classList.add('neutra');
        conteudo(n, cel.etiquetas);
      });
      // Tábuas das prateleiras (por cima das cores, no pé de cada nível).
      for (let k = 0; k < plano.n; k++) pos(novo('i', 'pg-tabua', null, grade), col, linhaTopo + k + 1);
      pos(novo('span', 'pg-nome', c.nome, grade), col, linhaTopo + plano.n + 1);
    });
    novo('p', 'pg-nota', plano.rotulos[0] === 'Painel 1'
      ? 'Painel 1 é o de cima. Cada painel tem a cor e a etiqueta da própria linha (ou da Etiqueta N do totem).'
      : plano.n > 1
        ? 'Prateleira 1 é a de cima. As etiquetas de cada espaço dividem as prateleiras na ordem (Etiqueta 1 em cima), cada uma com a cor da marca dela.' + (plano.testeiras ? ' As prateleiras do móvel make não levam marca: cada testeira tem a sua.' : '')
        : 'As etiquetas de cada espaço, com a cor da marca de cada uma.', sec);
  }

  /** Desenho só do móvel (com as cores reais do ciclo, sem o filtro de marca), recortado nele. */
  function desenharMovelSozinho(alvo, planta, id) {
    Render.desenhar(alvo, Object.assign(contextoDesenho(), {
      filtro: '', somentePlanta: true, edicao: false, selecionado: '', grade: false, referencia: null, ajustes: {},
    }));
    // Os degradês têm ids (grad0, grad1…) que se repetem no slide principal: renomeia os deste desenho.
    alvo.querySelectorAll('linearGradient').forEach((g) => {
      const antigo = g.id;
      g.id = 'mv-' + antigo;
      alvo.querySelectorAll('[fill="url(#' + antigo + ')"]').forEach((n) => n.setAttribute('fill', 'url(#mv-' + antigo + ')'));
    });
    const camada = alvo.querySelector('.camada-planta');
    Array.from(alvo.children).forEach((n) => { if (n !== camada && n.tagName.toLowerCase() !== 'defs') n.remove(); });
    Array.from(camada.children).forEach((n) => { if (n.getAttribute('data-movel') !== id) n.remove(); });
    if (!camada.children.length) return false;
    const bb = camada.getBBox();
    const m = Math.max(bb.width, bb.height) * 0.12 + 4;
    alvo.setAttribute('viewBox', [bb.x - m, bb.y - m, bb.width + m * 2, bb.height + m * 2].join(' '));
    return true;
  }

  /** Clique no móvel: abre a tela com a estratégia do ciclo para ele (a linha do móvel ou a de cada espaço). */
  function abrirMovel(id) {
    const planta = plantaAtual();
    const m = planta && planta.moveis.find((x) => x.id === id);
    if (!m) return;
    const dlg = $('dlgMovel');
    const ciclo = estado.ciclo;
    const linha = (x) => (ciclo ? movimentoDe(ciclo, planta.id, x) : null);
    const temLinha = (x) => { const i = linha(x); return !!(i && (i.marca || i.etiquetas.length || i.simbolo)); };
    const tipo = (estado.dados.tipos && estado.dados.tipos[m.tipo]) || m.tipo;

    $('mvTitulo').textContent = m.id;
    const simples = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
    const descricao = simples(m.descricao) === simples(m.id) ? '' : m.descricao;
    $('mvSub').textContent = [descricao, String(tipo).split(':')[0], planta.nome, ciclo || 'sem ciclo selecionado'].filter(Boolean).join(' · ');
    const corpo = $('mvEstrategia');
    corpo.innerHTML = '';
    // Comentários da validação deste móvel (só aparece para quem entrou na validação).
    Validacao.montarSecaoMovel(novo('section', 'mv-bloco mv-validacao', null, corpo), m.id);
    if (!ciclo) {
      novo('p', 'mv-vazio', 'Escolha um ciclo no seletor para ver a estratégia deste móvel.', corpo);
    } else {
      const config = estado.dados.config || {};
      // Gôndola: o meio também fica dividido quando o ciclo tem linha para uma das metades (como na planta).
      let mov = m;
      if (m.tipo === 'GONDOLA') {
        const div = ['A', 'B'].filter((l) => String(m.dividido || '').toUpperCase().indexOf(l) >= 0
          || temLinha(m.id + '/MEIO-' + l + '-2') || temLinha(m.id + '/MEIO-' + l + '-1')).join('');
        mov = Object.assign({}, m, { dividido: div });
      }
      const plano = planogramaDe(m, mov, linha, temLinha);
      if (plano) blocoPlanograma(corpo, plano);
      // Móvel com espaços (gôndola, mesas, totem, make): só as linhas dos espaços; os demais, a linha do móvel.
      if (!Render.espacos(mov).length) {
        blocoEstrategia(corpo, 'Móvel', linha(m.id), {
          vazio: 'Sem linha neste ciclo: o móvel fica branco (neutro).',
          limite: (config.etiquetasPorTipo || {})[m.tipo],
        });
      }
      Render.espacos(mov).forEach((e) => {
        const meio = /^MEIO-[AB]-\d$/.test(e.id) ? m.id + '/' + e.id.slice(0, 6) : null;
        const propria = [m.id + '/' + e.id, meio].filter(Boolean).find(temLinha);
        blocoEstrategia(corpo, e.nome, propria ? linha(propria) : null, {
          vazio: 'Sem linha neste ciclo: o espaço fica branco (neutro).',
          limite: (config.etiquetasPorBloco || {})[m.tipo] || 1,
        });
      });
    }
    dlg.showModal();
    // O desenho precisa da tela visível para medir o móvel (getBBox).
    const desenho = $('mvDesenho');
    try {
      desenho.hidden = !desenharMovelSozinho(desenho, planta, m.id);
    } catch (e) {
      desenho.hidden = true;
    }
  }

  async function importar(arquivo) {
    if (!arquivo) return;
    carregando(true, 'Lendo a planilha…');
    try {
      const payload = await Planilha.ler(arquivo, estado.dados);
      carregando(true, 'Gravando na planilha…');
      const r = await chamar('importarPlanilha', payload);
      await carregar({ ciclo: r.ciclos.length ? r.ciclos[r.ciclos.length - 1] : '' });
      mostrarResultado(r);

      erro(e);
    } finally {

      $('arquivo').value = '';

  function mostrarResultado(r) {
    $('resTitulo').textContent = 'Importação concluída';
    const partes = [];
    if (r.movimentos) partes.push(r.movimentos + ' linha(s) de movimentos');
    if (r.paineis) partes.push(r.paineis + ' linha(s) de painéis');
    if (r.tipos) partes.push(r.tipos + ' linha(s) de tipos de movimento');
    if (r.layout) partes.push(r.layout + ' linha(s) de layout');
    $('resTexto').textContent = (partes.join(' e ') || 'Nenhuma linha') + ' gravada(s)' +
      (r.ciclos.length ? ' — ciclo(s): ' + r.ciclos.join(', ') + '.' : '.') +
      (r.avisos.length ? ' Confira os avisos:' : '');

    ul.textContent = '';
    r.avisos.forEach((a) => {
      const li = document.createElement('li');
      li.textContent = a;
      ul.appendChild(li);
    });
    $('dlgResultado').showModal();
  }
