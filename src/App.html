  /**
   * Dados do slide da estratégia (o espaço da ER por marca, movimento e classificação), já com nomes,
   * cores e formatos, para o Estrategia.desenhar. Não usa os filtros da tela: é o ciclo inteiro na ER.
   */
  function dadosEstrategia(planta, ciclo) {
    const r = resumoDeEspaco(partesDeEspaco(planta, ciclo).filter((p) => !p.vm));
    const marcas = ordemDasMarcas().filter((c) => r.porMarca[c]);
    const grupos = Object.values(r.porEtiqueta).sort((a, b) => b.espacos - a.espacos || a.texto.localeCompare(b.texto, 'pt-BR'));
    const gmvDe = (g) => (g.tipo && typeof g.tipo.gmv === 'number' ? g.tipo.gmv : 0);
    const gmvTotal = grupos.reduce((s, g) => s + gmvDe(g), 0);
    const classes = ordemDasClassificacoes(Object.keys(r.porClassificacao));
    return {
      er: planta.nome,
      ciclo,
      total: r.total,
      moveis: r.moveis.size,
      gmvTotal,
      marcas: marcas.map((c) => ({ nome: nomeMarcaPainel(c), cor: corMarcaPainel(c), valor: r.porMarca[c] })),
      movimentos: grupos.map((g) => ({
        texto: g.texto,
        espacos: g.espacos,
        gmv: gmvDe(g),
        classificacao: g.classificacao === SEM_CLASSIFICACAO ? null : { nome: nomeClassificacao(g.classificacao), cor: corClassificacao(g.classificacao) },
        marcas: marcas.filter((c) => g.marcas[c]).map((c) => ({ cor: corMarcaPainel(c), valor: g.marcas[c] })),
      })),
      movimentosOcultos: 0,
      classificacoes: classes.map((c) => {
        const doTipo = grupos.filter((g) => g.classificacao === c);
        return {
          nome: nomeClassificacao(c), cor: corClassificacao(c), sem: c === SEM_CLASSIFICACAO,
          espacos: r.porClassificacao[c] || 0, movimentos: doTipo.length, gmv: doTipo.reduce((s, g) => s + gmvDe(g), 0),
        };
      }),
      nota: 'Espaços de exposição: na gôndola, cada ponta e cada meio (meio dividido: ½ para cada metade); na mesa, cada frente; '
        + 'na pirâmide, o espaço se divide entre as etiquetas; os demais móveis, um espaço. Espaços de VM (PDV móvel, verso da mesa, totem e balcão recepção), '
        + 'móvel de atendimento, itens fora da planta, móveis de parede e móvel make não contam. GMV esperado: o do movimento no ciclo (aba Tipos de movimento).',
      fmt: {
        espacos: qtdEspacos,
        pct: porcento,
        gmvCurto,
        gmvCompleto: (v) => formatoGmvCompleto.format(v),
      },
    };
  }

  /**
   * SVG a exportar, desenhado à parte (sem o zoom e sem os marcadores da validação). "slide": o slide
   * inteiro, com os painéis (nome da ER, TV / rádio, A, C, notas, legenda e itens extras), que na tela
   * ficam no menu da esquerda. "planta": só a loja, os móveis e as etiquetas, sem fundo e recortada no
   * conteúdo. Os dois com as mesmas cores da tela (inclusive o filtro de marca) e na visão da tela.
   */
  function svgParaPng(modo, conteudo) {
    const ns = 'http://www.w3.org/2000/svg';
    const temp = document.createElementNS(ns, 'svg');
    // Fora da tela, mas renderizado (getBBox não funciona com display: none).
    temp.setAttribute('style', 'position:absolute;left:-10000px;top:0;width:' + estado.tela.w + 'px;height:' + estado.tela.h + 'px;visibility:hidden');
    document.body.appendChild(temp);
    try {
      const soPlanta = modo === 'planta';
      const r = conteudo === 'estrategia'
        ? { tela: Estrategia.desenhar(temp, dadosEstrategia(plantaAtual(), estado.ciclo), { recorte: soPlanta }) }
        : Render.desenhar(temp, Object.assign(contextoDesenho(), {
          somentePlanta: soPlanta, paineis: !soPlanta, edicao: false, selecionado: '', grade: false, referencia: null, escuro: false,
          visao: conteudo === 'simplificada' ? 'simplificada' : 'planta',
        }));
      let caixa = { x: 0, y: 0, w: r.tela.w, h: r.tela.h };
      if (soPlanta) {
        const bb = temp.getBBox();
        const m = 12;
        const x = Math.max(0, Math.floor(bb.x - m));
        const y = Math.max(0, Math.floor(bb.y - m));
        caixa = {
          x, y,
          w: Math.min(r.tela.w, Math.ceil(bb.x + bb.width + m)) - x,
          h: Math.min(r.tela.h, Math.ceil(bb.y + bb.height + m)) - y,
        };
      }
      const clone = temp.cloneNode(true);
      clone.removeAttribute('style');
      clone.setAttribute('viewBox', [caixa.x, caixa.y, caixa.w, caixa.h].join(' '));
      return { clone, caixa };
    } finally {
      temp.remove();
      Render.paleta(document.documentElement.dataset.tema === 'escuro'); // volta às cores da tela
    }
  }

  const URL_FONTE_ETQ = 'https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap';
  let fonteEmbutida = null;

  /**
   * @font-face da fonte das etiquetas com os arquivos embutidos (data:), para o PNG sair com a mesma
   * fonte da tela (uma imagem SVG não carrega arquivos de fora). Sem internet, o PNG usa Arial.
   */
  function cssFonteEmbutida() {
    if (!fonteEmbutida) {
      const paraDataUrl = (blob) => new Promise((ok, falha) => {
        const r = new FileReader();
        r.onload = () => ok(r.result);
        r.onerror = falha;
        r.readAsDataURL(blob);
      });
      fonteEmbutida = (async () => {
        const css = await (await fetch(URL_FONTE_ETQ)).text();
        // Só os blocos "latin" e "latin-ext" (os acentos do português estão neles).
        const blocos = css.split(/(?=\/\*)/).filter((b) => /^\/\*\s*latin(-ext)?\s*\*\//.test(b));
        const partes = await Promise.all(blocos.map(async (b) => {
          const url = (b.match(/url\(([^)]+)\)/) || [])[1];
          if (!url) return '';
          const dados = await paraDataUrl(await (await fetch(url.replace(/['"]/g, ''))).blob());
          return b.replace(url, '"' + dados + '"');
        }));
        return partes.join('\n');
      })().catch((e) => {
        console.warn('PNG sem a fonte das etiquetas embutida:', e);
        fonteEmbutida = null;
        return '';
      });
    }
    return fonteEmbutida;
  }

  async function baixarPng() {
    const dlg = $('dlgPng');
    if (dlg.returnValue !== 'baixar') return;
    const planta = plantaAtual();
    if (!planta) return;
    const conteudo = dlg.querySelector('input[name="pngConteudo"]:checked').value;
    // "png": só o conteúdo, recortado e sem fundo; "slide": o slide 16:9 completo.
    const modo = dlg.querySelector('input[name="pngFormato"]:checked').value === 'png' ? 'planta' : 'slide';
    carregando(true, 'Gerando imagem…');
    try {
      const { clone, caixa } = svgParaPng(modo, conteudo);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', caixa.w);
      clone.setAttribute('height', caixa.h);
      clone.querySelectorAll('title').forEach((t) => t.remove());
      const css = await cssFonteEmbutida();
      if (css) {
        const estilo = document.createElementNS('http://www.w3.org/2000/svg', 'style');
        estilo.textContent = css;
        clone.insertBefore(estilo, clone.firstChild);
      }
      const xml = new XMLSerializer().serializeToString(clone);
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
      await img.decode();
      // Slide completo: sempre 3840 px de largura (16:9), mesmo quando o slide cresceu para caber as fichas.
      const escala = modo === 'planta' ? 2 : 3840 / caixa.w;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(caixa.w * escala);
      canvas.height = Math.round(caixa.h * escala);
      const ctx = canvas.getContext('2d');
      ctx.scale(escala, escala);
      ctx.drawImage(img, 0, 0, caixa.w, caixa.h);
      const blob = await new Promise((ok) => canvas.toBlob(ok, 'image/png'));
      const marca = estado.filtro && estado.dados.marcas[estado.filtro];
      const estrategia = conteudo === 'estrategia';
      const partes = [planta.nome, estado.ciclo, estrategia ? 'estrategia' : conteudo === 'simplificada' ? 'visao simplificada' : 'planta',
        modo === 'slide' ? 'slide' : '', !estrategia && marca ? marca.nome : ''].filter(Boolean);
      const nome = partes.join(' - ').replace(/[\\/:*?"<>|]+/g, '-') + '.png';
      baixarArquivo(blob, nome);
    } catch (e) {
      erro(e);
    } finally {
      carregando(false);
    }
  }

  /* -------------------------------- início -------------------------------- */

  function ligarEventos() {
    // Botões que só existem em uma das versões (ex.: a de visualização não tem Construir loja
    // nem Baixar / Importar planilha) são ignorados quando não estão na página.
    const ao = (id, evento, fn) => { if ($(id)) $(id).addEventListener(evento, fn); };
    ao('selCiclo', 'change', (e) => {
      estado.ciclo = e.target.value;
      desenhar();
    });
    ao('btnModelo', 'click', () => estado.dados && abrirDialogoModelo());
    ao('dlgModelo', 'close', baixarModelo);
    ao('btnImportar', 'click', () => estado.dados && $('arquivo').click());
    ao('arquivo', 'change', (e) => importar(e.target.files[0]));
    ao('btnPng', 'click', () => estado.dados && abrirDialogoPng());
    ao('dlgPng', 'close', baixarPng);
    ao('dlgPng', 'change', atualizarDialogoPng);
    ao('btnEditar', 'click', () => estado.dados && alternarEdicao());
    ao('btnAnalytics', 'click', () => estado.dados && alternarAnalytics());
    ao('anFechar', 'click', () => alternarAnalytics(false));
    ao('anInfo', 'click', () => {
      if (!estado.dados || !estado.ciclo) return;
      Analytics.desenharInfo($('anInfoCorpo'), dadosAnalytics(estado.ciclo), { miniatura: Render.miniaturaEspacos });
      $('dlgAnInfo').showModal();
    });
    ao('btnLoja', 'click', () => {
      // Com o Analytics aberto, o botão volta para a planta com o menu da ER aberto.
      estado.painelLoja = estado.analytics ? true : !estado.painelLoja;
      if (estado.analytics) alternarAnalytics(false);
      memoria.gravar('painelLoja', estado.painelLoja ? '1' : '0');
      atualizarPainelLoja();
    });
    ao('lojaFechar', 'click', () => $('btnLoja').click());
    ao('zoomMais', 'click', () => zoomPara(estado.zoom.k * 1.5));
    ao('zoomMenos', 'click', () => zoomPara(estado.zoom.k / 1.5));
    ao('zoomNivel', 'click', () => zoomPara(1));
    ao('btnAutoOrganizar', 'click', autoOrganizar);
    ao('etqMenor', 'click', () => mudarTamanhoEtiquetas(tamanhoEtiquetas() - TAMANHO_ETQ.passo));
    ao('etqMaior', 'click', () => mudarTamanhoEtiquetas(tamanhoEtiquetas() + TAMANHO_ETQ.passo));
    ao('etqTamanho', 'click', () => mudarTamanhoEtiquetas(100));
    // Menu de configurações (engrenagem): abre e fecha; fecha ao escolher um item, clicar fora ou Esc.
    const menuCfg = $('menuConfigLista');
    const abrirMenuCfg = (abrir) => {
      menuCfg.hidden = !abrir;
      $('btnConfig').setAttribute('aria-expanded', String(abrir));
      if (abrir) { const i = menuCfg.querySelector('.menu-item:not(:disabled)'); if (i) i.focus(); }
    };
    ao('btnConfig', 'click', () => abrirMenuCfg(menuCfg.hidden));
    menuCfg.addEventListener('click', (e) => { if (e.target.closest('.menu-item')) abrirMenuCfg(false); });
    document.addEventListener('pointerdown', (e) => { if (!menuCfg.hidden && !e.target.closest('#menuConfig')) abrirMenuCfg(false); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !menuCfg.hidden) { abrirMenuCfg(false); $('btnConfig').focus(); }
    });
    ao('btnTema', 'click', () => {
      const escuro = document.documentElement.dataset.tema !== 'escuro';
      memoria.gravar('tema', escuro ? 'escuro' : 'claro');
      aplicarTema(escuro);
    });
    ao('btnDescartar', 'click', () => { estado.ajustes = {}; atualizarBarraEdicao(); desenhar(); });
    // O menu fecha no clique; o tour começa depois, para não destacar o menu ainda aberto.
    ao('btnTutorial', 'click', () => estado.dados && setTimeout(() => Tutorial.iniciar(), 0));
    ao('btnSalvarAjustes', 'click', salvarAjustes);
    ao('btnBaixarPosicoes', 'click', baixarPosicoes);
    ao('btnConfigurar', 'click', configurar);
    ao('btnConstruir', 'click', () => {
      if (!estado.dados) return;
      if (Editor.ativo()) { Editor.fechar(); return; }
      if (estado.edicao) alternarEdicao();
      if (estado.edicao) return; // usuário cancelou a saída do modo ajuste
      Editor.abrir();
    });
    ao('btnRestaurar', 'click', () => {
      if (window.confirm('Apagar os dados salvos neste navegador e voltar ao ciclo de exemplo?')) configurar();
    });
    ao('btnAtualizar', 'click', () => {
      if (Object.keys(estado.ajustes).length && !window.confirm('Descartar ajustes de etiquetas não salvos?')) return;
      carregar().then(() => toast('Dados atualizados.'));
    });

    // Setas ← → trocam de planta (útil ao apresentar).
    document.addEventListener('keydown', (e) => {
      if (!estado.dados) return;
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName) || document.querySelector('dialog[open]')) return;
      if (Editor.ativo()) { Editor.tecla(e); return; }
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (estado.analytics) {
        // No Analytics, Esc volta para a planta; as setas continuam trocando a ER em destaque.
        if (e.key === 'Escape' && !document.querySelector('.tut-foco')) { alternarAnalytics(false); return; }
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      }
      if (e.key === '+' || e.key === '=') { zoomPara(estado.zoom.k * 1.5); return; }
      if (e.key === '-' || e.key === '_') { zoomPara(estado.zoom.k / 1.5); return; }
      if (e.key === '0') { zoomPara(1); return; }
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const ids = estado.dados.plantas.map((p) => p.id);
      const i = ids.indexOf(estado.planta) + (e.key === 'ArrowRight' ? 1 : -1);
      if (i >= 0 && i < ids.length) trocarPlanta(ids[i]);
    });
  }

  // Modo noturno: o script do <head> já aplicou a escolha salva (ou a do sistema); aqui marca o botão
  // e redesenha a planta com as cores escuras e as marcas mais escuras (o PNG sai sempre com as cores do slide).
  function aplicarTema(escuro) {
    if (escuro) document.documentElement.dataset.tema = 'escuro';
    else delete document.documentElement.dataset.tema;
    $('btnTema').setAttribute('aria-pressed', String(escuro));
    Render.paleta(escuro);
    if (estado.dados) { montarLegenda(); desenhar(); }
  }
  aplicarTema(document.documentElement.dataset.tema === 'escuro');
  // Visão das etiquetas: lembra a última escolha (na planta, por padrão).
  if (memoria.ler('visao') === 'simplificada') estado.visao = 'simplificada';
  marcarVisao();
  document.querySelectorAll('#abasVisao .aba').forEach((b) => b.addEventListener('click', () => trocarVisao(b.dataset.visao)));
  // Menu da esquerda (painel da ER): lembra a última escolha; na primeira vez, abre em telas largas.
  const prefLoja = memoria.ler('painelLoja');
  estado.painelLoja = prefLoja ? prefLoja === '1' : window.innerWidth >= 1200;
  ligarEventos();
  ligarZoom();
  ligarDestaque();
  // A fonte das etiquetas (Nunito) pode chegar depois do primeiro desenho: quando ela carregar, redesenha,
  // para o tamanho das etiquetas ser medido com a fonte certa.
  if (document.fonts && document.fonts.load) {
    Promise.all(['700 12px Nunito', '800 12px Nunito'].map((f) => document.fonts.load(f)))
      .then(() => { if (estado.dados) desenhar(); })
      .catch(() => { /* sem a fonte: as etiquetas usam a reserva (Segoe UI / Arial) */ });
  }
  Editor.iniciar({ estado, desenhar, chamar, toast, erro, carregar, carregando, plantaAtual });
  Validacao.iniciar({
    estado, chamar, toast, erro, desenhar, plantaAtual, trocarPlanta,
    abrirMovel: (id) => abrirMovel(id),
    fecharAnalytics: () => alternarAnalytics(false),
  });
  // Na primeira visita, depois de carregar, oferece o tutorial guiado.
  carregar().then(() => { if (estado.dados) Tutorial.oferecer(); });

  // resolver: usado também para gerar a planilha base da versão de visualização (dev/).
  return { estado, carregar, resolver: { movimento: movimentoDe, linhasPaineis, linhasTipos } };
})();
</script>
