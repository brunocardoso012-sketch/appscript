<script>
/**
 * ============================================================================
 *  ANALYTICS: dashboard de como o espaço do ciclo se divide entre os movimentos, em cada ER
 * ============================================================================
 *  Analytics.desenhar(corpo, dados, acoes) monta, no lugar da planta:
 *   - o mapa de calor movimento × ER (quanto de cada ER vai para cada movimento);
 *   - as marcas e as classificações em cada ER (barras 100%);
 *   - GMV esperado × espaço de cada movimento (gráfico de dispersão, uma ER por vez);
 *   - os espaços de VM, à parte (mapa de calor movimento × ER só com eles).
 *  Cada ER é um tamanho médio da rede: nada aqui soma ERs, toda
 *  conta é feita dentro de cada ER e as ERs só são comparadas lado a lado.
 *  Analytics.desenharInfo(corpo, dados, acoes) monta o "Sobre a análise" (botão de informação no topo):
 *  como as contas são feitas e a legenda do que conta como espaço (miniatura de cada tipo de móvel,
 *  com os espaços em cores), separando exposição, VM (PDV móvel, verso da mesa, totem, balcão) e fora.
 *  Os dados vêm prontos da aplicação (App.dadosAnalytics); aqui só o desenho. Clicar num número
 *  chama acoes.verNaPlanta({ er, etiqueta | marca | classificacao }), que abre a planta já filtrada.
 */
const Analytics = (() => {
  const COR_MAPA = [51, 70, 184]; // o azul dos botões em destaque (#3346B8), do claro ao escuro
  const COR_SEM_MOVIMENTO = '#E6E8EB';
  // Escolhas da tela (valem até recarregar): medida de cada mapa (exposição e VM), ER que ordena as
  // linhas (vazio = a ER em destaque) e ER do GMV × espaço (vazio = a ER em destaque).
  const vista = { medida: 'pct', ordem: '' };
  const vistaVm = { medida: 'pct', ordem: '' };
  const vistaGmv = { er: '' };
  // O gráfico de dispersão é desenhado na largura do cartão: se ela mudar, o dashboard é redesenhado.
  let observaLargura = null;

  const fmtNum = (n) => (Math.round(n * 10) / 10).toLocaleString('pt-BR');
  const fmtPct = (v, total) => (total ? Math.round((v / total) * 100) : 0) + '%';
  const fmtPctNum = (p) => Math.round(p * 100) + '%';
  const espacos = (n) => fmtNum(n) + (n === 1 ? ' espaço' : ' espaços');
  const gmvCurto = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', notation: 'compact', maximumFractionDigits: 1 });
  const gmvCompleto = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

  /** Texto escuro sobre cores claras (cinza "sem marca", amarelos…), branco sobre as demais. */
  function corClara(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return false;
    const n = parseInt(m[1], 16);
    const lin = (v) => { const c = v / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    return 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255) > 0.45;
  }

  function novo(tag, classe, conteudo, pai) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (conteudo !== undefined && conteudo !== null) n.textContent = conteudo;
    if (pai) pai.appendChild(n);
    return n;
  }

  /** Texto com trechos em negrito: partes = ['texto', ['negrito'], 'texto'…]. */
  function frase(pai, partes) {
    partes.forEach((p) => {
      if (Array.isArray(p)) novo('strong', null, p[0], pai);
      else pai.appendChild(document.createTextNode(p));
    });
    return pai;
  }

  function cartao(pai, titulo, sub, classe) {
    const c = novo('section', 'an-cartao' + (classe ? ' ' + classe : ''), null, pai);
    const h = novo('header', 'an-cartao-topo', null, c);
    novo('h3', null, titulo, h);
    if (sub) novo('p', null, sub, h);
    return c;
  }

  /* ------------------------------- contas -------------------------------- */

  /** Fatia de cada ER (0..1) que vai para o movimento. */
  const fatia = (m, er) => (er.total ? (m.porEr[er.id] || 0) / er.total : 0);
  /** ER em destaque (a da planta), ou a primeira com espaço. */
  const erDestaque = (d) => d.ers.find((e) => e.id === d.erAtual && e.total) || d.ers.find((e) => e.total) || d.ers[0];
  /**
   * GMV esperado × espaço dentro de uma ER: para cada movimento da ER com GMV, a fatia dele no GMV
   * esperado e no espaço (entre os movimentos com GMV da ER) e o índice (GMV ÷ espaço).
   */
  function gmvNaEr(d, er) {
    const comGmv = d.movimentos.filter((m) => m.gmv > 0 && m.porEr[er.id]);
    const gmvTotal = comGmv.reduce((s, m) => s + m.gmv, 0);
    const espTotal = comGmv.reduce((s, m) => s + m.porEr[er.id], 0);
    const linhas = gmvTotal && espTotal ? comGmv.map((m) => {
      const fe = m.porEr[er.id] / espTotal;
      const fg = m.gmv / gmvTotal;
      return { m, fe, fg, idx: fg / fe };
    }) : [];
    return { linhas, gmvTotal, espTotal };
  }

  /* ------------------------------- desenho ------------------------------- */

  /**
   * Mapa de calor: uma linha por movimento, uma coluna por ER (% do espaço de cada ER ou espaços).
   * op: { titulo, sub, classe, vista } — o mesmo mapa serve ao espaço de exposição e ao de VM.
   */
  function mapa(pai, d, acoes, redesenhar, op) {
    const vista = op.vista;
    const c = cartao(pai, op.titulo, op.sub, 'an-mapa-cartao' + (op.classe ? ' ' + op.classe : ''));
    const ctrl = novo('div', 'an-controles', null, c.querySelector('.an-cartao-topo'));
    const seg = novo('div', 'an-segmentado', null, ctrl);
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', 'Medida');
    [['pct', '% da ER'], ['qtd', 'Espaços']].forEach(([v, rot]) => {
      const b = novo('button', null, rot, seg);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(vista.medida === v));
      b.addEventListener('click', () => { vista.medida = v; redesenhar(); });
    });
    if (!d.movimentos.length) { novo('p', 'an-vazio', 'Nenhuma etiqueta neste ciclo.', c); return; }

    const ers = d.ers;
    const movs = d.movimentos.slice();
    // As linhas seguem uma ER (a em destaque, ou a do título clicado); empate: a ordem de d.movimentos.
    const ordemEr = ers.find((e) => e.id === vista.ordem) || erDestaque(d);
    if (ordemEr) movs.sort((a, b) => fatia(b, ordemEr) - fatia(a, ordemEr));
    const valor = (m, e) => (vista.medida === 'pct' ? fatia(m, e) : (m.porEr[e.id] || 0));
    const maior = Math.max.apply(null, movs.reduce((acc, m) => acc.concat(ers.map((e) => valor(m, e))), [0]));

    const rolagem = novo('div', 'an-tabela-rolagem', null, c);
    const tab = novo('table', 'an-mapa', null, rolagem);
    const thead = novo('thead', null, null, tab);
    const trh = novo('tr', null, null, thead);
    novo('th', 'an-col-mov', 'Movimento', trh).scope = 'col';
    ers.forEach((e) => {
      const th = novo('th', 'an-col-er' + (e.id === d.erAtual ? ' atual' : ''), null, trh);
      th.scope = 'col';
      const b = novo('button', null, null, th);
      b.type = 'button';
      const porEsta = ordemEr && ordemEr.id === e.id;
      b.title = 'Ordenar pela ' + e.nome;
      novo('span', null, e.nome + (porEsta ? ' ▾' : ''), b);
      novo('small', null, espacos(e.total), b);
      b.addEventListener('click', () => { vista.ordem = e.id; redesenhar(); });
    });
    novo('th', 'an-col-marcas', 'Marcas', trh).scope = 'col';

    const tbody = novo('tbody', null, null, tab);
    const filtrada = d.filtroEtiqueta;
    movs.forEach((m) => {
      const tr = novo('tr', m.chave === filtrada ? 'ativo' : null, null, tbody);
      const th = novo('th', 'an-col-mov', null, tr);
      th.scope = 'row';
      const nome = novo('div', 'an-mov-nome', null, th);
      const ponto = novo('i', null, null, nome);
      ponto.style.background = m.classe ? m.classe.cor : 'transparent';
      if (!m.classe) ponto.className = 'sem';
      novo('span', null, m.texto, nome);
      const info = novo('div', 'an-mov-info', null, th);
      novo('span', null, m.classe ? m.classe.nome : 'Sem classificação', info);
      if (m.gmv > 0) novo('span', 'an-gmv', 'GMV ' + gmvCurto.format(m.gmv), info);
      ers.forEach((e) => {
        const td = novo('td', 'an-celula' + (e.id === d.erAtual ? ' atual' : ''), null, tr);
        const n = m.porEr[e.id] || 0;
        const tituloCel = m.texto + ' · ' + e.nome + ': ' + (n ? espacos(n) + ' (' + fmtPct(n, e.total) + ' da ER)' : 'não aparece');
        if (!n) {
          const vazio = novo('span', 'an-cel-vazia', '—', td);
          vazio.title = tituloCel;
          return;
        }
        const b = novo('button', null, null, td);
        b.type = 'button';
        b.title = tituloCel + ' · clique para ver na planta';
        const k = maior ? valor(m, e) / maior : 0;
        const alfa = 0.07 + 0.83 * k;
        b.style.background = 'rgba(' + COR_MAPA.join(',') + ',' + alfa.toFixed(3) + ')';
        if (alfa > 0.55) b.classList.add('escuro');
        novo('strong', null, vista.medida === 'pct' ? fmtPct(n, e.total) : fmtNum(n), b);
        novo('small', null, vista.medida === 'pct' ? fmtNum(n) : fmtPct(n, e.total), b);
        b.addEventListener('click', () => acoes.verNaPlanta({ er: e.id, etiqueta: m.texto }));
      });
      const tdM = novo('td', 'an-col-marcas', null, tr);
      const pilha = novo('span', 'an-pilha', null, tdM);
      const somaM = m.marcas.reduce((s, x) => s + x.valor, 0);
      m.marcas.forEach((x) => {
        const s = novo('span', null, null, pilha);
        s.style.flexGrow = x.valor;
        s.style.background = x.cor;
        s.title = m.texto + ' · ' + x.nome + ': ' + fmtPct(x.valor, somaM) + ' (média das ERs onde aparece)';
      });
    });
    // Linha dos espaços sem movimento, para fechar a conta de cada ER.
    const tr = novo('tr', 'an-linha-livre', null, tbody);
    const th = novo('th', 'an-col-mov', null, tr);
    th.scope = 'row';
    novo('div', 'an-mov-nome', 'Sem movimento', th);
    ers.forEach((e) => {
      const td = novo('td', 'an-celula' + (e.id === d.erAtual ? ' atual' : ''), null, tr);
      const sp = novo('span', 'an-cel-livre', null, td);
      novo('strong', null, vista.medida === 'pct' ? fmtPct(e.semMovimento, e.total) : fmtNum(e.semMovimento), sp);
      sp.title = e.nome + ': ' + espacos(e.semMovimento) + ' sem etiqueta';
    });
    novo('td', 'an-col-marcas', null, tr);
  }

  /** Barras 100% por ER (marcas ou classificações), com a legenda em cima. */
  function barrasPorEr(pai, titulo, sub, d, chave, legenda, filtroDe, acoes) {
    const c = cartao(pai, titulo, sub);
    const leg = novo('div', 'an-legenda', null, c);
    legenda.forEach((x) => {
      const s = novo('span', null, null, leg);
      const i = novo('i', null, null, s);
      i.style.background = x.cor;
      if (x.borda) i.classList.add('borda');
      novo('span', null, x.nome, s);
    });
    const linhas = novo('div', 'an-barras', null, c);
    // Uma barra por ER (sem barra de "todas": cada ER é um tamanho médio da rede).
    d.ers.map((e) => ({ id: e.id, nome: e.nome, total: e.total, valores: e[chave] })).forEach((er) => {
      const linha = novo('div', 'an-barra-linha' + (er.id === d.erAtual ? ' atual' : ''), null, linhas);
      novo('span', 'an-barra-nome', er.nome, linha);
      const barra = novo('div', 'an-barra', null, linha);
      legenda.forEach((x) => {
        const v = er.valores[x.cod] || 0;
        if (!v) return;
        const ok = er.id && filtroDe(x);
        const s = novo(ok ? 'button' : 'span', 'an-seg', null, barra);
        s.style.flexGrow = v;
        s.style.background = x.cor;
        if (x.borda) s.classList.add('borda');
        if (corClara(x.cor)) s.classList.add('clara');
        s.title = er.nome + ' · ' + x.nome + ': ' + espacos(v) + ' (' + fmtPct(v, er.total) + ')' + (ok ? ' · clique para ver na planta' : '');
        if (v / er.total >= 0.09) novo('span', null, fmtPct(v, er.total), s);
        if (ok) {
          s.type = 'button';
          s.addEventListener('click', () => acoes.verNaPlanta(Object.assign({ er: er.id }, ok)));
        }
      });
    });
  }

  /**
   * GMV esperado × espaço, numa ER por vez (escolhida nos botões; começa pela ER em destaque): gráfico de
   * dispersão com um ponto por movimento — fatia do espaço (x) e fatia do GMV esperado (y), entre os
   * movimentos com GMV da ER, na mesma escala. A diagonal é o índice 1×: acima dela o movimento rende
   * mais que o espaço que ocupa; abaixo, menos.
   */
  function gmvEspaco(pai, d, acoes, redesenhar) {
    if (!d.movimentos.some((m) => m.gmv > 0)) return;
    const ers = d.ers.filter((e) => e.total);
    const er = ers.find((e) => e.id === vistaGmv.er) || erDestaque(d);
    const c = cartao(pai, 'GMV esperado × espaço',
      'Cada ponto é um movimento: a fatia dele no espaço da ER (→) e no GMV esperado (↑), entre os movimentos com GMV dela. Acima da diagonal (1×) rende mais que o espaço que ocupa. Clique num ponto para ver na planta.', 'an-gmv-cartao');
    if (ers.length > 1) {
      const seg = novo('div', 'an-segmentado', null, novo('div', 'an-controles', null, c.querySelector('.an-cartao-topo')));
      seg.setAttribute('role', 'group');
      seg.setAttribute('aria-label', 'ER');
      ers.forEach((e) => {
        const b = novo('button', null, e.nome, seg);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(e.id === er.id));
        b.addEventListener('click', () => { vistaGmv.er = e.id; redesenhar(); });
      });
    }
    const g = gmvNaEr(d, er);
    if (!g.linhas.length) { novo('p', 'an-vazio', 'Nenhum movimento com GMV esperado na ' + er.nome + '.', c); return; }
    const nivel = (idx) => (idx >= 1.3 ? 'alto' : idx <= 0.7 ? 'baixo' : 'medio');
    const leg = novo('div', 'an-legenda', null, c);
    [['alto', 'Rende mais (1,3× ou mais)'], ['medio', 'Perto do espaço que ocupa'], ['baixo', 'Rende menos (0,7× ou menos)']].forEach(([n, rot]) => {
      const s = novo('span', null, null, leg);
      novo('i', 'an-disp-cor ' + n, null, s);
      novo('span', null, rot, s);
    });
    const s = novo('span', null, null, leg);
    novo('i', 'an-disp-diag', null, s);
    novo('span', null, '1×: GMV na mesma fatia do espaço', s);

    const caixa = novo('div', 'an-disp', null, c);
    const NS = 'http://www.w3.org/2000/svg';
    const el = (tag, at, paiSvg) => {
      const n = document.createElementNS(NS, tag);
      Object.keys(at).forEach((k) => n.setAttribute(k, at[k]));
      if (paiSvg) paiSvg.appendChild(n);
      return n;
    };
    // Desenha na largura real do cartão (os textos ficam no tamanho certo); a altura acompanha.
    const W = Math.max(320, Math.round(caixa.clientWidth || 760));
    if (observaLargura) observaLargura.disconnect();
    if (typeof ResizeObserver === 'function') {
      let espera = 0;
      observaLargura = new ResizeObserver(() => {
        clearTimeout(espera);
        espera = setTimeout(() => {
          const agora = caixa.clientWidth;
          if (caixa.isConnected && agora && Math.abs(Math.max(320, agora) - W) > 24) redesenhar();
        }, 150);
      });
      observaLargura.observe(caixa);
    }
    const H = Math.round(Math.min(440, Math.max(280, W * 0.5)));
    const M = { t: 14, r: 18, b: 42, l: 50 };
    const pw = W - M.l - M.r, ph = H - M.t - M.b;
    const maior = Math.max.apply(null, g.linhas.map((x) => Math.max(x.fe, x.fg)));
    const passo = maior <= 0.2 ? 0.05 : maior <= 0.5 ? 0.1 : 0.2;
    const topo = Math.min(1, Math.ceil((maior * 1.08) / passo) * passo);
    const X = (v) => M.l + (v / topo) * pw;
    const Y = (v) => M.t + ph - (v / topo) * ph;
    const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', class: 'an-disp-svg', role: 'img',
      'aria-label': 'GMV esperado × espaço na ' + er.nome + ': um ponto por movimento' }, null);
    caixa.appendChild(svg);

    // Áreas acima (rende mais) e abaixo (rende menos) da diagonal, grade e eixos.
    el('polygon', { class: 'an-disp-zona alto', points: [X(0), Y(0), X(topo), Y(topo), X(0), Y(topo)].join(' ') }, svg);
    el('polygon', { class: 'an-disp-zona baixo', points: [X(0), Y(0), X(topo), Y(0), X(topo), Y(topo)].join(' ') }, svg);
    for (let v = 0; v <= topo + 1e-9; v += passo) {
      el('line', { class: 'an-disp-grade', x1: M.l, x2: M.l + pw, y1: Y(v), y2: Y(v) }, svg);
      el('line', { class: 'an-disp-grade', x1: X(v), x2: X(v), y1: M.t, y2: M.t + ph }, svg);
      el('text', { class: 'an-disp-tick', x: M.l - 8, y: Y(v) + 4, 'text-anchor': 'end' }, svg).textContent = fmtPctNum(v);
      el('text', { class: 'an-disp-tick', x: X(v), y: M.t + ph + 16, 'text-anchor': 'middle' }, svg).textContent = fmtPctNum(v);
    }
    el('line', { class: 'an-disp-eixo', x1: M.l, x2: M.l + pw, y1: M.t + ph, y2: M.t + ph }, svg);
    el('line', { class: 'an-disp-eixo', x1: M.l, x2: M.l, y1: M.t, y2: M.t + ph }, svg);
    el('line', { class: 'an-disp-diagonal', x1: X(0), y1: Y(0), x2: X(topo), y2: Y(topo) }, svg);
    el('text', { class: 'an-disp-zona-txt', x: M.l + 8, y: M.t + 14 }, svg).textContent = '▲ Rende mais que o espaço';
    el('text', { class: 'an-disp-zona-txt', x: M.l + pw - 8, y: M.t + ph - 8, 'text-anchor': 'end' }, svg).textContent = '▼ Rende menos que o espaço';
    el('text', { class: 'an-disp-titulo-eixo', x: M.l + pw / 2, y: H - 6, 'text-anchor': 'middle' }, svg).textContent = 'Fatia do espaço na ' + er.nome + ' →';
    el('text', { class: 'an-disp-titulo-eixo', x: 14, y: M.t + ph / 2, 'text-anchor': 'middle', transform: 'rotate(-90 14 ' + (M.t + ph / 2) + ')' }, svg)
      .textContent = 'Fatia do GMV esperado →';

    // Pontos (os de maior GMV por cima e com o nome primeiro); o nome só entra onde não cobre outro.
    const ordem = g.linhas.slice().sort((a, b) => b.m.gmv - a.m.gmv);
    const ocupado = ordem.map((x) => ({ x: X(x.fe) - 7, y: Y(x.fg) - 7, w: 14, h: 14 }));
    ocupado.push({ x: M.l, y: M.t, w: 180, h: 20 }, { x: M.l + pw - 180, y: M.t + ph - 22, w: 180, h: 22 });
    const livre = (r) => r.x >= M.l && r.x + r.w <= M.l + pw && r.y >= M.t && r.y + r.h <= M.t + ph
      && !ocupado.some((o) => r.x < o.x + o.w && o.x < r.x + r.w && r.y < o.y + o.h && o.y < r.y + r.h);
    const dica = novo('div', 'an-disp-dica', null, caixa);
    dica.hidden = true;
    const grupoPontos = el('g', {}, svg);
    const grupoNomes = el('g', {}, svg);
    ordem.slice().reverse().forEach(({ m, fe, fg, idx }) => {
      const cx = X(fe), cy = Y(fg);
      const p = el('g', { class: 'an-disp-ponto ' + nivel(idx), tabindex: '0', role: 'button' }, grupoPontos);
      const txtIdx = idx.toLocaleString('pt-BR', { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + '×';
      p.setAttribute('aria-label', m.texto + ': ' + fmtPctNum(fe) + ' do espaço, ' + fmtPctNum(fg) + ' do GMV esperado, ' + txtIdx);
      el('circle', { class: 'an-disp-alvo', cx, cy, r: 13 }, p);
      el('circle', { class: 'an-disp-marca', cx, cy, r: 6 }, p);
      const mostrar = () => {
        dica.innerHTML = '';
        novo('strong', null, m.texto, dica);
        novo('span', null, fmtPctNum(fe) + ' do espaço (' + espacos(m.porEr[er.id]) + ')', dica);
        novo('span', null, fmtPctNum(fg) + ' do GMV esperado (' + gmvCompleto.format(m.gmv) + ')', dica);
        novo('b', 'an-disp-idx ' + nivel(idx), (idx >= 1.3 ? '▲ ' : idx <= 0.7 ? '▼ ' : '') + txtIdx + ' o espaço que ocupa', dica);
        dica.hidden = false;
        const k = svg.getBoundingClientRect().width / W;
        const esquerda = cx * k > caixa.clientWidth / 2;
        dica.style.left = esquerda ? '' : (cx * k + 12) + 'px';
        dica.style.right = esquerda ? (caixa.clientWidth - cx * k + 12) + 'px' : '';
        dica.style.top = Math.max(0, cy * k - 20) + 'px';
      };
      const esconder = () => { dica.hidden = true; };
      const abrir = () => acoes.verNaPlanta({ er: er.id, etiqueta: m.texto });
      p.addEventListener('mouseenter', mostrar);
      p.addEventListener('focus', mostrar);
      p.addEventListener('mouseleave', esconder);
      p.addEventListener('blur', esconder);
      p.addEventListener('click', abrir);
      p.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } });
    });
    ordem.forEach(({ m, fe, fg }) => {
      const cx = X(fe), cy = Y(fg);
      const nome = m.texto.length > 22 ? m.texto.slice(0, 21) + '…' : m.texto;
      const w = nome.length * 6.3 + 4, h = 14;
      const lugar = [
        { x: cx + 10, y: cy - h / 2, a: 'start' },
        { x: cx - 10 - w, y: cy - h / 2, a: 'end' },
        { x: cx - w / 2, y: cy - 10 - h, a: 'middle' },
        { x: cx - w / 2, y: cy + 10, a: 'middle' },
      ].find((r) => livre({ x: r.x, y: r.y, w, h }));
      if (!lugar) return;
      ocupado.push({ x: lugar.x, y: lugar.y, w, h });
      const tx = lugar.a === 'start' ? lugar.x : lugar.a === 'end' ? lugar.x + w : cx;
      el('text', { class: 'an-disp-nome', x: tx, y: lugar.y + 11, 'text-anchor': lugar.a }, grupoNomes).textContent = nome;
    });
  }

  /** Cores dos espaços na legenda: só para separar um espaço do outro (não são marcas). */
  const CORES_LEGENDA = ['#3346B8', '#2F9E6B', '#D9822B', '#8E44AD', '#C2410C', '#0E7490'];

  /**
   * Legenda "O que conta como espaço": cada tipo de móvel das plantas, com os espaços dele em cores,
   * separado em espaço de exposição, espaço de VM e fora da conta.
   */
  function legendaEspacos(c, d, acoes) {
    const tipos = d.tiposDeMovel || [];
    if (!tipos.length || !acoes.miniatura) return;
    [
      ['expo', 'Espaço de exposição', 'o mapa e os gráficos do Analytics'],
      ['vm', 'Espaço de VM', 'contado à parte, na seção "Espaços de VM"'],
      ['fora', 'Fora da conta', ''],
    ].forEach(([grupo, titulo, sub]) => {
      const doGrupo = tipos.filter((t) => t.grupo === grupo);
      if (!doGrupo.length) return;
      const h = novo('h4', 'an-espacos-grupo', titulo, c);
      if (sub) novo('span', null, sub, h);
      const lista = novo('ul', 'an-espacos', null, c);
      doGrupo.forEach((t) => {
        const li = novo('li', 'an-espaco-tipo' + (grupo === 'fora' ? ' fora' : ''), null, lista);
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'an-espaco-mini');
        svg.setAttribute('aria-hidden', 'true');
        li.appendChild(svg);
        const cor = (id) => {
          const k = t.espacos.findIndex((e) => e.id === id);
          return k < 0 ? null : CORES_LEGENDA[k % CORES_LEGENDA.length];
        };
        // Espaço null: estrutura (fica cinza), ou o móvel inteiro quando ele não se divide em espaços.
        acoes.miniatura(svg, t.movel, (e) => cor(e ? e.id : ''), 84, 56, t.verso);
        const txt = novo('div', 'an-espaco-texto', null, li);
        novo('strong', null, t.nome + (t.verso ? ' · verso' : ''), txt);
        novo('span', 'an-espaco-qtd', grupo === 'fora' ? 'Não conta' : espacos(t.espacos.reduce((s, e) => s + e.peso, 0)), txt);
        if (t.nota) novo('span', 'an-espaco-nota', t.nota, txt);
        if (!t.espacos.length) return;
        const nomes = novo('span', 'an-espaco-nomes', null, txt);
        t.espacos.forEach((e) => {
          const sp = novo('span', null, null, nomes);
          novo('i', null, null, sp).style.background = cor(e.id);
          novo('span', null, e.nome + (e.peso === 0.5 ? ' · ½' : ''), sp);
        });
      });
    });
  }

  /** Seção "Espaços de VM": o mapa de calor só com os espaços de VM, fora da conta da exposição. */
  function secaoVm(pai, d, acoes, redesenhar) {
    if (!d.vm || !d.vm.ers.some((e) => e.total)) return;
    const titulo = novo('div', 'an-secao', null, pai);
    novo('h3', null, 'Espaços de VM', titulo);
    novo('p', null, 'PDV móvel, verso da mesa destaque, os três painéis do totem e balcão recepção. São comunicação visual: '
      + 'não entram na conta do espaço de exposição acima.', titulo);
    mapa(pai, Object.assign({}, d, d.vm), acoes, redesenhar, {
      titulo: 'Espaço de VM de cada movimento em cada ER',
      sub: 'Quanto mais escuro, maior a fatia do espaço de VM da ER. Clique numa célula para ver na planta.',
      classe: 'an-vm-cartao',
      vista: vistaVm,
    });
  }

  /**
   * Desenha o dashboard em corpo. dados: App.dadosAnalytics; acoes: { verNaPlanta(filtro), miniatura(svg, movel, corDoEspaco, w, h, verso) }.
   */
  function desenhar(corpo, d, acoes) {
    const redesenhar = () => desenhar(corpo, d, acoes);
    const rolagem = corpo.scrollTop;
    corpo.innerHTML = '';
    const grade = novo('div', 'an-grade', null, corpo);
    mapa(grade, d, acoes, redesenhar, {
      titulo: 'Espaço de exposição de cada movimento em cada ER',
      sub: 'Quanto mais escuro, maior a fatia da ER. Um espaço com dois movimentos conta nos dois (na pirâmide, as etiquetas dividem o espaço). Clique no nome de uma ER para ordenar por ela e numa célula para ver na planta.',
      vista,
    });
    const dupla = novo('div', 'an-dupla', null, grade);
    const legMarcas = d.marcas.map((m) => ({ cod: m.cod, nome: m.nome, cor: m.cor, borda: m.cod === 'NEUTRO', filtravel: m.filtravel }));
    barrasPorEr(dupla, 'Marcas em cada ER', 'Fatia do espaço de cada ER por marca. Combinações de marcas dividem o espaço igualmente.',
      d, 'porMarca', legMarcas, (x) => (x.filtravel ? { marca: x.cod } : null), acoes);
    const legClasses = d.classes.map((c) => ({ cod: c.cod, nome: c.nome, cor: c.cor, filtravel: true }))
      .concat([{ cod: '__LIVRE__', nome: 'Sem movimento', cor: COR_SEM_MOVIMENTO, borda: true }]);
    barrasPorEr(dupla, 'Classificação em cada ER', 'Fatia do espaço de cada ER por tipo de movimento (aba "' + d.abaTipos + '"). Um espaço com movimentos de dois tipos se divide entre eles.',
      d, 'porClasse', legClasses, (x) => (x.cod === '__LIVRE__' ? null : { classificacao: x.cod }), acoes);
    gmvEspaco(grade, d, acoes, redesenhar);
    secaoVm(grade, d, acoes, redesenhar);
    corpo.scrollTop = rolagem;
  }

  /**
   * "Sobre a análise": como as contas são feitas e a legenda do que conta como espaço.
   * acoes: { miniatura(svg, movel, corDoEspaco, w, h, verso) }.
   */
  function desenharInfo(corpo, d, acoes) {
    corpo.innerHTML = '';
    const regras = novo('ul', 'an-info-regras', null, corpo);
    const regra = (partes) => frase(novo('li', null, null, regras), partes);
    regra([['Cada ER é um tamanho médio da rede'], ' (as lojas daquele tamanho'
      + '). Por isso as contas são feitas dentro de cada ER e as ERs são comparadas lado a lado, ', ['nunca somadas'], '.']);
    regra(['A conta é em ', ['quantidade de espaços'], ', não em metros. Na gôndola, cada ponta e cada meio é um espaço; meio dividido vale ½ espaço para cada metade. Na mesa destaque, cada frente é um espaço. Na pirâmide, as etiquetas dividem o espaço (duas etiquetas: ½ para cada). Os demais móveis contam como um espaço.']);
    regra([['Espaço de VM'], ' (PDV móvel, verso da mesa destaque, cada painel do totem e balcão recepção) é comunicação visual: fica fora das contas do espaço de exposição e aparece à parte, na seção "Espaços de VM".']);
    regra(['Um espaço com dois movimentos conta nos dois no mapa de calor e se divide entre as classificações deles nas barras. Combinações de marcas dividem o espaço igualmente. Etiquetas com o mesmo texto somam juntas.']);
    regra(['O ', ['GMV esperado'], ' é o do movimento no ciclo (aba "' + d.abaTipos + '"), comparado com o espaço dentro de cada ER.']);
    const leg = novo('section', 'an-info-legenda', null, corpo);
    novo('h3', null, 'O que conta como espaço', leg);
    novo('p', 'an-info-sub', 'Cada cor na miniatura é um espaço na conta do Analytics; as partes em cinza não contam ali.', leg);
    legendaEspacos(leg, d, acoes);
  }

  return { desenhar, desenharInfo };
})();
</script>
