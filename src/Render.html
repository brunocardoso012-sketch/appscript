<script>
/**
 * ============================================================================
 *  RENDERIZADOR DA PLANTA (SVG isométrico, 1920×1080 — formato de slide)
 * ============================================================================
 *  Render.desenhar(svg, contexto) redesenha o slide inteiro:
 *   - planta isométrica (piso, paredes e móveis coloridos pela marca);
 *   - etiquetas de cada móvel (com desvio automático de sobreposição);
 *   - caixas de destaque (CALLOUT), painel lateral (TV / A / C), notas,
 *     legenda de símbolos e faixa de itens extras.
 *  Todo o estilo vai em atributos SVG (não em CSS) para o PNG exportado
 *  ficar idêntico ao que aparece na tela.
 */
const Render = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const FONTE = 'Arial, Helvetica, sans-serif';
  // Etiquetas: fonte arredondada (Nunito, carregada no <head>; no PNG ela vai embutida no SVG).
  const FONTE_ETQ = "Nunito, 'Segoe UI', Arial, sans-serif";
  const COS30 = Math.cos(Math.PI / 6);

  const TELA = { w: 1920, h: 1080, fundo: '#F3EFEA' };
  const REGIAO_PLANTA = { x: 500, y: 70, w: 1400, h: 950 };
  const LIMITES = { x0: 470, y0: 8, x1: 1912, y1: 1072 };
  const ETQ = { fonte: 12.5, lh: 15, padX: 10, padY: 4, gap: 4, maxTexto: 190, simbolo: 20, raio: 9 };
  // Quantas prateleiras (níveis) cada tipo de móvel tem: o desenho e o planograma da tela do móvel usam esta tabela.
  const PRATELEIRAS = { GONDOLA: 4, PIRAMIDE: 4, FILA: 3, GONDOLA_PAREDE: 5, VITRINE_L: 2, ILHA_OUI: 3, MAKE: 5 };
  // Móveis que mostram o número (do fim do ID: "MOVEL DE FILA 3" → 3) numa plaquinha na planta.
  const NUMERADOS = ['PIRAMIDE', 'GONDOLA', 'FILA'];
  const NUMERO = { lado: 18, fonte: 11.5 };
  const CALLOUT = { fonte: 12.5, lh: 16, pad: 9, maxW: 360 };
  const COR = {
    contorno: '#1C1C1C',
    contornoNeutro: '#B5B5B5',
    prateleiraNeutra: '#D0D0D0',
    neutro: '#F7F7F7',
    piso: '#EAEAEA',
    pisoBorda: '#D7D7D7',
    textoNota: '#1F3B73',
    tituloNota: '#0B2A5B',
    etiquetaPadrao: '#4A4A4A',
    metal: '#A7ABB1',
    tela: '#C9CCD1',
    rodape: '#4B4F56',
    // Filtro por marca: as outras marcas ficam em cinza (etiquetas mais escuras, móveis mais claros).
    cinzaEtiqueta: '#8C8C8C',
    cinzaMovel: '#D2D2D2',
  };
  const ESPESSURA_PAREDE = 0.35;
  const ESPESSURA_PISO = 0.35;

  let marcas = {};
  let filtroMarca = ''; // marca destacada pelo filtro ('' = todas coloridas)
  let defs = null;
  let gradientes = {};

  /* ------------------------------ utilidades ------------------------------ */

  function el(tag, attrs, pai) {
    const e = document.createElementNS(NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach((k) => {
        if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
      });
    }
    if (pai) pai.appendChild(e);
    return e;
  }

  function texto(pai, x, y, conteudo, attrs) {
    const t = el('text', Object.assign({ x, y, 'font-family': FONTE }, attrs), pai);
    t.textContent = conteudo;
    return t;
  }

  /** Dica ao passar o mouse (<title> precisa ser o primeiro filho). */
  function dica(alvo, conteudo) {
    const t = document.createElementNS(NS, 'title');
    t.textContent = conteudo;
    alvo.insertBefore(t, alvo.firstChild);
  }

  const pontos = (lista) => lista.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  function poligono(pai, lista, attrs) {
    return el('polygon', Object.assign({ points: pontos(lista) }, attrs), pai);
  }

  function linha(pai, a, b, attrs) {
    return el('line', Object.assign({ x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1) }, attrs), pai);
  }

  const medidor = document.createElement('canvas').getContext('2d');
  function largura(txt, tam, peso, estilo, fonte) {
    medidor.font = (estilo || 'normal') + ' ' + (peso || 700) + ' ' + tam + 'px ' + (fonte || FONTE);
    return medidor.measureText(txt).width;
  }

  /** Quebra o texto em linhas que caibam em maxW (respeita quebras de linha). */
  function quebrar(txt, maxW, tam, peso, fonte) {
    const linhas = [];
    String(txt).split('\n').forEach((par) => {
      if (!par.trim()) { linhas.push(''); return; }
      let atual = '';
      par.trim().split(/\s+/).forEach((palavra) => {
        const tentativa = atual ? atual + ' ' + palavra : palavra;
        if (!atual || largura(tentativa, tam, peso, 'normal', fonte) <= maxW) atual = tentativa;
        else { linhas.push(atual); atual = palavra; }
      });
      linhas.push(atual);
    });
    while (linhas.length > 1 && linhas[linhas.length - 1] === '') linhas.pop();
    return linhas;
  }

  /* -------------------------------- cores --------------------------------- */

  function rgb(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16));
  }
  function paraHex(v) {
    return '#' + v.map((c) => Math.round(Math.max(0, Math.min(255, c))).toString(16).padStart(2, '0')).join('');
  }
  function misturar(cor, alvo, t) {
    const a = rgb(cor);
    const b = rgb(alvo);
    return paraHex(a.map((v, i) => v + (b[i] - v) * t));
  }

  /** Cor fosca para os móveis: tira parte da saturação (mistura com o cinza de mesma luminância). */
  function fosco(cor) {
    const [r, g, b] = rgb(cor);
    const cinza = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
    return misturar(cor, paraHex([cinza, cinza, cinza]), 0.3);
  }

  /**
   * "BOT+QDB" → ['#..', '#..'] ; tipo = 'movel' (cores foscas) | 'etiqueta' (cores da marca).
   * filtrar: com uma marca no filtro, as outras viram cinza (cinzaMovel / cinzaEtiqueta).
   */
  function coresDe(valor, tipo, filtrar) {
    if (!valor) return null;
    const cinza = tipo === 'movel' ? COR.cinzaMovel : COR.cinzaEtiqueta;
    const cores = String(valor).split('+').map((p) => p.trim()).map((p) => {
      const cor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(p) ? p : marcas[p] ? marcas[p][tipo] : null;
      if (!cor) return null;
      if (filtrar && filtroMarca && p !== filtroMarca) return cinza;
      return tipo === 'movel' ? fosco(cor) : cor;
    }).filter(Boolean);
    if (!cores.length) return null;
    // Combinação toda em cinza vira uma cor só (sem degradê cinza-cinza).
    return cores.every((c) => c === cinza) ? [cinza] : cores;
  }

  /** Cor da etiqueta sem marca: cinza escuro padrão (ou o cinza do filtro, quando há marca filtrada). */
  const corEtiquetaPadrao = (filtrar) => [filtrar && filtroMarca ? COR.cinzaEtiqueta : COR.etiquetaPadrao];

  function ehNeutro(valor) {
    return !valor || valor === 'NEUTRO';
  }

  /** Cor sólida ou degradê (para combinações de marcas). sombra < 0 clareia, > 0 escurece. */
  function tinta(cores, sombra) {
    const aplicar = (c) => (sombra < 0 ? misturar(c, '#FFFFFF', -sombra) : sombra > 0 ? misturar(c, '#000000', sombra) : c);
    if (cores.length === 1) return aplicar(cores[0]);
    const chave = cores.join('-') + '|' + sombra;
    if (!gradientes[chave]) {
      const id = 'grad' + Object.keys(gradientes).length;
      const g = el('linearGradient', { id, x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
      cores.forEach((c, i) => el('stop', { offset: i / (cores.length - 1), 'stop-color': aplicar(c) }, g));
      gradientes[chave] = 'url(#' + id + ')';
    }
    return gradientes[chave];
  }

  /* ------------------------------ projeção -------------------------------- */

  function criarProjecao(loja) {
    const W = loja.largura;
    const D = loja.profundidade;
    const H = loja.alturaParede;
    const t = ESPESSURA_PAREDE;
    const cantos = [
      [-t, -t, H], [W, -t, H], [-t, D, H],
      [W, -t, -ESPESSURA_PISO], [W, D, -ESPESSURA_PISO], [-t, D, -ESPESSURA_PISO],
    ];
    const bruto = (p) => [(p[0] - p[1]) * COS30, (p[0] + p[1]) * 0.5 - p[2]];
    const bx = cantos.map((p) => bruto(p)[0]);
    const by = cantos.map((p) => bruto(p)[1]);
    const minX = Math.min.apply(null, bx);
    const minY = Math.min.apply(null, by);
    const larg = Math.max.apply(null, bx) - minX;
    const alt = Math.max.apply(null, by) - minY;
    const s = Math.min(REGIAO_PLANTA.w / larg, REGIAO_PLANTA.h / alt);
    const ox = REGIAO_PLANTA.x + (REGIAO_PLANTA.w - larg * s) / 2 - minX * s;
    const oy = REGIAO_PLANTA.y + (REGIAO_PLANTA.h - alt * s) / 2 - minY * s;
    return {
      escala: s,
      P: (x, y, z) => [ox + (x - y) * COS30 * s, oy + ((x + y) * 0.5 - (z || 0)) * s],
    };
  }

  /* --------------------------- caixas (móveis) ---------------------------- */

  /**
   * Desenha uma caixa isométrica, sempre opaca (cores sobrepostas confundiam a leitura).
   * est: { cores, vidro, prateleiras, modulo, gradeTopo, moldura } — vidro só deixa as linhas
   * internas tracejadas, para lembrar o material.
   */
  function caixa(pai, P, b, est) {
    const x0 = b.x, x1 = b.x + b.w, y0 = b.y, y1 = b.y + b.d, z0 = b.z, z1 = b.z + b.h;
    const neutro = !est.cores;
    const base = est.cores || [est.corNeutra || COR.neutro];
    const contorno = neutro ? COR.contornoNeutro : COR.contorno;
    const comum = { stroke: contorno, 'stroke-width': neutro ? 1 : 1.3, 'stroke-linejoin': 'round' };

    const esq = [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)]; // face y = y1
    const dir = [P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)]; // face x = x1
    const topo = [P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)];
    poligono(pai, esq, Object.assign({ fill: tinta(base, neutro ? 0.03 : 0) }, comum));
    poligono(pai, dir, Object.assign({ fill: tinta(base, neutro ? 0.1 : 0.16) }, comum));
    poligono(pai, topo, Object.assign({ fill: tinta(base, neutro ? 0 : -0.3) }, comum));

    const detalhe = neutro
      ? { stroke: COR.prateleiraNeutra, 'stroke-width': 1 }
      : est.vidro
        ? { stroke: misturar(base[0], '#000000', 0.35), 'stroke-width': 1, 'stroke-dasharray': '5 4' }
        : { stroke: misturar(base[0], '#000000', 0.35), 'stroke-width': 1 };

    // Prateleiras.
    const n = est.prateleiras || 0;
    for (let k = 1; k < n; k++) {
      const z = z0 + (b.h * k) / n;
      if (b.w > 0.3) linha(pai, P(x0, y1, z), P(x1, y1, z), detalhe);
      if (b.d > 0.3) linha(pai, P(x1, y0, z), P(x1, y1, z), detalhe);
    }
    // Divisórias verticais (módulos).
    if (est.modulo) {
      const nx = Math.round(b.w / est.modulo);
      for (let k = 1; k < nx; k++) {
        const x = x0 + (b.w * k) / nx;
        linha(pai, P(x, y1, z0), P(x, y1, z1), detalhe);
      }
      const ny = Math.round(b.d / est.modulo);
      for (let k = 1; k < ny; k++) {
        const y = y0 + (b.d * k) / ny;
        linha(pai, P(x1, y, z0), P(x1, y, z1), detalhe);
      }
    }
    if (est.gradeTopo) {
      const xm = (x0 + x1) / 2;
      const ym = (y0 + y1) / 2;
      linha(pai, P(xm, y0, z1), P(xm, y1, z1), detalhe);
      linha(pai, P(x0, ym, z1), P(x1, ym, z1), detalhe);
    }
    if (est.moldura) {
      const m = 0.12;
      const face = b.d >= b.w
        ? [P(x1, y0 + b.d * m, z0 + b.h * m), P(x1, y1 - b.d * m, z0 + b.h * m), P(x1, y1 - b.d * m, z1 - b.h * m), P(x1, y0 + b.d * m, z1 - b.h * m)]
        : [P(x0 + b.w * m, y1, z0 + b.h * m), P(x1 - b.w * m, y1, z0 + b.h * m), P(x1 - b.w * m, y1, z1 - b.h * m), P(x0 + b.w * m, y1, z1 - b.h * m)];
      poligono(pai, face, Object.assign({ fill: 'none' }, detalhe, { 'stroke-dasharray': '6 4' }));
    }
  }

  const espessuraL = (m) => Math.min(0.6, m.w / 2, m.d / 2);

  /** [comprimento, largura] do móvel: o lado maior é o eixo "u". */
  const eixos = (b) => (b.w >= b.d ? [b.w, b.d] : [b.d, b.w]);

  /** Caixa em coordenadas locais do móvel (u ao longo do lado maior, v = 0 no lado do fundo). */
  function caixaLocal(b, u0, u1, v0, v1, z0, z1) {
    const base = { z: b.z + z0, h: z1 - z0 };
    return b.w >= b.d
      ? Object.assign(base, { x: b.x + u0, w: u1 - u0, y: b.y + v0, d: v1 - v0 })
      : Object.assign(base, { x: b.x + v0, w: v1 - v0, y: b.y + u0, d: u1 - u0 });
  }

  /** Espaços do móvel: gôndola, mesas, painéis do totem e testeiras do make (mesma regra de espacosDoMovel_ em Config.gs). */
  function espacos(m) {
    const numerados = (prefixo, nome, n) => Array.from({ length: n }, (_, i) => ({ id: prefixo + '-' + (i + 1), nome: nome + ' ' + (i + 1) }));
    if (!m) return [];
    if (m.tipo === 'MAKE') return numerados('TESTEIRA', 'Testeira', 4);
    if (m.tipo === 'MESA') return numerados('FRENTE', 'Frente', 2);
    if (m.tipo === 'MESA_3') return numerados('FRENTE', 'Frente', 3);
    if (m.tipo === 'TOTEM') return numerados('PAINEL', 'Painel', 3);
    if (m.tipo !== 'GONDOLA') return [];
    const div = String(m.dividido || '').toUpperCase();
    const lista = [{ id: 'LADO-A', nome: 'Lado A' }];
    ['A', 'B'].forEach((lado) => {
      if (div.indexOf(lado) >= 0) {
        lista.push({ id: 'MEIO-' + lado + '-1', nome: 'Meio ' + lado + ' (metade 1)' });
        lista.push({ id: 'MEIO-' + lado + '-2', nome: 'Meio ' + lado + ' (metade 2)' });
      } else {
        lista.push({ id: 'MEIO-' + lado, nome: 'Meio ' + lado });
      }
    });
    lista.push({ id: 'LADO-B', nome: 'Lado B' });
    return lista;
  }

  /**
   * Caixa de cada espaço da gôndola: os lados (pontas) nas extremidades do lado maior
   * e os dois meios lado a lado. "A" é sempre o que está virado para quem olha a planta:
   * o lado A fica na ponta mais à frente e o meio A na face mais à frente.
   */
  function caixasGondola(m) {
    const aoLongoDeX = m.w >= m.d;
    const L = aoLongoDeX ? m.w : m.d; // comprimento
    const C = aoLongoDeX ? m.d : m.w; // largura (de um meio ao outro)
    const p = Math.min(0.6, L * 0.18); // espessura da ponta
    const meio = (L - 2 * p) / 2;
    const faixa = { 'LADO-B': [0, p, 0, C], 'LADO-A': [L - p, L, 0, C] };
    ['A', 'B'].forEach((lado) => {
      const v = lado === 'A' ? [C / 2, C] : [0, C / 2];
      faixa['MEIO-' + lado] = [p, L - p, v[0], v[1]];
      // Metades com um vão entre elas, para a divisão ficar visível na planta.
      faixa['MEIO-' + lado + '-1'] = [p, p + meio - 0.06, v[0], v[1]];
      faixa['MEIO-' + lado + '-2'] = [p + meio + 0.06, L - p, v[0], v[1]];
    });
    return espacos(m).map((e) => {
      const [u0, u1, v0, v1] = faixa[e.id];
      const caixaXY = aoLongoDeX
        ? { x: m.x + u0, w: u1 - u0, y: m.y + v0, d: v1 - v0 }
        : { x: m.x + v0, w: v1 - v0, y: m.y + u0, d: u1 - u0 };
      return Object.assign(caixaXY, { z: m.z, h: m.h, movel: m, espaco: e });
    });
  }

  /**
   * Etiquetas da gôndola, por espaço: cada espaço mostra as etiquetas da própria linha
   * (GONDOLA 1/MEIO-A…), até "limite", empilhadas em cima dele. A metade sem linha própria
   * usa a do meio (MEIO-A-1 → MEIO-A); metades iguais viram uma pilha só (juntarIguais).
   * @return {Array<{id, info, etiquetas, simbolo, pontos}|null>} na ordem dos espaços (null = sem etiqueta)
   */
  function etiquetasGondola(m, infoEspaco, limite) {
    return caixasGondola(m).map((b) => {
      const id = m.id + '/' + b.espaco.id;
      const proprio = infoEspaco[id];
      return proprio && proprio.etiquetas.length
        ? { id, info: proprio, etiquetas: proprio.etiquetas.slice(0, limite || 1), simbolo: proprio.simbolo, pontos: [[b.x + b.w / 2, b.y + b.d / 2, b.z + b.h]] }
        : null;
    });
  }

  /**
   * Blocos vizinhos com as mesmas etiquetas (texto e cor) viram uma pilha só, no centro deles.
   * lista: itens { id, info, etiquetas, simbolo, pontos } ou null (bloco sem etiqueta,
   * que separa os vizinhos). Devolve os itens com topo = ponto 3D médio.
   */
  function juntarIguais(lista) {
    const chave = (it) => it.etiquetas.map((e) => e.texto + '|' + (e.marca || it.info.marca || '')).join('||');
    const saida = [];
    let anterior = null;
    lista.forEach((it) => {
      if (it && anterior && chave(it) === chave(anterior)) {
        anterior.pontos = anterior.pontos.concat(it.pontos);
        anterior.simbolo = anterior.simbolo || it.simbolo;
        return;
      }
      anterior = it ? Object.assign({}, it) : null;
      if (anterior) saida.push(anterior);
    });
    return saida.map((it) => Object.assign(it, {
      topo: [0, 1, 2].map((k) => it.pontos.reduce((s, p) => s + p[k], 0) / it.pontos.length),
    }));
  }

  /**
   * Painéis do totem, de baixo para cima (k = 0, 1, 2): faixa de altura [z0, z1].
   * Na planilha o Painel 1 é o de cima, então o painel k é o espaço 3 - k.
   */
  const painelTotem = (h, k) => [h * (0.33 + 0.21 * k), h * (0.48 + 0.21 * k)];

  /** Ponto 3D (âncora da etiqueta) de cada bloco de mesa, totem e móvel make, na ordem de espacos(). */
  function topoDosBlocos(m) {
    if (m.tipo === 'TOTEM') {
      // Âncora no meio da face da frente de cada painel (o totem é fino: as etiquetas saem ao lado).
      return espacos(m).map((e, i) => {
        const [z0, z1] = painelTotem(m.h, 2 - i);
        return { espaco: e, topo: [m.x + m.w / 2, m.y + m.d / 2, m.z + (z0 + z1) / 2] };
      });
    }
    if (m.tipo === 'MESA' || m.tipo === 'MESA_3') {
      const [L, C] = eixos(m);
      const n = espacos(m).length;
      return espacos(m).map((e, k) => {
        const c = caixaLocal(m, (k + 0.5) * (L / n), (k + 0.5) * (L / n), C / 2, C / 2, 0, m.h);
        return { espaco: e, topo: [c.x, c.y, c.z + c.h] };
      });
    }
    return primitivas(m).filter((p) => p.espaco).map((p) => ({ espaco: p.espaco, topo: [p.x + p.w / 2, p.y + p.d / 2, p.z + p.h] }));
  }

  /**
   * Balcão em L: canto onde os braços se encontram, conforme o giro
   * (0 = canto da frente, mais perto de quem olha; cada 90° passa para o canto seguinte).
   */
  function cantoL(m) {
    const g = m.giro || 0;
    return { direita: g === 0 || g === 270, frente: g === 0 || g === 90 };
  }

  /** Móvel make: altura onde começa a testeira e fundo da testeira. */
  const testeiraMake = (m) => ({ z: m.h * 0.8, fundo: Math.min(eixos(m)[1], 0.4) });

  /** Quebra um móvel em caixas "ordenáveis" (gôndola → espaços; balcão em L → 3 blocos; make → corpo + testeiras). */
  function primitivas(m) {
    if (m.tipo === 'GONDOLA') return caixasGondola(m);
    if (m.tipo === 'VITRINE_L') {
      const t = espessuraL(m);
      const c = cantoL(m);
      const xBraco = c.direita ? m.x + m.w - t : m.x;
      const yBraco = c.frente ? m.y + m.d - t : m.y;
      // 3 blocos (braço, canto, braço), todos com a cor do balcão; bloco = posição da etiqueta.
      return [
        { x: xBraco, y: c.frente ? m.y : m.y + t, z: m.z, w: t, d: m.d - t, h: m.h, movel: m, bloco: 1 },
        { x: xBraco, y: yBraco, z: m.z, w: t, d: t, h: m.h, movel: m, bloco: 2 },
        { x: c.direita ? m.x : m.x + t, y: yBraco, z: m.z, w: m.w - t, d: t, h: m.h, movel: m, bloco: 3 },
      ];
    }
    if (m.tipo === 'MAKE') {
      const [L] = eixos(m);
      const T = testeiraMake(m);
      const fresta = 0.04;
      const corpo = Object.assign(caixaLocal(m, 0, L, 0, eixos(m)[1], 0, T.z), { movel: m });
      return [corpo].concat(espacos(m).map((e, k) => Object.assign(
        caixaLocal(m, (k * L) / 4 + (k ? fresta / 2 : 0), ((k + 1) * L) / 4 - (k < 3 ? fresta / 2 : 0), 0, T.fundo, T.z, m.h),
        { movel: m, espaco: e },
      )));
    }
    return [{ x: m.x, y: m.y, z: m.z, w: m.w, d: m.d, h: m.h, movel: m }];
  }

  function desenharPrimitiva(pai, P, b, cores) {
    const m = b.movel;
    switch (m.tipo) {
      case 'GONDOLA_PAREDE':
        caixa(pai, P, b, { cores, prateleiras: PRATELEIRAS.GONDOLA_PAREDE, modulo: 2.2 });
        break;
      case 'CUBO': {
        // Cubo de vidro sobre um rodapé escuro.
        const r = Math.min(0.12, b.h * 0.1);
        const m = Math.min(0.06, b.w * 0.05, b.d * 0.05);
        caixa(pai, P, { x: b.x + m, y: b.y + m, z: b.z, w: b.w - 2 * m, d: b.d - 2 * m, h: r }, { cores: [COR.rodape] });
        caixa(pai, P, Object.assign({}, b, { z: b.z + r, h: b.h - r }), { cores, vidro: true });
        break;
      }
      case 'MESA':
      case 'MESA_3': {
        // Mesa destaque: estrutura com pernas, 2 (ou 3) nichos baixos lado a lado em cima e
        // painel de vidro ao fundo com uma lâmina por nicho. Na frente, um cartaz por nicho, da
        // largura da lâmina do fundo, que sobe do chão e termina junto com o topo do nicho.
        const n = m.tipo === 'MESA_3' ? 3 : 2;
        const [L, C] = eixos(b);
        const hBase = b.h * 0.32;
        const hNicho = b.h * 0.15;
        const painel = Math.min(0.15, C * 0.12);
        const fresta = Math.min(0.08, L * 0.04);
        const perna = Math.min(0.08, L * 0.05);
        const passo = L / n;
        const g = 0.03;
        const frente = C - painel; // onde começam os cartazes
        const loc = (u0, u1, v0, v1, z0, z1) => caixaLocal(b, u0, u1, v0, v1, z0, z1);
        const corDe = (k) => (b.coresBlocos ? b.coresBlocos[k] : cores); // cada frente pode ter a cor da própria linha
        const lamina = (k) => [k * passo + (k ? fresta / 2 : 0), (k + 1) * passo - (k < n - 1 ? fresta / 2 : 0)];
        for (let k = 0; k < n; k++) {
          const [u0, u1] = lamina(k);
          caixa(pai, P, loc(u0, u1, 0, painel, hBase, b.h), { cores: corDe(k), vidro: true });
        }
        [[0, painel], [L - perna, painel], [0, frente - perna], [L - perna, frente - perna]].forEach(([u, v]) => {
          caixa(pai, P, loc(u, u + perna, v, v + perna, 0, hBase - 0.06), { cores: [COR.metal] });
        });
        caixa(pai, P, loc(0, L, painel, frente, hBase - 0.06, hBase), { cores: [COR.metal] });
        const v0 = painel + 0.05;
        for (let k = 0; k < n; k++) {
          caixa(pai, P, loc(k * passo + g, (k + 1) * passo - g, v0 + g, frente - g, hBase, hBase + hNicho), { cores: corDe(k), vidro: true });
        }
        for (let k = 0; k < n; k++) {
          const [u0, u1] = lamina(k);
          caixa(pai, P, loc(u0, u1, frente, C, 0, hBase + hNicho), { cores: corDe(k), vidro: true });
        }
        break;
      }
      case 'TOTEM': {
        // Totem: base, montantes e travessa metálicos, tela perfurada embaixo e 3 painéis na cor da marca.
        const [L, C] = eixos(b);
        const t = Math.min(0.12, L * 0.1);
        const base = 0.1;
        const loc = (u0, u1, v0, v1, z0, z1) => caixaLocal(b, u0, u1, v0, v1, z0, z1);
        caixa(pai, P, loc(-0.1, L + 0.1, -0.1, C + 0.1, 0, base), { cores: [COR.metal] });
        caixa(pai, P, loc(0, t, 0, C, base, b.h), { cores: [COR.metal] });
        caixa(pai, P, loc(t, L - t, C * 0.35, C * 0.65, base, b.h * 0.3), { cores: [COR.tela] });
        for (let k = 0; k < 3; k++) {
          // Cada painel pode ter a cor da própria linha (TOTEM 1/PAINEL-1 = o de cima).
          const [z0, z1] = painelTotem(b.h, k);
          caixa(pai, P, loc(t, L - t, 0, C, z0, z1), { cores: b.coresBlocos ? b.coresBlocos[2 - k] : cores, vidro: true });
        }
        caixa(pai, P, loc(t, L - t, 0, C, b.h - t, b.h), { cores: [COR.metal] });
        caixa(pai, P, loc(L - t, L, 0, C, base, b.h), { cores: [COR.metal] });
        break;
      }
      case 'MAKE': {
        if (b.espaco) { // testeira (cada uma com a cor da própria linha na planilha)
          caixa(pai, P, b, { cores });
          break;
        }
        // Corpo do móvel make (encostado na parede, v = 0): painel de fundo, montantes nas pontas,
        // base com rodapé escuro e prateleiras finas inclinadas para a frente, cada uma com a
        // fileira de produtos na borda. As de cima recuam só um pouco (não é escada).
        const [L, C] = eixos(b);
        const loc = (u0, u1, v0, v1, z0, z1) => caixaLocal(b, u0, u1, v0, v1, z0, z1);
        const fundo = Math.min(0.15, C * 0.12);
        const rodape = Math.min(0.12, b.h * 0.05);
        const hBase = b.h * 0.14;
        const montante = Math.min(0.06, L * 0.02);
        const n = PRATELEIRAS.MAKE;
        caixa(pai, P, loc(0, L, 0, fundo, 0, b.h), { cores, modulo: 1.5 });
        caixa(pai, P, loc(0, montante, fundo, C * 0.92, hBase, b.h), { cores: [COR.metal] });
        caixa(pai, P, loc(montante, L - montante, fundo, C, 0, rodape), { cores: [COR.rodape] });
        caixa(pai, P, loc(montante, L - montante, fundo, C, rodape, hBase), { cores });
        const passo = (b.h - hBase - 0.1) / n;
        for (let k = 0; k < n; k++) { // de baixo para cima
          const z = hBase + passo * (k + 0.75);
          const prof = C * (0.9 - 0.05 * k);
          caixa(pai, P, loc(montante, L - montante, fundo, prof, z, z + 0.05), { cores });
          caixa(pai, P, loc(montante + 0.03, L - montante - 0.03, prof - 0.14, prof - 0.02, z + 0.05, z + 0.17), { cores: ['#3A3A3A'] });
        }
        caixa(pai, P, loc(L - montante, L, fundo, C * 0.92, hBase, b.h), { cores: [COR.metal] });
        break;
      }
      case 'ILHA_OUI': {
        // Ilha premium O.U.i: base com prateleiras e, centralizado em cima dela, um painel alto
        // com a marca e duas faixas verticais mais claras nas laterais da frente do painel.
        const [L, C] = eixos(b);
        const loc = (u0, u1, v0, v1, z0, z1) => caixaLocal(b, u0, u1, v0, v1, z0, z1);
        const hBase = b.h * 0.4;
        const prof = C * 0.3;
        const clara = cores ? cores.map((c) => misturar(c, '#FFFFFF', 0.35)) : null;
        caixa(pai, P, loc(0, L, 0, C, 0, hBase), { cores, vidro: true, prateleiras: PRATELEIRAS.ILHA_OUI, modulo: L / 3 });
        const v0 = (C - prof) / 2;
        caixa(pai, P, loc(L * 0.04, L * 0.96, v0, v0 + prof, hBase, b.h), { cores, vidro: true });
        [[0.1, 0.24], [0.76, 0.9]].forEach(([u0, u1]) => {
          caixa(pai, P, loc(L * u0, L * u1, v0 + prof, v0 + prof + 0.05, hBase + b.h * 0.05, b.h * 0.95), { cores: clara, vidro: true });
        });
        break;
      }
      case 'PAINEL':
      case 'EXPOSITOR_OUI':
        caixa(pai, P, b, { cores, moldura: true });
        break;
      case 'VITRINE_L':
        caixa(pai, P, b, { cores, vidro: true, prateleiras: PRATELEIRAS.VITRINE_L });
        break;
      case 'CAIXA': {
        // Móvel de atendimento: balcão com a tela preta em cima, no lado do fundo (acompanha o giro).
        caixa(pai, P, b, { cores, prateleiras: 0 });
        const [L, C] = eixos(b);
        const tela = caixaLocal(b, L * 0.35, Math.min(L, L * 0.35 + 0.55), C * 0.15, C * 0.15 + 0.12, b.h, b.h + 0.55);
        caixa(pai, P, tela, { cores: ['#5A5A5A'] });
        break;
      }
      case 'PIRAMIDE': {
        // 4 blocos iguais, um em cima do outro (divisões tracejadas, como as prateleiras dos outros móveis).
        caixa(pai, P, b, { cores, vidro: true, prateleiras: PRATELEIRAS.PIRAMIDE });
        break;
      }
      case 'FILA':
        caixa(pai, P, b, { cores, vidro: true, prateleiras: PRATELEIRAS.FILA, modulo: 1.5 });
        break;
      default: // GONDOLA (cada espaço é uma caixa) e tipos desconhecidos
        caixa(pai, P, b, { cores, vidro: true, prateleiras: PRATELEIRAS.GONDOLA });
    }
  }

  /**
   * Plaquinha quadrada com o número do móvel, em perspectiva, colada na face da frente mais comprida
   * e centralizada nela (na gôndola, na ponta A), um pouco acima do pé. Fundo preto, número branco.
   * Devolve o retângulo ocupado na tela (obstáculo para as etiquetas).
   */
  function desenharNumero(pai, P, m, numero, escala) {
    const a = (numero.length > 1 ? NUMERO.lado + 4 : NUMERO.lado) / 2 / escala; // meio lado, em unidades da loja
    const zc = m.z + Math.max(m.h * 0.3, a + 0.1);
    // Face y = y1 (senão, face x = x1). Gôndola: a face da ponta A (a comprida fica atrás da gôndola vizinha).
    const naFrente = m.tipo === 'GONDOLA' ? m.w < m.d : m.w >= m.d;
    const xc = m.x + m.w / 2, yc = m.y + m.d / 2;
    const ponto = (s, t) => (naFrente ? P(xc + s, m.y + m.d, zc + t) : P(m.x + m.w, yc - s, zc + t));
    const cantos = [ponto(-a, a), ponto(a, a), ponto(a, -a), ponto(-a, -a)];
    const [cx, cy] = ponto(0, 0);
    const g = el('g', { class: 'numero-movel' }, pai);
    poligono(g, cantos, { fill: '#111111', stroke: '#111111', 'stroke-width': 0.8, 'stroke-linejoin': 'round' });
    // O texto acompanha a face: "deitado" na mesma inclinação da planta.
    const k = NUMERO.lado * 0.62 / NUMERO.fonte;
    const txt = el('g', { transform: 'matrix(' + [COS30 * k, (naFrente ? 0.5 : -0.5) * k, 0, k, cx, cy].join(',') + ')' }, g);
    texto(txt, 0, NUMERO.fonte * 0.36, numero, {
      'font-family': FONTE_ETQ, 'font-size': NUMERO.fonte, 'font-weight': 800, fill: '#FFFFFF', 'text-anchor': 'middle',
    });
    const xs = cantos.map((c) => c[0]), ys = cantos.map((c) => c[1]);
    const x0 = Math.min.apply(null, xs), y0 = Math.min.apply(null, ys);
    return { x: x0, y: y0, w: Math.max.apply(null, xs) - x0, h: Math.max.apply(null, ys) - y0 };
  }

  /** Ordenação de pintura (o que está atrás é desenhado primeiro). */
  function ordenar(prims, P) {
    const n = prims.length;
    const tela = prims.map((b) => {
      const xs = [];
      const ys = [];
      [b.x, b.x + b.w].forEach((x) => [b.y, b.y + b.d].forEach((y) => [b.z, b.z + b.h].forEach((z) => {
        const p = P(x, y, z);
        xs.push(p[0]);
        ys.push(p[1]);
      })));
      return { x0: Math.min.apply(null, xs), x1: Math.max.apply(null, xs), y0: Math.min.apply(null, ys), y1: Math.max.apply(null, ys) };
    });
    const prof = prims.map((b) => b.x + b.w / 2 + b.y + b.d / 2 + b.z * 0.5);
    const e = 1e-6;
    const separa = (a, b) => {
      if (a.x + a.w <= b.x + e) return -1;
      if (b.x + b.w <= a.x + e) return 1;
      if (a.y + a.d <= b.y + e) return -1;
      if (b.y + b.d <= a.y + e) return 1;
      if (a.z + a.h <= b.z + e) return -1;
      if (b.z + b.h <= a.z + e) return 1;
      return 0;
    };
    const depois = prims.map(() => []);
    const grau = new Array(n).fill(0);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const A = tela[i];
        const B = tela[j];
        if (A.x1 <= B.x0 || B.x1 <= A.x0 || A.y1 <= B.y0 || B.y1 <= A.y0) continue;
        let r = separa(prims[i], prims[j]);
        if (r === 0) r = prof[i] <= prof[j] ? -1 : 1;
        if (r < 0) { depois[i].push(j); grau[j]++; } else { depois[j].push(i); grau[i]++; }
      }
    }
    const saida = [];
    const prontos = [];
    for (let i = 0; i < n; i++) if (!grau[i]) prontos.push(i);
    const usados = new Array(n).fill(false);
    while (saida.length < n) {
      if (!prontos.length) { // ciclo (não deveria acontecer): pega o mais ao fundo
        let melhor = -1;
        for (let i = 0; i < n; i++) if (!usados[i] && (melhor < 0 || prof[i] < prof[melhor])) melhor = i;
        prontos.push(melhor);
        grau[melhor] = 0;
      }
      prontos.sort((a, b) => prof[b] - prof[a]);
      const i = prontos.pop();
      if (usados[i]) continue;
      usados[i] = true;
      saida.push(prims[i]);
      depois[i].forEach((j) => { if (--grau[j] === 0 && !usados[j]) prontos.push(j); });
    }
    return saida;
  }

  /* ----------------------------- piso e paredes ---------------------------- */

  function desenharLoja(pai, P, loja) {
    const W = loja.largura, D = loja.profundidade, H = loja.alturaParede;
    const t = ESPESSURA_PAREDE, b = ESPESSURA_PISO;
    const g = el('g', { class: 'loja' }, pai);
    // Laje do piso (bordas frontais).
    poligono(g, [P(-t, D, 0), P(W, D, 0), P(W, D, -b), P(-t, D, -b)], { fill: '#D9D9D9', stroke: '#C4C4C4' });
    poligono(g, [P(W, -t, 0), P(W, D, 0), P(W, D, -b), P(W, -t, -b)], { fill: '#C9C9C9', stroke: '#C4C4C4' });
    poligono(g, [P(-t, -t, 0), P(W, -t, 0), P(W, D, 0), P(-t, D, 0)], { fill: COR.piso, stroke: COR.pisoBorda });
    // Paredes do fundo (esquerda e direita).
    const parede = { cores: null, corNeutra: '#F1F1F1' };
    caixa(g, P, { x: -t, y: -t, z: 0, w: t, d: D + t, h: H }, parede);
    caixa(g, P, { x: 0, y: -t, z: 0, w: W, d: t, h: H }, parede);
  }

  /** Grade do piso (1 unidade; linha mais forte a cada 5) com a numeração dos eixos. */
  function desenharGrade(pai, P, loja) {
    const g = el('g', { class: 'grade', 'pointer-events': 'none' }, pai);
    const W = loja.largura, D = loja.profundidade;
    for (let x = 0; x <= W + 1e-6; x += 1) {
      const forte = Math.round(x) % 5 === 0;
      linha(g, P(x, 0, 0), P(x, D, 0), { stroke: forte ? '#9AA3AE' : '#C9CED4', 'stroke-width': forte ? 1 : 0.6 });
      if (forte) texto(g, P(x, D, 0)[0] + 4, P(x, D, 0)[1] + 16, 'X ' + x, { 'font-size': 11, fill: '#5B6068', 'font-weight': 700 });
    }
    for (let y = 0; y <= D + 1e-6; y += 1) {
      const forte = Math.round(y) % 5 === 0;
      linha(g, P(0, y, 0), P(W, y, 0), { stroke: forte ? '#9AA3AE' : '#C9CED4', 'stroke-width': forte ? 1 : 0.6 });
      if (forte) texto(g, P(W, y, 0)[0] + 6, P(W, y, 0)[1] + 14, 'Y ' + y, { 'font-size': 11, fill: '#5B6068', 'font-weight': 700 });
    }
  }

  /* ------------------------------ etiquetas ------------------------------- */

  function medirGrupo(etiquetas, simbolo, corPadrao) {
    const itens = etiquetas.map((e) => {
      const linhas = quebrar(e.texto, ETQ.maxTexto, ETQ.fonte, 800, FONTE_ETQ);
      const w = Math.max.apply(null, linhas.map((l) => largura(l, ETQ.fonte, 800, 'normal', FONTE_ETQ))) + ETQ.padX * 2;
      return {
        linhas,
        w,
        h: linhas.length * ETQ.lh + ETQ.padY * 2,
        cores: coresDe(e.marca, 'etiqueta', true) || corPadrao,
      };
    });
    const wEtq = Math.max.apply(null, itens.map((i) => i.w));
    const h = itens.reduce((s, i) => s + i.h, 0) + ETQ.gap * (itens.length - 1);
    return { itens, wEtq, w: wEtq + (simbolo ? ETQ.simbolo + 4 : 0), h, simbolo };
  }

  function desenharSimbolo(pai, simbolo, cx, cy, escala) {
    const k = escala || 1;
    const g = el('g', { transform: 'translate(' + cx + ',' + cy + ') scale(' + k + ')' }, pai);
    if (simbolo === 'MOVIMENTO') {
      poligono(g, [[-6, -7.5], [8, 0], [-6, 7.5]], { fill: '#111' });
    } else if (simbolo === 'FIXO') {
      poligono(g, [[0, -8.5], [8.5, 0], [0, 8.5], [-8.5, 0]], { fill: '#111' });
    } else if (simbolo === 'EXPOSICAO') {
      el('circle', { r: 8.5, fill: '#111', stroke: '#fff', 'stroke-width': 1.2 }, g);
      texto(g, 0, 4, 'E', { 'font-size': 11, 'font-weight': 700, fill: '#fff', 'text-anchor': 'middle' });
    } else if (simbolo === 'NOVO') {
      const pts = [];
      for (let i = 0; i < 24; i++) {
        const r = i % 2 ? 8 : 11;
        const a = (Math.PI * 2 * i) / 24;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      poligono(g, pts, { fill: '#FFD21F', stroke: '#B88A00', 'stroke-width': 0.8 });
      texto(g, 0, 2.4, 'NEW', { 'font-size': 6.5, 'font-weight': 700, fill: '#6B4200', 'text-anchor': 'middle' });
    }
    return g;
  }

  /** Retângulo arredondado de etiqueta: pílula numa linha, cantos suaves em várias; borda um pouco mais escura. */
  function fundoEtiqueta(pai, x, y, w, h, cores) {
    return el('rect', {
      x, y, width: w, height: h, rx: Math.min(ETQ.raio, h / 2), fill: tinta(cores, 0),
      stroke: misturar(cores[0], '#000000', 0.2), 'stroke-width': 0.8,
    }, pai);
  }

  function desenharGrupo(pai, gr, attrs) {
    // data-movel-base: o móvel da etiqueta (para destacar as etiquetas dele ao passar o mouse no móvel).
    const g = el('g', Object.assign({ 'data-movel': gr.id, 'data-movel-base': gr.movel.id, filter: 'url(#sombraEtq)' }, attrs), pai);
    let y = gr.y;
    gr.itens.forEach((it, i) => {
      fundoEtiqueta(g, gr.x, y, gr.wEtq, it.h, it.cores);
      it.linhas.forEach((l, k) => {
        texto(g, gr.x + gr.wEtq / 2, y + ETQ.padY + ETQ.lh * (k + 1) - 3.6, l, {
          'font-family': FONTE_ETQ, 'font-size': ETQ.fonte, 'font-weight': 800, 'letter-spacing': 0.15,
          fill: '#FFFFFF', 'text-anchor': 'middle',
        });
      });
      if (i === 0 && gr.simbolo) desenharSimbolo(g, gr.simbolo, gr.x + gr.wEtq + 4 + ETQ.simbolo / 2, y + it.h / 2);
      y += it.h + ETQ.gap;
    });
    return g;
  }

  const sobrepoe = (a, b, m) => a.x < b.x + b.w + m && b.x < a.x + a.w + m && a.y < b.y + b.h + m && b.y < a.y + a.h + m;

  /** Candidatos de deslocamento, do mais próximo ao mais distante. */
  const DESLOCAMENTOS = (() => {
    const lista = [];
    for (let dx = -220; dx <= 220; dx += 10) {
      for (let dy = -160; dy <= 160; dy += 6) lista.push([dx, dy, dx * dx + dy * dy * 1.3]);
    }
    return lista.sort((a, b) => a[2] - b[2]);
  })();

  /**
   * Posiciona os grupos sem nenhuma etiqueta sobre outra (nem sobre as caixas de destaque,
   * notas e painéis). Os com ajuste manual ficam onde o usuário pôs, a menos que caiam em
   * cima de outro. Primeiro tenta perto do móvel; se não houver lugar, procura na tela toda,
   * do mais perto para o mais longe.
   */
  function posicionar(grupos, obstaculos) {
    const ocupados = obstaculos.slice();
    const dentro = (r) => r.x >= LIMITES.x0 && r.y >= LIMITES.y0 && r.x + r.w <= LIMITES.x1 && r.y + r.h <= LIMITES.y1;
    const livre = (r) => dentro(r) && ocupados.every((o) => !sobrepoe(r, o, 3));
    const acomodar = (g) => {
      const base = { x: g.x, y: g.y, w: g.w, h: g.h };
      if (livre(base)) return;
      const tentar = (dx, dy) => {
        const c = { x: base.x + dx, y: base.y + dy, w: g.w, h: g.h };
        if (!livre(c)) return false;
        g.x = c.x;
        g.y = c.y;
        return true;
      };
      if (DESLOCAMENTOS.some((d) => tentar(d[0], d[1]))) return;
      const longe = [];
      for (let x = LIMITES.x0; x + g.w <= LIMITES.x1; x += 8) {
        for (let y = LIMITES.y0; y + g.h <= LIMITES.y1; y += 6) longe.push([x - base.x, y - base.y]);
      }
      longe.sort((a, b) => a[0] * a[0] + a[1] * a[1] * 1.3 - (b[0] * b[0] + b[1] * b[1] * 1.3));
      longe.some((d) => tentar(d[0], d[1]));
    };
    grupos.filter((g) => g.manual).forEach((g) => { acomodar(g); ocupados.push(g); });
    // As etiquetas ao lado do móvel (painéis do totem) vão antes, para ficarem juntas do móvel delas.
    grupos.filter((g) => !g.manual).sort((a, b) => (b.aoLado ? 1 : 0) - (a.aoLado ? 1 : 0) || a.ancora[1] - b.ancora[1])
      .forEach((g) => { acomodar(g); ocupados.push(g); });
  }

  /** Ponto da caixa mais perto da âncora: de onde sai a linha-guia. */
  function pontoDaGuia(rect, ancora) {
    return [Math.max(rect.x, Math.min(ancora[0], rect.x + rect.w)), Math.max(rect.y, Math.min(ancora[1], rect.y + rect.h))];
  }

  /**
   * Envoltório das caixas de destaque para o zoom da tela: com zoom, a aplicação encolhe o envoltório
   * em volta de (px, py) para a caixa continuar do mesmo tamanho na tela, sem soltar da linha-guia.
   * (As etiquetas dos móveis crescem com o zoom, junto com a planta.)
   */
  function pivoZoom(pai, px, py) {
    return el('g', { class: 'etq-zoom', 'data-px': px, 'data-py': py }, pai);
  }

  /** Linha-guia do grupo até o ponto do móvel (quando o grupo ficou longe). */
  function desenharGuia(pai, rect, ancora, forcar, movelId) {
    const [px, py] = pontoDaGuia(rect, ancora);
    const dist = Math.hypot(px - ancora[0], py - ancora[1]);
    if (!forcar && dist < 14) return;
    if (movelId) pai = el('g', { class: 'guia', 'data-movel-base': movelId }, pai);
    linha(pai, [px, py], ancora, { stroke: '#3A3A3A', 'stroke-width': 1.3 });
    el('circle', { cx: ancora[0], cy: ancora[1], r: 4, fill: '#FFFFFF', stroke: '#3A3A3A', 'stroke-width': 1.3 }, pai);
  }

  /* ----------------------------- painel lateral ---------------------------- */

  function iconeTv(pai, cx, cy) {
    const g = el('g', { fill: 'none', stroke: '#222', 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, pai);
    el('rect', { x: cx - 21, y: cy - 15, width: 42, height: 27, rx: 2 }, g);
    linha(g, [cx - 7, cy + 17], [cx + 7, cy + 17], {});
    linha(g, [cx, cy + 12], [cx, cy + 17], {});
  }

  function iconeRadio(pai, cx, cy) {
    const g = el('g', { fill: 'none', stroke: '#222', 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, pai);
    el('rect', { x: cx - 17, y: cy - 10, width: 34, height: 26, rx: 3 }, g);
    linha(g, [cx - 13, cy - 10], [cx + 10, cy - 22], {});
    el('circle', { cx: cx - 6, cy: cy + 7, r: 5 }, g);
    linha(g, [cx + 4, cy + 3], [cx + 12, cy + 3], {});
    linha(g, [cx + 4, cy + 9], [cx + 12, cy + 9], {});
    linha(g, [cx - 13, cy - 4], [cx + 13, cy - 4], {});
  }

  function iconeLetra(pai, cx, cy, letra) {
    el('circle', { cx, cy, r: 20, fill: 'none', stroke: '#222', 'stroke-width': 2.4 }, pai);
    texto(pai, cx, cy + 12, letra, { 'font-size': 33, 'font-weight': 400, fill: '#222', 'text-anchor': 'middle' });
  }

  function listaLateral(pai, itens, x, y, w, alturaMin) {
    const medidos = itens.map((it) => {
      const linhas = quebrar(it.texto, w - 12, 11, 800, FONTE_ETQ);
      return { it, linhas, h: Math.max(23, linhas.length * 13 + 10) };
    });
    let total = medidos.reduce((s, m) => s + m.h, 0) + 6 * (medidos.length - 1);
    const extra = alturaMin && total < alturaMin ? (alturaMin - total) / medidos.length : 0;
    let cy = y;
    medidos.forEach((m) => {
      const h = m.h + extra;
      const cores = coresDe(m.it.marca, 'etiqueta') || [COR.etiquetaPadrao];
      fundoEtiqueta(pai, x, cy, w, h, cores);
      const y0 = cy + h / 2 - (m.linhas.length * 13) / 2 + 10;
      m.linhas.forEach((l, k) => texto(pai, x + 6, y0 + k * 13, l, { 'font-family': FONTE_ETQ, 'font-size': 11, 'font-weight': 800, fill: '#fff' }));
      cy += h + 6;
    });
    return Math.max(total + extra * medidos.length, alturaMin || 0);
  }

  function desenharLateral(pai, planta, ciclo, secoes) {
    const g = el('g', { class: 'lateral' }, pai);
    el('rect', { x: 22, y: 12, width: 260, height: 64, fill: '#0A0A0A', stroke: '#666', 'stroke-width': 1 }, g);
    texto(g, 152, 58, planta.nome, { 'font-size': 38, 'font-weight': 700, fill: '#FFFFFF', 'text-anchor': 'middle' });
    if (ciclo) {
      texto(g, 24, 100, 'CICLO: ' + ciclo, { 'font-size': 15, 'font-weight': 700, fill: '#6B6B6B' });
    }

    let y = 117;
    if (secoes.TV.length) {
      iconeTv(g, 62, 135);
      iconeRadio(g, 62, 222);
      y += listaLateral(g, secoes.TV, 91, y, 168, 122) + 26;
    }
    ['A', 'C'].forEach((letra) => {
      if (!secoes[letra].length) return;
      const h = listaLateral(g, secoes[letra], 91, y, 168, 0);
      iconeLetra(g, 62, y + h / 2, letra);
      y += h + 26;
    });
  }

  /** Notas (canto inferior esquerdo): o trecho antes de ":" fica em negrito. */
  function medirNotas(notas) {
    const tam = 17, lh = 23, maxW = 490;
    const paragrafos = notas.map((n) => {
      const i = n.texto.indexOf(':');
      const partes = i > 0 && i < 60
        ? [{ t: n.texto.slice(0, i + 1), b: true }, { t: n.texto.slice(i + 1), b: false }]
        : [{ t: n.texto, b: false }];
      const palavras = [];
      partes.forEach((p) => p.t.split(/\s+/).filter(Boolean).forEach((w) => palavras.push({ t: w, b: p.b })));
      const linhas = [];
      let atual = [];
      let w = 0;
      palavras.forEach((p) => {
        const lp = largura(p.t, tam, p.b ? 700 : 400);
        const esp = atual.length ? largura(' ', tam, 400) : 0;
        if (atual.length && w + esp + lp > maxW) { linhas.push(atual); atual = []; w = 0; }
        atual.push(p);
        w += (atual.length > 1 ? esp : 0) + lp;
      });
      if (atual.length) linhas.push(atual);
      return linhas;
    });
    const nLinhas = paragrafos.reduce((s, p) => s + p.length, 0);
    return { paragrafos, tam, lh, h: nLinhas * lh + (paragrafos.length - 1) * 14 + 44, w: 535 };
  }

  function desenharNotas(pai, medida, x, y) {
    const g = el('g', { class: 'notas' }, pai);
    el('rect', { x, y, width: medida.w, height: medida.h, fill: '#F7F4F0', stroke: '#E2DDD6', filter: 'url(#sombra)' }, g);
    let cy = y + 22 + medida.lh - 6;
    medida.paragrafos.forEach((linhas) => {
      linhas.forEach((ln) => {
        const t = el('text', { x: x + 22, y: cy, 'font-family': FONTE, 'font-size': medida.tam, fill: COR.textoNota }, g);
        ln.forEach((p, i) => {
          const s = el('tspan', { 'font-weight': p.b ? 700 : 400, fill: p.b ? COR.tituloNota : COR.textoNota }, t);
          s.textContent = (i ? ' ' : '') + p.t;
        });
        cy += medida.lh;
      });
      cy += 14;
    });
  }

  function desenharLegendaSimbolos(pai, usados, simbolos) {
    const ordem = ['MOVIMENTO', 'FIXO', 'EXPOSICAO', 'NOVO'].filter((s) => usados.has(s));
    let y = 1052 - (ordem.length - 1) * 44;
    const topo = y - 22;
    ordem.forEach((s) => {
      desenharSimbolo(pai, s, 33, y, 1.45);
      texto(pai, 58, y + 7, (simbolos[s] && simbolos[s].descricao) || s, { 'font-size': 19, fill: '#1A1A1A', 'font-weight': 400 });
      y += 44;
    });
    return ordem.length ? topo : 1072;
  }

  /* ---------------------------- itens extras ------------------------------ */

  function iconeExtra(pai, id, cx, cy) {
    const g = el('g', { fill: 'none', stroke: '#6A6A6A', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, pai);
    const k = id.toUpperCase();
    if (k.indexOf('CEST') >= 0) {
      el('path', { d: `M${cx - 24},${cy - 4} L${cx + 24},${cy - 4} L${cx + 18},${cy + 20} L${cx - 18},${cy + 20} Z` }, g);
      el('path', { d: `M${cx - 16},${cy - 4} Q${cx},${cy - 32} ${cx + 16},${cy - 4}` }, g);
      for (let i = -12; i <= 12; i += 8) linha(g, [cx + i, cy - 4], [cx + i * 0.75, cy + 20], {});
      linha(g, [cx - 21, cy + 6], [cx + 21, cy + 6], {});
    } else if (k.indexOf('CAVALETE') >= 0) {
      el('rect', { x: cx - 16, y: cy - 26, width: 32, height: 40, fill: '#FFFFFF' }, g);
      linha(g, [cx - 13, cy + 14], [cx - 18, cy + 28], {});
      linha(g, [cx + 13, cy + 14], [cx + 18, cy + 28], {});
    } else {
      el('path', { d: `M${cx - 20},${cy - 12} L${cx},${cy - 22} L${cx + 20},${cy - 12} L${cx + 20},${cy + 18} L${cx},${cy + 28} L${cx - 20},${cy + 18} Z` }, g);
      linha(g, [cx, cy - 2], [cx, cy + 28], {});
      linha(g, [cx - 20, cy - 12], [cx, cy - 2], {});
      linha(g, [cx + 20, cy - 12], [cx, cy - 2], {});
    }
  }

  function desenharExtras(pai, extras, obterDados) {
    if (!extras.length) return null;
    const slot = 206;
    const w = slot * extras.length;
    const h = 84;
    const x = 1904 - w;
    const y = 1064 - h;
    const g = el('g', { class: 'extras' }, pai);
    el('rect', { x, y, width: w, height: h, rx: 10, fill: '#FFFFFF', stroke: '#DDD', filter: 'url(#sombra)' }, g);
    extras.forEach((m, i) => {
      const x0 = x + i * slot;
      const gs = el('g', { 'data-movel': m.id }, g);
      dica(gs, m.id + (m.descricao ? ' — ' + m.descricao : ''));
      if (i) linha(gs, [x0, y + 14], [x0, y + h - 14], { stroke: '#BBBBBB', 'stroke-width': 1.5 });
      iconeExtra(gs, m.id + ' ' + m.descricao, x0 + 38, y + h / 2);
      texto(gs, x0 + 136, y + 20, m.descricao || m.id, { 'font-size': 11, 'font-style': 'italic', fill: '#666', 'text-anchor': 'middle' });
      const info = obterDados(m);
      const etiquetas = info && info.etiquetas.length ? info.etiquetas : [];
      let cy = y + 28;
      etiquetas.slice(0, 3).forEach((e) => {
        const cores = coresDe(e.marca, 'etiqueta', true) || coresDe(info.marca, 'etiqueta', true) || corEtiquetaPadrao(true);
        const linhas = quebrar(e.texto, 110, 10, 800, FONTE_ETQ).slice(0, 2);
        const hh = linhas.length * 11 + 5;
        fundoEtiqueta(gs, x0 + 76, cy, 120, hh, cores);
        linhas.forEach((l, k) => texto(gs, x0 + 136, cy + 10 + k * 11, l, { 'font-family': FONTE_ETQ, 'font-size': 10, 'font-weight': 800, fill: '#fff', 'text-anchor': 'middle' }));
        cy += hh + 3;
      });
      if (!etiquetas.length) texto(gs, x0 + 136, y + 50, '—', { 'font-size': 14, fill: '#AAA', 'text-anchor': 'middle' });
    });
    return { x, y, w, h };
  }

  /* ------------------------------- callouts ------------------------------- */

  function posicionarCallouts(callouts) {
    const placed = [];
    callouts.sort((a, b) => a.ancoraX - b.ancoraX).forEach((c) => {
      c.x = Math.max(LIMITES.x0 + 6, Math.min(c.ancoraX - c.w / 2, LIMITES.x1 - c.w));
      c.y = 14;
      placed.forEach((p) => {
        if (sobrepoe(c, p, 14)) c.x = p.x + p.w + 18;
      });
      placed.push(c);
    });
    // Se estourou a direita, empurra tudo para a esquerda; se ainda não couber, quebra linha.
    const excesso = placed.length ? placed[placed.length - 1].x + placed[placed.length - 1].w - LIMITES.x1 : 0;
    if (excesso > 0) {
      for (let i = placed.length - 1; i >= 0; i--) {
        const limite = i === placed.length - 1 ? LIMITES.x1 : placed[i + 1].x - 18;
        placed[i].x = Math.min(placed[i].x, limite - placed[i].w);
      }
    }
    placed.forEach((c, i) => {
      if (c.x < LIMITES.x0) {
        c.x = LIMITES.x0 + 6;
        const acima = placed.slice(0, i).filter((p) => sobrepoe(c, p, 10));
        if (acima.length) c.y = Math.max.apply(null, acima.map((p) => p.y + p.h)) + 14;
      }
    });
  }

  function desenharCallout(pai, c) {
    // Com zoom, a caixa encolhe em volta do ponto de onde sai a linha-guia (ou do centro de cima).
    const px = c.alvo ? Math.max(c.x + 12, Math.min(c.alvo[0], c.x + c.w - 12)) : c.x + c.w / 2;
    const g = el('g', { class: 'callout' }, pivoZoom(pai, px, c.y + (c.alvo ? c.h : 0)));
    el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, fill: tinta(c.cores, 0), stroke: misturar(c.cores[0], '#000000', 0.25), 'stroke-width': 1 }, g);
    c.linhas.forEach((l, k) => texto(g, c.x + CALLOUT.pad, c.y + CALLOUT.pad + CALLOUT.lh * (k + 1) - 4, l, {
      'font-size': CALLOUT.fonte, 'font-weight': 700, fill: '#FFFFFF',
    }));
  }

  /* ------------------------------ desenho ---------------------------------- */

  /**
   * @param {SVGSVGElement} svg
   * @param {{dados, planta, ciclo, filtro, ajustes, obterMovimento, obterPaineis, edicao, somentePlanta}} ctx
   *   somentePlanta: só a loja, os móveis e as etiquetas, sem fundo nem painéis (PNG recortado).
   *   As etiquetas ficam nas mesmas posições da tela (os painéis continuam contando como obstáculo).
   * @return {{grupos: Array}} grupos de etiquetas (para arrastar no modo edição)
   */
  function desenhar(svg, ctx) {
    marcas = ctx.dados.marcas;
    filtroMarca = ctx.filtro || '';
    gradientes = {};
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('viewBox', '0 0 ' + TELA.w + ' ' + TELA.h);
    defs = el('defs', null, svg);
    const filtro = el('filter', { id: 'sombra', x: '-10%', y: '-10%', width: '120%', height: '130%' }, defs);
    el('feDropShadow', { dx: 0, dy: 3, stdDeviation: 4, 'flood-color': '#000', 'flood-opacity': 0.18 }, filtro);
    const sombraEtq = el('filter', { id: 'sombraEtq', x: '-20%', y: '-30%', width: '140%', height: '170%' }, defs);
    el('feDropShadow', { dx: 0, dy: 1.2, stdDeviation: 1.3, 'flood-color': '#000', 'flood-opacity': 0.22 }, sombraEtq);
    if (!ctx.somentePlanta) el('rect', { x: 0, y: 0, width: TELA.w, height: TELA.h, fill: TELA.fundo }, svg);

    const planta = ctx.planta;
    const projecao = criarProjecao(planta.loja);
    const { P } = projecao;
    const camadaPlanta = el('g', { class: 'camada-planta' }, svg);
    const camadaGuias = el('g', { class: 'camada-guias' }, svg);
    const camadaEtiquetas = el('g', { class: 'camada-etiquetas' }, svg);
    const camadaSobre = el('g', { class: 'camada-sobreposta' }, svg);

    desenharLoja(camadaPlanta, P, planta.loja);
    if (ctx.grade) desenharGrade(camadaPlanta, P, planta.loja);

    // Gôndola: um meio também fica dividido quando o ciclo tem linha para a 2ª (ou 1ª) metade dele.
    const temLinha = (id) => {
      const i = ctx.obterMovimento({ id });
      return !!(i && (i.marca || i.etiquetas.length || i.simbolo));
    };
    const moveis = planta.moveis.filter((m) => m.tipo !== 'EXTRA').map((m) => {
      if (m.tipo !== 'GONDOLA') return m;
      const div = ['A', 'B'].filter((l) => String(m.dividido || '').toUpperCase().indexOf(l) >= 0
        || temLinha(m.id + '/MEIO-' + l + '-2') || temLinha(m.id + '/MEIO-' + l + '-1')).join('');
      return div === (m.dividido || '') ? m : Object.assign({}, m, { dividido: div });
    });
    const extras = planta.moveis.filter((m) => m.tipo === 'EXTRA');
    const simbolosUsados = new Set();

    // Situação de cada móvel (e de cada espaço de gôndola) no ciclo.
    const info = {};
    const infoEspaco = {}; // "GON-01/MEIO-A" → linha própria do espaço
    const anotar = (i) => { if (i && i.simbolo) simbolosUsados.add(i.simbolo); return i; };
    moveis.concat(extras).forEach((m) => {
      // Móvel com espaços (gôndola, mesas, totem, móvel make) é preenchido só espaço por espaço:
      // não tem linha do móvel inteiro. Os demais têm uma linha só.
      info[m.id] = espacos(m).length ? null : anotar(ctx.obterMovimento(m));
      espacos(m).forEach((e) => {
        const id = m.id + '/' + e.id;
        // Linha de espaço vazia (sem marca, etiqueta nem símbolo) não conta: o espaço fica branco.
        // Metade sem linha própria usa a linha do meio (MEIO-A-1 → MEIO-A).
        const meio = /^MEIO-[AB]-\d$/.test(e.id) ? m.id + '/' + e.id.slice(0, 6) : null;
        const i = [id, meio].filter(Boolean).map((x) => ctx.obterMovimento({ id: x })).find((x) => x && (x.marca || x.etiquetas.length || x.simbolo));
        infoEspaco[id] = i ? anotar(i) : null;
      });
    });
    const infoDe = (b) => (b.espaco ? infoEspaco[b.movel.id + '/' + b.espaco.id] : info[b.movel.id]);

    // Numeração (pirâmide, gôndola e móvel de fila): plaquinha na face da frente, desenhada junto
    // com o móvel (o que está na frente o cobre, como o resto da planta); as etiquetas desviam dela.
    const numeros = [];
    const numeroDe = (m) => {
      if (NUMERADOS.indexOf(m.tipo) < 0) return '';
      const n = /(\d+)\s*$/.exec(m.id);
      return n ? String(Number(n[1])) : '';
    };

    // Móveis, na ordem de pintura.
    const prims = [];
    const faltam = {}; // primitivas ainda por pintar de cada móvel (a plaquinha vai com a última)
    moveis.forEach((m) => primitivas(m).forEach((p) => { prims.push(p); faltam[m.id] = (faltam[m.id] || 0) + 1; }));
    ordenar(prims, P).forEach((b) => {
      const m = b.movel;
      const i = infoDe(b);
      const corInfo = (x) => (x && !ehNeutro(x.marca) ? coresDe(x.marca, 'movel', true) : null);
      const cores = corInfo(i);
      // Mesas e totem: um só desenho, mas cada frente / painel com a cor da própria linha.
      if (m.tipo === 'MESA' || m.tipo === 'MESA_3' || m.tipo === 'TOTEM') b.coresBlocos = espacos(m).map((e) => corInfo(infoEspaco[m.id + '/' + e.id]));
      const g = el('g', {
        class: 'movel' + (ctx.selecionado === m.id ? ' selecionado' : ''),
        'data-movel': m.id,
        'data-espaco': b.espaco ? b.espaco.id : null,
      }, camadaPlanta);
      desenharPrimitiva(g, P, b, cores);
      const numero = --faltam[m.id] === 0 ? numeroDe(m) : '';
      if (numero) numeros.push(desenharNumero(g, P, m, numero, projecao.escala));
      const linhasDica = [m.id + (b.espaco ? '/' + b.espaco.id + ' (' + b.espaco.nome + ')' : '') + (m.descricao ? ' — ' + m.descricao : '')];
      const nomeMarca = (x) => (x.marca ? x.marca.split('+').map((c) => (marcas[c] ? marcas[c].nome : c)).join(' + ') : '—');
      if (!b.espaco && espacos(m).length) {
        // Mesa, totem e corpo do móvel make: um desenho só, com o que cada espaço tem.
        espacos(m).forEach((e) => {
          const x = infoEspaco[m.id + '/' + e.id];
          linhasDica.push(e.nome + ': ' + (x ? nomeMarca(x) + x.etiquetas.map((et) => ' • ' + et.texto).join('') : 'sem movimento'));
        });
      } else if (i) {
        linhasDica.push('Marca: ' + nomeMarca(i));
        i.etiquetas.forEach((e) => linhasDica.push('• ' + e.texto));
        if (i.observacao) linhasDica.push('Obs.: ' + i.observacao);
      } else {
        linhasDica.push('Sem movimento neste ciclo');
      }
      dica(g, linhasDica.join('\n'));
    });

    // Painéis (lateral, notas, callouts, extras).
    const pain = ctx.obterPaineis();
    desenharLateral(el('g', null, camadaSobre), planta, ctx.ciclo, pain);
    const topoLegenda = desenharLegendaSimbolos(camadaSobre, simbolosUsados, ctx.dados.simbolos);
    const obstaculos = [{ x: 0, y: 0, w: 470, h: 1080 }].concat(numeros);
    if (pain.NOTA.length) {
      const med = medirNotas(pain.NOTA);
      const y = Math.min(topoLegenda, 1072) - 28 - med.h;
      desenharNotas(camadaSobre, med, 15, y);
      obstaculos.push({ x: 15, y, w: med.w, h: med.h });
    }
    const rExtras = desenharExtras(camadaSobre, extras, (m) => info[m.id]);
    if (rExtras) obstaculos.push(rExtras);

    const ancoraDe = (m) => {
      if (m.tipo === 'VITRINE_L') {
        const t = espessuraL(m);
        return P(m.x + m.w / 2, cantoL(m).frente ? m.y + m.d - t / 2 : m.y + t / 2, m.z + m.h);
      }
      return P(m.x + m.w / 2, m.y + m.d / 2, m.z + m.h);
    };
    const porId = {};
    moveis.forEach((m) => { porId[m.id] = m; });

    const callouts = pain.CALLOUT.map((c) => {
      const cores = coresDe(c.marca, 'etiqueta') || [COR.etiquetaPadrao];
      const linhas = quebrar(c.texto, CALLOUT.maxW - CALLOUT.pad * 2, CALLOUT.fonte, 700);
      const w = Math.max.apply(null, linhas.map((l) => largura(l, CALLOUT.fonte, 700))) + CALLOUT.pad * 2 + 2;
      const alvo = c.movel && porId[c.movel] ? ancoraDe(porId[c.movel]) : null;
      return { cores, linhas, w, h: linhas.length * CALLOUT.lh + CALLOUT.pad * 2, alvo, ancoraX: alvo ? alvo[0] : 1200 };
    });
    posicionarCallouts(callouts);
    callouts.forEach((c) => {
      if (c.alvo) {
        const x = Math.max(c.x + 12, Math.min(c.alvo[0], c.x + c.w - 12));
        desenharGuia(el('g', { class: 'guia-callout' }, camadaGuias), { x, y: c.y + c.h, w: 0, h: 0 }, c.alvo, true);
      }
      desenharCallout(camadaEtiquetas, c);
      obstaculos.push(c);
    });

    // Etiquetas: uma pilha por móvel (limitada por tipo) e, na gôndola, uma por bloco.
    // As etiquetas de uma gôndola compartilham o ajuste manual do móvel (movem juntas).
    const limitePorTipo = ctx.dados.config.etiquetasPorTipo || {};
    const limitePorBloco = ctx.dados.config.etiquetasPorBloco || {};
    const grupos = [];
    // aoLado: a etiqueta começa à direita do móvel (com linha-guia até a âncora) em vez de ficar em
    // cima dela — usado nos painéis do totem, para a etiqueta não cobrir a cor do painel.
    const direitaDe = (m) => Math.max.apply(null, [m.x, m.x + m.w].map((x) => P(x, m.y, m.z)[0]));
    const novoGrupo = (id, m, i, etiquetas, simbolo, ancora, ajuste, aoLado) => {
      if (!etiquetas.length) return;
      const corPadrao = (!ehNeutro(i.marca) && coresDe(i.marca, 'etiqueta', true)) || corEtiquetaPadrao(true);
      const med = medirGrupo(etiquetas, simbolo, corPadrao);
      const baseX = aoLado ? direitaDe(m) + 16 : ancora[0] - med.w / 2;
      const baseY = ancora[1] - med.h / 2;
      grupos.push(Object.assign(med, {
        id, movel: m, info: i, ancora, baseX, baseY, aoLado: !!aoLado,
        x: baseX + ajuste.x, y: baseY + ajuste.y, manual: !!(ajuste.x || ajuste.y),
      }));
    };
    moveis.forEach((m) => {
      const ajuste = (ctx.ajustes && ctx.ajustes[m.id]) || { x: m.ajusteX || 0, y: m.ajusteY || 0 };
      const grupo = (e) => novoGrupo(e.id, m, e.info, e.etiquetas, e.simbolo, P(e.topo[0], e.topo[1], e.topo[2]), ajuste, e.aoLado);
      if (m.tipo === 'GONDOLA') {
        juntarIguais(etiquetasGondola(m, infoEspaco, limitePorBloco.GONDOLA)).forEach(grupo);
        return;
      }
      const i = info[m.id];
      if (m.tipo === 'VITRINE_L') {
        // Balcão: Etiqueta 1, 2 e 3 da linha do balcão vão para o bloco 1, o canto e o bloco 3.
        if (i) {
          juntarIguais(primitivas(m).map((p) => {
            const e = i.etiquetas.filter((x, k) => (x.posicao || k + 1) === p.bloco)[0];
            return e ? { id: m.id + '/' + p.bloco, info: i, etiquetas: [e], simbolo: p.bloco === 1 ? i.simbolo : '', pontos: [[p.x + p.w / 2, p.y + p.d / 2, p.z + p.h]] } : null;
          })).forEach(grupo);
        }
        return;
      }
      if (i) novoGrupo(m.id, m, i, i.etiquetas.slice(0, limitePorTipo[m.tipo] || i.etiquetas.length), i.simbolo, ancoraDe(m), ajuste);
      // Blocos (mesas, painéis do totem, testeiras do make): a linha do bloco mostra as etiquetas dela em
      // cima do bloco (até ETIQUETAS_POR_BLOCO; senão só a 1) — no totem, ao lado do painel, com linha-guia;
      // blocos vizinhos com as mesmas etiquetas ficam com uma pilha só, no centro deles.
      juntarIguais(topoDosBlocos(m).map((bl) => {
        const id = m.id + '/' + bl.espaco.id;
        const ie = infoEspaco[id];
        return ie && ie.etiquetas.length
          ? { id, info: ie, etiquetas: ie.etiquetas.slice(0, limitePorBloco[m.tipo] || 1), simbolo: ie.simbolo, pontos: [bl.topo], aoLado: m.tipo === 'TOTEM' }
          : null;
      })).forEach(grupo);
    });
    posicionar(grupos, obstaculos);
    grupos.forEach((gr) => {
      desenharGuia(camadaGuias, gr, gr.ancora, false, gr.movel.id);
      gr.elemento = desenharGrupo(camadaEtiquetas, gr, {
        class: 'grupo-etiquetas' + (ctx.edicao ? ' arrastavel' : ''),
      });
      dica(gr.elemento, gr.id + (gr.movel.descricao ? ' — ' + gr.movel.descricao : ''));
    });

    // Validação: marcador com o nº de comentários abertos no canto de cada móvel comentado
    // (do mesmo tamanho na tela com zoom; não vai no PNG).
    if (ctx.comentarios && !ctx.somentePlanta) {
      const camada = el('g', { class: 'camada-comentarios' }, svg);
      moveis.forEach((m) => {
        const qtd = ctx.comentarios[m.id];
        if (!qtd) return;
        // Canto de cima mais à direita do móvel na tela.
        const [px, py] = P(m.x + m.w, m.y, m.z + m.h);
        const g = el('g', { class: 'marcador-comentario', 'data-movel': m.id }, pivoZoom(camada, px, py));
        const cx = px + 6;
        const cy = py - 22;
        el('circle', { cx, cy, r: 17, fill: '#E8590C', stroke: '#FFFFFF', 'stroke-width': 2.5, filter: 'url(#sombraEtq)' }, g);
        poligono(g, [[cx - 9, cy + 11], [cx - 4, cy + 22], [cx + 3, cy + 14]], { fill: '#E8590C' });
        texto(g, cx, cy + 6, String(qtd), {
          'font-family': FONTE_ETQ, 'font-size': 17, 'font-weight': 800, fill: '#FFFFFF', 'text-anchor': 'middle',
        });
        dica(g, qtd + (qtd === 1 ? ' comentário aberto' : ' comentários abertos') + ' da validação — clique para ver');
      });
    }

    // Só a planta: tira os painéis (lateral, notas, legenda, extras e caixas de destaque).
    if (ctx.somentePlanta) {
      camadaSobre.remove();
      svg.querySelectorAll('.callout, .guia-callout').forEach((n) => n.remove());
    }

    // Imagem de referência (modo construção): por cima de tudo, semitransparente.
    if (ctx.referencia && ctx.referencia.src && !ctx.somentePlanta) {
      el('image', {
        href: ctx.referencia.src,
        x: ctx.referencia.dx || 0,
        y: ctx.referencia.dy || 0,
        width: TELA.w * (ctx.referencia.zoom || 1),
        height: TELA.h * (ctx.referencia.zoom || 1),
        preserveAspectRatio: 'xMidYMid meet', opacity: ctx.referencia.opacidade, 'pointer-events': 'none',
        class: 'referencia',
      }, svg);
    }

    return { grupos, escala: projecao.escala, P };
  }

  return { desenhar, espacos, caixasGondola, TELA, PRATELEIRAS, FONTE_ETQ };
})();
</script>
