<script>
/**
 * ============================================================================
 *  RENDERIZADOR DA PLANTA (SVG isométrico, 1920×1080 — formato de slide)
 * ============================================================================
 *  Render.desenhar(svg, contexto) redesenha o slide inteiro:
 *   - planta isométrica (piso, paredes e móveis coloridos pela marca);
 *   - etiquetas, em duas visões: "Na planta" (cada pilha junto do espaço a que pertence, com o
 *     nome do espaço e linha-guia até a face dele) ou "Visão simplificada" (sem a planta: uma
 *     ficha por móvel, agrupadas por tipo, com a miniatura do móvel mostrando cada espaço);
 *   - caixas de destaque (CALLOUT), painel lateral (TV / A / C), notas,
 *     legenda de símbolos e faixa de itens extras.
 *  Todo o estilo vai em atributos SVG (não em CSS) para o PNG exportado
 *  ficar idêntico ao que aparece na tela.
 */
const Render = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const FONTE = 'Arial, Helvetica, sans-serif';
  // Etiquetas: fonte arredondada (Nunito, carregada no <head>; no PNG ela vai embutida no SVG).
  const FONTE_ETQ = "Nunito, 'Segoe UI', Arial, sans-serif";
  const COS30 = Math.cos(Math.PI / 6);

  // Slide base (16:9). Com etiquetas, o slide cresce na mesma proporção quando as fichas precisam de
  // mais espaço ("canvas infinito"): TELA guarda o tamanho do último desenho (a aplicação usa no zoom e no PNG).
  const TELA_BASE = { w: 1920, h: 1080 };
  const TELA = { w: TELA_BASE.w, h: TELA_BASE.h };
  const REGIAO_PLANTA = { x: 500, y: 70, w: 1400, h: 950 };
  // Etiquetas: medidas no tamanho padrão (ETQ_BASE); ETQ é o tamanho do desenho atual (na visão na planta,
  // multiplicado pelo "Tamanho das etiquetas" da planta, ajustado em "Ajustar etiquetas").
  const ETQ_BASE = { fonte: 12.5, lh: 15, padX: 10, padY: 4, gap: 4, maxTexto: 190, simbolo: 20, raio: 9 };
  const ETQ = Object.assign({}, ETQ_BASE);
  // Fichas da visão simplificada: uma por móvel, em colunas agrupadas por tipo de móvel.
  //   xEsq: primeira coluna (logo depois do painel lateral); mini: miniatura do móvel em cada linha;
  //   legenda: nome do espaço ("PONTA A"), entre a miniatura e as etiquetas.
  const FICHA = { w: 330, xEsq: 300, margem: 12, pad: 7, cab: 22, mini: 40, miniH: 25, legenda: 52, vao: 6, simbolo: 24, entre: 5, gap: 9, raio: 9 };
  // Quantas prateleiras (níveis) cada tipo de móvel tem: o desenho e o planograma da tela do móvel usam esta tabela.
  const PRATELEIRAS = { GONDOLA: 4, PIRAMIDE: 4, FILA: 3, GONDOLA_PAREDE: 5, VITRINE_L: 2, ILHA_OUI: 3, MAKE: 5 };
  // Móveis que mostram o número (do fim do ID: "MOVEL DE FILA 3" → 3) numa plaquinha na planta.
  const NUMERADOS = ['PIRAMIDE', 'GONDOLA', 'FILA'];
  const NUMERO = { lado: 18, fonte: 11.5 };
  const CALLOUT = { fonte: 12.5, lh: 16, pad: 9, maxW: 360 };
  const COR = {
    contorno: '#1C1C1C',
    contornoNeutro: '#B5B5B5',
    prateleiraNeutra: '#D0D0D0',
    neutro: '#F7F7F7',
    piso: '#EAEAEA',
    pisoBorda: '#D7D7D7',
    textoNota: '#1F3B73',
    tituloNota: '#0B2A5B',
    etiquetaPadrao: '#4A4A4A',
    metal: '#A7ABB1',
    tela: '#C9CCD1',
    rodape: '#4B4F56',
    // Filtro por marca: as outras marcas ficam em cinza (etiquetas mais escuras, móveis mais claros).
    cinzaEtiqueta: '#8C8C8C',
    cinzaMovel: '#D2D2D2',
    // Fundo, loja e textos do slide (o modo noturno troca estas; as cores das marcas não mudam).
    fundo: '#F3EFEA',
    lajeFrente: '#D9D9D9',
    lajeLado: '#C9C9C9',
    lajeBorda: '#C4C4C4',
    parede: '#F1F1F1',
    placaNeutra: '#CFD2D6',
    gradeForte: '#9AA3AE',
    gradeFraca: '#C9CED4',
    gradeTexto: '#5B6068',
    notaFundo: '#F7F4F0',
    notaBorda: '#E2DDD6',
    legendaTexto: '#1A1A1A',
    simbolo: '#111111',
    simboloMiolo: '#FFFFFF',
    chipEspaco: '#24282E',
    guiaHalo: '#FFFFFF',
    guiaMistura: '#000000', // a linha-guia é a cor da etiqueta misturada com esta
    guiaDestaque: '#3A3A3A',
    guiaDestaquePonto: '#FFFFFF',
    fichaFundo: '#FFFFFF',
    fichaBorda: '#D9D2C8',
    fichaTitulo: '#3A3A3A',
    fichaLinha: '#ECE6DE',
    fichaDivisao: '#F1ECE6',
    fichaLegenda: '#5F5B56',
    secaoTitulo: '#2B2B2B',
    secaoNumero: '#8A847C',
    icone: '#222222', // ícones do painel lateral (TV, rádio, A, C)
    cicloTexto: '#6B6B6B',
  };
  const COR_CLARO = Object.assign({}, COR);
  // Modo noturno (só na tela; o PNG sai sempre com as cores claras de COR_CLARO).
  const COR_ESCURO = Object.assign({}, COR_CLARO, {
    contornoNeutro: '#5D646E',
    prateleiraNeutra: '#555C66',
    neutro: '#3A3F47',
    piso: '#2A2E34',
    pisoBorda: '#3A3F46',
    textoNota: '#B9C7EA',
    tituloNota: '#DBE4FB',
    cinzaMovel: '#4A4F57',
    fundo: '#16191D',
    lajeFrente: '#23272C',
    lajeLado: '#1D2025',
    lajeBorda: '#3A3F46',
    parede: '#33383F',
    placaNeutra: '#4A5059',
    gradeForte: '#5D646E',
    gradeFraca: '#3A3F46',
    gradeTexto: '#8B929C',
    notaFundo: '#1F2328',
    notaBorda: '#3A3F46',
    legendaTexto: '#E8EAED',
    simbolo: '#E8EAED',
    simboloMiolo: '#16191D',
    chipEspaco: '#454B54',
    guiaHalo: '#16191D',
    guiaMistura: '#FFFFFF',
    guiaDestaque: '#A3A9B2',
    guiaDestaquePonto: '#16191D',
    fichaFundo: '#1F2328',
    fichaBorda: '#3A3F46',
    fichaTitulo: '#E8EAED',
    fichaLinha: '#33383F',
    fichaDivisao: '#2A2E34',
    fichaLegenda: '#A3A9B2',
    secaoTitulo: '#E8EAED',
    secaoNumero: '#8B929C',
    icone: '#E8EAED',
    cicloTexto: '#A3A9B2',
  });
  const ESPESSURA_PAREDE = 0.35;
  const ESPESSURA_PISO = 0.35;

  let marcas = {};
  let limites = null; // faixa onde ficam as caixas de destaque (muda com o tamanho do slide)
  // Painéis do slide (nome da ER, TV/rádio, A, C, notas, legenda e itens extras). Na tela eles ficam
  // no menu da esquerda (fora do SVG) e a planta usa a largura toda; no PNG do slide eles vão desenhados.
  let comPaineis = true;

  /** Região da planta num slide W × H: à direita do painel lateral (com painéis) ou na largura toda. */
  const regiaoPlanta = (W, H) => (comPaineis
    ? { x: REGIAO_PLANTA.x, y: REGIAO_PLANTA.y, w: W - REGIAO_PLANTA.x - 20, h: H - 130 }
    : { x: 40, y: REGIAO_PLANTA.y, w: W - 80, h: H - 130 });
  const limitesDe = (W, H) => ({ x0: comPaineis ? 470 : 12, y0: 8, x1: W - 8, y1: H - 8 });
  let filtroMarca = ''; // marca destacada pelo filtro ('' = todas coloridas)
  let defs = null;
  let gradientes = {};
  let hachuras = {};

  /* ------------------------------ utilidades ------------------------------ */

  function el(tag, attrs, pai) {
    const e = document.createElementNS(NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach((k) => {
        if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
      });
    }
    if (pai) pai.appendChild(e);
    return e;
  }

  function texto(pai, x, y, conteudo, attrs) {
    const t = el('text', Object.assign({ x, y, 'font-family': FONTE }, attrs), pai);
    t.textContent = conteudo;
    return t;
  }

  /** Dica ao passar o mouse (<title> precisa ser o primeiro filho). */
  function dica(alvo, conteudo) {
    const t = document.createElementNS(NS, 'title');
    t.textContent = conteudo;
    alvo.insertBefore(t, alvo.firstChild);
  }

  const pontos = (lista) => lista.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  function poligono(pai, lista, attrs) {
    return el('polygon', Object.assign({ points: pontos(lista) }, attrs), pai);
  }

  function linha(pai, a, b, attrs) {
    return el('line', Object.assign({ x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1) }, attrs), pai);
  }

  const medidor = document.createElement('canvas').getContext('2d');
  function largura(txt, tam, peso, estilo, fonte) {
    medidor.font = (estilo || 'normal') + ' ' + (peso || 700) + ' ' + tam + 'px ' + (fonte || FONTE);
    return medidor.measureText(txt).width;
  }

  /** Quebra o texto em linhas que caibam em maxW (respeita quebras de linha). */
  function quebrar(txt, maxW, tam, peso, fonte) {
    const linhas = [];
    String(txt).split('\n').forEach((par) => {
      if (!par.trim()) { linhas.push(''); return; }
      let atual = '';
      par.trim().split(/\s+/).forEach((palavra) => {
        const tentativa = atual ? atual + ' ' + palavra : palavra;
        if (!atual || largura(tentativa, tam, peso, 'normal', fonte) <= maxW) atual = tentativa;
        else { linhas.push(atual); atual = palavra; }
      });
      linhas.push(atual);
    });
    while (linhas.length > 1 && linhas[linhas.length - 1] === '') linhas.pop();
    return linhas;
  }

  /* -------------------------------- cores --------------------------------- */

  function rgb(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16));
  }
  function paraHex(v) {
    return '#' + v.map((c) => Math.round(Math.max(0, Math.min(255, c))).toString(16).padStart(2, '0')).join('');
  }
  function misturar(cor, alvo, t) {
    const a = rgb(cor);
    const b = rgb(alvo);
    return paraHex(a.map((v, i) => v + (b[i] - v) * t));
  }

  /** Cor fosca para os móveis: tira parte da saturação (mistura com o cinza de mesma luminância). */
  function fosco(cor) {
    const [r, g, b] = rgb(cor);
    const cinza = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
    return misturar(cor, paraHex([cinza, cinza, cinza]), 0.3);
  }

  // Modo noturno: as cores das marcas ficam mais escuras (etiquetas um pouco; móveis mais, para não
  // brilharem sobre o piso escuro). Só na tela: o PNG sai com as cores originais.
  let escuro = false;
  const ESCURECER = { etiqueta: 0.28, movel: 0.4 };

  /** Cor da marca como aparece na tela (no modo noturno, a versão mais escura dela). */
  function corDaTela(cor, tipo) {
    return escuro ? misturar(cor, '#000000', ESCURECER[tipo] || 0) : cor;
  }

  /** Troca a paleta (clara ou do modo noturno) dos próximos desenhos. */
  function paleta(noturno) {
    escuro = !!noturno;
    Object.assign(COR, escuro ? COR_ESCURO : COR_CLARO);
  }

  /**
   * "BOT+QDB" → ['#..', '#..'] ; tipo = 'movel' (cores foscas) | 'etiqueta' (cores da marca).
   * filtrar: com uma marca no filtro, as outras viram cinza (cinzaMovel / cinzaEtiqueta).
   */
  function coresDe(valor, tipo, filtrar) {
    if (!valor) return null;
    const cinza = tipo === 'movel' ? COR.cinzaMovel : COR.cinzaEtiqueta;
    const cores = String(valor).split('+').map((p) => p.trim()).map((p) => {
      const cor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(p) ? p : marcas[p] ? marcas[p][tipo] : null;
      if (!cor) return null;
      if (filtrar && filtroMarca && p !== filtroMarca) return cinza;
      return corDaTela(tipo === 'movel' ? fosco(cor) : cor, tipo);
    }).filter(Boolean);
    if (!cores.length) return null;
    // Combinação toda em cinza vira uma cor só (sem degradê cinza-cinza).
    return cores.every((c) => c === cinza) ? [cinza] : cores;
  }

  /**
   * Movimento de uma etiqueta: o texto sem a observação depois do "|" ("LÇTO EGEO | só no kit" → "LÇTO EGEO").
   * A planta mostra a etiqueta inteira; as contas (Analytics, Tipos de movimento, filtros) usam só o movimento.
   */
  const movimentoDaEtiqueta = (t) => String(t || '').split('|')[0].trim();
  /** Observação da etiqueta (o que vem depois do "|"), ou ''. */
  const obsDaEtiqueta = (t) => { const s = String(t || ''); const i = s.indexOf('|'); return i < 0 ? '' : s.slice(i + 1).trim(); };
  /** Mesmo movimento, com variações de maiúsculas e espaços ("Multi  promo" = "MULTI PROMO") e sem a observação. */
  const chaveEtiqueta = (t) => movimentoDaEtiqueta(t).replace(/\s+/g, ' ').toUpperCase();

  /** Cor da etiqueta sem marca: cinza escuro padrão (ou o cinza do filtro, quando há marca filtrada). */
  const corEtiquetaPadrao = (filtrar) => [filtrar && filtroMarca ? COR.cinzaEtiqueta : COR.etiquetaPadrao];

  function ehNeutro(valor) {
    return !valor || valor === 'NEUTRO';
  }

  // Espaço fixo (cadeado): hachura diagonal na cor do móvel / da etiqueta, mais escura.
  const HACHURA = { vao: 7, traco: 2.2, escurecer: 0.32, opacidade: 0.75 };

  /** Preenchimento de hachura (listras diagonais) numa versão mais escura de `cor`. */
  function hachura(cor, escala) {
    const k = escala || 1;
    const chave = cor + '|' + k;
    if (!hachuras[chave]) {
      const id = 'hach' + Object.keys(hachuras).length;
      const lado = HACHURA.vao * k;
      const pt = el('pattern', {
        id, patternUnits: 'userSpaceOnUse', width: lado, height: lado, patternTransform: 'rotate(45)',
      }, defs);
      el('rect', {
        x: 0, y: 0, width: HACHURA.traco * k, height: lado,
        fill: misturar(cor, '#000000', HACHURA.escurecer), 'fill-opacity': HACHURA.opacidade,
      }, pt);
      hachuras[chave] = 'url(#' + id + ')';
    }
    return hachuras[chave];
  }

  /** Cor sólida ou degradê (para combinações de marcas). sombra < 0 clareia, > 0 escurece. */
  function tinta(cores, sombra) {
    const aplicar = (c) => (sombra < 0 ? misturar(c, '#FFFFFF', -sombra) : sombra > 0 ? misturar(c, '#000000', sombra) : c);
    if (cores.length === 1) return aplicar(cores[0]);
    const chave = cores.join('-') + '|' + sombra;
    if (!gradientes[chave]) {
      const id = 'grad' + Object.keys(gradientes).length;
      const g = el('linearGradient', { id, x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
      cores.forEach((c, i) => el('stop', { offset: i / (cores.length - 1), 'stop-color': aplicar(c) }, g));
      gradientes[chave] = 'url(#' + id + ')';
    }
    return gradientes[chave];
  }

  /* ------------------------------ projeção -------------------------------- */

  function criarProjecao(loja, regiao) {
    const R = regiao || REGIAO_PLANTA;
    const W = loja.largura;
    const D = loja.profundidade;
    const H = loja.alturaParede;
    const t = ESPESSURA_PAREDE;
    const cantos = [
      [-t, -t, H], [W, -t, H], [-t, D, H],
      [W, -t, -ESPESSURA_PISO], [W, D, -ESPESSURA_PISO], [-t, D, -ESPESSURA_PISO],
    ];
    const bruto = (p) => [(p[0] - p[1]) * COS30, (p[0] + p[1]) * 0.5 - p[2]];
    const bx = cantos.map((p) => bruto(p)[0]);
    const by = cantos.map((p) => bruto(p)[1]);
    const minX = Math.min.apply(null, bx);
    const minY = Math.min.apply(null, by);
    const larg = Math.max.apply(null, bx) - minX;
    const alt = Math.max.apply(null, by) - minY;
    const s = Math.min(R.w / larg, R.h / alt);
    const ox = R.x + (R.w - larg * s) / 2 - minX * s;
    const oy = R.y + (R.h - alt * s) / 2 - minY * s;
    return {
      escala: s, ox, oy,
      P: (x, y, z) => [ox + (x - y) * COS30 * s, oy + ((x + y) * 0.5 - (z || 0)) * s],
    };
  }

  /* --------------------------- caixas (móveis) ---------------------------- */

  /**
   * Desenha uma caixa isométrica, sempre opaca (cores sobrepostas confundiam a leitura).
   * est: { cores, vidro, prateleiras, modulo, gradeTopo, moldura } — vidro só deixa as linhas
   * internas tracejadas, para lembrar o material.
   */
  function caixa(pai, P, b, est) {
    const x0 = b.x, x1 = b.x + b.w, y0 = b.y, y1 = b.y + b.d, z0 = b.z, z1 = b.z + b.h;
    const neutro = !est.cores;
    const base = est.cores || [est.corNeutra || COR.neutro];
    const contorno = neutro ? COR.contornoNeutro : COR.contorno;
    const comum = { stroke: contorno, 'stroke-width': neutro ? 1 : 1.3, 'stroke-linejoin': 'round' };

    const esq = [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)]; // face y = y1
    const dir = [P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)]; // face x = x1
    const topo = [P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)];
    poligono(pai, esq, Object.assign({ fill: tinta(base, neutro ? 0.03 : 0) }, comum));
    poligono(pai, dir, Object.assign({ fill: tinta(base, neutro ? 0.1 : 0.16) }, comum));
    poligono(pai, topo, Object.assign({ fill: tinta(base, neutro ? 0 : -0.3) }, comum));
    if (est.cores && est.cores.fixo) {
      // Espaço fixo: a hachura por cima das três faces visíveis.
      const h = hachura(base[0]);
      [esq, dir, topo].forEach((f) => poligono(pai, f, { class: 'hachura', fill: h, stroke: 'none', 'pointer-events': 'none' }));
    }

    const detalhe = neutro
      ? { stroke: COR.prateleiraNeutra, 'stroke-width': 1 }
      : est.vidro
        ? { stroke: misturar(base[0], '#000000', 0.35), 'stroke-width': 1, 'stroke-dasharray': '5 4' }
        : { stroke: misturar(base[0], '#000000', 0.35), 'stroke-width': 1 };

    // Prateleiras.
    const n = est.prateleiras || 0;
    for (let k = 1; k < n; k++) {
      const z = z0 + (b.h * k) / n;
      if (b.w > 0.3) linha(pai, P(x0, y1, z), P(x1, y1, z), detalhe);
      if (b.d > 0.3) linha(pai, P(x1, y0, z), P(x1, y1, z), detalhe);
    }
    // Divisórias verticais (módulos).
    if (est.modulo) {
      const nx = Math.round(b.w / est.modulo);
      for (let k = 1; k < nx; k++) {
        const x = x0 + (b.w * k) / nx;
        linha(pai, P(x, y1, z0), P(x, y1, z1), detalhe);
      }
      const ny = Math.round(b.d / est.modulo);
      for (let k = 1; k < ny; k++) {
        const y = y0 + (b.d * k) / ny;
        linha(pai, P(x1, y, z0), P(x1, y, z1), detalhe);
      }
    }
    if (est.gradeTopo) {
      const xm = (x0 + x1) / 2;
      const ym = (y0 + y1) / 2;
      linha(pai, P(xm, y0, z1), P(xm, y1, z1), detalhe);
      linha(pai, P(x0, ym, z1), P(x1, ym, z1), detalhe);
    }
    if (est.moldura) {
      const m = 0.12;
      const face = b.d >= b.w
        ? [P(x1, y0 + b.d * m, z0 + b.h * m), P(x1, y1 - b.d * m, z0 + b.h * m), P(x1, y1 - b.d * m, z1 - b.h * m), P(x1, y0 + b.d * m, z1 - b.h * m)]
        : [P(x0 + b.w * m, y1, z0 + b.h * m), P(x1 - b.w * m, y1, z0 + b.h * m), P(x1 - b.w * m, y1, z1 - b.h * m), P(x0 + b.w * m, y1, z1 - b.h * m)];
      poligono(pai, face, Object.assign({ fill: 'none' }, detalhe, { 'stroke-dasharray': '6 4' }));
    }
  }

  const espessuraL = (m) => Math.min(0.6, m.w / 2, m.d / 2);

  /**
   * Balcão recepção: um bloco só em "L" (sem divisões entre os braços), em vidro, com as prateleiras.
   * Desenha as faces de fora viradas para quem olha (de trás para a frente) e o tampo em "L" por cima.
   */
  function balcaoL(pai, P, b, cores) {
    const x0 = b.x, x1 = b.x + b.w, y0 = b.y, y1 = b.y + b.d, z0 = b.z, z1 = b.z + b.h;
    const t = espessuraL(b);
    const c = cantoL(b.movel);
    // Canto do retângulo que fica vazio (o oposto ao canto do L) e o canto de dentro do L.
    const vazio = [c.direita ? x0 : x1, c.frente ? y0 : y1];
    const dentro = [c.direita ? x1 - t : x0 + t, c.frente ? y1 - t : y0 + t];
    const cantos = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
    const pegada = [];
    cantos.forEach((q, k) => {
      if (q[0] !== vazio[0] || q[1] !== vazio[1]) { pegada.push(q); return; }
      const ant = cantos[(k + 3) % 4], prox = cantos[(k + 1) % 4];
      pegada.push(ant[1] === q[1] ? [dentro[0], q[1]] : [q[0], dentro[1]]);
      pegada.push(dentro);
      pegada.push(prox[1] === q[1] ? [dentro[0], q[1]] : [q[0], dentro[1]]);
    });
    let area = 0;
    pegada.forEach((a, k) => { const n = pegada[(k + 1) % pegada.length]; area += a[0] * n[1] - n[0] * a[1]; });
    const neutro = !cores;
    const base = cores || [COR.neutro];
    const comum = { stroke: neutro ? COR.contornoNeutro : COR.contorno, 'stroke-width': neutro ? 1 : 1.3, 'stroke-linejoin': 'round' };
    const detalhe = neutro
      ? { stroke: COR.prateleiraNeutra, 'stroke-width': 1 }
      : { stroke: misturar(base[0], '#000000', 0.35), 'stroke-width': 1, 'stroke-dasharray': '5 4' };
    // Faces visíveis: normal para fora em +x ou +y.
    const faces = [];
    pegada.forEach((a, k) => {
      const n = pegada[(k + 1) % pegada.length];
      const nx = area > 0 ? n[1] - a[1] : a[1] - n[1];
      const ny = area > 0 ? a[0] - n[0] : n[0] - a[0];
      if (nx > 0 || ny > 0) faces.push({ a, n, frente: ny > 0, prof: (a[0] + n[0] + a[1] + n[1]) / 2 });
    });
    faces.sort((f, g) => f.prof - g.prof).forEach((f) => {
      const sombra = f.frente ? (neutro ? 0.03 : 0) : (neutro ? 0.1 : 0.16);
      const face = [P(f.a[0], f.a[1], z0), P(f.n[0], f.n[1], z0), P(f.n[0], f.n[1], z1), P(f.a[0], f.a[1], z1)];
      poligono(pai, face, Object.assign({ fill: tinta(base, sombra) }, comum));
      if (cores && cores.fixo) poligono(pai, face, { class: 'hachura', fill: hachura(base[0]), stroke: 'none', 'pointer-events': 'none' });
      for (let k = 1; k < PRATELEIRAS.VITRINE_L; k++) {
        const z = z0 + (b.h * k) / PRATELEIRAS.VITRINE_L;
        linha(pai, P(f.a[0], f.a[1], z), P(f.n[0], f.n[1], z), detalhe);
      }
    });
    poligono(pai, pegada.map((q) => P(q[0], q[1], z1)), Object.assign({ fill: tinta(base, neutro ? 0 : -0.3) }, comum));
    if (cores && cores.fixo) poligono(pai, pegada.map((q) => P(q[0], q[1], z1)), { class: 'hachura', fill: hachura(base[0]), stroke: 'none', 'pointer-events': 'none' });
  }

  /** [comprimento, largura] do móvel: o lado maior é o eixo "u". */
  const eixos = (b) => (b.w >= b.d ? [b.w, b.d] : [b.d, b.w]);

  /** Caixa em coordenadas locais do móvel (u ao longo do lado maior, v = 0 no lado do fundo). */
  function caixaLocal(b, u0, u1, v0, v1, z0, z1) {
    const base = { z: b.z + z0, h: z1 - z0 };
    return b.w >= b.d
      ? Object.assign(base, { x: b.x + u0, w: u1 - u0, y: b.y + v0, d: v1 - v0 })
      : Object.assign(base, { x: b.x + v0, w: v1 - v0, y: b.y + u0, d: u1 - u0 });
  }

  /** Espaços do móvel: gôndola, mesas, painéis do totem e testeiras do make (mesma regra de espacosDoMovel_ em Config.gs). */
  function espacos(m) {
    const numerados = (prefixo, nome, n) => Array.from({ length: n }, (_, i) => ({ id: prefixo + '-' + (i + 1), nome: nome + ' ' + (i + 1) }));
    if (!m) return [];
    if (m.tipo === 'MAKE') return numerados('TESTEIRA', 'Testeira', 4);
    // Mesas: as frentes e o verso (atrás das lâminas, espaço de VM).
    if (m.tipo === 'MESA' || m.tipo === 'MESA_3') {
      return numerados('FRENTE', 'Frente', m.tipo === 'MESA' ? 2 : 3).concat([{ id: 'VERSO', nome: 'Verso', vm: true }]);
    }
    if (m.tipo === 'TOTEM') return numerados('PAINEL', 'Painel', 3);
    if (m.tipo !== 'GONDOLA') return [];
    const div = String(m.dividido || '').toUpperCase();
    const lista = [{ id: 'PONTA-A', nome: 'Ponta A' }];
    ['A', 'B'].forEach((lado) => {
      if (div.indexOf(lado) >= 0) {
        lista.push({ id: 'MEIO-' + lado + '-1', nome: 'Meio ' + lado + ' (metade 1)' });
        lista.push({ id: 'MEIO-' + lado + '-2', nome: 'Meio ' + lado + ' (metade 2)' });
      } else {
        lista.push({ id: 'MEIO-' + lado, nome: 'Meio ' + lado });
      }
    });
    lista.push({ id: 'PONTA-B', nome: 'Ponta B' });
    return lista;
  }

  /**
   * Caixa de cada espaço da gôndola: as pontas nas extremidades do lado maior
   * e os dois meios lado a lado. "A" é sempre o que está virado para quem olha a planta:
   * a ponta A fica na extremidade mais à frente e o meio A na face mais à frente.
   */
  function caixasGondola(m) {
    const aoLongoDeX = m.w >= m.d;
    const L = aoLongoDeX ? m.w : m.d; // comprimento
    const C = aoLongoDeX ? m.d : m.w; // largura (de um meio ao outro)
    const p = Math.min(0.6, L * 0.18); // espessura da ponta
    const meio = (L - 2 * p) / 2;
    const faixa = { 'PONTA-B': [0, p, 0, C], 'PONTA-A': [L - p, L, 0, C] };
    ['A', 'B'].forEach((lado) => {
      const v = lado === 'A' ? [C / 2, C] : [0, C / 2];
      faixa['MEIO-' + lado] = [p, L - p, v[0], v[1]];
      // Metades com um vão entre elas, para a divisão ficar visível na planta.
      faixa['MEIO-' + lado + '-1'] = [p, p + meio - 0.06, v[0], v[1]];
      faixa['MEIO-' + lado + '-2'] = [p + meio + 0.06, L - p, v[0], v[1]];
    });
    return espacos(m).map((e) => {
      const [u0, u1, v0, v1] = faixa[e.id];
      const caixaXY = aoLongoDeX
        ? { x: m.x + u0, w: u1 - u0, y: m.y + v0, d: v1 - v0 }
        : { x: m.x + v0, w: v1 - v0, y: m.y + u0, d: u1 - u0 };
      return Object.assign(caixaXY, { z: m.z, h: m.h, movel: m, espaco: e });
    });
  }

  /**
   * Espaços vizinhos com as mesmas etiquetas (texto e cor) viram uma linha só na ficha.
   * lista: itens { info, etiquetas, simbolo, espacos } ou null (espaço sem etiqueta, que separa os vizinhos).
   */
  function juntarIguais(lista) {
    const chave = (it) => it.etiquetas.map((e) => e.texto + '|' + (e.marca || it.info.marca || '')).join('||');
    const saida = [];
    let anterior = null;
    lista.forEach((it) => {
      // O verso da mesa (VM) nunca se junta às frentes.
      const vm = (x) => !!(x.espacos && x.espacos[0] && x.espacos[0].vm);
      if (it && anterior && chave(it) === chave(anterior) && vm(it) === vm(anterior)) {
        anterior.espacos = anterior.espacos.concat(it.espacos);
        anterior.simbolo = anterior.simbolo || it.simbolo;
        return;
      }
      anterior = it ? Object.assign({}, it) : null;
      if (anterior) saida.push(anterior);
    });
    return saida;
  }

  /**
   * Painéis do totem, de baixo para cima (k = 0, 1, 2): faixa de altura [z0, z1].
   * Na planilha o Painel 1 é o de cima, então o painel k é o espaço 3 - k.
   */
  const painelTotem = (h, k) => [h * (0.33 + 0.21 * k), h * (0.48 + 0.21 * k)];

  /**
   * Balcão em L: canto onde os braços se encontram, conforme o giro
   * (0 = canto da frente, mais perto de quem olha; cada 90° passa para o canto seguinte).
   */
  function cantoL(m) {
    const g = m.giro || 0;
    return { direita: g === 0 || g === 270, frente: g === 0 || g === 90 };
  }

  /**
   * Móvel de parede: uma placa de comunicação só (o espaço destaque), no meio do móvel, na parte
   * de cima, um pouco saltada da frente, com o prendedor preto no alto. Devolve as caixas dela.
   */
  function placasParede(m) {
    const [L, C] = eixos(m);
    const uc = L / 2;
    const meia = Math.min(0.45, L * 0.15);
    const z0 = m.h * 0.6, z1 = m.h * 0.76;
    return [{
      placa: caixaLocal(m, uc - meia, uc + meia, C - 0.02, C + 0.05, z0, z1),
      prendedor: caixaLocal(m, uc - 0.07, uc + 0.07, C + 0.05, C + 0.07, z1 - 0.13, z1 - 0.03),
    }];
  }

  /** Móvel make: altura onde começa a testeira e fundo da testeira. */
  const testeiraMake = (m) => ({ z: m.h * 0.8, fundo: Math.min(eixos(m)[1], 0.4) });

  /** Quebra um móvel em caixas "ordenáveis" (gôndola → espaços; make → corpo + testeiras). */
  function primitivas(m) {
    if (m.tipo === 'GONDOLA') return caixasGondola(m);
    if (m.tipo === 'MAKE') {
      const [L] = eixos(m);
      const T = testeiraMake(m);
      const fresta = 0.04;
      const corpo = Object.assign(caixaLocal(m, 0, L, 0, eixos(m)[1], 0, T.z), { movel: m });
      return [corpo].concat(espacos(m).map((e, k) => Object.assign(
        caixaLocal(m, (k * L) / 4 + (k ? fresta / 2 : 0), ((k + 1) * L) / 4 - (k < 3 ? fresta / 2 : 0), 0, T.fundo, T.z, m.h),
        { movel: m, espaco: e },
      )));
    }
    return [{ x: m.x, y: m.y, z: m.z, w: m.w, d: m.d, h: m.h, movel: m }];
  }

  function desenharPrimitiva(pai, P, b, cores) {
    const m = b.movel;
    switch (m.tipo) {
      case 'GONDOLA_PAREDE':
        // Estante neutra com prateleiras; a cor do móvel vai só nas placas de comunicação (espaço destaque).
        caixa(pai, P, b, { cores: null, prateleiras: PRATELEIRAS.GONDOLA_PAREDE, modulo: 2.2 });
        placasParede(b).forEach((pl) => {
          caixa(pai, P, pl.placa, cores ? { cores } : { cores: null, corNeutra: COR.placaNeutra });
          caixa(pai, P, pl.prendedor, { cores: ['#2B2B2B'] });
        });
        break;
      case 'CUBO': {
        // Cubo de vidro sobre um rodapé escuro.
        const r = Math.min(0.12, b.h * 0.1);
        const m = Math.min(0.06, b.w * 0.05, b.d * 0.05);
        caixa(pai, P, { x: b.x + m, y: b.y + m, z: b.z, w: b.w - 2 * m, d: b.d - 2 * m, h: r }, { cores: [COR.rodape] });
        caixa(pai, P, Object.assign({}, b, { z: b.z + r, h: b.h - r }), { cores, vidro: true });
        break;
      }
      case 'MESA':
      case 'MESA_3': {
        // Mesa destaque: estrutura com pernas, 2 (ou 3) nichos baixos lado a lado em cima e
        // painel de vidro ao fundo com uma lâmina por nicho. Na frente, um cartaz por nicho, da
        // largura da lâmina do fundo, que sobe do chão e termina junto com o topo do nicho.
        const n = m.tipo === 'MESA_3' ? 3 : 2;
        const [L, C] = eixos(b);
        const hBase = b.h * 0.32;
        const hNicho = b.h * 0.15;
        const painel = Math.min(0.15, C * 0.12);
        const fresta = Math.min(0.08, L * 0.04);
        const perna = Math.min(0.08, L * 0.05);
        const passo = L / n;
        const g = 0.03;
        const frente = C - painel; // onde começam os cartazes
        const loc = (u0, u1, v0, v1, z0, z1) => caixaLocal(b, u0, u1, v0, v1, z0, z1);
        const corDe = (k) => (b.coresBlocos ? b.coresBlocos[k] : cores); // cada frente pode ter a cor da própria linha
        const lamina = (k) => [k * passo + (k ? fresta / 2 : 0), (k + 1) * passo - (k < n - 1 ? fresta / 2 : 0)];
        for (let k = 0; k < n; k++) {
          const [u0, u1] = lamina(k);
          caixa(pai, P, loc(u0, u1, 0, painel, hBase, b.h), { cores: corDe(k), vidro: true });
        }
        [[0, painel], [L - perna, painel], [0, frente - perna], [L - perna, frente - perna]].forEach(([u, v]) => {
          caixa(pai, P, loc(u, u + perna, v, v + perna, 0, hBase - 0.06), { cores: [COR.metal] });
        });
        caixa(pai, P, loc(0, L, painel, frente, hBase - 0.06, hBase), { cores: [COR.metal] });
        const v0 = painel + 0.05;
        for (let k = 0; k < n; k++) {
          caixa(pai, P, loc(k * passo + g, (k + 1) * passo - g, v0 + g, frente - g, hBase, hBase + hNicho), { cores: corDe(k), vidro: true });
        }
        for (let k = 0; k < n; k++) {
          const [u0, u1] = lamina(k);
          caixa(pai, P, loc(u0, u1, frente, C, 0, hBase + hNicho), { cores: corDe(k), vidro: true });
        }
        break;
      }
      case 'TOTEM': {
        // Totem: base, montantes e travessa metálicos, tela perfurada embaixo e 3 painéis na cor da marca.
        const [L, C] = eixos(b);
        const t = Math.min(0.12, L * 0.1);
        const base = 0.1;
        const loc = (u0, u1, v0, v1, z0, z1) => caixaLocal(b, u0, u1, v0, v1, z0, z1);
        caixa(pai, P, loc(-0.1, L + 0.1, -0.1, C + 0.1, 0, base), { cores: [COR.metal] });
        caixa(pai, P, loc(0, t, 0, C, base, b.h), { cores: [COR.metal] });
        caixa(pai, P, loc(t, L - t, C * 0.35, C * 0.65, base, b.h * 0.3), { cores: [COR.tela] });
        for (let k = 0; k < 3; k++) {
          // Cada painel pode ter a cor da própria linha (TOTEM 1/PAINEL-1 = o de cima).
          const [z0, z1] = painelTotem(b.h, k);
          caixa(pai, P, loc(t, L - t, 0, C, z0, z1), { cores: b.coresBlocos ? b.coresBlocos[2 - k] : cores, vidro: true });
        }
        caixa(pai, P, loc(t, L - t, 0, C, b.h - t, b.h), { cores: [COR.metal] });
        caixa(pai, P, loc(L - t, L, 0, C, base, b.h), { cores: [COR.metal] });
        break;
      }
      case 'MAKE': {
        if (b.espaco) { // testeira (cada uma com a cor da própria linha na planilha)
          caixa(pai, P, b, { cores });
          break;
        }
        // Corpo do móvel make (encostado na parede, v = 0): painel de fundo, montantes nas pontas,
        // base com rodapé escuro e prateleiras finas inclinadas para a frente, cada uma com a
        // fileira de produtos na borda. As de cima recuam só um pouco (não é escada).
        const [L, C] = eixos(b);
        const loc = (u0, u1, v0, v1, z0, z1) => caixaLocal(b, u0, u1, v0, v1, z0, z1);
        const fundo = Math.min(0.15, C * 0.12);
        const rodape = Math.min(0.12, b.h * 0.05);
        const hBase = b.h * 0.14;
        const montante = Math.min(0.06, L * 0.02);
        const n = PRATELEIRAS.MAKE;
        caixa(pai, P, loc(0, L, 0, fundo, 0, b.h), { cores, modulo: 1.5 });
        caixa(pai, P, loc(0, montante, fundo, C * 0.92, hBase, b.h), { cores: [COR.metal] });
        caixa(pai, P, loc(montante, L - montante, fundo, C, 0, rodape), { cores: [COR.rodape] });
        caixa(pai, P, loc(montante, L - montante, fundo, C, rodape, hBase), { cores });
        const passo = (b.h - hBase - 0.1) / n;
        for (let k = 0; k < n; k++) { // de baixo para cima
          const z = hBase + passo * (k + 0.75);
          const prof = C * (0.9 - 0.05 * k);
          caixa(pai, P, loc(montante, L - montante, fundo, prof, z, z + 0.05), { cores });
          caixa(pai, P, loc(montante + 0.03, L - montante - 0.03, prof - 0.14, prof - 0.02, z + 0.05, z + 0.17), { cores: ['#3A3A3A'] });
        }
        caixa(pai, P, loc(L - montante, L, fundo, C * 0.92, hBase, b.h), { cores: [COR.metal] });
        break;
      }
      case 'ILHA_OUI': {
        // Ilha premium O.U.i: base com prateleiras e, centralizado em cima dela, um painel alto
        // com a marca e duas faixas verticais mais claras nas laterais da frente do painel.
        const [L, C] = eixos(b);
        const loc = (u0, u1, v0, v1, z0, z1) => caixaLocal(b, u0, u1, v0, v1, z0, z1);
        const hBase = b.h * 0.4;
        const prof = C * 0.3;
        const clara = cores ? Object.assign(cores.map((c) => misturar(c, '#FFFFFF', 0.35)), { fixo: cores.fixo }) : null;
        caixa(pai, P, loc(0, L, 0, C, 0, hBase), { cores, vidro: true, prateleiras: PRATELEIRAS.ILHA_OUI, modulo: L / 3 });
        const v0 = (C - prof) / 2;
        caixa(pai, P, loc(L * 0.04, L * 0.96, v0, v0 + prof, hBase, b.h), { cores, vidro: true });
        [[0.1, 0.24], [0.76, 0.9]].forEach(([u0, u1]) => {
          caixa(pai, P, loc(L * u0, L * u1, v0 + prof, v0 + prof + 0.05, hBase + b.h * 0.05, b.h * 0.95), { cores: clara, vidro: true });
        });
        break;
      }
      case 'PAINEL':
      case 'EXPOSITOR_OUI':
        caixa(pai, P, b, { cores, moldura: true });
        break;
      case 'VITRINE_L':
        balcaoL(pai, P, b, cores);
        break;
      case 'CAIXA': {
        // Móvel de atendimento: balcão com a tela preta em cima, no lado do fundo (acompanha o giro).
        caixa(pai, P, b, { cores, prateleiras: 0 });
        const [L, C] = eixos(b);
        const tela = caixaLocal(b, L * 0.35, Math.min(L, L * 0.35 + 0.55), C * 0.15, C * 0.15 + 0.12, b.h, b.h + 0.55);
        caixa(pai, P, tela, { cores: ['#5A5A5A'] });
        break;
      }
      case 'PIRAMIDE': {
        // 4 blocos iguais, um em cima do outro (divisões tracejadas, como as prateleiras dos outros móveis).
        caixa(pai, P, b, { cores, vidro: true, prateleiras: PRATELEIRAS.PIRAMIDE });
        break;
      }
      case 'FILA':
        caixa(pai, P, b, { cores, vidro: true, prateleiras: PRATELEIRAS.FILA, modulo: 1.5 });
        break;
      default: // GONDOLA (cada espaço é uma caixa) e tipos desconhecidos
        caixa(pai, P, b, { cores, vidro: true, prateleiras: PRATELEIRAS.GONDOLA });
    }
  }

  /**
   * Plaquinha quadrada com o número do móvel, em perspectiva, colada na face da frente mais comprida
   * e centralizada nela (na gôndola, na ponta A), um pouco acima do pé. Fundo preto, número branco.
   */
  function desenharNumero(pai, P, m, numero, escala) {
    const a = (numero.length > 1 ? NUMERO.lado + 4 : NUMERO.lado) / 2 / escala; // meio lado, em unidades da loja
    const zc = m.z + Math.max(m.h * 0.3, a + 0.1);
    // Face y = y1 (senão, face x = x1). Gôndola: a face da ponta A (a comprida fica atrás da gôndola vizinha).
    const naFrente = m.tipo === 'GONDOLA' ? m.w < m.d : m.w >= m.d;
    const xc = m.x + m.w / 2, yc = m.y + m.d / 2;
    const ponto = (s, t) => (naFrente ? P(xc + s, m.y + m.d, zc + t) : P(m.x + m.w, yc - s, zc + t));
    const cantos = [ponto(-a, a), ponto(a, a), ponto(a, -a), ponto(-a, -a)];
    const [cx, cy] = ponto(0, 0);
    const g = el('g', { class: 'numero-movel' }, pai);
    poligono(g, cantos, { fill: '#111111', stroke: '#111111', 'stroke-width': 0.8, 'stroke-linejoin': 'round' });
    // O texto acompanha a face: "deitado" na mesma inclinação da planta.
    const k = NUMERO.lado * 0.62 / NUMERO.fonte;
    const txt = el('g', { transform: 'matrix(' + [COS30 * k, (naFrente ? 0.5 : -0.5) * k, 0, k, cx, cy].join(',') + ')' }, g);
    texto(txt, 0, NUMERO.fonte * 0.36, numero, {
      'font-family': FONTE_ETQ, 'font-size': NUMERO.fonte, 'font-weight': 800, fill: '#FFFFFF', 'text-anchor': 'middle',
    });
    const xs = cantos.map((c) => c[0]), ys = cantos.map((c) => c[1]);
    const x0 = Math.min.apply(null, xs), y0 = Math.min.apply(null, ys);
    return { x: x0, y: y0, w: Math.max.apply(null, xs) - x0, h: Math.max.apply(null, ys) - y0 };
  }

  /** Ordenação de pintura (o que está atrás é desenhado primeiro). */
  function ordenar(prims, P) {
    const n = prims.length;
    const tela = prims.map((b) => {
      const xs = [];
      const ys = [];
      [b.x, b.x + b.w].forEach((x) => [b.y, b.y + b.d].forEach((y) => [b.z, b.z + b.h].forEach((z) => {
        const p = P(x, y, z);
        xs.push(p[0]);
        ys.push(p[1]);
      })));
      return { x0: Math.min.apply(null, xs), x1: Math.max.apply(null, xs), y0: Math.min.apply(null, ys), y1: Math.max.apply(null, ys) };
    });
    const prof = prims.map((b) => b.x + b.w / 2 + b.y + b.d / 2 + b.z * 0.5);
    const e = 1e-6;
    const separa = (a, b) => {
      if (a.x + a.w <= b.x + e) return -1;
      if (b.x + b.w <= a.x + e) return 1;
      if (a.y + a.d <= b.y + e) return -1;
      if (b.y + b.d <= a.y + e) return 1;
      if (a.z + a.h <= b.z + e) return -1;
      if (b.z + b.h <= a.z + e) return 1;
      return 0;
    };
    const depois = prims.map(() => []);
    const grau = new Array(n).fill(0);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const A = tela[i];
        const B = tela[j];
        if (A.x1 <= B.x0 || B.x1 <= A.x0 || A.y1 <= B.y0 || B.y1 <= A.y0) continue;
        let r = separa(prims[i], prims[j]);
        if (r === 0) r = prof[i] <= prof[j] ? -1 : 1;
        if (r < 0) { depois[i].push(j); grau[j]++; } else { depois[j].push(i); grau[i]++; }
      }
    }
    const saida = [];
    const prontos = [];
    for (let i = 0; i < n; i++) if (!grau[i]) prontos.push(i);
    const usados = new Array(n).fill(false);
    while (saida.length < n) {
      if (!prontos.length) { // ciclo (não deveria acontecer): pega o mais ao fundo
        let melhor = -1;
        for (let i = 0; i < n; i++) if (!usados[i] && (melhor < 0 || prof[i] < prof[melhor])) melhor = i;
        prontos.push(melhor);
        grau[melhor] = 0;
      }
      prontos.sort((a, b) => prof[b] - prof[a]);
      const i = prontos.pop();
      if (usados[i]) continue;
      usados[i] = true;
      saida.push(prims[i]);
      depois[i].forEach((j) => { if (--grau[j] === 0 && !usados[j]) prontos.push(j); });
    }
    return saida;
  }

  /* ----------------------------- piso e paredes ---------------------------- */

  function desenharLoja(pai, P, loja) {
    const W = loja.largura, D = loja.profundidade, H = loja.alturaParede;
    const t = ESPESSURA_PAREDE, b = ESPESSURA_PISO;
    const g = el('g', { class: 'loja' }, pai);
    // Laje do piso (bordas frontais).
    poligono(g, [P(-t, D, 0), P(W, D, 0), P(W, D, -b), P(-t, D, -b)], { fill: COR.lajeFrente, stroke: COR.lajeBorda });
    poligono(g, [P(W, -t, 0), P(W, D, 0), P(W, D, -b), P(W, -t, -b)], { fill: COR.lajeLado, stroke: COR.lajeBorda });
    poligono(g, [P(-t, -t, 0), P(W, -t, 0), P(W, D, 0), P(-t, D, 0)], { fill: COR.piso, stroke: COR.pisoBorda });
    // Paredes do fundo (esquerda e direita).
    const parede = { cores: null, corNeutra: COR.parede };
    caixa(g, P, { x: -t, y: -t, z: 0, w: t, d: D + t, h: H }, parede);
    caixa(g, P, { x: 0, y: -t, z: 0, w: W, d: t, h: H }, parede);
  }

  /** Grade do piso (1 unidade; linha mais forte a cada 5) com a numeração dos eixos. */
  function desenharGrade(pai, P, loja) {
    const g = el('g', { class: 'grade', 'pointer-events': 'none' }, pai);
    const W = loja.largura, D = loja.profundidade;
    for (let x = 0; x <= W + 1e-6; x += 1) {
      const forte = Math.round(x) % 5 === 0;
      linha(g, P(x, 0, 0), P(x, D, 0), { stroke: forte ? COR.gradeForte : COR.gradeFraca, 'stroke-width': forte ? 1 : 0.6 });
      if (forte) texto(g, P(x, D, 0)[0] + 4, P(x, D, 0)[1] + 16, 'X ' + x, { 'font-size': 11, fill: COR.gradeTexto, 'font-weight': 700 });
    }
    for (let y = 0; y <= D + 1e-6; y += 1) {
      const forte = Math.round(y) % 5 === 0;
      linha(g, P(0, y, 0), P(W, y, 0), { stroke: forte ? COR.gradeForte : COR.gradeFraca, 'stroke-width': forte ? 1 : 0.6 });
      if (forte) texto(g, P(W, y, 0)[0] + 6, P(W, y, 0)[1] + 14, 'Y ' + y, { 'font-size': 11, fill: COR.gradeTexto, 'font-weight': 700 });
    }
  }

  /* ------------------------------ etiquetas ------------------------------- */

  /** Pilha de etiquetas: todas com a mesma largura (wEtq); maxTexto = largura máxima do texto. */
  function medirGrupo(etiquetas, simbolo, corPadrao, maxTexto) {
    const itens = etiquetas.map((e) => {
      const linhas = quebrar(e.texto, maxTexto || ETQ.maxTexto, ETQ.fonte, 800, FONTE_ETQ);
      const w = Math.max.apply(null, linhas.map((l) => largura(l, ETQ.fonte, 800, 'normal', FONTE_ETQ))) + ETQ.padX * 2;
      return {
        linhas,
        w,
        h: linhas.length * ETQ.lh + ETQ.padY * 2,
        cores: coresDe(e.marca, 'etiqueta', true) || corPadrao,
      };
    });
    const wEtq = Math.max.apply(null, itens.map((i) => i.w));
    const h = itens.reduce((s, i) => s + i.h, 0) + ETQ.gap * (itens.length - 1);
    return { itens, wEtq, w: wEtq + (simbolo ? ETQ.simbolo + 4 : 0), h, simbolo };
  }

  /** Ordem dos símbolos na legenda (o de antecipação vem da aba Antecipações, não da planilha). */
  const ORDEM_SIMBOLOS = ['FIXO', 'EXPOSICAO', 'NOVO', 'ANTECIPADO'];

  function desenharSimbolo(pai, simbolo, cx, cy, escala) {
    const k = escala || 1;
    const g = el('g', { transform: 'translate(' + cx + ',' + cy + ') scale(' + k + ')' }, pai);
    if (simbolo === 'FIXO') { // cadeado
      el('path', { d: 'M-4.2,-1.5 V-4.6 a4.2,4.2 0 0 1 8.4,0 V-1.5', fill: 'none', stroke: COR.simbolo, 'stroke-width': 2.2 }, g);
      el('rect', { x: -6.8, y: -1.8, width: 13.6, height: 10.3, rx: 1.8, fill: COR.simbolo }, g);
      el('circle', { cx: 0, cy: 2.6, r: 1.6, fill: COR.simboloMiolo }, g);
      el('rect', { x: -0.7, y: 3.2, width: 1.4, height: 2.8, fill: COR.simboloMiolo }, g);
    } else if (simbolo === 'EXPOSICAO') {
      el('circle', { r: 8.5, fill: COR.simbolo, stroke: COR.simboloMiolo, 'stroke-width': 1.2 }, g);
      texto(g, 0, 4, 'E', { 'font-size': 11, 'font-weight': 700, fill: COR.simboloMiolo, 'text-anchor': 'middle' });
    } else if (simbolo === 'NOVO') {
      const pts = [];
      for (let i = 0; i < 24; i++) {
        const r = i % 2 ? 8 : 11;
        const a = (Math.PI * 2 * i) / 24;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      poligono(g, pts, { fill: '#FFD21F', stroke: '#B88A00', 'stroke-width': 0.8 });
      texto(g, 0, 2.4, 'NEW', { 'font-size': 6.5, 'font-weight': 700, fill: '#6B4200', 'text-anchor': 'middle' });
    } else if (simbolo === 'ANTECIPADO') { // antecipação: "avançar" (⏩) num círculo laranja
      el('circle', { r: 9, fill: '#EA580C', stroke: '#9A3412', 'stroke-width': 1 }, g);
      poligono(g, [[-5.6, -4.6], [-0.4, 0], [-5.6, 4.6]], { fill: '#FFFFFF' });
      poligono(g, [[-0.6, -4.6], [4.6, 0], [-0.6, 4.6]], { fill: '#FFFFFF' });
      el('rect', { x: 4.6, y: -4.6, width: 1.6, height: 9.2, fill: '#FFFFFF' }, g);
    }
    return g;
  }

  /**
   * Retângulo arredondado de etiqueta: pílula numa linha, cantos suaves em várias; borda um pouco mais escura.
   * Espaço fixo: borda dupla, um contorno a mais por fora na cor da etiqueta (com um fio branco no meio).
   */
  function fundoEtiqueta(pai, x, y, w, h, cores, fixo) {
    if (fixo) {
      const f = 2.4 * escalaEtq;
      el('rect', {
        class: 'etq-fixo', x: x - f, y: y - f, width: w + 2 * f, height: h + 2 * f, rx: Math.min(ETQ.raio, h / 2) + f,
        fill: '#FFFFFF', stroke: cores[0], 'stroke-width': 1.6 * escalaEtq,
      }, pai);
    }
    const r = el('rect', {
      class: 'etq', x, y, width: w, height: h, rx: Math.min(ETQ.raio, h / 2), fill: tinta(cores, 0),
      stroke: misturar(cores[0], '#000000', 0.2), 'stroke-width': 0.8,
    }, pai);
    if (fixo) {
      el('rect', {
        class: 'hachura', x, y, width: w, height: h, rx: Math.min(ETQ.raio, h / 2),
        fill: hachura(cores[0], 0.75 * escalaEtq), 'pointer-events': 'none',
      }, pai);
    }
    return r;
  }

  /* ---------------------------- fichas dos móveis --------------------------- */
  // Visão simplificada: cada móvel com etiqueta ganha uma ficha, com o nome do móvel (com a plaquinha
  // do número, igual à da planta) e uma linha por espaço, com o móvel em miniatura (na mesma posição
  // da planta, só aquele espaço pintado) e as etiquetas dele. As fichas ficam agrupadas por tipo.

  /** Número do móvel na plaquinha ("MOVEL DE FILA 3" → "3"), só nos tipos numerados. */
  function numeroDe(m) {
    if (NUMERADOS.indexOf(m.tipo) < 0) return '';
    const n = /(\d+)\s*$/.exec(m.id);
    return n ? String(Number(n[1])) : '';
  }

  /** Caixas do móvel para a miniatura, cada uma com o espaço dela (null = estrutura, fica sempre cinza). */
  function formaDoMovel(m) {
    const [L, C] = eixos(m);
    const esp = espacos(m);
    const loc = (u0, u1, v0, v1, z0, z1, espaco) => Object.assign(caixaLocal(m, u0, u1, v0, v1, z0, z1), { espaco: espaco || null });
    if (m.tipo === 'GONDOLA') return caixasGondola(m);
    if (m.tipo === 'MAKE') return primitivas(m).map((p) => Object.assign({}, p, { espaco: p.espaco || null }));
    if (m.tipo === 'MESA' || m.tipo === 'MESA_3') {
      // Cada frente: a lâmina de vidro do fundo (alta) e o nicho com o cartaz (baixo). O verso é
      // uma placa fina atrás das lâminas, na altura delas.
      const frentes = esp.filter((e) => !e.vm);
      const passo = L / frentes.length;
      const g = Math.min(0.05, passo * 0.04);
      const painel = Math.min(0.15, C * 0.12);
      const lista = [loc(g, L - g, -painel * 0.5, 0, m.h * 0.32, m.h, esp.find((e) => e.vm))];
      frentes.forEach((e, k) => {
        lista.push(loc(k * passo + g, (k + 1) * passo - g, 0, painel, 0, m.h, e));
        lista.push(loc(k * passo + g, (k + 1) * passo - g, painel, C, 0, m.h * 0.47, e));
      });
      return lista;
    }
    if (m.tipo === 'TOTEM') {
      const t = Math.min(0.12, L * 0.1);
      return [loc(0, t, 0, C, 0, m.h), loc(L - t, L, 0, C, 0, m.h)].concat([0, 1, 2].map((k) => {
        const [z0, z1] = painelTotem(m.h, k);
        return loc(t, L - t, 0, C, z0, z1, esp[2 - k]);
      }));
    }
    if (m.tipo === 'VITRINE_L') {
      const t = espessuraL(m);
      const c = cantoL(m);
      const yBraco = c.frente ? m.y + m.d - t : m.y;
      return [
        { x: m.x, y: yBraco, z: m.z, w: m.w, d: t, h: m.h },
        { x: c.direita ? m.x + m.w - t : m.x, y: c.frente ? m.y : m.y + t, z: m.z, w: t, d: m.d - t, h: m.h },
      ];
    }
    return [{ x: m.x, y: m.y, z: m.z, w: m.w, d: m.d, h: m.h }];
  }

  /**
   * Miniatura do móvel dentro de (x, y, w, h), na mesma orientação da planta, com os espaços "ids"
   * pintados na cor da etiqueta e o resto em cinza claro (ids = null: o móvel todo pintado).
   * cores também pode ser uma função (espaço da caixa ou null) => cores, ou null para cinza.
   * O verso da mesa fica de costas na planta: com verso = true (ou só o verso em ids), a mesa
   * aparece espelhada, com o verso virado para quem olha.
   */
  function desenharMiniatura(pai, m, ids, cores, x, y, w, h, verso) {
    const corDe = typeof cores === 'function' ? cores : () => cores;
    const espelhar = verso || !!(ids && ids.length && ids.every((id) => id === 'VERSO'));
    const caixas = formaDoMovel(m).map((b) => (!espelhar ? b : m.w >= m.d
      ? Object.assign({}, b, { y: 2 * m.y + m.d - b.y - b.d })
      : Object.assign({}, b, { x: 2 * m.x + m.w - b.x - b.w })));
    const bruto = (px, py, pz) => [(px - py) * COS30, (px + py) * 0.5 - pz];
    const xs = [];
    const ys = [];
    caixas.forEach((b) => [b.x, b.x + b.w].forEach((px) => [b.y, b.y + b.d].forEach((py) => [b.z, b.z + b.h].forEach((pz) => {
      const r = bruto(px, py, pz);
      xs.push(r[0]);
      ys.push(r[1]);
    }))));
    const x0 = Math.min.apply(null, xs);
    const y0 = Math.min.apply(null, ys);
    const bw = Math.max.apply(null, xs) - x0 || 1;
    const bh = Math.max.apply(null, ys) - y0 || 1;
    const k = Math.min(w / bw, h / bh);
    const ox = x + (w - bw * k) / 2 - x0 * k;
    const oy = y + (h - bh * k) / 2 - y0 * k;
    const P = (px, py, pz) => {
      const r = bruto(px, py, pz || 0);
      return [ox + r[0] * k, oy + r[1] * k];
    };
    const g = el('g', { class: 'miniatura' }, pai);
    ordenar(caixas, P).forEach((b) => {
      const propria = (ids ? !!(b.espaco && ids.indexOf(b.espaco.id) >= 0) : true) ? corDe(b.espaco || null) : null;
      const pintado = !!propria;
      const base = pintado ? propria : ['#E4E2DF'];
      const comum = { stroke: pintado ? misturar(propria[0], '#000000', 0.45) : '#A3A09B', 'stroke-width': 0.7, 'stroke-linejoin': 'round' };
      const x1 = b.x + b.w, y1 = b.y + b.d, z1 = b.z + b.h;
      poligono(g, [P(b.x, y1, b.z), P(x1, y1, b.z), P(x1, y1, z1), P(b.x, y1, z1)], Object.assign({ fill: tinta(base, 0) }, comum));
      poligono(g, [P(x1, b.y, b.z), P(x1, y1, b.z), P(x1, y1, z1), P(x1, b.y, z1)], Object.assign({ fill: tinta(base, 0.16) }, comum));
      poligono(g, [P(b.x, b.y, z1), P(x1, b.y, z1), P(x1, y1, z1), P(b.x, y1, z1)], Object.assign({ fill: tinta(base, pintado ? -0.3 : -0.5) }, comum));
    });
    return g;
  }

  /** Nome curto do(s) espaço(s) de uma linha da ficha: "Ponta A", "Meio A", "Frentes 1–2"… */
  function nomeCurto(lista) {
    const ids = lista.map((e) => e.id);
    // As duas metades de um meio juntas = o meio inteiro.
    if (ids.length > 1 && ids.every((id) => /^MEIO-[AB]-\d$/.test(id) && id.slice(0, 6) === ids[0].slice(0, 6))) {
      return 'Meio ' + ids[0].charAt(5);
    }
    const um = (id) => {
      const g = /^(PONTA|MEIO)-([AB])(?:-(\d))?$/.exec(id);
      if (g) return (g[1] === 'PONTA' ? 'Ponta ' : 'Meio ') + g[2] + (g[3] ? ' · ' + g[3] : '');
      if (id === 'VERSO') return 'Verso';
      const n = /^(\w+)-(\d+)$/.exec(id);
      return n ? n[1].charAt(0) + n[1].slice(1).toLowerCase() + ' ' + n[2] : id;
    };
    if (ids.length === 1) return um(ids[0]);
    const n = ids.map((id) => /^(FRENTE|PAINEL|TESTEIRA)-(\d+)$/.exec(id));
    if (n.every((x) => x && x[1] === n[0][1])) {
      const plural = { FRENTE: 'Frentes', PAINEL: 'Painéis', TESTEIRA: 'Testeiras' }[n[0][1]];
      return plural + ' ' + n[0][2] + '–' + n[n.length - 1][2];
    }
    return ids.map(um).join(' + ');
  }

  /**
   * Fichas da planta: uma por móvel com etiqueta, com uma linha por espaço (gôndola, mesas, totem,
   * móvel make) ou uma linha só (os demais). Espaços vizinhos com as mesmas etiquetas viram uma linha.
   */
  function montarFichas(moveis, info, infoEspaco, config) {
    const limitePorTipo = config.etiquetasPorTipo || {};
    const limitePorBloco = config.etiquetasPorBloco || {};
    const fichas = [];
    moveis.forEach((m) => {
      let linhas;
      if (espacos(m).length) {
        linhas = juntarIguais(espacos(m).map((e) => {
          const ie = infoEspaco[m.id + '/' + e.id];
          return ie && ie.etiquetas.length
            ? { info: ie, etiquetas: ie.etiquetas.slice(0, limitePorBloco[m.tipo] || 1), simbolo: ie.simbolo, espacos: [e] }
            : null;
        }));
      } else {
        const i = info[m.id];
        linhas = i && i.etiquetas.length
          ? [{ info: i, etiquetas: i.etiquetas.slice(0, limitePorTipo[m.tipo] || i.etiquetas.length), simbolo: i.simbolo, espacos: null }]
          : [];
      }
      if (!linhas.length) return;
      // Móvel com espaços: o nome do espaço fica entre a miniatura e as etiquetas (que ficam mais estreitas).
      const comLegenda = linhas.some((ln) => ln.espacos);
      const xEtq = FICHA.pad + FICHA.mini + FICHA.vao + (comLegenda ? FICHA.legenda + FICHA.vao : 0);
      const larguraEtq = FICHA.w - xEtq - FICHA.pad - FICHA.simbolo;
      linhas.forEach((ln) => {
        const corMarca = !ehNeutro(ln.info.marca) && coresDe(ln.info.marca, 'etiqueta', true);
        ln.med = medirGrupo(ln.etiquetas, ln.simbolo, corMarca || corEtiquetaPadrao(true), larguraEtq - ETQ.padX * 2);
        ln.med.wEtq = larguraEtq;
        ln.cores = corMarca || ln.med.itens[0].cores; // cor do espaço na miniatura
        ln.legenda = ln.espacos ? quebrar(nomeCurto(ln.espacos).toUpperCase(), FICHA.legenda, 8.5, 800, FONTE_ETQ) : [];
        ln.h = Math.max(ln.med.h, FICHA.miniH, ln.legenda.length * 10 + 3);
      });
      const h = FICHA.pad + FICHA.cab + linhas.reduce((s, l) => s + l.h, 0) + FICHA.entre * (linhas.length - 1) + FICHA.pad;
      fichas.push({ id: m.id, movel: m, linhas, xEtq, w: FICHA.w, h });
    });
    return fichas;
  }

  function desenharFicha(pai, f, attrs) {
    // data-movel-base: o móvel da ficha (para destacá-la ao passar o mouse no móvel).
    const g = el('g', Object.assign({ 'data-movel': f.id, 'data-movel-base': f.movel.id }, attrs), pai);
    el('rect', {
      class: 'ficha-fundo', x: f.x, y: f.y, width: f.w, height: f.h, rx: FICHA.raio,
      fill: COR.fichaFundo, stroke: COR.fichaBorda, 'stroke-width': 1, filter: 'url(#sombraEtq)',
    }, g);
    // Cabeçalho: plaquinha do número (como na planta) e o nome do móvel.
    const numero = numeroDe(f.movel);
    const cy = f.y + FICHA.pad + 7.5;
    let tx = f.x + FICHA.pad + 1;
    if (numero) {
      const lado = numero.length > 1 ? 21 : 15;
      el('rect', { x: tx, y: cy - 7.5, width: lado, height: 15, rx: 3, fill: '#111111' }, g);
      texto(g, tx + lado / 2, cy + 3.8, numero, { 'font-family': FONTE_ETQ, 'font-size': 10.5, 'font-weight': 800, fill: '#FFFFFF', 'text-anchor': 'middle' });
      tx += lado + 6;
    }
    const nome = f.movel.descricao || f.movel.id;
    texto(g, tx, cy + 3.6, (numero ? nome.replace(/\s*\d+\s*$/, '') : nome).toUpperCase(), {
      'font-family': FONTE_ETQ, 'font-size': 10.5, 'font-weight': 800, 'letter-spacing': 0.6, fill: COR.fichaTitulo,
    });
    linha(g, [f.x + 1, f.y + FICHA.pad + 17.5], [f.x + f.w - 1, f.y + FICHA.pad + 17.5], { stroke: COR.fichaLinha, 'stroke-width': 1 });
    // Uma linha por espaço: miniatura do móvel (com o espaço pintado), nome do espaço e as etiquetas dele.
    const xMini = f.x + FICHA.pad;
    const xEtq = f.x + f.xEtq;
    let y = f.y + FICHA.pad + FICHA.cab;
    f.linhas.forEach((ln, k) => {
      if (k) linha(g, [xMini, y - FICHA.entre / 2], [f.x + f.w - FICHA.pad, y - FICHA.entre / 2], { stroke: COR.fichaDivisao, 'stroke-width': 1 });
      const gl = el('g', { class: 'ficha-linha', 'data-espaco': ln.espacos ? ln.espacos.map((e) => e.id).join(' ') : null }, g);
      desenharMiniatura(gl, f.movel, ln.espacos ? ln.espacos.map((e) => e.id) : null, ln.cores, xMini, y + (ln.h - FICHA.miniH) / 2, FICHA.mini, FICHA.miniH);
      const yLeg = y + ln.h / 2 - (ln.legenda.length * 10) / 2 + 7.5;
      ln.legenda.forEach((t, i) => texto(gl, xMini + FICHA.mini + FICHA.vao, yLeg + i * 10, t, {
        'font-family': FONTE_ETQ, 'font-size': 8.5, 'font-weight': 800, 'letter-spacing': 0.2, fill: COR.fichaLegenda,
      }));
      let ye = y + (ln.h - ln.med.h) / 2;
      ln.med.itens.forEach((it, i) => {
        fundoEtiqueta(gl, xEtq, ye, ln.med.wEtq, it.h, it.cores, ln.simbolo === 'FIXO');
        it.linhas.forEach((l, j) => {
          texto(gl, xEtq + ln.med.wEtq / 2, ye + ETQ.padY + ETQ.lh * (j + 1) - 3.6, l, {
            'font-family': FONTE_ETQ, 'font-size': ETQ.fonte, 'font-weight': 800, 'letter-spacing': 0.15,
            fill: '#FFFFFF', 'text-anchor': 'middle',
          });
        });
        if (i === 0 && ln.simbolo) desenharSimbolo(gl, ln.simbolo, xEtq + ln.med.wEtq + FICHA.simbolo / 2 + 1, ye + it.h / 2);
        ye += it.h + ETQ.gap;
      });
      y += ln.h + FICHA.entre;
    });
    return g;
  }

  /** Ponto do móvel onde chega a linha-guia: meio do tampo (no balcão em L, o meio do braço da frente/fundo). */
  function ancoraDe(m, P) {
    if (m.tipo === 'VITRINE_L') {
      const t = espessuraL(m);
      return P(m.x + m.w / 2, cantoL(m).frente ? m.y + m.d - t / 2 : m.y + t / 2, m.z + m.h);
    }
    if (m.tipo === 'GONDOLA_PAREDE') return pontosPlacas(m, P)[0];
    return P(m.x + m.w / 2, m.y + m.d / 2, m.z + m.h);
  }

  /** Móvel de parede: meio da frente da placa de comunicação (onde chega a linha-guia). */
  function pontosPlacas(m, P) {
    return placasParede(m).map(({ placa: b }) => (m.w >= m.d
      ? P(b.x + b.w / 2, b.y + b.d, b.z + b.h / 2)
      : P(b.x + b.w, b.y + b.d / 2, b.z + b.h / 2)));
  }

  /** Seções da visão simplificada: tipos de móvel, nesta ordem (os demais vão em "Outros"). */
  const SECOES_FICHAS = [
    { titulo: 'Gôndolas', tipos: ['GONDOLA'] },
    { titulo: 'Pirâmides', tipos: ['PIRAMIDE'] },
    { titulo: 'Móveis de fila', tipos: ['FILA'] },
    { titulo: 'Mesas destaque', tipos: ['MESA', 'MESA_3'] },
    { titulo: 'Totens', tipos: ['TOTEM'] },
    { titulo: 'Móvel make', tipos: ['MAKE'] },
    { titulo: 'Móveis de parede', tipos: ['GONDOLA_PAREDE'] },
    { titulo: 'Balcão recepção', tipos: ['VITRINE_L'] },
    { titulo: 'PDV móvel', tipos: ['CUBO'] },
    { titulo: 'O.U.i', tipos: ['PAINEL', 'EXPOSITOR_OUI', 'ILHA_OUI'] },
  ];
  const CABECALHO_SECAO = 30; // altura do título de cada tipo

  /** Fichas agrupadas por tipo de móvel (na ordem de SECOES_FICHAS) e, dentro do tipo, pelo número. */
  function agruparFichas(fichas) {
    const num = (f) => { const n = /(\d+)\s*$/.exec(f.movel.id); return n ? Number(n[1]) : 0; };
    const secoes = SECOES_FICHAS.map((sec) => ({ titulo: sec.titulo, fichas: fichas.filter((f) => sec.tipos.indexOf(f.movel.tipo) >= 0) }));
    const conhecidos = [].concat.apply([], SECOES_FICHAS.map((sec) => sec.tipos));
    secoes.push({ titulo: 'Outros', fichas: fichas.filter((f) => conhecidos.indexOf(f.movel.tipo) < 0) });
    return secoes.filter((sec) => sec.fichas.length).map((sec) => Object.assign(sec, {
      fichas: sec.fichas.sort((a, b) => num(a) - num(b) || (a.movel.id < b.movel.id ? -1 : 1)),
    }));
  }

  /**
   * Arranjo da visão simplificada (sem a planta): as fichas em colunas, lidas de cima para baixo e da
   * esquerda para a direita, agrupadas por tipo de móvel, cada grupo com o título dele (repetido com
   * "(cont.)" se passar para a coluna seguinte). As caixas de destaque vêm no fim, como o grupo
   * "Destaques", na largura das fichas. As colunas começam depois do painel lateral e param acima do
   * que estiver embaixo (legenda, notas, itens extras). Se não couberem, o slide cresce em 16:9.
   * painel: { callouts (já medidos na largura da ficha), embaixo(W, H) → retângulos }.
   */
  function arranjarSimplificada(fichas, painel) {
    const secoes = agruparFichas(fichas);
    if (painel.callouts.length) secoes.push({ titulo: 'Destaques', fichas: painel.callouts });
    const passo = FICHA.w + 16;
    for (let fator = 1; ; fator += 0.05) {
      const W = Math.max(Math.round((TELA_BASE.w * fator) / 16) * 16, painel.larguraMinima || 0);
      const H = (W / 16) * 9;
      const x0 = comPaineis ? FICHA.xEsq : 24;
      const nCol = Math.max(1, Math.floor((W - FICHA.margem - x0 + 16) / passo));
      // Cada coluna vai do alto do slide até acima do que está embaixo dela.
      const colunas = Array.from({ length: nCol }, (_, c) => {
        const x = x0 + c * passo;
        const baixo = painel.embaixo(W, H).filter((r) => r.x < x + FICHA.w && r.x + r.w > x);
        return { x, y0: 20, y1: Math.min.apply(null, [H - FICHA.margem].concat(baixo.map((r) => r.y - 14))) };
      });
      const alturaSecao = (sec) => CABECALHO_SECAO + sec.fichas.reduce((t, f) => t + f.h + FICHA.gap, 0);
      const titulos = [];
      let c = 0;
      let y = colunas[0].y0;
      const proxima = () => { c++; if (c < nCol) y = colunas[c].y0; return c < nCol; };
      const cabe = secoes.every((sec) => sec.fichas.every((f, i) => {
        // Um tipo que não cabe no resto da coluna, mas cabe inteiro na seguinte, começa nela.
        if (i === 0 && y + alturaSecao(sec) > colunas[c].y1 && c + 1 < nCol && y > colunas[c].y0
          && colunas[c + 1].y0 + alturaSecao(sec) <= colunas[c + 1].y1) proxima();
        // Título junto com a primeira ficha do tipo; numa coluna nova, o título se repete.
        const precisa = (i === 0 ? CABECALHO_SECAO : 0) + f.h;
        if (y + precisa > colunas[c].y1) {
          if (!proxima() || y + CABECALHO_SECAO + f.h > colunas[c].y1) return false;
          if (i > 0) { titulos.push({ texto: sec.titulo + ' (cont.)', x: colunas[c].x, y }); y += CABECALHO_SECAO; }
        }
        if (i === 0) { titulos.push({ texto: sec.titulo, n: sec.fichas.length, x: colunas[c].x, y }); y += CABECALHO_SECAO; }
        f.baseX = colunas[c].x;
        f.baseY = y;
        y += f.h + FICHA.gap;
        if (i === sec.fichas.length - 1) y += 10; // respiro entre um tipo e o seguinte
        return true;
      }));
      if (cabe || fator > 3) {
        painel.callouts.forEach((c) => Object.assign(c, { x: c.baseX, y: c.baseY, alvo: null }));
        return { w: W, h: H, titulos, callouts: painel.callouts, limites: { x0, y0: 8, x1: W - FICHA.margem, y1: H - 8 } };
      }
    }
  }

  /** Título de um tipo de móvel na visão simplificada: nome, quantidade e um traço embaixo. */
  function desenharTituloSecao(pai, t) {
    const g = el('g', { class: 'titulo-secao' }, pai);
    texto(g, t.x + 2, t.y + 16, t.texto.toUpperCase(), {
      'font-family': FONTE_ETQ, 'font-size': 13, 'font-weight': 800, 'letter-spacing': 0.8, fill: COR.secaoTitulo,
    });
    if (t.n) {
      const w = largura(t.texto.toUpperCase(), 13, 800, 'normal', FONTE_ETQ) + t.texto.length * 0.8;
      texto(g, t.x + 10 + w, t.y + 16, String(t.n), { 'font-family': FONTE_ETQ, 'font-size': 12, 'font-weight': 700, fill: COR.secaoNumero });
    }
    linha(g, [t.x, t.y + 23], [t.x + FICHA.w, t.y + 23], { stroke: COR.secaoTitulo, 'stroke-width': 1.5 });
  }

  /* ------------------------ etiquetas na planta --------------------------- */
  // Visão "Na planta": as etiquetas ficam junto do móvel. Nos móveis com espaços, cada pilha sai da
  // face do próprio espaço, para o lado que ela olha (ponta A: além da ponta da frente; meio B: para
  // trás da gôndola; frente 2: na frente da mesa; verso: atrás da mesa…), com o nome do espaço numa plaquinha escura e uma
  // linha-guia na cor da etiqueta até um ponto na face. Nos móveis de um espaço só, a pilha fica em
  // cima do móvel (ou no lugar livre mais perto). A planta cresce (slide em 16:9) até as etiquetas
  // caberem perto dos móveis sem cobrir os outros.

  const ROTULO_BASE = { chip: 13, vaoChip: 2, fonteChip: 8.5 };
  const ROTULO = Object.assign({ cel: 6 }, ROTULO_BASE);
  let escalaEtq = 1; // tamanho das etiquetas no desenho atual (1 = padrão)

  /** Aplica o tamanho das etiquetas (k = 1 é o padrão) às medidas usadas no desenho. */
  function definirEscalaEtiquetas(k) {
    escalaEtq = k;
    Object.keys(ETQ_BASE).forEach((c) => { ETQ[c] = ETQ_BASE[c] * k; });
    Object.keys(ROTULO_BASE).forEach((c) => { ROTULO[c] = ROTULO_BASE[c] * k; });
  }

  /** Direção (no piso) para onde cada espaço olha: +u/-u nas pontas, +v/-v nos meios, frentes e verso. */
  function direcaoDoEspaco(m, id) {
    const local = /^PONTA-A/.test(id) ? [1, 0] : /^PONTA-B/.test(id) ? [-1, 0] : /^(MEIO-B|VERSO)/.test(id) ? [0, -1] : [0, 1];
    // u = lado maior: x quando largura >= profundidade (então v = y), senão o contrário.
    return m.w >= m.d ? local : [local[1], local[0]];
  }

  /**
   * Ponto 3D da face do espaço por onde sai a linha-guia: no meio da face que olha para "dir"; se ela
   * fica de costas para quem olha (-x / -y), na aresta de cima dela (a parte que aparece).
   */
  function pontoDaFace(b, dir) {
    const [dx, dy] = dir;
    const x = dx > 0 ? b.x + b.w : dx < 0 ? b.x : b.x + b.w / 2;
    const y = dy > 0 ? b.y + b.d : dy < 0 ? b.y : b.y + b.d / 2;
    const visivel = dx > 0 || dy > 0;
    return [x, y, visivel ? b.z + b.h * 0.55 : b.z + b.h];
  }

  /** Caixa do espaço que recebe a linha-guia (mesa: o nicho com o cartaz; demais: a caixa do espaço). */
  function caixaDoEspaco(m, id) {
    const caixas = formaDoMovel(m).filter((b) => b.espaco && b.espaco.id === id);
    return caixas[caixas.length - 1];
  }

  /**
   * Pilhas de etiquetas da visão na planta (tamanhos, sem posição): uma por espaço (ou por móvel de
   * um espaço só). Espaços vizinhos com as mesmas etiquetas viram uma pilha, com uma linha para cada um.
   */
  function montarRotulos(moveis, info, infoEspaco, config) {
    const limitePorTipo = config.etiquetasPorTipo || {};
    const limitePorBloco = config.etiquetasPorBloco || {};
    const rotulos = [];
    moveis.forEach((m) => {
      let linhas;
      if (espacos(m).length) {
        linhas = juntarIguais(espacos(m).map((e) => {
          const ie = infoEspaco[m.id + '/' + e.id];
          return ie && ie.etiquetas.length
            ? { info: ie, etiquetas: ie.etiquetas.slice(0, limitePorBloco[m.tipo] || 1), simbolo: ie.simbolo, espacos: [e] }
            : null;
        }));
      } else {
        const i = info[m.id];
        linhas = i && i.etiquetas.length
          ? [{ info: i, etiquetas: i.etiquetas.slice(0, limitePorTipo[m.tipo] || i.etiquetas.length), simbolo: i.simbolo, espacos: null }]
          : [];
      }
      linhas.forEach((ln) => {
        const corMarca = !ehNeutro(ln.info.marca) && coresDe(ln.info.marca, 'etiqueta', true);
        const med = medirGrupo(ln.etiquetas, ln.simbolo, corMarca || corEtiquetaPadrao(true));
        // Móvel de parede: a plaquinha leva o nome do móvel (a categoria do espaço destaque).
        const legenda = ln.espacos ? nomeCurto(ln.espacos).toUpperCase() : m.tipo === 'GONDOLA_PAREDE' ? String(m.descricao || '').toUpperCase() : '';
        const wChip = legenda ? largura(legenda, ROTULO.fonteChip, 800, 'normal', FONTE_ETQ) + 10 * escalaEtq : 0;
        const topo = legenda ? ROTULO.chip + ROTULO.vaoChip : 0;
        rotulos.push(Object.assign(med, {
          id: m.id + (ln.espacos ? '/' + ln.espacos.map((e) => e.id).join('+') : ''),
          movel: m, info: ln.info, espacos: ln.espacos, legenda, wChip, topo,
          cor: (corMarca || med.itens[0].cores)[0],
          w: Math.max(med.w, wChip), h: med.h + topo,
        }));
      });
    });
    return rotulos;
  }

  /** Pontos da linha-guia (na tela) e direção de saída de cada pilha, para a projeção P. */
  function ancorarRotulo(r, P) {
    const m = r.movel;
    if (!r.espacos) {
      r.pontos = m.tipo === 'GONDOLA_PAREDE' ? pontosPlacas(m, P) : [ancoraDe(m, P)];
      r.dir = null;
      return;
    }
    let sx = 0;
    let sy = 0;
    r.pontos = r.espacos.map((e) => {
      const d = direcaoDoEspaco(m, e.id);
      const b = caixaDoEspaco(m, e.id);
      const p3 = pontoDaFace(b, d);
      const a = P(p3[0], p3[1], p3[2]);
      const c = P(p3[0] + d[0], p3[1] + d[1], p3[2]);
      sx += c[0] - a[0];
      sy += c[1] - a[1];
      return a;
    });
    const n = Math.hypot(sx, sy) || 1;
    r.dir = [sx / n, sy / n];
  }

  /** Envoltório convexo de pontos 2D (cadeia monótona). */
  function envoltorio(pts) {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cruz = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const baixo = [];
    const cima = [];
    p.forEach((q) => {
      while (baixo.length >= 2 && cruz(baixo[baixo.length - 2], baixo[baixo.length - 1], q) <= 0) baixo.pop();
      baixo.push(q);
    });
    for (let i = p.length - 1; i >= 0; i--) {
      while (cima.length >= 2 && cruz(cima[cima.length - 2], cima[cima.length - 1], p[i]) <= 0) cima.pop();
      cima.push(p[i]);
    }
    return baixo.slice(0, -1).concat(cima.slice(0, -1));
  }

  function dentroConvexo(poli, x, y) {
    let sinal = 0;
    for (let i = 0; i < poli.length; i++) {
      const a = poli[i];
      const b = poli[(i + 1) % poli.length];
      const c = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
      if (c !== 0) {
        if (sinal && Math.sign(c) !== sinal) return false;
        sinal = Math.sign(c);
      }
    }
    return true;
  }

  /** Silhueta (na tela) de cada caixa dos móveis, com o móvel dela. */
  function silhuetas(moveis, P) {
    const lista = [];
    moveis.forEach((m) => primitivas(m).forEach((b) => {
      const pts = [];
      [b.x, b.x + b.w].forEach((x) => [b.y, b.y + b.d].forEach((y) => [b.z, b.z + b.h].forEach((z) => pts.push(P(x, y, z)))));
      lista.push({ movel: m.id, poli: envoltorio(pts) });
    }));
    return lista;
  }

  /**
   * Grade da tela com o que é móvel (células de ROTULO.cel px), com soma acumulada: diz em O(1)
   * quanto de um retângulo cobre os móveis.
   */
  function gradeDeMoveis(silh, W, H) {
    const cel = ROTULO.cel;
    const nx = Math.ceil(W / cel);
    const ny = Math.ceil(H / cel);
    const soma = new Float32Array((nx + 1) * (ny + 1));
    const ocupado = new Uint8Array(nx * ny);
    silh.forEach((s) => {
      const xs = s.poli.map((p) => p[0]);
      const ys = s.poli.map((p) => p[1]);
      const i0 = Math.max(0, Math.floor(Math.min.apply(null, xs) / cel));
      const i1 = Math.min(nx - 1, Math.floor(Math.max.apply(null, xs) / cel));
      const j0 = Math.max(0, Math.floor(Math.min.apply(null, ys) / cel));
      const j1 = Math.min(ny - 1, Math.floor(Math.max.apply(null, ys) / cel));
      for (let j = j0; j <= j1; j++) {
        for (let i = i0; i <= i1; i++) {
          if (!ocupado[j * nx + i] && dentroConvexo(s.poli, (i + 0.5) * cel, (j + 0.5) * cel)) ocupado[j * nx + i] = 1;
        }
      }
    });
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        soma[(j + 1) * (nx + 1) + i + 1] = ocupado[j * nx + i] + soma[j * (nx + 1) + i + 1] + soma[(j + 1) * (nx + 1) + i] - soma[j * (nx + 1) + i];
      }
    }
    return (r) => {
      const i0 = Math.max(0, Math.min(nx, Math.round(r.x / cel)));
      const i1 = Math.max(0, Math.min(nx, Math.round((r.x + r.w) / cel)));
      const j0 = Math.max(0, Math.min(ny, Math.round(r.y / cel)));
      const j1 = Math.max(0, Math.min(ny, Math.round((r.y + r.h) / cel)));
      const area = (i1 - i0) * (j1 - j0);
      if (area <= 0) return 0;
      const v = soma[j1 * (nx + 1) + i1] - soma[j0 * (nx + 1) + i1] - soma[j1 * (nx + 1) + i0] + soma[j0 * (nx + 1) + i0];
      return v / area;
    };
  }

  const cruzam = (a, b, c, d) => {
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
  };
  const segmentoNoRet = (a, b, r) => {
    const c = [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]];
    return c.some((p, i) => cruzam(a, b, p, c[(i + 1) % 4]));
  };

  /**
   * Candidatos de posição (centro) da pilha: ao longo da direção do espaço, a partir de onde a linha
   * sai do desenho do móvel ("saida", px), ou em volta do móvel (móvel de um espaço só).
   */
  function candidatos(r, saida) {
    const lista = [];
    const [ax, ay] = r.pontos.reduce((s, p) => [s[0] + p[0] / r.pontos.length, s[1] + p[1] / r.pontos.length], [0, 0]);
    if (r.dir) {
      const [ux, uy] = r.dir;
      const nx = -uy;
      const ny = ux;
      const meio = Math.abs(ux) * r.w / 2 + Math.abs(uy) * r.h / 2; // meia extensão da pilha na direção
      for (let t = 8; t <= 420; t += 10) {
        [0, 14, -14, 30, -30, 50, -50, 80, -80, 120, -120].forEach((sl) => {
          const d = saida + t + meio;
          lista.push({ cx: ax + ux * d + nx * sl, cy: ay + uy * d + ny * sl, custo: t + Math.abs(sl) * 1.4 });
        });
      }
      // Se a direção do espaço estiver tomada: em volta do ponto, mais caro (a plaquinha diz o espaço).
      for (let dx = -300; dx <= 300; dx += 14) {
        for (let dy = -240; dy <= 240; dy += 12) lista.push({ cx: ax + dx, cy: ay + dy, custo: 40 + Math.hypot(dx, dy) * 1.5 });
      }
    } else {
      // Em cima do móvel (no ponto do tampo) e em volta dele, do mais perto ao mais longe.
      for (let dx = -280; dx <= 280; dx += 12) {
        for (let dy = -220; dy <= 220; dy += 10) lista.push({ cx: ax + dx, cy: ay - r.h / 2 + 4 + dy, custo: Math.hypot(dx, dy * 1.2) * 0.9 });
      }
    }
    return lista.sort((a, b) => a.custo - b.custo);
  }

  /**
   * Coloca as pilhas: nenhuma sobre outra nem sobre os painéis; entre as livres, a de menor custo:
   * distância + o quanto cobre os móveis (os outros; nos móveis com espaços, também o próprio) +
   * linhas que se cruzam ou passam por cima de outra pilha. Devolve a média da distância e das penalidades.
   */
  function posicionarRotulos(rotulos, silh, obstaculos, W, H) {
    const cobre = gradeDeMoveis(silh, W, H);
    const silhDe = {};
    silh.forEach((x) => { (silhDe[x.movel] = silhDe[x.movel] || []).push(x.poli); });
    // Quanto do retângulo cobre o próprio móvel (amostras 5 × 3), para não contar nos de um espaço só.
    const cobreProprio = (ret, id) => {
      const polis = silhDe[id] || [];
      let n = 0;
      for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 3; j++) {
          const x = ret.x + ret.w * (i + 0.5) / 5;
          const y = ret.y + ret.h * (j + 0.5) / 3;
          if (polis.some((p) => dentroConvexo(p, x, y))) n++;
        }
      }
      return n / 15;
    };
    const colocados = [];
    const guias = [];
    let somaDist = 0;
    let somaPena = 0;
    // Pilhas com posição fixa (salva em "Ajustar etiquetas"): a de baixo fica onde foi posta e a pilha
    // cresce para cima; as outras se arranjam em volta delas.
    rotulos.filter((r) => r.fixoAqui).forEach((r) => {
      r.baseX = r.fixoAqui.x;
      r.baseY = r.fixoAqui.y - r.h;
      const ret = { x: r.baseX, y: r.baseY, w: r.w, h: r.h };
      colocados.push(ret);
      r.pontos.forEach((p) => guias.push([p, pontoDaGuia(ret, p)]));
    });
    const ordem = rotulos.filter((r) => !r.fixoAqui).sort((a, b) => (a.dir ? 0 : 1) - (b.dir ? 0 : 1) || b.pontos[0][1] - a.pontos[0][1]);
    ordem.forEach((r) => {
      let melhor = null;
      // Onde a linha sai do desenho do próprio móvel, andando na direção do espaço.
      let saida = 0;
      if (r.dir) {
        const [ax, ay] = r.pontos.reduce((s, p) => [s[0] + p[0] / r.pontos.length, s[1] + p[1] / r.pontos.length], [0, 0]);
        const polis = silhDe[r.movel.id] || [];
        while (saida < 400 && polis.some((p) => dentroConvexo(p, ax + r.dir[0] * (saida + 2), ay + r.dir[1] * (saida + 2)))) saida += 4;
      }
      candidatos(r, saida).forEach((c) => {
        if (melhor && c.custo >= melhor.custo) return;
        const ret = { x: c.cx - r.w / 2, y: c.cy - r.h / 2, w: r.w, h: r.h };
        if (ret.x < 6 || ret.y < 6 || ret.x + ret.w > W - 6 || ret.y + ret.h > H - 6) return;
        if (obstaculos.some((o) => sobrepoe(ret, o, 4)) || colocados.some((o) => sobrepoe(ret, o, 5))) return;
        // Cobrir outro móvel confunde (parece etiqueta dele); cobrir o próprio, bem menos.
        const proprio = cobreProprio(ret, r.movel.id);
        let pena = Math.max(0, cobre(ret) - proprio) * 520 + (r.dir ? proprio * 50 : 0);
        // Móvel de parede: a pilha não cobre a placa de comunicação (fica ao lado, com a linha-guia).
        if (r.movel.tipo === 'GONDOLA_PAREDE' && r.pontos.some((p) => sobrepoe(ret, { x: p[0] - 22, y: p[1] - 16, w: 44, h: 32 }, 0))) pena += 300;
        if (c.custo + pena >= (melhor ? melhor.custo : Infinity)) return;
        guias.forEach((g) => { if (segmentoNoRet(g[0], g[1], ret)) pena += 90; });
        r.pontos.forEach((p) => {
          const q = pontoDaGuia(ret, p);
          if (Math.hypot(q[0] - p[0], q[1] - p[1]) < 6) return;
          guias.forEach((g) => { if (cruzam(p, q, g[0], g[1])) pena += 70; });
          colocados.forEach((o) => { if (segmentoNoRet(p, q, o)) pena += 110; });
        });
        if (!melhor || c.custo + pena < melhor.custo) melhor = { x: ret.x, y: ret.y, custo: c.custo + pena, dist: c.custo, pena };
      });
      if (!melhor) melhor = { x: r.pontos[0][0] - r.w / 2, y: r.pontos[0][1] - r.h / 2, dist: 400, pena: 400 };
      r.baseX = melhor.x;
      r.baseY = melhor.y;
      const ret = { x: r.baseX, y: r.baseY, w: r.w, h: r.h };
      colocados.push(ret);
      r.pontos.forEach((p) => guias.push([p, pontoDaGuia(ret, p)]));
      somaDist += melhor.dist;
      somaPena += melhor.pena;
    });
    const n = rotulos.length || 1;
    return { dist: somaDist / n, pena: somaPena / n };
  }

  /** Pilha de etiquetas na planta: plaquinha com o nome do espaço (se houver) e as etiquetas. */
  function desenharRotulo(pai, r, attrs) {
    const g = el('g', Object.assign({ 'data-movel': r.id, 'data-movel-base': r.movel.id, filter: 'url(#sombraEtq)' }, attrs), pai);
    let y = r.y;
    if (r.legenda) {
      el('rect', { class: 'chip-espaco', x: r.x, y, width: r.wChip, height: ROTULO.chip, rx: 4 * escalaEtq, fill: COR.chipEspaco }, g);
      texto(g, r.x + 5 * escalaEtq, y + ROTULO.chip - 3.6 * escalaEtq, r.legenda, {
        'font-family': FONTE_ETQ, 'font-size': ROTULO.fonteChip, 'font-weight': 800, 'letter-spacing': 0.3, fill: '#FFFFFF',
      });
      y += r.topo;
    }
    r.itens.forEach((it, i) => {
      fundoEtiqueta(g, r.x, y, r.wEtq, it.h, it.cores, r.simbolo === 'FIXO');
      it.linhas.forEach((l, k) => {
        texto(g, r.x + r.wEtq / 2, y + ETQ.padY + ETQ.lh * (k + 1) - 3.6 * escalaEtq, l, {
          'font-family': FONTE_ETQ, 'font-size': ETQ.fonte, 'font-weight': 800, 'letter-spacing': 0.15,
          fill: '#FFFFFF', 'text-anchor': 'middle',
        });
      });
      if (i === 0 && r.simbolo) desenharSimbolo(g, r.simbolo, r.x + r.wEtq + 4 + ETQ.simbolo / 2, y + it.h / 2, escalaEtq);
      y += it.h + ETQ.gap;
    });
    return g;
  }

  /** Linhas-guia da pilha até a face de cada espaço, na cor da etiqueta (com contorno branco). */
  function desenharGuiaRotulo(pai, r) {
    const ret = { x: r.x, y: r.y, w: r.wEtq, h: r.h };
    const g = el('g', { class: 'guia', 'data-movel-base': r.movel.id }, pai);
    const escura = misturar(r.cor, COR.guiaMistura, 0.25);
    r.pontos.forEach((p) => {
      const q = pontoDaGuia(ret, p);
      const dentro = p[0] >= ret.x && p[0] <= ret.x + ret.w && p[1] >= ret.y && p[1] <= ret.y + ret.h;
      if (dentro) return; // a pilha está em cima do ponto: não precisa de linha
      const d = 'M' + q[0].toFixed(1) + ',' + q[1].toFixed(1) + ' L' + p[0].toFixed(1) + ',' + p[1].toFixed(1);
      el('path', { class: 'guia-halo', d, fill: 'none', stroke: COR.guiaHalo, 'stroke-opacity': 0.9, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
      el('path', { class: 'guia-linha', d, fill: 'none', stroke: escura, 'stroke-width': 1.6, 'stroke-linecap': 'round' }, g);
      el('circle', { class: 'guia-ponto', cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: 4.4, fill: r.cor, stroke: '#FFFFFF', 'stroke-width': 1.6 }, g);
    });
  }

  /**
   * Arranjo da visão na planta: o slide cresce (16:9) e a planta junto, até as etiquetas caberem
   * perto dos espaços sem cobrir os outros móveis. Fica no menor tamanho em que a nota é boa;
   * senão, no de melhor nota (slide maior deixa o texto menor na tela, então ele pesa um pouco).
   */
  function arranjarNaPlanta(loja, moveis, rotulos, painel) {
    let melhor = null;
    // Planta com posições fixas: o slide tem sempre a largura salva junto com elas (a planta não muda de
    // tamanho com o ciclo, e as posições valem em qualquer ciclo).
    const minima = painel.larguraMinima || 0;
    const larguras = (loja && loja.slide > 0
      ? [Math.round(loja.slide)]
