      : [1, 1.15, 1.3, 1.45, 1.6].map((fator) => Math.round((TELA_BASE.w * fator) / 16) * 16))
      .map((W) => Math.max(W, minima)).filter((W, i, l) => l.indexOf(W) === i);
    larguras.some((W) => {
      const fator = W / TELA_BASE.w;
      const H = (W / 16) * 9;
      const projecao = criarProjecao(loja, regiaoPlanta(W, H));
      limites = limitesDe(W, H);
      const callouts = painel.situarCallouts(projecao.P);
      // Posições fixas são da tela (planta na largura toda); no slide com painéis a planta fica em outro
      // lugar e menor, e as posições acompanham a planta.
      const naTela = criarProjecao(loja, { x: 40, y: REGIAO_PLANTA.y, w: W - 80, h: H - 130 });
      const k = projecao.escala / naTela.escala;
      rotulos.forEach((r) => {
        r.fixoAqui = r.fixo ? { x: projecao.ox + (r.fixo.x - naTela.ox) * k, y: projecao.oy + (r.fixo.y - naTela.oy) * k } : null;
      });
      const obstaculos = (comPaineis ? [{ x: 0, y: 0, w: 470, h: H }] : []).concat(painel.obstaculos(W, H), callouts);
      rotulos.forEach((r) => ancorarRotulo(r, projecao.P));
      const q = posicionarRotulos(rotulos, silhuetas(moveis, projecao.P), obstaculos, W, H);
      const qualidade = q.pena + Math.max(0, q.dist - 50) * 0.5;
      const nota = qualidade + (fator - 1) * 50;
      if (!melhor || nota < melhor.nota) {
        melhor = { nota, w: W, h: H, projecao, limites, callouts, posicoes: rotulos.map((r) => [r.baseX, r.baseY]) };
      }
      return qualidade < 22;
    });
    limites = melhor.limites;
    rotulos.forEach((r, i) => {
      ancorarRotulo(r, melhor.projecao.P);
      [r.baseX, r.baseY] = melhor.posicoes[i];
    });
    return melhor;
  }

  /**
   * Posição fixa de uma pilha (planta com largura do slide salva): canto de baixo à esquerda da
   * etiqueta mais baixa, em px do slide. Vem do ajuste ainda não salvo ou do salvo: o do móvel (móveis
   * de um espaço só) ou o da pilha do espaço; se os espaços se juntaram (ou o meio se dividiu) de outro
   * jeito neste ciclo, vale o de um deles. Null = posição automática.
   */
  function posicaoFixa(r, pendentes) {
    const m = r.movel;
    const valida = (a) => (a && (a.x || a.y) ? { x: Number(a.x) || 0, y: Number(a.y) || 0 } : null);
    if (!r.espacos) return valida(m.id in pendentes ? pendentes[m.id] : { x: m.ajusteX, y: m.ajusteY });
    const salvos = m.ajustesEspacos || {};
    const chave = r.id.slice(m.id.length + 1);
    const partes = chave.split('+');
    // Meio dividido neste ciclo: a 1ª metade fica onde estava o meio inteiro (a 2ª se arranja ao lado).
    const candidatas = [chave].concat(partes, partes.filter((k) => /-1$/.test(k)).map((k) => k.slice(0, -2)));
    for (let i = 0; i < candidatas.length; i++) {
      const k = candidatas[i];
      if (m.id + '/' + k in pendentes) return valida(pendentes[m.id + '/' + k]);
      if (valida(salvos[k])) return valida(salvos[k]);
    }
    const outra = Object.keys(salvos).filter((k) => k.split('+').some((p) => partes.indexOf(p) >= 0))[0];
    return outra ? valida(salvos[outra]) : null;
  }

  /** Ponto da caixa mais perto da âncora: de onde sai a linha-guia. */
  function pontoDaGuia(rect, ancora) {
    return [Math.max(rect.x, Math.min(ancora[0], rect.x + rect.w)), Math.max(rect.y, Math.min(ancora[1], rect.y + rect.h))];
  }

  /**
   * Envoltório das caixas de destaque para o zoom da tela: com zoom, a aplicação encolhe o envoltório
   * em volta de (px, py) para a caixa continuar do mesmo tamanho na tela, sem soltar da linha-guia.
   * (As fichas dos móveis crescem com o zoom, junto com a planta.)
   */
  function pivoZoom(pai, px, py) {
    return el('g', { class: 'etq-zoom', 'data-px': px, 'data-py': py }, pai);
  }

  /** Linha-guia da caixa de destaque até o ponto do móvel. */
  function desenharGuia(pai, rect, ancora) {
    linha(pai, pontoDaGuia(rect, ancora), ancora, { stroke: COR.guiaDestaque, 'stroke-width': 1.3 });
    el('circle', { cx: ancora[0], cy: ancora[1], r: 4, fill: COR.guiaDestaquePonto, stroke: COR.guiaDestaque, 'stroke-width': 1.3 }, pai);
  }

  /* ----------------------------- painel lateral ---------------------------- */

  function iconeTv(pai, cx, cy) {
    const g = el('g', { fill: 'none', stroke: COR.icone, 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, pai);
    el('rect', { x: cx - 21, y: cy - 15, width: 42, height: 27, rx: 2 }, g);
    linha(g, [cx - 7, cy + 17], [cx + 7, cy + 17], {});
    linha(g, [cx, cy + 12], [cx, cy + 17], {});
  }

  function iconeRadio(pai, cx, cy) {
    const g = el('g', { fill: 'none', stroke: COR.icone, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, pai);
    el('rect', { x: cx - 17, y: cy - 10, width: 34, height: 26, rx: 3 }, g);
    linha(g, [cx - 13, cy - 10], [cx + 10, cy - 22], {});
    el('circle', { cx: cx - 6, cy: cy + 7, r: 5 }, g);
    linha(g, [cx + 4, cy + 3], [cx + 12, cy + 3], {});
    linha(g, [cx + 4, cy + 9], [cx + 12, cy + 9], {});
    linha(g, [cx - 13, cy - 4], [cx + 13, cy - 4], {});
  }

  function iconeLetra(pai, cx, cy, letra) {
    el('circle', { cx, cy, r: 20, fill: 'none', stroke: COR.icone, 'stroke-width': 2.4 }, pai);
    texto(pai, cx, cy + 12, letra, { 'font-size': 33, 'font-weight': 400, fill: COR.icone, 'text-anchor': 'middle' });
  }

  function listaLateral(pai, itens, x, y, w, alturaMin) {
    const medidos = itens.map((it) => {
      const linhas = quebrar(it.texto, w - 12, 11, 800, FONTE_ETQ);
      return { it, linhas, h: Math.max(23, linhas.length * 13 + 10) };
    });
    let total = medidos.reduce((s, m) => s + m.h, 0) + 6 * (medidos.length - 1);
    const extra = alturaMin && total < alturaMin ? (alturaMin - total) / medidos.length : 0;
    let cy = y;
    medidos.forEach((m) => {
      const h = m.h + extra;
      const cores = coresDe(m.it.marca, 'etiqueta') || [COR.etiquetaPadrao];
      fundoEtiqueta(pai, x, cy, w, h, cores);
      const y0 = cy + h / 2 - (m.linhas.length * 13) / 2 + 10;
      m.linhas.forEach((l, k) => texto(pai, x + 6, y0 + k * 13, l, { 'font-family': FONTE_ETQ, 'font-size': 11, 'font-weight': 800, fill: '#fff' }));
      cy += h + 6;
    });
    return Math.max(total + extra * medidos.length, alturaMin || 0);
  }

  function desenharLateral(pai, planta, ciclo, secoes) {
    const g = el('g', { class: 'lateral' }, pai);
    el('rect', { x: 22, y: 12, width: 260, height: 64, fill: '#0A0A0A', stroke: '#666', 'stroke-width': 1 }, g);
    texto(g, 152, 58, planta.nome, { 'font-size': 38, 'font-weight': 700, fill: '#FFFFFF', 'text-anchor': 'middle' });
    if (ciclo) {
      texto(g, 24, 100, 'CICLO: ' + ciclo, { 'font-size': 15, 'font-weight': 700, fill: COR.cicloTexto });
    }

    let y = 117;
    if (secoes.TV.length) {
      iconeTv(g, 62, 135);
      iconeRadio(g, 62, 222);
      y += listaLateral(g, secoes.TV, 91, y, 168, 122) + 26;
    }
    ['A', 'C'].forEach((letra) => {
      if (!secoes[letra].length) return;
      const h = listaLateral(g, secoes[letra], 91, y, 168, 0);
      iconeLetra(g, 62, y + h / 2, letra);
      y += h + 26;
    });
    // Destaques: o texto na cor da marca e, à esquerda, a miniatura do móvel a que ele se refere.
    (secoes.CALLOUT || []).forEach((c) => {
      const m = c.movel && planta.moveis.filter((x) => x.id === c.movel)[0];
      const h = listaLateral(g, [c], 91, y, 168, 46);
      if (m && m.tipo !== 'EXTRA') desenharMiniatura(g, m, null, coresDe(c.marca, 'movel') || [COR.cinzaMovel], 26, y + h / 2 - 20, 58, 40);
      y += h + 12;
    });
    return y; // pé do painel (com pai = null, só mede)
  }

  /**
   * Notas (canto inferior esquerdo): o trecho antes de ":" fica em negrito.
   * estreita: caixa da largura do painel lateral (com as fichas, para a coluna da esquerda ir até embaixo).
   */
  function medirNotas(notas, estreita) {
    const tam = estreita ? 15 : 17, lh = estreita ? 20 : 23, maxW = estreita ? 226 : 490;
    const paragrafos = notas.map((n) => {
      const i = n.texto.indexOf(':');
      const partes = i > 0 && i < 60
        ? [{ t: n.texto.slice(0, i + 1), b: true }, { t: n.texto.slice(i + 1), b: false }]
        : [{ t: n.texto, b: false }];
      const palavras = [];
      partes.forEach((p) => p.t.split(/\s+/).filter(Boolean).forEach((w) => palavras.push({ t: w, b: p.b })));
      const linhas = [];
      let atual = [];
      let w = 0;
      palavras.forEach((p) => {
        const lp = largura(p.t, tam, p.b ? 700 : 400);
        const esp = atual.length ? largura(' ', tam, 400) : 0;
        if (atual.length && w + esp + lp > maxW) { linhas.push(atual); atual = []; w = 0; }
        atual.push(p);
        w += (atual.length > 1 ? esp : 0) + lp;
      });
      if (atual.length) linhas.push(atual);
      return linhas;
    });
    const nLinhas = paragrafos.reduce((s, p) => s + p.length, 0);
    return { paragrafos, tam, lh, h: nLinhas * lh + (paragrafos.length - 1) * 14 + 44, w: estreita ? 270 : 535 };
  }

  function desenharNotas(pai, medida, x, y) {
    const g = el('g', { class: 'notas' }, pai);
    el('rect', { x, y, width: medida.w, height: medida.h, fill: COR.notaFundo, stroke: COR.notaBorda, filter: 'url(#sombra)' }, g);
    let cy = y + 22 + medida.lh - 6;
    medida.paragrafos.forEach((linhas) => {
      linhas.forEach((ln) => {
        const t = el('text', { x: x + 22, y: cy, 'font-family': FONTE, 'font-size': medida.tam, fill: COR.textoNota }, g);
        ln.forEach((p, i) => {
          const s = el('tspan', { 'font-weight': p.b ? 700 : 400, fill: p.b ? COR.tituloNota : COR.textoNota }, t);
          s.textContent = (i ? ' ' : '') + p.t;
        });
        cy += medida.lh;
      });
      cy += 14;
    });
  }

  function desenharLegendaSimbolos(pai, usados, simbolos) {
    const ordem = ORDEM_SIMBOLOS.filter((s) => usados.has(s));
    let y = TELA.h - 28 - (ordem.length - 1) * 44;
    const topo = y - 22;
    ordem.forEach((s) => {
      desenharSimbolo(pai, s, 33, y, 1.45);
      let xt = 58;
      if (s === 'FIXO') {
        // Amostra da hachura que os móveis e etiquetas fixos ganham.
        el('rect', { x: 56, y: y - 10, width: 30, height: 20, rx: 4, fill: COR.cinzaEtiqueta }, pai);
        el('rect', { x: 56, y: y - 10, width: 30, height: 20, rx: 4, fill: hachura(COR.cinzaEtiqueta), stroke: misturar(COR.cinzaEtiqueta, '#000000', 0.2), 'stroke-width': 0.8 }, pai);
        xt = 96;
      }
      texto(pai, xt, y + 7, (simbolos[s] && simbolos[s].descricao) || s, { 'font-size': 19, fill: COR.legendaTexto, 'font-weight': 400 });
      y += 44;
    });
    return ordem.length ? topo : TELA.h - 8;
  }

  /* ---------------------------- itens extras ------------------------------ */

  function iconeExtra(pai, id, cx, cy) {
    const g = el('g', { fill: 'none', stroke: '#6A6A6A', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, pai);
    const k = id.toUpperCase();
    if (k.indexOf('CEST') >= 0) {
      el('path', { d: `M${cx - 24},${cy - 4} L${cx + 24},${cy - 4} L${cx + 18},${cy + 20} L${cx - 18},${cy + 20} Z` }, g);
      el('path', { d: `M${cx - 16},${cy - 4} Q${cx},${cy - 32} ${cx + 16},${cy - 4}` }, g);
      for (let i = -12; i <= 12; i += 8) linha(g, [cx + i, cy - 4], [cx + i * 0.75, cy + 20], {});
      linha(g, [cx - 21, cy + 6], [cx + 21, cy + 6], {});
    } else if (k.indexOf('CAVALETE') >= 0) {
      el('rect', { x: cx - 16, y: cy - 26, width: 32, height: 40, fill: '#FFFFFF' }, g);
      linha(g, [cx - 13, cy + 14], [cx - 18, cy + 28], {});
      linha(g, [cx + 13, cy + 14], [cx + 18, cy + 28], {});
    } else {
      el('path', { d: `M${cx - 20},${cy - 12} L${cx},${cy - 22} L${cx + 20},${cy - 12} L${cx + 20},${cy + 18} L${cx},${cy + 28} L${cx - 20},${cy + 18} Z` }, g);
      linha(g, [cx, cy - 2], [cx, cy + 28], {});
      linha(g, [cx - 20, cy - 12], [cx, cy - 2], {});
      linha(g, [cx + 20, cy - 12], [cx, cy - 2], {});
    }
  }

  function desenharExtras(pai, extras, obterDados) {
    if (!extras.length) return null;
    const slot = 206;
    const w = slot * extras.length;
    const h = 84;
    const x = TELA.w - 16 - w;
    const y = TELA.h - 16 - h;
    const g = el('g', { class: 'extras' }, pai);
    el('rect', { x, y, width: w, height: h, rx: 10, fill: '#FFFFFF', stroke: '#DDD', filter: 'url(#sombra)' }, g);
    extras.forEach((m, i) => {
      const x0 = x + i * slot;
      const gs = el('g', { 'data-movel': m.id }, g);
      dica(gs, m.id + (m.descricao ? ' — ' + m.descricao : ''));
      if (i) linha(gs, [x0, y + 14], [x0, y + h - 14], { stroke: '#BBBBBB', 'stroke-width': 1.5 });
      iconeExtra(gs, m.id + ' ' + m.descricao, x0 + 38, y + h / 2);
      texto(gs, x0 + 136, y + 20, m.descricao || m.id, { 'font-size': 11, 'font-style': 'italic', fill: '#666', 'text-anchor': 'middle' });
      const info = obterDados(m);
      const etiquetas = info && info.etiquetas.length ? info.etiquetas : [];
      let cy = y + 28;
      etiquetas.slice(0, 3).forEach((e) => {
        const cores = coresDe(e.marca, 'etiqueta', true) || coresDe(info.marca, 'etiqueta', true) || corEtiquetaPadrao(true);
        const linhas = quebrar(e.texto, 110, 10, 800, FONTE_ETQ).slice(0, 2);
        const hh = linhas.length * 11 + 5;
        fundoEtiqueta(gs, x0 + 76, cy, 120, hh, cores);
        linhas.forEach((l, k) => texto(gs, x0 + 136, cy + 10 + k * 11, l, { 'font-family': FONTE_ETQ, 'font-size': 10, 'font-weight': 800, fill: '#fff', 'text-anchor': 'middle' }));
        cy += hh + 3;
      });
      if (!etiquetas.length) texto(gs, x0 + 136, y + 50, '—', { 'font-size': 14, fill: '#AAA', 'text-anchor': 'middle' });
    });
    return { x, y, w, h };
  }

  /* ------------------------------- callouts ------------------------------- */

  const sobrepoe = (a, b, m) => a.x < b.x + b.w + m && b.x < a.x + a.w + m && a.y < b.y + b.h + m && b.y < a.y + a.h + m;

  function posicionarCallouts(callouts) {
    const placed = [];
    callouts.sort((a, b) => a.ancoraX - b.ancoraX).forEach((c) => {
      c.x = Math.max(limites.x0 + 6, Math.min(c.ancoraX - c.w / 2, limites.x1 - c.w));
      c.y = 14;
      placed.forEach((p) => {
        if (sobrepoe(c, p, 14)) c.x = p.x + p.w + 18;
      });
      placed.push(c);
    });
    // Se estourou a direita, empurra tudo para a esquerda; se ainda não couber, quebra linha.
    const excesso = placed.length ? placed[placed.length - 1].x + placed[placed.length - 1].w - limites.x1 : 0;
    if (excesso > 0) {
      for (let i = placed.length - 1; i >= 0; i--) {
        const limite = i === placed.length - 1 ? limites.x1 : placed[i + 1].x - 18;
        placed[i].x = Math.min(placed[i].x, limite - placed[i].w);
      }
    }
    placed.forEach((c, i) => {
      if (c.x < limites.x0) {
        c.x = limites.x0 + 6;
        const acima = placed.slice(0, i).filter((p) => sobrepoe(c, p, 10));
        if (acima.length) c.y = Math.max.apply(null, acima.map((p) => p.y + p.h)) + 14;
      }
    });
  }

  function desenharCallout(pai, c) {
    // Com zoom, a caixa encolhe em volta do ponto de onde sai a linha-guia (ou do centro de cima).
    const px = c.alvo ? Math.max(c.x + 12, Math.min(c.alvo[0], c.x + c.w - 12)) : c.x + c.w / 2;
    const g = el('g', { class: 'callout' }, pivoZoom(pai, px, c.y + (c.alvo ? c.h : 0)));
    el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, fill: tinta(c.cores, 0), stroke: misturar(c.cores[0], '#000000', 0.25), 'stroke-width': 1 }, g);
    c.linhas.forEach((l, k) => texto(g, c.x + CALLOUT.pad, c.y + CALLOUT.pad + CALLOUT.lh * (k + 1) - 4, l, {
      'font-size': CALLOUT.fonte, 'font-weight': 700, fill: '#FFFFFF',
    }));
  }

  /* ------------------------------ desenho ---------------------------------- */

  /**
   * @param {SVGSVGElement} svg
   * @param {{dados, planta, ciclo, filtro, filtroEtiqueta, ajustes, obterMovimento, obterPaineis, edicao, somentePlanta, visao, paineis}} ctx
   *   escalaEtiquetas: tamanho das etiquetas na visão na planta (1 = padrão).
   *   filtroEtiqueta: texto de uma etiqueta (ou lista de textos); só os espaços com ela ficam coloridos e com etiqueta.
   *   destaqueEspacos: chaves ("MOVEL" ou "MOVEL/ESPACO") dos espaços que ficam coloridos (comparação de ciclos).
   *   somentePlanta: só a loja, os móveis e as etiquetas, sem fundo nem painéis (PNG recortado).
   *   paineis: false = sem o painel lateral, notas, legenda e itens extras (na tela eles ficam no menu
   *   da esquerda) e a planta na largura toda; true (padrão) = slide completo, como no PNG.
   *   escuro: true = cores do modo noturno (fundo, loja, textos); só na tela, o PNG sai claro.
   * @return {{grupos: Array, tela: {w, h}, simbolos: Array}} grupos de etiquetas (para arrastar no modo
   *   edição), tamanho do slide desenhado e símbolos usados na planta
   */
  function desenhar(svg, ctx) {
    marcas = ctx.dados.marcas;
    paleta(ctx.escuro);
    filtroMarca = ctx.filtro || '';
    comPaineis = ctx.paineis !== false;
    gradientes = {};
    hachuras = {};
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const planta = ctx.planta;

    // Gôndola: um meio também fica dividido quando o ciclo tem linha para a 2ª (ou 1ª) metade dele.
    const temLinha = (id) => {
      const i = ctx.obterMovimento({ id });
      return !!(i && (i.marca || i.etiquetas.length || i.simbolo));
    };
    const moveis = planta.moveis.filter((m) => m.tipo !== 'EXTRA').map((m) => {
      if (m.tipo !== 'GONDOLA') return m;
      const div = ['A', 'B'].filter((l) => String(m.dividido || '').toUpperCase().indexOf(l) >= 0
        || temLinha(m.id + '/MEIO-' + l + '-2') || temLinha(m.id + '/MEIO-' + l + '-1')).join('');
      return div === (m.dividido || '') ? m : Object.assign({}, m, { dividido: div });
    });
    const extras = planta.moveis.filter((m) => m.tipo === 'EXTRA');
    const simbolosUsados = new Set();

    // Situação de cada móvel (e de cada espaço de gôndola) no ciclo.
    const info = {};
    const infoEspaco = {}; // "GON-01/MEIO-A" → linha própria do espaço
    const anotar = (i) => { if (i && i.simbolo) simbolosUsados.add(i.simbolo); return i; };
    moveis.concat(extras).forEach((m) => {
      // Móvel com espaços (gôndola, mesas, totem, móvel make) é preenchido só espaço por espaço:
      // não tem linha do móvel inteiro. Os demais têm uma linha só.
      info[m.id] = espacos(m).length ? null : anotar(ctx.obterMovimento(m));
      espacos(m).forEach((e) => {
        const id = m.id + '/' + e.id;
        // Linha de espaço vazia (sem marca, etiqueta nem símbolo) não conta: o espaço fica branco.
        // Metade sem linha própria usa a linha do meio (MEIO-A-1 → MEIO-A).
        const meio = /^MEIO-[AB]-\d$/.test(e.id) ? m.id + '/' + e.id.slice(0, 6) : null;
        const i = [id, meio].filter(Boolean).map((x) => ctx.obterMovimento({ id: x })).find((x) => x && (x.marca || x.etiquetas.length || x.simbolo));
        infoEspaco[id] = i ? anotar(i) : null;
      });
    });
    const infoDe = (b) => (b.espaco ? infoEspaco[b.movel.id + '/' + b.espaco.id] : info[b.movel.id]);

    // Filtro por etiqueta (escolhida no Analytics): só os espaços que têm
    // aquela etiqueta ficam coloridos e com etiquetas (só ela); os outros espaços com movimento ficam
    // em cinza e sem etiquetas. Mesmo texto = mesma etiqueta (sem diferenciar maiúsculas e espaços).
    // Também aceita uma lista de textos (as etiquetas de uma classificação: lançamento, promoção…).
    const filtroEtq = [].concat(ctx.filtroEtiqueta || []).map(chaveEtiqueta).filter(Boolean);
    const soEtiqueta = (i) => {
      if (!filtroEtq.length || !i) return i;
      const iguais = i.etiquetas.filter((e) => filtroEtq.indexOf(chaveEtiqueta(e.texto)) >= 0);
      return iguais.length ? Object.assign({}, i, { etiquetas: iguais }) : { marca: '', etiquetas: [], simbolo: '', apagado: true };
    };
    // Comparação de ciclos: só os espaços que mudaram (chaves "MOVEL" ou "MOVEL/ESPACO") ficam
    // coloridos; os outros com movimento ficam em cinza e sem etiquetas, como no filtro por etiqueta.
    const destaque = ctx.destaqueEspacos ? new Set(ctx.destaqueEspacos) : null;
    const visivel = (k, i) => (destaque && i && !destaque.has(k)
      ? { marca: '', etiquetas: [], simbolo: '', apagado: true } : soEtiqueta(i));
    const infoVis = {};
    const infoEspacoVis = {};
    Object.keys(info).forEach((k) => { infoVis[k] = visivel(k, info[k]); });
    Object.keys(infoEspaco).forEach((k) => { infoEspacoVis[k] = visivel(k, infoEspaco[k]); });
    const infoVisDe = (b) => (b.espaco ? infoEspacoVis[b.movel.id + '/' + b.espaco.id] : infoVis[b.movel.id]);

    // Caixas de destaque: não vão mais na planta nem nas fichas (ficam em "Comunicações ER" e, no PNG do
    // slide, na coluna lateral, com a miniatura do móvel).
    const pain = ctx.obterPaineis();
    const porId = {};
    moveis.forEach((m) => { porId[m.id] = m; });
    const medCallouts = [];
    const situarCallouts = (P) => {
      const lista = medCallouts.map((mc) => {
        const alvo = mc.c.movel && porId[mc.c.movel] ? ancoraDe(porId[mc.c.movel], P) : null;
        return Object.assign({}, mc, { alvo, ancoraX: alvo ? alvo[0] : (limites.x0 + limites.x1) / 2 });
      });
      posicionarCallouts(lista);
      return lista;
    };

    // Tamanho do slide e etiquetas. Sem etiquetas: o slide de sempre (1920×1080).
    //  - "simplificada": sem a planta, só as fichas, agrupadas por tipo de móvel (o slide cresce se precisar);
    //  - "planta" (padrão): etiquetas junto dos espaços, com a planta maior se faltar lugar.
    const simplificada = ctx.visao === 'simplificada';
    // Tamanho das etiquetas: só na visão na planta (as fichas da visão simplificada têm largura fixa).
    definirEscalaEtiquetas(simplificada ? 1 : Math.max(0.5, Math.min(3, Number(ctx.escalaEtiquetas) || 1)));
    // Notas e legenda dos símbolos: na tela e no slide (o painel lateral e os extras, só no slide).
    const nSimbolos = ORDEM_SIMBOLOS.filter((x) => simbolosUsados.has(x)).length;
    const legendaAteOPe = nSimbolos ? 50 + (nSimbolos - 1) * 44 : 8; // do topo da legenda ao pé do slide
    const fichas = simplificada ? montarFichas(moveis, infoVis, infoEspacoVis, ctx.dados.config) : [];
    const rotulos = simplificada ? [] : montarRotulos(moveis, infoVis, infoEspacoVis, ctx.dados.config);
    // Na visão simplificada, as notas vão estreitas embaixo do painel lateral (se couberem no slide de
    // 1080), e a primeira coluna desce até a legenda; senão, as notas largas, e a coluna para acima delas.
    let medNotas = pain.NOTA.length ? medirNotas(pain.NOTA, comPaineis && !!fichas.length) : null;
    if (medNotas && comPaineis && fichas.length && TELA_BASE.h - legendaAteOPe - 28 - medNotas.h < desenharLateral(null, planta, ctx.ciclo, pain) + 16) {
      medNotas = medirNotas(pain.NOTA, false);
    }
    const yNotas = (H) => Math.min(nSimbolos ? H - legendaAteOPe : H - 8, H - 8) - 28 - (medNotas ? medNotas.h : 0);
    const obstaculosPaineis = (W, H) => [].concat(
      medNotas ? [{ x: 15, y: yNotas(H), w: medNotas.w, h: medNotas.h }] : [],
      comPaineis && extras.length ? [{ x: W - 16 - 206 * extras.length, y: H - 100, w: 206 * extras.length, h: 84 }] : [],
    );
    const larguraLegenda = 58 + Math.max.apply(null, [0].concat(ORDEM_SIMBOLOS
      .filter((x) => simbolosUsados.has(x)).map((x) => largura((ctx.dados.simbolos[x] && ctx.dados.simbolos[x].descricao) || x, 19, 400))));
    const semPlanta = fichas.length > 0; // visão simplificada com etiquetas: só as fichas
    // Slide com painéis (PNG): a coluna lateral (TV, A, C e destaques), as notas e a legenda têm de caber
    // uma embaixo da outra; o slide cresce (16:9) até a altura mínima.
    const alturaMinima = comPaineis
      ? desenharLateral(null, planta, ctx.ciclo, pain) + 16 + (medNotas ? medNotas.h + 28 : 0) + legendaAteOPe
      : 0;
    const larguraMinima = Math.ceil((alturaMinima * 16) / 9 / 16) * 16;
    let arranjo;
    if (semPlanta) {
      // Caixas de destaque no fim do quadro, na largura das fichas.
      arranjo = arranjarSimplificada(fichas, {
        callouts: medCallouts.map((mc) => {
          const linhas = quebrar(mc.c.texto, FICHA.w - CALLOUT.pad * 2 - 2, CALLOUT.fonte, 700);
          return Object.assign({}, mc, { linhas, w: FICHA.w, h: linhas.length * CALLOUT.lh + CALLOUT.pad * 2 });
        }),
        larguraMinima,
        embaixo: (W, H) => obstaculosPaineis(W, H).concat(nSimbolos ? [{ x: 0, y: H - legendaAteOPe, w: larguraLegenda, h: legendaAteOPe }] : []),
      });
      limites = arranjo.limites;
    } else if (rotulos.length) {
      const modoFixo = planta.loja && planta.loja.slide > 0;
      rotulos.forEach((r) => {
        r.modoFixo = modoFixo;
        r.fixo = modoFixo ? posicaoFixa(r, ctx.ajustes || {}) : null;
      });
      arranjo = arranjarNaPlanta(planta.loja, moveis, rotulos, { situarCallouts, obstaculos: obstaculosPaineis, larguraMinima });
      limites = arranjo.limites;
    } else {
      const W = Math.max(TELA_BASE.w, larguraMinima);
      const H = (W / 16) * 9;
      limites = limitesDe(W, H);
      arranjo = { w: W, h: H, projecao: criarProjecao(planta.loja, regiaoPlanta(W, H)) };
      arranjo.callouts = situarCallouts(arranjo.projecao.P);
    }
    TELA.w = arranjo.w;
    TELA.h = arranjo.h;

    svg.setAttribute('viewBox', '0 0 ' + TELA.w + ' ' + TELA.h);
    defs = el('defs', null, svg);
    const filtro = el('filter', { id: 'sombra', x: '-10%', y: '-10%', width: '120%', height: '130%' }, defs);
    el('feDropShadow', { dx: 0, dy: 3, stdDeviation: 4, 'flood-color': '#000', 'flood-opacity': 0.18 }, filtro);
    const sombraEtq = el('filter', { id: 'sombraEtq', x: '-20%', y: '-30%', width: '140%', height: '170%' }, defs);
    el('feDropShadow', { dx: 0, dy: 1.2, stdDeviation: 1.3, 'flood-color': '#000', 'flood-opacity': 0.22 }, sombraEtq);
    if (!ctx.somentePlanta) el('rect', { x: 0, y: 0, width: TELA.w, height: TELA.h, fill: COR.fundo }, svg);

    const projecao = arranjo.projecao || criarProjecao(planta.loja, regiaoPlanta(TELA.w, TELA.h));
    const { P } = projecao;
    const camadaPlanta = el('g', { class: 'camada-planta' }, svg);
    const camadaGuias = el('g', { class: 'camada-guias' }, svg);
    const camadaEtiquetas = el('g', { class: 'camada-etiquetas' }, svg);
    const camadaSobre = el('g', { class: 'camada-sobreposta' }, svg);

    // A planta (piso, paredes e móveis): na visão simplificada com etiquetas, não aparece.
    if (!semPlanta) {
      desenharLoja(camadaPlanta, P, planta.loja);
      if (ctx.grade) desenharGrade(camadaPlanta, P, planta.loja);

      // Móveis, na ordem de pintura. Numeração (pirâmide, gôndola e móvel de fila): plaquinha na face
      // da frente, desenhada junto com o móvel (o que está na frente o cobre, como o resto da planta).
      const prims = [];
      const faltam = {}; // primitivas ainda por pintar de cada móvel (a plaquinha vai com a última)
      moveis.forEach((m) => primitivas(m).forEach((p) => { prims.push(p); faltam[m.id] = (faltam[m.id] || 0) + 1; }));
      ordenar(prims, P).forEach((b) => {
        const m = b.movel;
        const i = infoDe(b);
        const corInfo = (x) => {
          const c = x && x.apagado ? [COR.cinzaMovel] : x && !ehNeutro(x.marca) ? coresDe(x.marca, 'movel', true) : null;
          if (c && x.simbolo === 'FIXO') c.fixo = true; // espaço fixo: o móvel ganha a hachura
          return c;
        };
        const cores = corInfo(infoVisDe(b));
        // Mesas e totem: um só desenho, mas cada frente / painel com a cor da própria linha.
        if (m.tipo === 'MESA' || m.tipo === 'MESA_3' || m.tipo === 'TOTEM') b.coresBlocos = espacos(m).map((e) => corInfo(infoEspacoVis[m.id + '/' + e.id]));
        const g = el('g', {
          class: 'movel' + (ctx.selecionado === m.id ? ' selecionado' : ''),
          'data-movel': m.id,
          'data-espaco': b.espaco ? b.espaco.id : null,
        }, camadaPlanta);
        desenharPrimitiva(g, P, b, cores);
        const numero = --faltam[m.id] === 0 ? numeroDe(m) : '';
        if (numero) desenharNumero(g, P, m, numero, projecao.escala);
        const linhasDica = [m.id + (b.espaco ? '/' + b.espaco.id + ' (' + b.espaco.nome + ')' : '') + (m.descricao ? ' — ' + m.descricao : '')];
        const nomeMarca = (x) => (x.marca ? x.marca.split('+').map((c) => (marcas[c] ? marcas[c].nome : c)).join(' + ') : '—');
        if (!b.espaco && espacos(m).length) {
          // Mesa, totem e corpo do móvel make: um desenho só, com o que cada espaço tem.
          espacos(m).forEach((e) => {
            const x = infoEspaco[m.id + '/' + e.id];
            linhasDica.push(e.nome + ': ' + (x ? nomeMarca(x) + x.etiquetas.map((et) => ' • ' + et.texto).join('') : 'sem movimento'));
          });
        } else if (i) {
          linhasDica.push('Marca: ' + nomeMarca(i));
          i.etiquetas.forEach((e) => linhasDica.push('• ' + e.texto));
          if (i.antecipacao) linhasDica.push('Antecipação: ' + i.antecipacao);
          if (i.observacao) linhasDica.push('Obs.: ' + i.observacao);
        } else {
          linhasDica.push('Sem movimento neste ciclo');
        }
        dica(g, linhasDica.join('\n'));
      });
    }

    // Painéis (lateral, legenda, notas, extras e caixas de destaque).
    const topoLegenda = desenharLegendaSimbolos(camadaSobre, simbolosUsados, ctx.dados.simbolos);
    if (medNotas) desenharNotas(camadaSobre, medNotas, 15, Math.min(topoLegenda, TELA.h - 8) - 28 - medNotas.h);
    if (comPaineis) {
      desenharLateral(el('g', null, camadaSobre), planta, ctx.ciclo, pain);
      desenharExtras(camadaSobre, extras, (m) => info[m.id]);
    }

    arranjo.callouts.forEach((c) => {
      if (c.alvo) {
        const x = Math.max(c.x + 12, Math.min(c.alvo[0], c.x + c.w - 12));
        desenharGuia(el('g', { class: 'guia-callout' }, camadaGuias), { x, y: c.y + c.h, w: 0, h: 0 }, c.alvo);
      }
      desenharCallout(camadaEtiquetas, c);
    });

    // Etiquetas na planta: na posição do arranjo, mais o ajuste manual ("Ajustar etiquetas"): o do
    // móvel inteiro (vale para todas as pilhas dele) somado ao da própria pilha (cada espaço se move sozinho).
    rotulos.forEach((r) => {
      const m = r.movel;
      const ajustes = ctx.ajustes || {};
      const doMovel = ajustes[m.id] || { x: m.ajusteX || 0, y: m.ajusteY || 0 };
      const chave = r.espacos ? r.id.slice(m.id.length + 1) : '';
      const daPilha = (chave && (ajustes[r.id] || (m.ajustesEspacos || {})[chave])) || { x: 0, y: 0 };
      r.ajusteMovel = doMovel;
      // Com posições fixas, o arranjo já pôs cada pilha no lugar dela.
      r.x = r.modoFixo ? r.baseX : r.baseX + doMovel.x + daPilha.x;
      r.y = r.modoFixo ? r.baseY : r.baseY + doMovel.y + daPilha.y;
      desenharGuiaRotulo(camadaGuias, r);
      r.elemento = desenharRotulo(camadaEtiquetas, r, { class: 'grupo-etiquetas' + (ctx.edicao ? ' arrastavel' : '') });
      dica(r.elemento, r.id + (m.descricao ? ' — ' + m.descricao : '') + ' · clique para ver a estratégia do móvel');
    });

    // Fichas (visão simplificada): títulos dos tipos de móvel e as fichas, na posição do arranjo
    // (sem ajuste manual: o arranjo por tipo é fixo).
    (arranjo.titulos || []).forEach((t) => desenharTituloSecao(camadaEtiquetas, t));
    fichas.forEach((f) => {
      const m = f.movel;
      f.x = f.baseX;
      f.y = f.baseY;
      f.elemento = desenharFicha(camadaEtiquetas, f, { class: 'grupo-etiquetas ficha' });
      dica(f.elemento, m.id + (m.descricao ? ' — ' + m.descricao : '') + ' · clique para ver a estratégia do móvel');
    });
    const grupos = rotulos; // pilhas que se arrastam em "Ajustar etiquetas" (as fichas não se ajustam)

    // Validação: marcador com o nº de comentários abertos no canto de cada móvel comentado
    // (do mesmo tamanho na tela com zoom; não vai no PNG).
    if (ctx.comentarios && !ctx.somentePlanta) {
      const camada = el('g', { class: 'camada-comentarios' }, svg);
      const fichaDe = {};
      fichas.forEach((f) => { fichaDe[f.movel.id] = f; });
      moveis.forEach((m) => {
        const qtd = ctx.comentarios[m.id];
        if (!qtd || (semPlanta && !fichaDe[m.id])) return;
        // Canto de cima mais à direita do móvel na tela (sem a planta: o canto da ficha dele).
        const f = fichaDe[m.id];
        const [px, py] = semPlanta ? [f.x + f.w - 12, f.y + 20] : P(m.x + m.w, m.y, m.z + m.h);
        const g = el('g', { class: 'marcador-comentario', 'data-movel': m.id }, pivoZoom(camada, px, py));
        const cx = px + 6;
        const cy = py - 22;
        el('circle', { cx, cy, r: 17, fill: '#E8590C', stroke: '#FFFFFF', 'stroke-width': 2.5, filter: 'url(#sombraEtq)' }, g);
        poligono(g, [[cx - 9, cy + 11], [cx - 4, cy + 22], [cx + 3, cy + 14]], { fill: '#E8590C' });
        texto(g, cx, cy + 6, String(qtd), {
          'font-family': FONTE_ETQ, 'font-size': 17, 'font-weight': 800, fill: '#FFFFFF', 'text-anchor': 'middle',
        });
        dica(g, qtd + (qtd === 1 ? ' comentário aberto' : ' comentários abertos') + ' da validação — clique para ver');
      });
    }

    // Só a planta: tira os painéis (lateral, notas, legenda, extras e caixas de destaque).
    if (ctx.somentePlanta) {
      camadaSobre.remove();
      // Na visão simplificada as caixas de destaque fazem parte do quadro (grupo "Destaques"): ficam.
      if (!semPlanta) svg.querySelectorAll('.callout, .guia-callout').forEach((n) => n.remove());
    }

    // Imagem de referência (modo construção): por cima de tudo, semitransparente.
    if (ctx.referencia && ctx.referencia.src && !ctx.somentePlanta) {
      el('image', {
        href: ctx.referencia.src,
        x: ctx.referencia.dx || 0,
        y: ctx.referencia.dy || 0,
        width: TELA.w * (ctx.referencia.zoom || 1),
        height: TELA.h * (ctx.referencia.zoom || 1),
        preserveAspectRatio: 'xMidYMid meet', opacity: ctx.referencia.opacidade, 'pointer-events': 'none',
        class: 'referencia',
      }, svg);
    }

    return { grupos, escala: projecao.escala, P, tela: { w: TELA.w, h: TELA.h }, simbolos: Array.from(simbolosUsados) };
  }

  /** Miniatura de um móvel num <svg> à parte (painel "Comunicações ER"), na cor da marca. */
  function miniatura(svg, m, marca, w, h) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    marcas = marcas || {};
    desenharMiniatura(svg, m, null, coresDe(marca, 'movel') || [COR.cinzaMovel], 1, 1, w - 2, h - 2);
  }

  /**
   * Miniatura de um móvel num <svg> à parte (legenda do Analytics), com cada espaço na cor que
   * corDoEspaco(espaco) devolver (espaco = null: estrutura, ou o móvel inteiro se ele não tem espaços).
   * verso = true: a mesa espelhada, com o verso virado para quem olha.
   */
  function miniaturaEspacos(svg, m, corDoEspaco, w, h, verso) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    desenharMiniatura(svg, m, null, (e) => { const c = corDoEspaco(e); return c ? [c] : null; }, 1, 1, w - 2, h - 2, verso);
  }

  return { desenhar, paleta, corDaTela, miniatura, miniaturaEspacos, espacos, caixasGondola, chaveEtiqueta, movimentoDaEtiqueta, obsDaEtiqueta, TELA, PRATELEIRAS, FONTE_ETQ };
})();
</script>
