<script>
/**
 * ============================================================================
 *  TUTORIAL GUIADO (primeira visita)
 * ============================================================================
 *  Na primeira vez que a pessoa abre o app (neste navegador), aparece um cartão de boas-vindas que
 *  oferece um tour pela tela. O tour destaca uma parte por vez (o resto escurece) e explica para que
 *  ela serve, com Voltar / Próximo / Pular. Pode ser refeito pelo menu de configurações (engrenagem),
 *  em "Ver o tutorial".
 *
 *  Passos cujo alvo não existe nesta versão (ex.: Construir loja no visualizador) ou está escondido
 *  são pulados sozinhos. O tour não grava nada na planilha: só abre o painel "Espaço por marca" e
 *  escolhe um ciclo, se nenhum estiver escolhido, para a tela ter o que mostrar.
 */
const Tutorial = (() => {
  const CHAVE_VISTO = 'planoVarejo.tutorialVisto';
  const $ = (id) => document.getElementById(id);

  let passos = [];
  let atual = -1;
  let camada = null; // { fundo, foco, balao }

  const visto = () => { try { return window.localStorage.getItem(CHAVE_VISTO) === '1'; } catch (e) { return true; } };
  const marcarVisto = () => { try { window.localStorage.setItem(CHAVE_VISTO, '1'); } catch (e) { /* sem armazenamento */ } };

  /** Elemento visível na tela (com tamanho e sem [hidden] em nenhum ancestral). */
  function visivel(el) {
    if (!el || el.closest('[hidden]')) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }

  /** Primeiro dos alvos que está visível. */
  function alvoDe(passo) {
    if (!passo.alvo) return null;
    return [].concat(passo.alvo).map((s) => document.querySelector(s)).find(visivel) || null;
  }

  /** Escolhe o primeiro ciclo, se nenhum estiver escolhido (para a planta e os painéis terem conteúdo). */
  function garantirCiclo() {
    const sel = $('selCiclo');
    if (!sel || sel.value) return;
    const op = Array.from(sel.options).find((o) => o.value);
    if (!op) return;
    sel.value = op.value;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function abrirEspaco() {
    const b = $('btnEspaco');
    if (b && b.getAttribute('aria-pressed') !== 'true') b.click();
  }

  /** Os passos do tour. alvo: seletor (ou lista; vale o primeiro visível); antes: ação ao entrar no passo. */
  function montarPassos() {
    return [
      {
        alvo: '#selCiclo',
        titulo: 'Escolha o ciclo',
        texto: 'Tudo começa aqui. Cada ciclo é um plano de varejo: as cores dos móveis, as etiquetas e os painéis mudam de acordo com o ciclo escolhido. Sem ciclo, a planta aparece limpa.',
        antes: garantirCiclo,
      },
      {
        alvo: '#abasPlanta',
        titulo: 'Troque de planta',
        texto: 'ER P, ER M, ER G e ER GG são os tamanhos de loja. O que vale para uma planta vale também para as maiores, a menos que a planilha diga o contrário. Dica: as setas ← → do teclado trocam de planta, ótimo para apresentar.',
      },
      {
        alvo: '#abasVisao',
        titulo: 'Duas formas de ver as etiquetas',
        texto: '"Na planta" mostra cada etiqueta junto do espaço do móvel. "Visão simplificada" troca a planta por fichas organizadas por tipo de móvel, mais fáceis de ler numa reunião.',
      },
      {
        alvo: '#slide',
        titulo: 'A planta da loja',
        texto: 'Cada móvel tem a cor da marca e as etiquetas do ciclo. Clique num móvel para ver a estratégia dele (com o planograma das prateleiras). Use a roda do mouse, a pinça ou os botões − / + para dar zoom; com zoom, arraste para mover.',
        posicao: 'centro',
      },
      {
        alvo: '#legenda',
        titulo: 'Filtre por marca',
        texto: 'Clique numa marca para destacar só ela: o resto fica em cinza. Clique de novo para ver todas. O filtro vale também para o PNG.',
      },
      {
        alvo: '#btnLoja',
        titulo: 'Painel da ER',
        texto: 'Abre, à esquerda, o que fica fora da planta: nome da ER e ciclo, TV e rádio, (A), (C), notas, símbolos usados e os itens fora da planta (cestinhas, espaço da beleza, cavalete).',
      },
      {
        alvo: '#btnEspaco',
        titulo: 'Espaço por marca',
        texto: 'Mostra quanto do espaço da ER vai para cada marca, cada movimento e cada classificação (lançamento, promoção…), com o GMV esperado.',
      },
      {
        alvo: '#painelEspaco',
        titulo: 'Clique para ver na planta',
        texto: 'Em "Por movimentos" e "Por classificação", clique numa linha para ver na planta só os espaços onde aquele movimento (ou aquele tipo de movimento) aparece. A classificação e o GMV vêm da aba "Tipos de movimento" da planilha.',
        antes: () => { garantirCiclo(); abrirEspaco(); },
        posicao: 'esquerda',
      },
      {
        alvo: '#btnPng',
        titulo: 'Leve para a apresentação',
        texto: 'Baixe a planta, a visão simplificada ou a estratégia (o espaço por marca em gráficos). Escolha "PNG" para só o conteúdo, com fundo transparente, ou "Slide completo" para o slide 16:9 pronto para colar.',
      },
      {
        alvo: '#btnConfig',
        titulo: 'Configurações',
        texto: 'Na engrenagem ficam a Validação (o validador comenta a estratégia e o construtor responde; o número mostra os comentários abertos) e Ajustar etiquetas (arraste cada pilha para onde quiser e mude o tamanho das etiquetas). O tutorial também fica aqui.',
      },
      {
        alvo: ['#btnModelo', '#lnkPlanilha'],
        titulo: 'A planilha manda',
        texto: 'Tudo o que aparece vem da planilha: abas Movimentos (cor e etiquetas de cada móvel), Painéis (TV, A, C, notas, destaques) e Tipos de movimento (classificação e GMV). Edite a planilha e clique em "Atualizar" para ver as mudanças.',
        textoCompleto: 'Tudo o que aparece vem da planilha. "Baixar planilha base" gera o arquivo para montar o próximo ciclo (já com o ciclo atual, se quiser) e "Importar planilha" lê o arquivo preenchido. Se editar direto no Google Sheets, clique em "Atualizar".',
      },
      {
        alvo: '#btnConstruir',
        titulo: 'Construir loja',
        texto: 'Para mudar o layout de uma planta: adicione, mova, gire e redimensione os móveis e clique em "Salvar planta".',
      },
      {
        titulo: 'Pronto!',
        texto: 'Você já sabe o essencial. Para rever este tour quando quiser, abra a engrenagem no topo e escolha "Ver o tutorial".',
      },
    ];
  }

  /* ------------------------------ desenho -------------------------------- */

  function criarCamada() {
    const fundo = document.createElement('div');
    fundo.className = 'tut-fundo';
    const foco = document.createElement('div');
    foco.className = 'tut-foco';
    const balao = document.createElement('div');
    balao.className = 'tut-balao';
    balao.setAttribute('role', 'dialog');
    balao.setAttribute('aria-modal', 'true');
    balao.setAttribute('aria-labelledby', 'tutTitulo');
    balao.setAttribute('aria-describedby', 'tutTexto');
    document.body.append(fundo, foco, balao);
    document.body.classList.add('tutorial-ativo');
    camada = { fundo, foco, balao };
    window.addEventListener('resize', reposicionar);
    window.addEventListener('scroll', reposicionar, true);
    window.addEventListener('keydown', teclado, true);
  }

  /** Tira o tour da tela (sem marcar como visto). */
  function desmontar() {
    if (!camada) return;
    window.removeEventListener('resize', reposicionar);
    window.removeEventListener('scroll', reposicionar, true);
    window.removeEventListener('keydown', teclado, true);
    Object.values(camada).forEach((n) => n.remove());
    camada = null;
    atual = -1;
    document.body.classList.remove('tutorial-ativo');
  }

  /** Fecha o tour (ou o cartão de boas-vindas): não oferece de novo neste navegador. */
  function fechar() {
    if (!camada) return;
    desmontar();
    marcarVisto();
  }

  /** Teclado durante o tour: Esc fecha, ← → navegam (sem trocar de planta por baixo). */
  function teclado(e) {
    if (!camada) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fechar(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); ir(atual + 1); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); ir(atual - 1); return; }
    if (e.key === 'Tab') {
      // Mantém o foco dentro do balão.
      const itens = Array.from(camada.balao.querySelectorAll('button'));
      const i = itens.indexOf(document.activeElement);
      e.preventDefault();
      itens[(i + (e.shiftKey ? itens.length - 1 : 1)) % itens.length].focus();
      return;
    }
    // Atalhos do app (zoom, plantas) ficam desligados enquanto o tour está aberto.
    e.stopPropagation();
  }

  function botao(texto, classe, acao) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn pequeno ' + (classe || '');
    b.textContent = texto;
    b.addEventListener('click', acao);
    return b;
  }

  /** Índices dos passos que dá para mostrar agora (alvo visível ou passo sem alvo). */
  function disponiveis() {
    return passos.map((p, i) => i).filter((i) => !passos[i].alvo || alvoDe(passos[i]));
  }

  /** Vai para o passo i (pula os que não têm alvo nesta tela; < 0 não faz nada; depois do último, fecha). */
  function ir(i) {
    if (i < 0) return;
    const dir = i >= atual ? 1 : -1;
    while (i >= 0 && i < passos.length) {
      const p = passos[i];
      if (p.antes) p.antes();
      if (!p.alvo || alvoDe(p)) break;
      i += dir;
    }
    if (i >= passos.length) { fechar(); return; }
    if (i < 0) return;
    atual = i;
    mostrar();
  }

  function mostrar() {
    const p = passos[atual];
    const lista = disponiveis();
    const n = lista.indexOf(atual) + 1;
    const b = camada.balao;
    b.textContent = '';
    const topo = document.createElement('div');
    topo.className = 'tut-topo';
    const prog = document.createElement('span');
    prog.className = 'tut-progresso';
    prog.textContent = n + ' de ' + lista.length;
    topo.append(prog, botao('✕', 'fantasma tut-fechar', fechar));
    topo.lastChild.setAttribute('aria-label', 'Fechar o tutorial');
    const h = document.createElement('h2');
    h.id = 'tutTitulo';
    h.textContent = p.titulo;
    const t = document.createElement('p');
    t.id = 'tutTexto';
    t.textContent = p.textoCompleto && document.getElementById('btnModelo') ? p.textoCompleto : p.texto;
    const pontos = document.createElement('div');
    pontos.className = 'tut-pontos';
    pontos.setAttribute('aria-hidden', 'true');
    lista.forEach((i) => { const s = document.createElement('i'); if (i === atual) s.className = 'ativo'; pontos.appendChild(s); });
    const rodape = document.createElement('div');
    rodape.className = 'tut-rodape';
    const ultimo = n === lista.length;
    if (n > 1) rodape.appendChild(botao('Voltar', '', () => ir(lista[n - 2])));
    else rodape.appendChild(botao('Pular tutorial', 'fantasma', fechar));
    const prox = botao(ultimo ? 'Concluir' : 'Próximo', 'primario', () => (ultimo ? fechar() : ir(lista[n])));
    rodape.appendChild(prox);
    b.append(topo, h, t, pontos, rodape);
    const alvo = alvoDe(p);
    if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    reposicionar();
    prox.focus();
  }

  /** Põe o recorte em volta do alvo e o balão ao lado (embaixo, em cima, à esquerda ou no centro). */
  function reposicionar() {
    if (!camada || atual < 0) return;
    const p = passos[atual];
    const alvo = alvoDe(p);
    const { foco, balao, fundo } = camada;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const margem = 12;
    const bw = Math.min(380, vw - 2 * margem);
    balao.style.width = bw + 'px';
    const bh = balao.offsetHeight;
    if (!alvo) {
      foco.hidden = true;
      fundo.classList.add('cheio');
      balao.style.left = (vw - bw) / 2 + 'px';
      balao.style.top = Math.max(margem, (vh - bh) / 2) + 'px';
      return;
    }
    fundo.classList.remove('cheio');
    foco.hidden = false;
    const r = alvo.getBoundingClientRect();
    const pad = 6;
    // Recorte limitado à tela (alvos grandes, como a planta).
    const fx = Math.max(4, r.left - pad);
    const fy = Math.max(4, r.top - pad);
    const fw = Math.min(vw - 4, r.right + pad) - fx;
    const fh = Math.min(vh - 4, r.bottom + pad) - fy;
    Object.assign(foco.style, { left: fx + 'px', top: fy + 'px', width: fw + 'px', height: fh + 'px' });

    let x;
    let y;
    const cabeEmbaixo = fy + fh + margem + bh <= vh;
    const cabeEmCima = fy - margem - bh >= 0;
    if (p.posicao === 'centro' || (!cabeEmbaixo && !cabeEmCima && p.posicao !== 'esquerda')) {
      x = fx + fw / 2 - bw / 2;
      y = fy + fh / 2 - bh / 2;
    } else if (p.posicao === 'esquerda' && fx - margem - bw >= 0) {
      x = fx - margem - bw;
      y = fy + 24;
    } else if (cabeEmbaixo) {
      x = fx + fw / 2 - bw / 2;
      y = fy + fh + margem;
    } else {
      x = fx + fw / 2 - bw / 2;
      y = fy - margem - bh;
    }
    balao.style.left = Math.max(margem, Math.min(vw - bw - margem, x)) + 'px';
    balao.style.top = Math.max(margem, Math.min(vh - bh - margem, y)) + 'px';
  }

  /* ----------------------------- entrada --------------------------------- */

  function iniciar() {
    if (document.querySelector('dialog[open]')) return;
    desmontar();
    passos = montarPassos();
    criarCamada();
    ir(0);
  }

  /** Cartão de boas-vindas (primeira visita): oferece o tour. */
  function boasVindas() {
    passos = [{
      titulo: 'Bem-vindo ao Plano de Varejo',
      texto: 'Aqui você vê, em cada ER, onde fica cada marca e cada movimento do ciclo, com as etiquetas na planta, o espaço por marca e o GMV esperado. Quer um tour rápido (cerca de 2 minutos) pelas principais funções?',
    }];
    criarCamada();
    atual = 0;
    const b = camada.balao;
    b.classList.add('tut-boas-vindas');
    const h = document.createElement('h2');
    h.id = 'tutTitulo';
    h.textContent = passos[0].titulo;
    const t = document.createElement('p');
    t.id = 'tutTexto';
    t.textContent = passos[0].texto;
    const rodape = document.createElement('div');
    rodape.className = 'tut-rodape';
    const sim = botao('Fazer o tour', 'primario', () => { desmontar(); iniciar(); });
    rodape.append(botao('Agora não', 'fantasma', fechar), sim);
    const dica = document.createElement('p');
    dica.className = 'tut-dica';
    dica.textContent = 'Você pode abrir o tour depois pela engrenagem, em "Ver o tutorial".';
    b.append(h, t, rodape, dica);
    reposicionar();
    sim.focus();
  }

  /** Chamado quando o app termina de carregar: na primeira visita, oferece o tour. */
  function oferecer() {
    if (visto() || camada) return;
    if (document.querySelector('dialog[open]') || !visivel($('slide'))) return;
    setTimeout(() => { if (!camada && !document.querySelector('dialog[open]')) boasVindas(); }, 500);
  }

  return { iniciar, oferecer, fechar, ativo: () => !!camada };
})();
</script>
