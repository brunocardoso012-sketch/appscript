<script>
/**
 * ============================================================================
 *  PLANILHA BASE (.xlsx): gerar para download e ler o arquivo preenchido
 * ============================================================================
 *  Usa a biblioteca ExcelJS (carregada sob demanda do cdnjs), tudo no
 *  navegador — o servidor só recebe os valores das células já lidos.
 */
const Planilha = (() => {
  const EXCELJS = {
    src: 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
    integrity: 'sha512-dlPw+ytv/6JyepmelABrgeYgHI0O+frEwgfnPdXDTOIZz+eDgfW07QXG02/O8COfivBdGNINy+Vex+lYmJ5rxw==',
  };
  const MIME_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const LINHAS_EXTRAS = 300; // linhas vazias com validação, para o usuário acrescentar
  const COR_CABECALHO = 'FF202124';
  const FAIXAS_PLANTA = ['FFFFFFFF', 'FFF3F4F6'];
  const SEM_LINHA_NA_PLANILHA = { CAIXA: true };
  const SEM_USO = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9DBDF' } }; // etiqueta que não aparece na planta

  let promessaExcel = null;

  function carregarExcelJS() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (!promessaExcel) {
      promessaExcel = new Promise((ok, falha) => {
        const s = document.createElement('script');
        s.src = EXCELJS.src;
        s.integrity = EXCELJS.integrity;
        s.crossOrigin = 'anonymous';
        s.referrerPolicy = 'no-referrer';
        s.onload = () => ok(window.ExcelJS);
        s.onerror = () => {
          promessaExcel = null;
          falha(new Error('Não foi possível carregar a biblioteca de planilhas (ExcelJS). Verifique a conexão.'));
        };
        document.head.appendChild(s);
      });
    }
    return promessaExcel;
  }

  /** Dispara o download de um Blob. */
  function baixarBlob(blob, nome) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  const chave = (v) => String(v == null ? '' : v).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const argb = (hex) => 'FF' + String(hex).replace('#', '').toUpperCase();
  const letra = (n) => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const nomeArquivo = (s) => String(s).replace(/[\\/:*?"<>|]+/g, '-').trim();
  /**
   * Espaços com linha na planilha. Gôndola: cada meio tem a linha do meio inteiro e a da
   * 2ª metade — preencher a 2ª metade divide o meio em dois movimentos (a linha do meio
   * passa a valer para a 1ª metade). Meio já dividido no Layout: as duas metades.
   */
  function espacosNaPlanilha(m) {
    // Totem: a linha do totem inteiro já tem uma etiqueta e uma cor por painel (Etiqueta / Marca
    // Etiqueta 1–3); as linhas TOTEM 1/PAINEL-N continuam aceitas, mas não entram na planilha base.
    if (m.tipo === 'TOTEM') return [];
    if (m.tipo !== 'GONDOLA') return Render.espacos(m);
    const div = String(m.dividido || '').toUpperCase();
    const meio = (l) => (div.indexOf(l) >= 0
      ? [{ id: 'MEIO-' + l + '-1', nome: 'Meio ' + l + ' (metade 1)' }, { id: 'MEIO-' + l + '-2', nome: 'Meio ' + l + ' (metade 2)' }]
      : [{ id: 'MEIO-' + l, nome: 'Meio ' + l + ' (inteiro, ou metade 1 se a metade 2 for preenchida)' },
        { id: 'MEIO-' + l + '-2', nome: 'Meio ' + l + ' – metade 2 (preencha só para dividir o meio em dois)' }]);
    return [{ id: 'LADO-A', nome: 'Lado A' }].concat(meio('A'), meio('B'), [{ id: 'LADO-B', nome: 'Lado B' }]);
  }

  /** Coluna "Planta": o nome da planta (ER P…) quando houver; a importação aceita nome ou número. */
  const plantaNaPlanilha = (dados, id) => (dados.config.nomesPlantas || {})[id] || id;

  function estilizarCabecalho(row) {
    row.height = 30;
    row.eachCell((c) => {
      c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COR_CABECALHO } };
      c.alignment = { vertical: 'middle', wrapText: true };
    });
  }

  function larguraColuna(k) {
    if (k === 'descricao' || k === 'observacao') return 36;
    if (k === 'texto') return 70;
    if (/^etiqueta/.test(k)) return 26;
    if (/marca/i.test(k)) return 15;
    return 13;
  }

  /** Lista suspensa + cores por marca numa coluna. */
  function validarColuna(ws, col, ultima, lista, titulo, ajuda) {
    for (let r = 2; r <= ultima; r++) {
      ws.getCell(r, col).dataValidation = {
        type: 'list',
        allowBlank: true,
        formulae: ['"' + lista.join(',') + '"'],
        showErrorMessage: true,
        errorStyle: 'warning',
        errorTitle: titulo,
        error: ajuda,
        showInputMessage: true,
        promptTitle: titulo,
        prompt: ajuda.slice(0, 250),
      };
    }
  }

  function colorirMarcas(ws, col, ultima, marcas) {
    const ref = letra(col) + '2:' + letra(col) + ultima;
    ws.addConditionalFormatting({
      ref,
      rules: Object.keys(marcas).map((cod, i) => ({
        type: 'containsText',
        operator: 'containsText',
        text: cod,
        priority: i + 1,
        style: {
          fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: argb(cod === 'NEUTRO' ? '#E8E8E8' : marcas[cod].etiqueta) } },
          font: { bold: true, color: { argb: cod === 'NEUTRO' ? 'FF333333' : 'FFFFFFFF' } },
        },
      })),
    });
  }

  function textoAjudaMarca(marcas) {
    return 'Use ' + Object.keys(marcas).join(', ') + '. Combinações com "+" (ex.: BOT+QDB) geram degradê; também aceita cor #RRGGBB.';
  }

  /* ------------------------------ abas ------------------------------------ */

  function abaInstrucoes(wb, dados, op) {
    const ws = wb.addWorksheet('Instruções', { views: [{ showGridLines: false }] });
    ws.columns = [{ width: 4 }, { width: 22 }, { width: 34 }, { width: 70 }];
    const abas = dados.config.abas;
    let r = 1;
    const titulo = (t, tam) => {
      const c = ws.getCell(r, 2);
      c.value = t;
      c.font = { bold: true, size: tam || 12 };
      r++;
    };
    const paragrafo = (t) => {
      ws.mergeCells(r, 2, r, 4);
      const c = ws.getCell(r, 2);
      c.value = t;
      c.alignment = { wrapText: true, vertical: 'top' };
      ws.getRow(r).height = Math.max(16, Math.ceil(t.length / 110) * 15);
      r++;
    };

    titulo('Planilha base — Plano de Varejo', 16);
    paragrafo('Gerada em ' + new Date().toLocaleString('pt-BR') + (op.origem ? ' a partir do ciclo "' + op.origem + '".' : ' (em branco).'));
    r++;
    titulo('Como preencher');
    [
      '1. Na aba "' + abas.MOVIMENTOS + '", cada linha é um móvel de uma planta. NÃO altere "Planta" nem "ID Móvel": eles ligam a linha ao desenho.',
      '2. Preencha "Ciclo" em todas as linhas com o nome do ciclo (ex.: C15/2026). É esse nome que aparece no seletor de ciclos.',
      '3. "Marca do Móvel" define a cor do móvel na planta. Deixe vazio (ou NEUTRO) para o móvel aparecer branco.',
      '4. "Etiqueta 1…' + dados.config.maxEtiquetas + '" são as caixas de texto do móvel; "Marca Etiqueta N" define a cor de cada uma (vazio = cor do móvel). Pirâmide e mesa destaque mostram até 4 etiquetas, empilhadas (as colunas que não aparecem na planta ficam cinza).',
      '5. "Símbolo" é opcional e aparece ao lado da primeira etiqueta (tabela abaixo).',
      '6. Na aba "' + abas.PAINEIS + '" ficam os textos fora dos móveis: listas TV / A / C, caixas de destaque (CALLOUT, que podem apontar para um ID Móvel) e notas (NOTA).',
      '6.1 Gôndolas têm uma linha para a gôndola inteira e uma por espaço (ex.: GONDOLA 1/LADO-A, GONDOLA 1/MEIO-A). Espaço preenchido tem prioridade; espaço vazio usa a linha da gôndola inteira (para deixar um espaço branco, use NEUTRO). Para dividir um meio em dois movimentos, preencha também a linha da metade 2 (ex.: GONDOLA 1/MEIO-A-2): a linha do meio passa a valer para a metade 1 e a planta mostra o meio dividido.',
      '6.2 Etiquetas da gôndola. Na linha da gôndola inteira: Etiqueta 1 = Lado A, Etiqueta 2 = Meio A, Etiqueta 3 = Meio B, Etiqueta 4 = Lado B ("A" é sempre o lado virado para quem olha a planta). A linha de um espaço mostra até 4 etiquetas empilhadas em cima daquele bloco (Etiqueta 1 a 4) e substitui a etiqueta que viria da gôndola inteira.',
      '6.3 Mesa destaque (FRENTE-1 e 2), mesa 3 frentes (FRENTE-1 a 3) e móvel make (TESTEIRA-1 a 4) têm uma linha por bloco, com cor e etiqueta próprias. Cada frente das mesas e cada testeira mostram até 4 etiquetas, empilhadas. Bloco sem linha própria usa a cor do móvel inteiro. Blocos vizinhos com as mesmas etiquetas e cor ficam com uma pilha só, no centro. O balcão recepção tem uma cor só; Etiqueta 1, 2 e 3 vão para o bloco 1, o canto e o bloco 3.',
      '6.4 Totem: na linha do totem, Etiqueta 1, 2 e 3 vão para o painel de cima, o do meio e o de baixo (cada uma ao lado do seu painel), e a "Marca Etiqueta N" pinta o painel N. Painel sem etiqueta usa a "Marca do Móvel". Se preferir, uma linha TOTEM 1/PAINEL-1 (a 3) define cor e etiqueta de um painel e tem prioridade.',
      '7. Na coluna "Planta" vale o nome (ex.: ER P) ou o número (01). Cascata: o que é definido numa planta vale também para as seguintes (ER P → ER M → ER G → ER GG), por isso cada móvel aparece uma vez só, na primeira planta que o tem ("vale para…" na coluna Móvel). Para mudar um móvel só a partir de uma planta, acrescente uma linha com o mesmo ID Móvel e essa planta. Planta = TODAS vale para todas.',
    ].concat((dados.config.transferencias || []).length ? [
      '7.1 Espaços que mudam de móvel na cascata: ' + dados.config.transferencias.map((r) => {
        const i = dados.plantas.findIndex((x) => x.id === r.planta);
        const anterior = i > 0 ? plantaNaPlanilha(dados, dados.plantas[i - 1].id) : '';
        return 'a partir da ' + plantaNaPlanilha(dados, r.planta) + ', ' + r.para + ' mostra o que ' + r.de + ' tinha na ' + anterior;
      }).join('; ') + '. Nessas plantas o espaço de destino recebe sempre o conteúdo da planta anterior (a linha própria dele só vale se a origem estiver vazia) e o espaço de origem fica livre (branco): preencha a linha dele com o novo movimento. Se a linha da planta maior repetir o movimento que foi transferido, ele é ignorado ali, para não aparecer nos dois móveis.',
    ] : []).concat(op.visualizador ? [
      // Versão só de visualização (Apps Script): o app lê esta planilha direto, sem importar.
      '8. Todos os ciclos ficam nesta mesma planilha. No primeiro ciclo, preencha o "Ciclo" nas linhas já prontas (linhas sem ciclo e sem conteúdo são ignoradas). Para criar um ciclo novo, copie as linhas de um ciclo existente (nas abas "' + abas.MOVIMENTOS + '" e "' + abas.PAINEIS + '"), cole no fim e troque o "Ciclo". Cada nome diferente de ciclo aparece no seletor do visualizador.',
      '9. O visualizador lê esta planilha diretamente: depois de editar, clique em "Atualizar" no app. Não renomeie as abas nem os títulos das colunas. Os avisos do app (marca desconhecida, ID inexistente…) indicam a linha da planilha a corrigir.',
    ] : [
      '8. Salve o arquivo e use o botão "Importar planilha" no visualizador. As linhas do mesmo Ciclo + Planta que já existirem serão substituídas.',
      '9. Aba "' + abas.LAYOUT + '" (opcional): posição e tamanho dos móveis (X, Y, Largura, Profundidade, Altura). Ao importar, as plantas presentes nela são substituídas por inteiro.',
    ]).forEach(paragrafo);
    r++;

    titulo('Marcas (cores)');
    Object.keys(dados.marcas).forEach((cod) => {
      const m = dados.marcas[cod];
      ws.getCell(r, 2).value = cod;
      ws.getCell(r, 2).font = { bold: true };
      ws.getCell(r, 3).value = m.nome;
      const cor = ws.getCell(r, 4);
      cor.value = 'Etiqueta ' + m.etiqueta + '  ·  Móvel ' + m.movel;
      cor.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb(cod === 'NEUTRO' ? '#E8E8E8' : m.etiqueta) } };
      cor.font = { color: { argb: cod === 'NEUTRO' ? 'FF333333' : 'FFFFFFFF' }, bold: true };
      r++;
    });
    r++;
    titulo('Símbolos');
    const desenho = { MOVIMENTO: '▶', FIXO: '◆', EXPOSICAO: 'Ⓔ', NOVO: 'NEW' };
    Object.keys(dados.simbolos).forEach((s) => {
      ws.getCell(r, 2).value = s;
      ws.getCell(r, 2).font = { bold: true };
      ws.getCell(r, 3).value = desenho[s] || '';
      ws.getCell(r, 4).value = dados.simbolos[s].descricao;
      r++;
    });
    r++;
    titulo('Seções da aba ' + abas.PAINEIS);
    Object.keys(dados.secoes).forEach((s) => {
      ws.getCell(r, 2).value = s;
      ws.getCell(r, 2).font = { bold: true };
      ws.mergeCells(r, 3, r, 4);
      ws.getCell(r, 3).value = dados.secoes[s].descricao;
      r++;
    });
  }

  function abaMovimentos(wb, dados, op, resolver) {
    const cols = dados.colunas.movimentos;
    const ws = wb.addWorksheet(dados.config.abas.MOVIMENTOS, { views: [{ state: 'frozen', xSplit: 4, ySplit: 1 }] });
    ws.columns = cols.map((c) => ({ header: c.titulo, key: c.chave, width: larguraColuna(c.chave), style: { numFmt: '@' } }));
    estilizarCabecalho(ws.getRow(1));

    const max = dados.config.maxEtiquetas;
    const porTipo = dados.config.etiquetasPorTipo || {};
    const porBloco = dados.config.etiquetasPorBloco || {};
    const plantas = dados.plantas.filter((p) => op.plantas.indexOf(p.id) >= 0);
    // Cascata (ER P → ER M → ER G → ER GG): com mais de uma planta, cada móvel entra uma vez só, na
    // primeira planta que o tem, e vale para as seguintes. Uma planta seguinte só ganha linha própria
    // se o ciclo copiado tiver algo diferente para ela.
    const emCascata = plantas.length > 1;
    const ondeExiste = {};
    plantas.forEach((p) => p.moveis.forEach((m) => { (ondeExiste[m.id] = ondeExiste[m.id] || []).push(p.id); }));
    const nomeDe = (id) => plantaNaPlanilha(dados, id);
    // TRANSFERENCIAS (Config.gs): na planta em que a regra começa, avisa de onde vem o espaço
    // "para" e que o espaço "de" ficou livre (essa linha entra mesmo vazia, para ser preenchida).
    const transferencias = emCascata ? dados.config.transferencias || [] : [];
    const notaTransferencia = (planta, id) => transferencias
      .filter((r) => r.planta === planta)
      .map((r) => {
        const i = dados.plantas.findIndex((x) => x.id === r.planta);
        const anterior = i > 0 ? nomeDe(dados.plantas[i - 1].id) : '';
        if (id === r.para) return ' · VEM DE ' + r.de + ' da ' + anterior + ' (automático: para mudar, mude a ' + r.de + ' na ' + anterior + ')';
        if (id === r.de) return ' · ESPAÇO LIVRE: o que estava aqui na ' + anterior + ' foi para ' + r.para + '; preencha com o novo movimento';
        return '';
      }).join('');
    const jaListado = {}; // ID → conteúdo (JSON) que as plantas seguintes herdam
    let faixa = 0;
    plantas.forEach((p) => {
      const fundo = { type: 'pattern', pattern: 'solid', fgColor: { argb: FAIXAS_PLANTA[faixa++ % FAIXAS_PLANTA.length] } };
      // Gôndola: uma linha para ela inteira (etiqueta N = bloco N) + uma por espaço (ponta/meio), com 1 etiqueta cada.
      // limite = quantas etiquetas aparecem na planta (as outras colunas ficam cinza).
      const valePara = (m) => {
        if (!emCascata) return '';
        const lista = (ondeExiste[m.id] || []).filter((id) => plantas.findIndex((x) => x.id === id) >= plantas.indexOf(p));
        return lista.length > 1 ? ' · vale para ' + lista.map(nomeDe).join(', ') : '';
      };
      const POR_POSICAO = {
        GONDOLA: ' (gôndola inteira; Etiqueta 1–4 = Lado A, Meio A, Meio B, Lado B)',
        VITRINE_L: ' (Etiqueta 1–3 = bloco 1, canto, bloco 3)',
        TOTEM: ' (Etiqueta 1–3 = painel de cima, do meio e de baixo; Marca Etiqueta N = cor do painel N)',
      };
      const linhasDoMovel = (m) => [{
        id: m.id,
        descricao: m.descricao + (POR_POSICAO[m.tipo] || '') + valePara(m),
        limite: porTipo[m.tipo] || max,
        porPosicao: !!POR_POSICAO[m.tipo],
      }].concat(espacosNaPlanilha(m).map((e) => {
        const id = m.id + '/' + e.id;
        const nota = notaTransferencia(p.id, id);
        return { id, descricao: (m.descricao || m.id) + ' – ' + e.nome + nota, limite: porBloco[m.tipo] || 1, forcar: !!nota };
      }));
      // Móvel de atendimento não leva cor nem etiqueta: fica fora da planilha.
      p.moveis.filter((m) => !SEM_LINHA_NA_PLANILHA[m.tipo]).reduce((acc, m) => acc.concat(linhasDoMovel(m)), []).forEach((m) => {
        let info = op.origem ? resolver.movimento(op.origem, p.id, m.id) : null;
        // Transferência entre plantas: em cascata ela é automática, então a linha não repete o conteúdo
        // (assim, mudar a planta anterior continua mudando as seguintes).
        if (info && info._regra) info = emCascata ? info._regra.base : Object.assign({}, info, { _regra: undefined });
        const conteudo = JSON.stringify(info);
        if (emCascata && !m.forcar && m.id in jaListado && jaListado[m.id] === conteudo) return; // já vem da planta anterior
        jaListado[m.id] = conteudo;
        const linha = { ciclo: op.ciclo, planta: nomeDe(p.id), movel: m.id, descricao: m.descricao };
        if (info) {
          linha.marca = info.marca;
          // Só as etiquetas que aparecem na planta (na gôndola inteira, cada uma fica na coluna do seu bloco).
          const usadas = m.porPosicao
            ? info.etiquetas.filter((e, i) => (e.posicao || i + 1) <= m.limite)
            : info.etiquetas.slice(0, m.limite);
          usadas.forEach((e, i) => {
            const n = m.porPosicao ? e.posicao || i + 1 : i + 1;
            linha['etiqueta' + n] = e.texto;
            linha['marcaEtiqueta' + n] = e.marca;
          });
          linha.simbolo = info.simbolo;
          linha.observacao = info.observacao;
        }
        const row = ws.addRow(linha);
        for (let c = 1; c <= 4; c++) row.getCell(c).fill = fundo;
        row.getCell(4).font = { italic: true, color: { argb: 'FF666666' } };
        for (let n = m.limite + 1; n <= max; n++) {
          row.getCell('etiqueta' + n).fill = SEM_USO;
          row.getCell('marcaEtiqueta' + n).fill = SEM_USO;
        }
      });
    });

    const ultima = ws.rowCount + LINHAS_EXTRAS;
    const ajudaMarca = textoAjudaMarca(dados.marcas);
    cols.forEach((c, i) => {
      if (/^marca/i.test(c.chave)) {
        validarColuna(ws, i + 1, ultima, Object.keys(dados.marcas), c.titulo, ajudaMarca);
        colorirMarcas(ws, i + 1, ultima, dados.marcas);
      } else if (c.chave === 'simbolo') {
        validarColuna(ws, i + 1, ultima, Object.keys(dados.simbolos), 'Símbolo',
          Object.keys(dados.simbolos).map((s) => s + ' = ' + dados.simbolos[s].descricao).join('; '));
      }
    });
    ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
  }

  function abaPaineis(wb, dados, op, resolver) {
    const cols = dados.colunas.paineis;
    const ws = wb.addWorksheet(dados.config.abas.PAINEIS, { views: [{ state: 'frozen', ySplit: 1 }] });
    ws.columns = cols.map((c) => ({ header: c.titulo, key: c.chave, width: larguraColuna(c.chave), style: { numFmt: '@' } }));
    estilizarCabecalho(ws.getRow(1));

    if (op.origem) {
      resolver.linhasPaineis(op.origem, op.plantas).forEach((p) => {
        const row = ws.addRow({
          ciclo: op.ciclo, planta: plantaNaPlanilha(dados, p.planta), secao: p.secao, texto: p.texto, marca: p.marca, movel: p.movel,
        });
        row.getCell(4).alignment = { wrapText: true, vertical: 'top' };
      });
    }
    const ultima = ws.rowCount + LINHAS_EXTRAS;
    cols.forEach((c, i) => {
      if (c.chave === 'secao') {
        validarColuna(ws, i + 1, ultima, Object.keys(dados.secoes), 'Seção',
          Object.keys(dados.secoes).map((s) => s + ' = ' + dados.secoes[s].descricao).join('; '));
      } else if (c.chave === 'marca') {
        validarColuna(ws, i + 1, ultima, Object.keys(dados.marcas), 'Marca', textoAjudaMarca(dados.marcas));
        colorirMarcas(ws, i + 1, ultima, dados.marcas);
      }
    });
    ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
  }

  /** Aba Layout com a posição atual dos móveis (para ajustar coordenadas). */
  function abaLayout(wb, dados, op) {
    const cols = dados.colunas.layout;
    const ws = wb.addWorksheet(dados.config.abas.LAYOUT, { views: [{ state: 'frozen', xSplit: 2, ySplit: 1 }] });
    ws.columns = cols.map((c) => ({
      header: c.titulo, key: c.chave, width: c.chave === 'descricao' ? 36 : c.chave === 'tipo' ? 17 : 12,
      style: c.texto ? { numFmt: '@' } : {},
    }));
    estilizarCabecalho(ws.getRow(1));
    let faixa = 0;
    dados.plantas.filter((p) => op.plantas.indexOf(p.id) >= 0).forEach((p) => {
      const fundo = { type: 'pattern', pattern: 'solid', fgColor: { argb: FAIXAS_PLANTA[faixa++ % FAIXAS_PLANTA.length] } };
      const linhas = [{
        planta: plantaNaPlanilha(dados, p.id), movel: 'LOJA', descricao: 'Piso e paredes da loja', tipo: 'LOJA', x: 0, y: 0, z: 0,
        largura: p.loja.largura, profundidade: p.loja.profundidade, altura: p.loja.alturaParede, ajusteX: 0, ajusteY: 0,
      }].concat(p.moveis.map((m) => ({
        planta: plantaNaPlanilha(dados, p.id), movel: m.id, descricao: m.descricao, tipo: m.tipo, x: m.x, y: m.y, z: m.z,
        largura: m.w, profundidade: m.d, altura: m.h, ajusteX: m.ajusteX || 0, ajusteY: m.ajusteY || 0, dividido: m.dividido || '', giro: m.giro || 0,
      })));
      linhas.forEach((l) => {
        const row = ws.addRow(l);
        for (let c = 1; c <= 3; c++) row.getCell(c).fill = fundo;
      });
    });
    const ultima = ws.rowCount + LINHAS_EXTRAS;
    cols.forEach((c, i) => {
      if (c.chave === 'tipo') {
        validarColuna(ws, i + 1, ultima, Object.keys(dados.tipos), 'Tipo',
          Object.keys(dados.tipos).map((t) => t + ' = ' + dados.tipos[t]).join('; '));
      }
    });
    ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
  }

  /**
   * Gera e baixa a planilha base.
   * @param {Object} dados    retorno de getDados()
   * @param {{ciclo: string, origem: string, plantas: string[], incluirLayout: boolean, visualizador?: boolean}} op
   *   visualizador: instruções para a versão só de visualização (lê a planilha direto, sem importar).
   * @param {{movimento: Function, linhasPaineis: Function}} resolver
   */
  async function baixarModelo(dados, op, resolver) {
    const ExcelJS = await carregarExcelJS();
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Plano de Varejo';
    wb.created = new Date();
    abaMovimentos(wb, dados, op, resolver);
    abaPaineis(wb, dados, op, resolver);
    if (op.incluirLayout) abaLayout(wb, dados, op);
    abaInstrucoes(wb, dados, op);
    const buffer = await wb.xlsx.writeBuffer();
    const nome = 'Planilha base - ' + nomeArquivo(op.ciclo || 'novo ciclo') + '.xlsx';
    baixarBlob(new Blob([buffer], { type: MIME_XLSX }), nome);
    return nome;
  }

  /* ------------------------------ leitura --------------------------------- */

  function valorCelula(v) {
    if (v === null || v === undefined) return '';
    if (v instanceof Date) {
      const p = (n) => String(n).padStart(2, '0');
      return p(v.getUTCDate()) + '/' + p(v.getUTCMonth() + 1) + '/' + v.getUTCFullYear();
    }
    if (typeof v === 'object') {
      if (Array.isArray(v.richText)) return v.richText.map((r) => r.text).join('');
      if ('result' in v) return valorCelula(v.result);
      if ('text' in v) return valorCelula(v.text);
      if ('error' in v) return '';
      return '';
    }
    return v;
  }

  function matrizDaAba(ws) {
    const linhas = [];
    const nCols = ws.columnCount;
    for (let r = 1; r <= ws.rowCount; r++) {
      const row = ws.getRow(r);
      const valores = [];
      for (let c = 1; c <= nCols; c++) valores.push(valorCelula(row.getCell(c).value));
      linhas.push(valores);
    }
    while (linhas.length && linhas[linhas.length - 1].every((v) => v === '' || v === null)) linhas.pop();
    return linhas;
  }

  /**
   * Lê o .xlsx preenchido e devolve { movimentos, paineis, layout } (matrizes [[...]])
   * (matrizes com cabeçalho) para enviar ao servidor.
   */
  async function ler(arquivo, dados) {
    if (!/\.xlsx$/i.test(arquivo.name)) {
      throw new Error('Envie um arquivo .xlsx (no Google Sheets: Arquivo › Fazer download › Microsoft Excel).');
    }
    const ExcelJS = await carregarExcelJS();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await arquivo.arrayBuffer());
    const achar = (nome) => wb.worksheets.find((ws) => chave(ws.name) === chave(nome));
    const out = {};
    const abas = dados.config.abas;
    const mov = achar(abas.MOVIMENTOS);
    const pai = achar(abas.PAINEIS);
    const lay = achar(abas.LAYOUT);
    if (mov) out.movimentos = matrizDaAba(mov);
    if (pai) out.paineis = matrizDaAba(pai);
    if (lay) out.layout = matrizDaAba(lay);
    if (!out.movimentos && !out.paineis && !out.layout) {
      throw new Error('O arquivo não tem as abas "' + abas.MOVIMENTOS + '", "' + abas.PAINEIS + '" ou "' + abas.LAYOUT +
        '". Use a planilha gerada pelo botão "Baixar planilha base".');
    }
    return out;
  }

  return { baixarModelo, ler, baixarBlob };
})();
</script>
