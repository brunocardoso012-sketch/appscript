<script>
/**
 * ============================================================================
 *  CICLOS EM CONSTRUÇÃO (página)
 * ============================================================================
 *  Para quem entrou na validação. O construtor da estratégia cria um ciclo novo
 *  (em branco, copiando outro ou só os espaços fixos de outro) e monta em três
 *  passos: (1) os Tipos de movimento, com o GMV; (2) os móveis, na tela do móvel,
 *  só com os movimentos cadastrados nos tipos (e as Comunicações ER); (3) o envio
 *  para aprovação. O validador
 *  aprova (o ciclo entra nas abas da planilha, junto com os demais) ou devolve
 *  com um comentário. Os ciclos em construção aparecem no seletor de ciclos
 *  ("Em construção") e na planta como um ciclo qualquer. As regras ficam no
 *  servidor (Rascunhos.gs).
 */
const Rascunho = (() => {
  const $ = (id) => document.getElementById(id);
  let app = null; // { estado, ultimoAprovado, chamar, toast, erro, desenhar, plantaAtual, acesso, montarCiclos, carregar, abrirMovel, movimentoDe, paineisDe, corDaMarca, nomeDaMarca }
  let lista = []; // [{ ciclo, status, nomeStatus, origem, criadoPor, criadoEm, enviadoEm, decididoPor, decididoEm }]
  let dados = null; // { movimentos, paineis, tiposMovimento } dos ciclos em construção
  let mesclados = []; // ciclos que mesclar() pôs em estado.dados (para tirar na próxima vez)
  // Painel de construção (lateral): móvel selecionado na planta e gravação automática.
  let selecao = ''; // ID do móvel selecionado ('' = nenhum)
  let formChave = ''; // ciclo|ER|móvel do formulário montado (só refaz quando muda, para não perder o foco)
  let verComentarios = false; // o construtor abriu os comentários da validação no lugar do painel
  let abriuDoPapel = false; // já levou a tela ao ciclo em construção do papel neste login (abrirDoPapel)
  const pendentes = {}; // "ciclo|ER|espaço" → { ciclo, planta, chave, linha } ainda não gravados
  // Meios de gôndola divididos pelo construtor que ainda não têm nada nas metades (com uma metade preenchida,
  // a linha dela já divide o meio na planta): "ciclo|ER|móvel" → 'A' | 'B' | 'AB'.
  const divididos = {};
  let timer = null;
  let gravando = false;
  let gravacao = 'salvo'; // salvo | pendente | salvando | erro
  const ESPERA_GRAVACAO = 800; // ms sem mexer antes de gravar

  function n(tag, classe, texto, pai) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto !== undefined && texto !== null) e.textContent = texto;
    if (pai) pai.appendChild(e);
    return e;
  }

  function botao(texto, classe, fn, pai) {
    const b = n('button', 'btn pequeno ' + (classe || ''), texto, pai);
    b.type = 'button';
    b.addEventListener('click', fn);
    return b;
  }

  const acesso = () => (app && app.acesso()) || null;
  const papel = () => (acesso() || {}).papel || '';
  const doCiclo = (ciclo) => lista.find((r) => r.ciclo === ciclo) || null;
  /** O ciclo da tela, se for um ciclo em construção. */
  const atual = () => (app && app.estado.ciclo ? doCiclo(app.estado.ciclo) : null);
  /** O construtor pode editar o ciclo da tela (em construção, ainda não enviado). */
  const editavel = () => papel() === 'CONSTRUTOR' && !!atual() && atual().status === 'EM_CONSTRUCAO';

  /** Tipos de movimento do ciclo da tela: [{ chave, texto, classificacao, gmv, observacao }], em ordem alfabética. */
  function tiposDoCiclo() {
    const t = (app.estado.dados.tiposMovimento || {})[app.estado.ciclo] || {};
    return Object.keys(t).map((k) => Object.assign({ chave: k }, t[k], { texto: t[k].texto || k }))
      .sort((a, b) => a.texto.localeCompare(b.texto, 'pt-BR'));
  }
  const chaveEtq = (t) => Render.chaveEtiqueta(t); // o movimento, sem a observação depois do "|"

  /** Situação dos três passos do ciclo da tela (para o painel e a faixa). */
  function passos() {
    const tipos = tiposDoCiclo();
    const cadastrados = {};
    tipos.forEach((t) => { cadastrados[t.chave] = true; });
    let espacos = 0;
    const fora = {};
    const usados = {};
    Object.values(app.estado.dados.movimentos[app.estado.ciclo] || {}).forEach((pl) => Object.values(pl).forEach((i) => {
      espacos++;
      i.etiquetas.forEach((e) => {
        usados[chaveEtq(e.texto)] = true;
        if (!cadastrados[chaveEtq(e.texto)]) fora[chaveEtq(e.texto)] = Render.movimentoDaEtiqueta(e.texto);
      });
    }));
    const semGmv = tipos.filter((t) => typeof t.gmv !== 'number');
    return {
      tipos: tipos.length, semGmv: semGmv.length, nomesSemGmv: semGmv.map((t) => t.texto), espacos, fora: Object.values(fora),
      semEspaco: tipos.filter((t) => !usados[t.chave]).map((t) => t.texto),
    };
  }

  /* --------------------- mudanças locais e gravação automática ------------------- */

  /**
   * Põe a linha de um espaço direto em estado.dados (no formato do montarDados_), para a planta e os números
   * mudarem na hora; a gravação vai depois (agendar). Linha vazia tira o espaço desta ER.
   */
  function aplicarLocal(ciclo, plantaId, chave, l) {
    const d = app.estado.dados;
    if (!d || !d.movimentos[ciclo] && !doCiclo(ciclo)) return;
    const mov = d.movimentos[ciclo] || (d.movimentos[ciclo] = {});
    if (dados && dados.movimentos) dados.movimentos[ciclo] = mov; // o mesmo objeto, para o próximo mesclar
    const er = mov[plantaId] || (mov[plantaId] = {});
    const obs = String(l.observacao || '').trim();
    if (!l.marca && !l.simbolo && !obs && !l.etiquetas.length) {
      delete er[chave];
      return;
    }
    er[chave] = {
      marca: l.marca || '', simbolo: l.simbolo || '', observacao: obs,
      etiquetas: l.etiquetas.map((e, k) => {
        const x = { texto: e.texto, marca: e.marca || '', posicao: k + 1 };
        if (e.simbolo) x.simbolo = e.simbolo;
        if (e.simbolo === 'ANTECIPADO' && e.data) x.data = e.data;
        return x;
      }),
    };
  }

  /** Depois de receber os dados do servidor: as mudanças ainda não gravadas continuam por cima. */
  function reaplicarPendentes() {
    Object.values(pendentes).forEach((p) => aplicarLocal(p.ciclo, p.planta, p.chave, p.linha));
  }

  function agendar(ciclo, plantaId, chave, linha) {
    pendentes[ciclo + '|' + plantaId + '|' + chave] = { ciclo, planta: plantaId, chave, linha };
    gravacao = 'pendente';
    indicador();
    clearTimeout(timer);
    timer = setTimeout(esvaziar, ESPERA_GRAVACAO);
  }

  /** Grava as mudanças pendentes, uma de cada vez (a mais recente de cada espaço). */
  async function esvaziar() {
    clearTimeout(timer);
    timer = null;
    if (gravando) return;
    const k = Object.keys(pendentes)[0];
    if (!k) {
      if (gravacao !== 'erro') gravacao = 'salvo';
      indicador();
      return;
    }
    const p = pendentes[k];
    delete pendentes[k];
    gravando = true;
    gravacao = 'salvando';
    indicador();
    try {
      const r = await app.chamar('salvarRascunho', acesso(), { acao: 'salvarEspaco', ciclo: p.ciclo, planta: p.planta, movel: p.chave, linha: p.linha });
      gravando = false;
      if (!Object.keys(pendentes).length) gravacao = 'salvo';
      aplicar(r);
    } catch (e) {
      gravando = false;
      gravacao = 'erro';
      app.erro(e);
      formChave = ''; // o formulário volta ao que está no servidor
      await recarregar();
    }
    if (Object.keys(pendentes).length) await esvaziar();
    else indicador();
  }

  /** Espera gravar tudo (antes de enviar para aprovação). */
  async function esvaziarTudo() {
    while (Object.keys(pendentes).length || gravando) {
      if (gravando) await new Promise((ok) => setTimeout(ok, 100));
      else await esvaziar();
    }
  }

  function indicador() {
    const el = $('pcGravacao');
    if (!el) return;
    const textos = { salvo: 'Tudo salvo', pendente: 'Alterações a salvar…', salvando: 'Salvando…', erro: 'Erro ao salvar' };
    el.className = 'pc-gravacao ' + gravacao;
    el.textContent = textos[gravacao];
  }

  /* ----------------------------- servidor ---------------------------------- */

  /** Põe os ciclos em construção em estado.dados (movimentos, painéis, tipos), tirando os da vez anterior. */
  function mesclar(d) {
    if (!d) return;
    mesclados.forEach((c) => {
      if (d.ciclos.indexOf(c) >= 0) return; // acabou de ser aprovado: agora os dados são os publicados
      delete d.movimentos[c];
      delete d.paineis[c];
      if (d.tiposMovimento) delete d.tiposMovimento[c];
    });
    mesclados = [];
    if (!dados || !acesso()) return;
    lista.forEach((r) => {
      if (d.ciclos.indexOf(r.ciclo) >= 0) return; // nome já publicado (não deveria acontecer)
      d.movimentos[r.ciclo] = dados.movimentos[r.ciclo] || {};
      d.paineis[r.ciclo] = dados.paineis[r.ciclo] || {};
      d.tiposMovimento = d.tiposMovimento || {};
      d.tiposMovimento[r.ciclo] = (dados.tiposMovimento || {})[r.ciclo] || {};
      mesclados.push(r.ciclo);
    });
  }

  /**
   * Logo depois de entrar na validação (ou ao abrir o app já com o login), a tela vai para o ciclo em construção
   * do papel: o construtor, o que está montando; o validador, o que aguarda aprovação. Só uma vez por login.
   */
  function abrirDoPapel() {
    if (abriuDoPapel || !acesso()) return;
    abriuDoPapel = true;
    const status = papel() === 'CONSTRUTOR' ? 'EM_CONSTRUCAO' : papel() === 'VALIDADOR' ? 'ENVIADO' : '';
    const r = lista.slice().reverse().find((x) => x.status === status);
    if (!r || r.ciclo === app.estado.ciclo) return;
    app.estado.ciclo = r.ciclo;
    selecao = '';
    verComentarios = false;
  }

  function aplicar(r) {
    lista = (r && r.rascunhos) || [];
    dados = r || null;
    const e = app.estado;
    if (!e.dados) return;
    mesclar(e.dados);
    reaplicarPendentes();
    abrirDoPapel();
    // O ciclo da tela era um rascunho que não existe mais (aprovado por outra pessoa, excluído…): volta ao último ciclo aprovado.
    if (e.ciclo && e.dados.ciclos.indexOf(e.ciclo) < 0 && !doCiclo(e.ciclo)) e.ciclo = app.ultimoAprovado();
    app.montarCiclos();
    app.desenhar();
  }

  async function recarregar() {
    if (!acesso() || !app.estado.dados) { limpar(); return; }
    try {
      aplicar(await app.chamar('getRascunhos', acesso()));
    } catch (e) {
      app.erro(e);
    }
  }

  function limpar() {
    lista = [];
    dados = null;
    abriuDoPapel = false; // no próximo login, abre de novo o ciclo do papel
    if (!app || !app.estado.dados) return;
    mesclar(app.estado.dados);
    if (app.estado.ciclo && app.estado.dados.ciclos.indexOf(app.estado.ciclo) < 0) app.estado.ciclo = app.ultimoAprovado();
    app.montarCiclos();
    app.desenhar();
  }

  /** Grava um pedido; com "aprovar", recarrega os ciclos publicados (o novo passa a estar lá). */
  async function salvar(pedido, mensagem) {
    try {
      const r = await app.chamar('salvarRascunho', acesso(), pedido);
      if (pedido.acao === 'aprovar') {
        dados = r;
        lista = r.rascunhos || [];
        await app.carregar({ ciclo: pedido.ciclo });
      } else {
        aplicar(r);
      }
      if (mensagem) app.toast(mensagem);
      return true;
    } catch (e) {
      app.erro(e);
      return false;
    }
  }

  /* ---------------------- diálogo genérico (dlgRascunho) -------------------- */

  /**
   * Abre o diálogo com um título e um corpo montado por `montar(corpo)`. Ao confirmar, chama
   * `confirmar()`: se ela devolver uma mensagem de erro (texto), mostra e mantém o diálogo aberto.
   */
  function dialogo(titulo, sub, botaoOk, montar, confirmar) {
    const dlg = $('dlgRascunho');
    $('rascunhoTitulo').textContent = titulo;
    $('rascunhoSub').textContent = sub || '';
    $('rascunhoSub').hidden = !sub;
    $('rascunhoOk').textContent = botaoOk;
    $('rascunhoErro').hidden = true;
    const corpo = $('rascunhoCorpo');
    corpo.innerHTML = '';
    montar(corpo);
    dlg.onsubmit = async (ev) => {
      if (ev.submitter && ev.submitter.value === 'cancelar') return;
      ev.preventDefault();
      $('rascunhoOk').disabled = true;
      try {
        const falha = await confirmar();
        if (falha) {
          $('rascunhoErro').textContent = falha;
          $('rascunhoErro').hidden = false;
          return;
        }
        dlg.close();
      } finally {
        $('rascunhoOk').disabled = false;
      }
    };
    dlg.showModal();
    const primeiro = corpo.querySelector('input:not([type="hidden"]), select, textarea');
    if (primeiro) primeiro.focus();
  }

  /** Select de marca: sem marca + as marcas do app (e o valor atual, se for uma combinação ou cor). */
  function selectMarca(pai, valor, rotuloVazio) {
    const sel = n('select', 'rs-marca', null, pai);
    n('option', null, rotuloVazio || 'Sem marca', sel).value = '';
    const marcas = app.estado.dados.marcas;
    Object.keys(marcas).filter((c) => c !== 'NEUTRO').forEach((c) => { n('option', null, marcas[c].nome, sel).value = c; });
    if (valor && valor !== 'NEUTRO' && !marcas[valor]) n('option', null, app.nomeDaMarca(valor), sel).value = valor;
    sel.value = valor && valor !== 'NEUTRO' ? valor : '';
    app.colorirSelectMarca(sel);
    return sel;
  }

  /* ------------------------ painel da validação ----------------------------- */

  /** Seção "Ciclos em construção" no painel da validação. */
  function montarSecao(corpo) {
    if (!acesso()) return;
    const sec = n('section', 'rs-secao', null, corpo);
    if (editavel() && verComentarios) {
      botao('← Voltar à construção', 'primario rs-voltar', () => { verComentarios = false; app.desenhar(); }, sec);
    }
    const topo = n('div', 'rs-secao-topo', null, sec);
    n('h3', null, 'Ciclos em construção', topo);
    if (papel() === 'CONSTRUTOR') botao('Novo ciclo', 'primario', novoCiclo, topo);
    if (!lista.length) {
      n('p', 'val-dica', papel() === 'CONSTRUTOR'
        ? 'Monte um ciclo novo direto na planta: ele só entra na planilha, junto com os outros, depois que o validador aprovar.'
        : 'Nenhum ciclo novo aguardando aprovação.', sec);
      return;
    }
    lista.forEach((r) => {
      const item = n('div', 'rs-item' + (r.ciclo === app.estado.ciclo ? ' atual' : ''), null, sec);
      const txt = n('div', 'rs-item-txt', null, item);
      n('strong', null, r.ciclo, txt);
      n('span', null, 'por ' + r.criadoPor + (r.origem ? ' · cópia de ' + r.origem : ''), txt);
      n('span', 'rs-status ' + r.status.toLowerCase(), r.nomeStatus, item);
      if (r.ciclo !== app.estado.ciclo) botao('Abrir', '', () => abrir(r.ciclo), item);
    });
  }

  function abrir(ciclo) {
    const e = app.estado;
    e.ciclo = ciclo;
    verComentarios = false;
    selecao = '';
    app.montarCiclos();
    app.desenhar();
  }

  function novoCiclo() {
    const e = app.estado;
    let nome;
    let origem;
    let copiar;
    dialogo('Novo ciclo', 'O ciclo fica em construção (só quem entrou na validação vê) até o validador aprovar.', 'Criar', (corpo) => {
      const l1 = n('label', 'acesso-campo', 'Nome do ciclo', corpo);
      nome = n('input', null, null, l1);
      nome.type = 'text';
      nome.maxLength = 60;
      nome.required = true;
      nome.placeholder = 'Ex.: C11/2026';
      const l2 = n('label', 'acesso-campo', 'Começar de', corpo);
      origem = n('select', null, null, l2);
      n('option', null, 'Em branco (planta vazia)', origem).value = '';
      e.dados.ciclos.forEach((c) => { n('option', null, 'Cópia de ' + c, origem).value = c; });
      lista.forEach((r) => { n('option', null, 'Cópia de ' + r.ciclo + ' (em construção)', origem).value = r.ciclo; });
      // O mais comum: ajustar o ciclo anterior (o da tela ou o último da planilha).
      origem.value = e.ciclo || e.dados.ciclos[e.dados.ciclos.length - 1] || '';
      copiar = n('fieldset', 'campo bloco rs-copiar', null, corpo);
      n('legend', null, 'O que copiar', copiar);
      [['tudo', 'Tudo', 'os espaços, as Comunicações ER e os Tipos de movimento'],
        ['fixos', 'Só os movimentos fixos (🔒)', 'os espaços com cadeado e os tipos desses movimentos; o resto começa vazio']].forEach(([v, rot, sub], k) => {
        const l = n('label', 'opcao', null, copiar);
        const r = n('input', null, null, l);
        r.type = 'radio';
        r.name = 'rsCopiar';
        r.value = v;
        r.checked = !k;
        const t = n('span', null, rot + ' ', l);
        n('small', null, '— ' + sub, t);
      });
      const marcar = () => { copiar.disabled = !origem.value; };
      origem.addEventListener('change', marcar);
      marcar();
    }, async () => {
      const ciclo = nome.value.trim();
      if (!ciclo) return 'Informe o nome do ciclo.';
      try {
        const modo = (copiar.querySelector('input:checked') || {}).value || 'tudo';
        const r = await app.chamar('salvarRascunho', acesso(), { acao: 'criar', ciclo, origem: origem.value, copiar: modo });
        aplicar(r);
        abrir(ciclo);
        app.toast('Ciclo ' + ciclo + ' criado. Passo 1: confira os Tipos de movimento e o GMV de cada um.');
        return '';
      } catch (err) {
        return (err && err.message) || String(err);
      }
    });
  }

  /* --------------------------- faixa do rascunho ---------------------------- */

  /**
   * Faixa em destaque no topo (logo abaixo das marcas), sempre que o ciclo da tela é um ciclo em construção:
   * avisa que ele ainda não foi aprovado, com a mensagem de cada papel, e traz as ações do validador. O
   * construtor monta pelo painel da lateral (passos e ações); com os comentários abertos, as ações vêm aqui.
   */
  function atualizarFaixa() {
    const faixa = $('barraRascunho');
    const r = atual();
    const mostrar = !!r;
    faixa.hidden = !mostrar;
    document.body.classList.toggle('com-rascunho', mostrar);
    if (!mostrar) return;
    const construtor = papel() === 'CONSTRUTOR';
    const validador = papel() === 'VALIDADOR';
    const enviado = r.status === 'ENVIADO';
    const info = $('rascunhoInfo');
    info.innerHTML = '';
    n('span', 'rs-faixa-icone', '🚧', info).setAttribute('aria-hidden', 'true');
    n('strong', null, 'Ciclo ' + r.ciclo + ' (não publicado)', info);
    n('span', 'rs-status ' + r.status.toLowerCase(), r.nomeStatus, info);
    const msg = construtor
      ? (enviado ? 'Enviado para o validador. Você volta a editar se ele devolver.'
        : 'Você está montando este ciclo. Ele só aparece para todos depois que o validador aprovar.')
      : validador
        ? (enviado ? 'Confira as ERs e aprove ou devolva para o construtor.' : 'O construtor ainda está montando este ciclo (não foi enviado para aprovação).')
        : '';
    if (msg) n('span', 'rs-faixa-msg', msg, info);
    const acoes = $('rascunhoAcoes');
    acoes.innerHTML = '';
    if (construtor && !enviado && verComentarios) {
      botao('← Voltar à construção', 'primario', () => { verComentarios = false; app.desenhar(); }, acoes);
    } else if (validador && enviado) {
      botao('Devolver', '', () => devolver(r), acoes);
      botao('Aprovar e publicar', 'primario', () => {
        if (window.confirm('Aprovar ' + r.ciclo + '? Ele entra na planilha, junto com os outros ciclos, e fica visível para todos.')) {
          salvar({ acao: 'aprovar', ciclo: r.ciclo }, 'Ciclo ' + r.ciclo + ' aprovado e publicado.');
        }
      }, acoes);
    }
  }

  function devolver(r) {
    let motivo;
    dialogo('Devolver ' + r.ciclo, 'O ciclo volta para o construtor, com um comentário na ' + app.plantaAtual().nome + '.', 'Devolver', (corpo) => {
      const l = n('label', 'acesso-campo', 'O que precisa mudar', corpo);
      motivo = n('textarea', null, null, l);
      motivo.rows = 4;
      motivo.required = true;
    }, async () => {
      if (!motivo.value.trim()) return 'Escreva o que precisa mudar.';
      const ok = await salvar({ acao: 'devolver', ciclo: r.ciclo, planta: app.plantaAtual().id, motivo: motivo.value }, 'Ciclo devolvido ao construtor.');
      if (ok && app.recarregarComentarios) app.recarregarComentarios();
      return ok ? '' : 'Não foi possível devolver.';
    });
  }

  /* ------------------------ painel de construção --------------------------- */

  const painelVisivel = () => editavel() && !verComentarios && !!app.plantaAtual();
  const selecionado = () => (painelVisivel() ? selecao : '');

  /** Clique na planta, construindo: seleciona o móvel (ou tira a seleção, com id ''). @return {boolean} tratado */
  function aoClicarMovel(id) {
    if (!editavel()) return false;
    const m = id && app.plantaAtual().moveis.find((x) => x.id === id);
    if (m && m.tipo === 'CAIXA') return false; // o móvel de atendimento não leva cor nem etiqueta: abre a tela do móvel
    if (id && !m) return false;
    verComentarios = false;
    if (selecao === id) return true;
    selecao = id;
    app.desenhar();
    if (id) {
      const f = $('pcForm');
      if (f) f.scrollIntoView({ block: 'nearest' });
    }
    return true;
  }

  /** Formulário do móvel selecionado (refeito só quando muda o ciclo, a ER ou o móvel). */
  function montarForm(forcar) {
    const planta = app.plantaAtual();
    let m = selecao && planta.moveis.find((x) => x.id === selecao);
    if (selecao && !m) { selecao = ''; m = null; } // trocou para uma ER sem esse móvel
    const chave = app.estado.ciclo + '|' + planta.id + '|' + selecao;
    if (!forcar && chave === formChave) return;
    formChave = chave;
    const pai = $('pcForm');
    pai.innerHTML = '';
    if (!m) {
      n('h3', null, 'Móvel', pai);
      n('p', 'val-dica', 'Clique num móvel da planta para preencher os espaços dele. A planta muda na hora e tudo é salvo sozinho.', pai);
      return;
    }
    const topo = n('div', 'pc-movel', null, pai);
    const nome = n('div', null, null, topo);
    n('h3', null, m.id, nome);
    if (m.descricao && m.descricao !== m.id) n('span', null, m.descricao, nome);
    botao('Ver detalhes', 'fantasma', () => app.abrirMovel(m.id), topo).title = 'Planograma e comentários deste móvel';
    botao('✕', 'fantasma', () => aoClicarMovel(''), topo).setAttribute('aria-label', 'Tirar a seleção');
    app.blocosDoMovel(planta, m, app.estado.ciclo).forEach((b) => {
      const porEr = app.espacoPorEr(b.chave);
      if (!porEr) { blocoEspaco(pai, planta, m, b); return; }
      // Espaço que muda conforme a ER (ex.: ponta B da gôndola 1): a parte fixa e a livre, separadas. Cada
      // uma grava na ER dela (na ER aberta, quando é a parte dela; senão, na primeira ER da parte).
      const nomeEr = (id) => (app.estado.dados.plantas.find((p) => p.id === id) || { nome: id }).nome;
      // A parte que vale na ER aberta vem primeiro.
      [porEr.parte(planta.id), porEr.parte(planta.id) === porEr.fixo ? porEr.livre : porEr.fixo].forEach((parte) => {
        if (!parte.plantas.length) return;
        const alvo = parte.plantas.indexOf(planta.id) >= 0 ? planta : app.estado.dados.plantas.find((p) => p.id === parte.plantas[0]);
        const mAlvo = alvo && alvo.moveis.find((x) => x.id === m.id);
        const bAlvo = mAlvo && app.blocosDoMovel(alvo, mAlvo, app.estado.ciclo).find((x) => x.chave === b.chave);
        if (!bAlvo) return;
        // ERs em que esta linha vale (a cascata pode parar antes, ex.: a ER G define o espaço de novo).
        const ers = app.ersDaLinha(alvo.id, b.chave).map((x) => nomeEr(x.planta)).join(', ');
        blocoEspaco(pai, alvo, mAlvo, bAlvo, { parte, ers, nestaEr: alvo === planta });
      });
    });
  }

  /* ------------------------- meio de gôndola em 2 -------------------------- */

  const chaveDivisao = (ciclo, plantaId, movelId) => ciclo + '|' + plantaId + '|' + movelId;

  /** Meios que o construtor dividiu nesta gôndola ('', 'A', 'B' ou 'AB'), só no ciclo em construção da tela. */
  function meiosDivididos(ciclo, plantaId, movelId) {
    if (!editavel() || ciclo !== app.estado.ciclo) return '';
    return divididos[chaveDivisao(ciclo, plantaId, movelId)] || '';
  }

  const linhaVazia = () => ({ marca: '', simbolo: '', observacao: '', etiquetas: [] });
  const temConteudo = (i) => !!(i && (i.marca || i.simbolo || (i.observacao || '').trim() || i.etiquetas.length));
  const copiaDaLinha = (i) => ({
    marca: i.marca || '', simbolo: i.simbolo || '', observacao: i.observacao || '',
    etiquetas: i.etiquetas.map((e) => ({ texto: e.texto, marca: e.marca || '', simbolo: e.simbolo || '', data: e.data || '' })),
  });

  /** Muda um espaço na tela e agenda a gravação (linha vazia apaga a linha do espaço nesta ER). */
  function gravarEspaco(planta, chave, l) {
    aplicarLocal(app.estado.ciclo, planta.id, chave, l);
    agendar(app.estado.ciclo, planta.id, chave, l);
  }

  /**
   * Divide o meio (lado A ou B) em duas metades: o que estava no meio passa para a metade 1 e a metade 2
   * começa vazia, para outro movimento. A linha do meio inteiro (desta ER) sai.
   */
  function dividirMeio(planta, m, lado) {
    const ciclo = app.estado.ciclo;
    const daEr = (app.estado.dados.movimentos[ciclo] || {})[planta.id] || {};
    const meio = m.id + '/MEIO-' + lado;
    if (daEr[meio]) {
      const atual = copiaDaLinha(daEr[meio]);
      gravarEspaco(planta, meio + '-1', atual);
      gravarEspaco(planta, meio, linhaVazia());
    }
    const k = chaveDivisao(ciclo, planta.id, m.id);
    if ((divididos[k] || '').indexOf(lado) < 0) divididos[k] = ['A', 'B'].filter((l) => l === lado || (divididos[k] || '').indexOf(l) >= 0).join('');
    formChave = '';
    app.desenhar();
  }

  /** Junta as duas metades do meio de novo: fica o que está na metade 1 (ou, se ela estiver vazia, na 2). */
  function juntarMeio(planta, m, lado) {
    const ciclo = app.estado.ciclo;
    const daEr = (app.estado.dados.movimentos[ciclo] || {})[planta.id] || {};
    const meio = m.id + '/MEIO-' + lado;
    const blocos = app.blocosDoMovel(planta, m, ciclo);
    const metade = (n2) => (blocos.find((b) => b.chave === meio + '-' + n2) || {}).info || null;
    const m1 = metade(1);
    const m2 = metade(2);
    if (temConteudo(m1) && temConteudo(m2) && JSON.stringify(copiaDaLinha(m1)) !== JSON.stringify(copiaDaLinha(m2))
      && !window.confirm('Juntar as metades do Meio ' + lado + '? Fica o que está na metade 1; o da metade 2 sai.')) return;
    const fica = temConteudo(m1) ? m1 : temConteudo(m2) ? m2 : null;
    [meio + '-1', meio + '-2'].forEach((c) => { if (daEr[c]) gravarEspaco(planta, c, linhaVazia()); });
    if (fica) gravarEspaco(planta, meio, copiaDaLinha(fica));
    const k = chaveDivisao(ciclo, planta.id, m.id);
    divididos[k] = (divididos[k] || '').replace(lado, '');
    if (!divididos[k]) delete divididos[k];
    formChave = '';
    app.desenhar();
  }

  /**
   * Um espaço (ou o móvel inteiro) no painel: cada mudança pinta a planta na hora e é gravada sozinha.
   * As etiquetas começam com uma (ou as que o espaço já tem) e "+ Adicionar etiqueta" põe outra, até o limite.
   * @param {{titulo, chave, info, limite, propria, espaco}} b  de blocosDoMovel (App.html)
   * @param {{parte, ers, nestaEr}} [porEr]  uma parte de um espaço que muda conforme a ER (fixa ou livre):
   *   planta é a ER em que ela grava; ers, os nomes das ERs da parte; nestaEr: é a parte da ER aberta.
   */
  function blocoEspaco(pai, planta, m, b, porEr) {
    const ciclo = app.estado.ciclo;
    const i = b.info || { marca: '', etiquetas: [], simbolo: '', observacao: '' };
    const fixa = porEr && porEr.parte.tipo === 'fixo' ? porEr.parte.marca : '';
    const f = n('div', 'rs-espaco pc-espaco' + (porEr ? ' pc-parte ' + porEr.parte.tipo + (porEr.nestaEr ? ' atual' : '') : ''), null, pai);
    f.dataset.espaco = b.chave;
    if (porEr) f.dataset.parte = porEr.parte.tipo;
    const cab = n('div', 'pc-espaco-cab', null, f);
    n('h4', null, b.titulo, cab);
    // Gôndola: o meio pode ser dividido em duas metades (dois movimentos) e as metades, juntadas de novo.
    const idEsp = b.espaco ? b.espaco.id : '';
    if (m.tipo === 'GONDOLA' && /^MEIO-[AB]$/.test(idEsp)) {
      botao('Dividir em 2', 'fantasma pc-dividir', () => dividirMeio(planta, m, idEsp.slice(-1)), cab)
        .title = 'Divide este meio em duas metades, cada uma com o seu movimento';
    } else if (m.tipo === 'GONDOLA' && /^MEIO-[AB]-1$/.test(idEsp)) {
      botao('Juntar metades', 'fantasma pc-dividir', () => juntarMeio(planta, m, idEsp.slice(5, 6)), cab)
        .title = 'Volta a ser um meio só (fica o que está na metade 1)';
    }
    if (porEr) {
      const sub = n('p', 'pc-parte-ers', null, f);
      n('strong', null, (porEr.parte.tipo === 'fixo' ? 'Só na ' : 'Vale para ') + porEr.ers + '.', sub);
      sub.appendChild(document.createTextNode(porEr.parte.tipo === 'fixo'
        ? ' Espaço fixo de ' + app.nomeDaMarca(fixa) + ': só as etiquetas mudam.'
        : ' É só o que aparece nessas ERs (a parte fixa não passa para elas).'));
      if (!porEr.nestaEr) n('span', 'pc-parte-outra', 'Não aparece na ' + app.plantaAtual().nome, sub);
    }
    // Vem de outra ER (às vezes de outro espaço: o lado B da gôndola 2 da ER M é o lado A da gôndola 3 da ER G).
    const de = b.origem ? 'Vem ' + (b.origem.outro ? 'de ' + b.origem.espaco + ', na ' : 'da ') + b.origem.er : 'Vem de outra ER';
    const herdado = b.info && !b.propria
      ? n('p', 'rs-herdado', de + ' (cascata). Ao mudar, vira uma linha própria da ' + planta.nome + '.', f)
      // Espaço que a ER define de novo (não herda da ER anterior: os móveis mudaram de lugar).
      : !b.info && !b.propria && b.redefinir
        ? n('p', 'rs-herdado pc-redefinir', 'Defina de novo na ' + planta.nome + ': este espaço não vem da ' + b.redefinir + '.', f) : null;
    const linha = (rotulo) => {
      const d = n('label', 'pc-linha', null, f);
      n('span', 'mv-rotulo', rotulo, d);
      return d;
    };
    const marca = selectMarca(linha('Marca'), fixa || i.marca, 'Sem marca (branco)');
    marca.setAttribute('aria-label', 'Marca de ' + b.titulo);
    marca.disabled = !!fixa; // espaço fixo de uma marca: a marca não muda
    const simbolo = n('select', null, null, linha('Símbolo'));
    simbolo.setAttribute('aria-label', 'Símbolo de ' + b.titulo);
    n('option', null, 'Nenhum', simbolo).value = '';
    Object.keys(app.estado.dados.simbolos).filter((x) => !app.estado.dados.simbolos[x].automatico).forEach((x) => {
      const d = app.estado.dados.simbolos[x];
      n('option', null, ({ FIXO: '🔒 ', EXPOSICAO: 'Ⓔ ', NOVO: 'NEW · ' }[x] || '') + (d.descricao || x), simbolo).value = x;
    });
    simbolo.value = i.simbolo || '';
    // Etiquetas: só os movimentos cadastrados nos Tipos de movimento do ciclo (passo 1).
    const tipos = tiposDoCiclo();
    const etqs = n('div', 'rs-etiquetas pc-etiquetas', null, f);
    n('span', 'mv-rotulo', 'Etiquetas' + (b.limite > 1 ? ' (até ' + b.limite + ')' : ''), etqs);
    const listaEtq = n('div', 'pc-etq-lista', null, etqs);
    const campos = [];
    let adicionar = null;
    if (!tipos.length) {
      n('p', 'rs-herdado', 'Cadastre primeiro os movimentos do ciclo em Tipos de movimento (passo 1): as etiquetas são escolhidas entre eles.', etqs);
      botao('1. Tipos de movimento', 'primario', editarTipos, etqs);
    } else if (b.limite > 1) {
      adicionar = botao('+ Adicionar etiqueta', 'fantasma rs-add pc-add-etq', () => {
        const c = novaEtiqueta({});
        c.t.focus();
      }, etqs);
    }
    const obs = n('textarea', null, null, linha('Observação'));
    obs.rows = 2;
    obs.value = i.observacao || '';
    obs.setAttribute('aria-label', 'Observação de ' + b.titulo);
    const ler = () => ({
      marca: marca.value, simbolo: simbolo.value, observacao: obs.value,
      etiquetas: campos.filter((c) => c.t.value.trim()).map((c) => {
        const obsEtq = c.o.value.replace(/\|/g, '/').trim();
        const e = { texto: c.t.value + (obsEtq ? ' | ' + obsEtq : ''), marca: c.m.value };
        if (c.s.value) e.simbolo = c.s.value;
        if (c.s.value === 'ANTECIPADO' && c.d.value) e.data = c.d.value; // "2026-10-25"
        return e;
      }),
    });
    const mudou = (redesenhar) => {
      campos.forEach((c) => c.t.classList.toggle('fora', !!c.t.value && !tipos.some((x) => x.texto === c.t.value)));
      if (herdado) herdado.hidden = true;
      gravarEspaco(planta, b.chave, ler());
      if (redesenhar) app.desenhar();
      else montarStats();
    };
    /** Numera as etiquetas, mostra o "×" de cada uma e o "+ Adicionar etiqueta" enquanto couber outra. */
    const renumerar = () => {
      campos.forEach((c, k) => {
        c.t.setAttribute('aria-label', 'Etiqueta ' + (k + 1) + ' de ' + b.titulo);
        c.o.setAttribute('aria-label', 'Observação da etiqueta ' + (k + 1) + ' de ' + b.titulo);
        c.m.setAttribute('aria-label', 'Marca da etiqueta ' + (k + 1) + ' de ' + b.titulo);
        c.x.setAttribute('aria-label', 'Tirar a etiqueta ' + (k + 1) + ' de ' + b.titulo);
        c.s.setAttribute('aria-label', 'Símbolo da etiqueta ' + (k + 1) + ' de ' + b.titulo);
        c.d.setAttribute('aria-label', 'Data da antecipação da etiqueta ' + (k + 1) + ' de ' + b.titulo);
        c.x.hidden = campos.length === 1 && !c.t.value && !c.o.value && !c.m.value && !c.s.value;
      });
      if (adicionar) adicionar.hidden = campos.length >= b.limite;
    };
    function novaEtiqueta(e) {
      const row = n('div', 'rs-etq', null, listaEtq);
      const t = n('select', null, null, row);
      n('option', null, '— sem etiqueta —', t).value = '';
      tipos.forEach((x) => { n('option', null, x.texto + (typeof x.gmv === 'number' ? '' : ' (sem GMV)'), t).value = x.texto; });
      const atualT = e.texto ? tipos.find((x) => x.chave === chaveEtq(e.texto)) : null;
      const movimento = Render.movimentoDaEtiqueta(e.texto);
      if (e.texto && !atualT) {
        // Veio de uma cópia ou o tipo saiu da lista: aparece marcado, para trocar ou cadastrar nos tipos.
        const op = n('option', null, movimento + ' — fora dos tipos de movimento', t);
        op.value = movimento;
        t.classList.add('fora');
      }
      t.value = atualT ? atualT.texto : movimento;
      // Observação da etiqueta: aparece na planta depois de um "|", mas não muda o movimento nem as contas.
      const o = n('input', 'rs-etq-obs', null, row);
      o.type = 'text';
      o.maxLength = 120;
      o.placeholder = '| observação (opcional)';
      o.title = 'Aparece na planta depois de um "|" (ex.: ' + (movimento || 'LÇTO EGEO') + ' | só no kit). Não entra nas contas.';
      o.value = Render.obsDaEtiqueta(e.texto);
      const mc = selectMarca(row, e.marca, 'Cor da marca do espaço');
      // Símbolo próprio da etiqueta (aparece ao lado dela); com a antecipação (⏩), a data em que entra.
      const sl = n('div', 'pc-etq-simbolo', null, row);
      const se = n('select', 'rs-etq-simbolo', null, sl);
      n('option', null, 'Sem símbolo', se).value = '';
      Object.keys(app.estado.dados.simbolos).forEach((x) => {
        const d = app.estado.dados.simbolos[x];
        n('option', null, ({ FIXO: '🔒 ', EXPOSICAO: 'Ⓔ ', NOVO: 'NEW · ', ANTECIPADO: '⏩ ' }[x] || '') + (x === 'ANTECIPADO' ? 'Antecipação' : d.descricao || x), se).value = x;
      });
      se.value = e.simbolo || '';
      const de = n('input', 'rs-etq-data', null, sl);
      de.type = 'date';
      de.value = e.data || '';
      de.title = 'Data em que a antecipação entra';
      const mostrarData = () => {
        de.hidden = se.value !== 'ANTECIPADO';
        de.required = !de.hidden;
      };
      mostrarData();
      se.addEventListener('change', () => {
        mostrarData();
        if (!de.hidden && !de.value) de.focus(); // escolheu a antecipação: em seguida, a data
      });
      const c = { row, t, o, m: mc, s: se, d: de };
      c.x = botao('×', 'fantasma pc-tirar-etq', () => {
        if (campos.length > 1) {
          row.remove();
          campos.splice(campos.indexOf(c), 1);
        } else {
          [t, o, mc, se, de].forEach((el) => { el.value = ''; });
          mc.dispatchEvent(new Event('input')); // tira a cor do select
          mostrarData();
        }
        renumerar();
        mudou(true);
      }, row);
      [t, mc, o, se, de].forEach((el) => el.addEventListener('change', () => { renumerar(); mudou(true); }));
      campos.push(c);
      renumerar();
      return c;
    }
    if (tipos.length) {
      const atuais = i.etiquetas.slice(0, b.limite);
      (atuais.length ? atuais : [{}]).forEach((e) => novaEtiqueta(e));
    }
    [marca, simbolo].forEach((el) => el.addEventListener('change', () => mudou(true)));
    obs.addEventListener('input', () => mudou(false));
    const acoes = n('div', 'val-acoes', null, f);
    botao('Limpar espaço', 'fantasma', () => {
      [fixa ? null : marca, simbolo, obs].filter(Boolean).forEach((el) => { el.value = ''; }); // a marca fixa fica
      marca.dispatchEvent(new Event('input'));
      campos.splice(1).forEach((c) => c.row.remove());
      campos.forEach((c) => {
        [c.t, c.o, c.m, c.s, c.d].forEach((el) => { el.value = ''; });
        c.m.dispatchEvent(new Event('input'));
        c.s.dispatchEvent(new Event('change'));
      });
      renumerar();
      mudou(true);
    }, acoes);
  }

  /** Barra 100% (espaço por marca / classificação), com a legenda em %. */
  function barra100(pai, itens) {
    const total = itens.reduce((s, x) => s + x.valor, 0);
    if (!total) { n('p', 'mv-vazio', 'Nenhum espaço preenchido.', pai); return; }
    const barra = n('div', 'an-barra pc-barra', null, pai);
    const leg = n('div', 'an-legenda pc-legenda', null, pai);
    itens.forEach((x) => {
      const pct = Math.round((x.valor / total) * 100);
      const seg = n('span', 'an-seg', null, barra);
      seg.style.width = (x.valor / total) * 100 + '%';
      seg.style.background = x.cor;
      seg.title = x.nome + ': ' + pct + '%';
      const l = n('span', null, null, leg);
      n('i', null, null, l).style.background = x.cor;
      l.appendChild(document.createTextNode(x.nome + ' ' + pct + '%'));
    });
  }

  const pct = (v) => Math.round(v * 100) + '%';

  /** Números da ER da tela, recalculados a cada mudança. */
  function montarStats() {
    const pai = $('pcStats');
    if (!pai || !painelVisivel()) return;
    const planta = app.plantaAtual();
    const st = app.estatisticas(planta, app.estado.ciclo);
    const p = passos();
    pai.innerHTML = '';
    n('h3', null, 'Números da ' + planta.nome, pai);

    // Progresso e alertas.
    const prog = n('div', 'pc-bloco', null, pai);
    const fr = st.total ? st.preenchidos / st.total : 0;
    const t = n('div', 'pc-prog-texto', null, prog);
    n('strong', null, (Math.round(st.preenchidos * 10) / 10).toLocaleString('pt-BR') + ' de ' + st.total.toLocaleString('pt-BR'), t);
    t.appendChild(document.createTextNode(' espaços de exposição preenchidos (' + pct(fr) + ')'));
    const barra = n('div', 'pc-progresso', null, prog);
    n('i', null, null, barra).style.width = pct(fr);
    const alertas = n('ul', 'pc-alertas', null, prog);
    const alerta = (classe, texto, acao, rotulo) => {
      const li = n('li', classe, null, alertas);
      n('span', null, texto, li);
      if (acao) botao(rotulo, 'fantasma', acao, li);
    };
    if (p.fora.length) alerta('erro', p.fora.length + ' movimento(s) fora dos tipos: ' + p.fora.slice(0, 3).join(', ') + (p.fora.length > 3 ? '…' : ''), editarTipos, 'Cadastrar');
    if (p.semGmv) alerta('aviso', p.semGmv + ' movimento(s) sem GMV: ' + p.nomesSemGmv.slice(0, 3).join(', ') + (p.semGmv > 3 ? '…' : ''), editarTipos, 'Completar');
    if (p.semEspaco.length) alerta('info', 'Ainda sem espaço no ciclo: ' + p.semEspaco.slice(0, 4).join(', ') + (p.semEspaco.length > 4 ? '…' : ''));
    if (!p.fora.length && !p.semGmv && !p.semEspaco.length && !st.vazios.length) alerta('ok', 'Tudo preenchido nesta ER.');
    if (st.vazios.length) {
      const det = n('details', 'pc-vazios', null, prog);
      n('summary', null, 'Espaços vazios (' + st.vazios.length + ')', det);
      const ul = n('ul', null, null, det);
      st.vazios.forEach((v) => botao(v.nome, 'fantasma', () => aoClicarMovel(v.id), n('li', null, null, ul)));
    }

    // Espaço por marca e por classificação.
    const b1 = n('div', 'pc-bloco', null, pai);
    n('h4', null, 'Espaço por marca', b1);
    barra100(b1, st.marcas);
    const b2 = n('div', 'pc-bloco', null, pai);
    n('h4', null, 'Espaço por classificação', b2);
    barra100(b2, st.classes);

    // GMV × espaço.
    const b3 = n('div', 'pc-bloco', null, pai);
    n('h4', null, 'GMV esperado × espaço', b3);
    n('p', 'pc-sub', 'Fatia do GMV e fatia do espaço de cada movimento nesta ER. Índice acima de 1× rende mais que o espaço que ocupa.', b3);
    if (!st.gmv.length) n('p', 'mv-vazio', 'Nenhum movimento nos espaços ainda.', b3);
    st.gmv.forEach((g) => {
      const l = n('div', 'pc-gmv', null, b3);
      n('span', 'pc-gmv-nome', g.texto, l).title = g.texto;
      const barras = n('div', 'pc-gmv-barras', null, l);
      const trilho = (classe, v, rot) => {
        const tr = n('div', 'pc-gmv-trilho', null, barras);
        const i = n('i', classe, null, tr);
        i.style.width = Math.max(1, v * 100) + '%';
        if (classe === 'gmv') i.style.background = g.cor;
        n('small', null, rot + ' ' + pct(v), tr);
      };
      trilho('esp', g.espaco, 'espaço');
      trilho('gmv', g.gmv, g.semGmv ? 'GMV (falta)' : 'GMV');
      const ind = n('span', 'an-indice pc-indice' + (g.semGmv ? '' : g.indice >= 1.2 ? ' alto' : g.indice <= 0.8 ? ' baixo' : ''),
        g.semGmv ? '—' : g.indice.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '×', l);
      ind.title = g.semGmv ? 'Sem GMV em Tipos de movimento' : g.indice >= 1.2 ? 'Rende mais que o espaço que ocupa' : g.indice <= 0.8 ? 'Rende menos que o espaço que ocupa' : 'Proporcional ao espaço';
    });
  }

  /** Mostra / esconde o painel e atualiza o topo e os números (o formulário só quando muda o móvel). */
  function atualizarPainel() {
    const painel = $('painelConstrucao');
    if (!painel) return;
    const visivel = painelVisivel();
    painel.hidden = !visivel;
    document.body.classList.toggle('com-painel-construcao', visivel);
    if (!visivel) { formChave = ''; return; }
    montarTopo();
    montarForm(false);
    montarStats();
  }

  /* ----------------------- Comunicações ER (Painéis) ------------------------ */

  /** Edita os textos de Comunicações ER da ER da tela (todas as seções; viram linhas próprias desta ER). */
  function editarPaineis() {
    const planta = app.plantaAtual();
    const ciclo = app.estado.ciclo;
    const secoes = app.estado.dados.secoes;
    const atuais = app.paineisDe(ciclo, planta.id);
    const grupos = {};
    dialogo('Comunicações ER · ' + planta.nome, 'TV e rádio, (A), (C), destaques e notas desta ER no ciclo ' + ciclo + '.', 'Salvar', (corpo) => {
      Object.keys(secoes).forEach((s) => {
        const sec = n('fieldset', 'rs-painel', null, corpo);
        n('legend', null, { TV: 'TV e rádio', A: '(A)', C: '(C)', CALLOUT: 'Destaques', NOTA: 'Notas' }[s] || s, sec);
        n('p', 'val-dica', secoes[s].descricao, sec);
        const box = n('div', 'rs-painel-linhas', null, sec);
        grupos[s] = box;
        const novaLinha = (p) => {
          const row = n('div', 'rs-painel-linha', null, box);
          const t = n('textarea', null, null, row);
          t.rows = 1;
          t.value = (p && p.texto) || '';
          t.placeholder = 'Texto';
          t.setAttribute('aria-label', 'Texto (' + s + ')');
          const m = selectMarca(row, p && p.marca);
          m.setAttribute('aria-label', 'Marca (' + s + ')');
          if (s === 'CALLOUT') {
            const alvo = n('select', 'rs-alvo', null, row);
            alvo.setAttribute('aria-label', 'Aponta para o móvel');
            n('option', null, 'Geral (sem móvel)', alvo).value = '';
            planta.moveis.filter((x) => x.tipo !== 'CAIXA').slice()
              .sort((a, b) => a.id.localeCompare(b.id, 'pt-BR', { numeric: true }))
              .forEach((x) => { n('option', null, x.descricao && x.descricao !== x.id ? x.id + ' · ' + x.descricao : x.id, alvo).value = x.id; });
            alvo.value = (p && p.movel) || '';
          }
          const x = botao('×', 'fantasma', () => row.remove(), row);
          x.setAttribute('aria-label', 'Remover');
        };
        (atuais[s] || []).forEach(novaLinha);
        botao('+ Adicionar', 'fantasma rs-add', () => { novaLinha(null); box.lastChild.querySelector('textarea').focus(); }, sec);
      });
    }, async () => {
      const linhas = [];
      Object.keys(grupos).forEach((s) => grupos[s].querySelectorAll('.rs-painel-linha').forEach((row) => {
        const texto = row.querySelector('textarea').value.trim();
        if (!texto) return;
        const alvo = row.querySelector('.rs-alvo');
        linhas.push({ secao: s, texto, marca: row.querySelector('.rs-marca').value, movel: alvo ? alvo.value : '' });
      }));
      const ok = await salvar({ acao: 'salvarPaineis', ciclo, planta: planta.id, linhas }, 'Comunicações da ' + planta.nome + ' salvas.');
      return ok ? '' : 'Não foi possível salvar.';
    });
  }

  /* -------------------------- Tipos de movimento ---------------------------- */

  /**
   * Passo 1: os movimentos que o ciclo pode usar, com classificação, GMV esperado e observação. Os
   * espaços só recebem etiquetas desta lista. Movimentos usados nos espaços que não estão na lista
   * aparecem marcados, para cadastrar.
   */
  function editarTipos() {
    const e = app.estado;
    const ciclo = e.ciclo;
    const lista = tiposDoCiclo();
    const p = passos();
    const linhas = [];
    let tabela;
    const novaLinha = (t, fixo) => {
      const nome = n(fixo ? 'strong' : 'input', 'rs-tipos-nome', fixo ? t.texto : null, tabela);
      if (!fixo) {
        nome.type = 'text';
        nome.maxLength = 200;
        nome.placeholder = 'Nome do movimento (como na etiqueta)';
        nome.value = (t && t.texto) || '';
        nome.setAttribute('aria-label', 'Nome do movimento novo');
      }
      const rotulo = () => (fixo ? t.texto : nome.value || 'movimento novo');
      const cl = n('select', null, null, tabela);
      cl.setAttribute('aria-label', 'Classificação de ' + rotulo());
      n('option', null, '—', cl).value = '';
      Object.keys(e.dados.classificacoes).forEach((c) => { n('option', null, e.dados.classificacoes[c].nome, cl).value = c; });
      if (t && t.classificacao && !e.dados.classificacoes[t.classificacao]) n('option', null, t.classificacao, cl).value = t.classificacao;
      cl.value = (t && t.classificacao) || '';
      const gmv = n('input', null, null, tabela);
      gmv.type = 'text';
      gmv.inputMode = 'decimal';
      gmv.placeholder = 'Ex.: 1,5 mi';
      gmv.value = t && typeof t.gmv === 'number' ? String(t.gmv).replace('.', ',') : '';
      gmv.setAttribute('aria-label', 'GMV esperado de ' + rotulo());
      const marcarGmv = () => gmv.classList.toggle('falta', !gmv.value.trim());
      gmv.addEventListener('input', marcarGmv);
      marcarGmv();
      const obs = n('input', null, null, tabela);
      obs.type = 'text';
      obs.value = (t && t.observacao) || '';
      obs.setAttribute('aria-label', 'Observação de ' + rotulo());
      const linha = { nome, fixo, texto: fixo ? t.texto : null, cl, gmv, obs, elementos: [nome, cl, gmv, obs] };
      const x = botao('×', 'fantasma', () => {
        linha.elementos.concat([x]).forEach((el) => el.remove());
        linhas.splice(linhas.indexOf(linha), 1);
      }, tabela);
      x.setAttribute('aria-label', 'Tirar ' + rotulo() + ' dos tipos');
      linhas.push(linha);
      return linha;
    };
    dialogo('Passo 1 · Tipos de movimento · ' + ciclo,
      'Cadastre os movimentos do ciclo, com a classificação e o GMV esperado. Nos móveis, as etiquetas são escolhidas só entre estes movimentos. O GMV é obrigatório para enviar.',
      'Salvar', (corpo) => {
        tabela = n('div', 'rs-tipos', null, corpo);
        ['Movimento', 'Classificação', 'GMV esperado (R$)', 'Observação', ''].forEach((t) => n('span', 'rs-tipos-cab', t, tabela));
        lista.forEach((t) => novaLinha(t, true));
        // Movimentos usados nos espaços que não estão nos tipos (ex.: tirados da lista): já entram para cadastrar.
        p.fora.forEach((texto) => novaLinha({ texto }, true));
        botao('+ Adicionar movimento', 'fantasma rs-add', () => novaLinha(null, false).nome.focus(), corpo);
        if (!lista.length && !p.fora.length) novaLinha(null, false);
      }, async () => {
        const vistos = {};
        const enviar = [];
        for (const l of linhas) {
          const texto = l.fixo ? l.texto : l.nome.value.trim();
          if (!texto) continue;
          if (vistos[chaveEtq(texto)]) return 'O movimento "' + texto + '" aparece duas vezes.';
          vistos[chaveEtq(texto)] = true;
          enviar.push({ etiqueta: texto, classificacao: l.cl.value, gmv: l.gmv.value, observacao: l.obs.value });
        }
        const ok = await salvar({ acao: 'salvarTipos', ciclo, linhas: enviar }, 'Tipos de movimento salvos.');
        return ok ? '' : 'Não foi possível salvar.';
      });
  }

  /* -------------------------------- início --------------------------------- */

  function iniciar(contexto) {
    app = contexto;
    // Esc tira a seleção do móvel (fora dos diálogos e dos campos).
    document.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Escape' || !selecao || !painelVisivel() || document.querySelector('dialog[open]')) return;
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
      aoClicarMovel('');
    });
    // Fechar a página com alteração ainda não gravada: o navegador pergunta antes.
    window.addEventListener('beforeunload', (ev) => {
      if (!Object.keys(pendentes).length && !gravando) return;
      esvaziar();
      ev.preventDefault();
      ev.returnValue = '';
    });
  }

  /** Chamado depois de cada desenho da planta. */
  function atualizar() {
    atualizarFaixa();
    atualizarPainel();
  }

  return {
    iniciar, atualizar, recarregar, limpar, mesclar, montarSecao, editarPaineis, editavel, painelVisivel,
    selecionado, aoClicarMovel, esvaziarTudo, lista: () => lista, tem: (ciclo) => !!doCiclo(ciclo), meiosDivididos,
  };
})();
</script>
