<script>
/**
 * ============================================================================
 *  CONSTRUIR LOJA (editor visual do layout das plantas)
 * ============================================================================
 *  - Ao abrir, a planta começa VAZIA (só os itens "Extra" ficam); o botão
 *    "Carregar móveis salvos" traz de volta o layout gravado. Fechar sem salvar
 *    não apaga nada.
 *  - Paleta "Adicionar móvel" (Gôndola, Pirâmide, Móvel de fila, Móvel de parede,
 *    Totem, PDV móvel, Mesa destaque, Mesa destaque 3 frentes, Balcão recepção): um clique
 *    cria o móvel no centro da loja.
 *  - Clicar num móvel seleciona; arrastar move (Alt = movimento fino);
 *    clicar no piso vazio desmarca.
 *  - Barra flutuante sobre o selecionado: Girar · Duplicar · Excluir.
 *  - Atalhos: setas movem, Delete exclui, Ctrl+Z desfaz, Ctrl+D duplica,
 *    R gira, Esc desmarca.
 *  - Cada mudança é gravada sozinha na aba Layout (um instante depois; pode estar numa
 *    planilha separada, veja Code.gs). "Salvar como…" cria uma planta nova ou substitui outra.
 */
const Construtor = (() => {
  const COS30 = Math.cos(Math.PI / 6);
  const MAX_HISTORICO = 80;

  /** Móveis oferecidos: nome (também é a base do ID: "Gôndola" → GONDOLA 1), tamanho padrão [largura, fundo, altura] e ícone. */
  const TIPOS = {
    GONDOLA: {
      nome: 'Gôndola', tam: [4, 1.6, 1.94],
      icone: 'M2 8h20v9H2zM5 8v9M19 8v9M5 12.5h14M2 20h20',
    },
    PIRAMIDE: {
      nome: 'Pirâmide', tam: [1.02, 1.02, 1.94],
      icone: 'M7 21V3h10v18zM7 7.5h10M7 12h10M7 16.5h10',
    },
    FILA: {
      nome: 'Móvel de fila', tam: [1.5, 0.4, 1.46],
      icone: 'M2 8h20v12H2zM2 11h20M2 14h20M2 17h20',
    },
    GONDOLA_PAREDE: {
      nome: 'Móvel de parede', tam: [4, 1.1, 3.2],
      icone: 'M3 21V3h18v18M3 8h18M3 13h18M3 18h18M10 3v18M17 3v18',
    },
    TOTEM: {
      nome: 'Totem', tam: [1.5, 0.35, 3.4],
      icone: 'M7 3v17M17 3v17M7 3h10M5 21h14M7 7h10v3H7zM7 12h10v3H7zM9 17h6',
    },
    CUBO: {
      nome: 'PDV móvel', tam: [1.3, 1.3, 1.44],
      icone: 'M5 8l7-4 7 4v9l-7 4-7-4zM5 8l7 4 7-4M12 12v9M4 19l8 4 8-4',
    },
    MESA: {
      nome: 'Mesa destaque', tam: [2.6, 1.4, 2.6],
      icone: 'M4 3h7v9H4zM13 3h7v9h-7zM3 12h18v3H3zM5 15v6M19 15v6M7.5 15h3v6h-3zM13.5 15h3v6h-3z',
    },
    MESA_3: {
      nome: 'Mesa destaque 3 frentes', tam: [3.9, 1.4, 2.6],
      icone: 'M2 3h6v9H2zM9 3h6v9H9zM16 3h6v9h-6zM1 12h22v3H1zM3 15v6M21 15v6',
    },
    VITRINE_L: {
      nome: 'Balcão recepção', tam: [2.4, 2.4, 1.28],
      icone: 'M14 3h6v18H4v-6h10z',
    },
    CAIXA: {
      nome: 'Móvel de atendimento', tam: [1.8, 1.2, 1.7],
      icone: 'M3 12h18v9H3zM9 4h6v5H9zM12 9v3',
    },
    PAINEL: {
      nome: 'Parede O.U.i', tam: [3.6, 0.9, 5],
      icone: 'M3 3h18v18H3zM6 6h12v12H6z',
    },
    EXPOSITOR_OUI: {
      nome: 'Totem O.U.i', tam: [0.8, 0.8, 1.94],
      icone: 'M8 6h8v14H8zM10 9h4v8h-4zM6 21h12',
    },
    ILHA_OUI: {
      nome: 'Ilha premium O.U.i', tam: [3, 1.6, 3],
      icone: 'M2 13h20v8H2zM2 17h20M4 3h16v10M6 4v8M18 4v8',
    },
    MAKE: {
      nome: 'Móvel make', tam: [6, 1.4, 3.2],
      icone: 'M3 2h4v4H3zM8 2h4v4H8zM13 2h4v4h-4zM18 2h3v4h-3zM3 6v15M21 6v15M3 10h18M3 14h18M3 18h18M3 21h18',
    },
  };

  const c = {
    ativo: false,
    planta: null, // cópia editável da planta
    nova: false, // planta criada aqui e ainda não salva
    selecionado: '',
    historico: [], // fotos (JSON) antes de cada alteração — para desfazer
    grade: true,
    mostrarCiclo: false, // na construção os móveis ficam sem cor e sem etiqueta
    passo: 0.5,
    referencias: {}, // planta → {src, opacidade, zoom, dx, dy}
    escala: 1,
    quadro: 0,
    // Salvamento automático: cada mudança sobe a versão; ela vai para a aba Layout um instante depois.
    versao: 0, // mudanças feitas nesta planta desde que ela abriu no editor
    versaoSalva: 0, // até qual versão já foi gravada
    sessao: 0, // muda a cada planta carregada (uma gravação antiga não marca a planta nova como salva)
    timer: 0,
    salvando: false,
    repetir: false,
    erroSalvar: '',
    arrastando: false,
    inicial: null, // a planta como estava ao abrir no editor (para "Desfazer tudo")
  };
  let app = null;
  const $ = (id) => document.getElementById(id);
  const clonar = (o) => JSON.parse(JSON.stringify(o));
  const arred = (v) => Math.round(v * 100) / 100;
  /** Nome da planta (mesma regra de nomePlanta_ no Code.gs). */
  const nomePlanta = (id) => (app.estado.dados.config.nomesPlantas || {})[id] || 'PLANTA ' + id;
  const nomeTipo = (t) => (TIPOS[t] ? TIPOS[t].nome : t.charAt(0) + t.slice(1).toLowerCase().replace(/_/g, ' '));
  /** Há mudanças que ainda não estão na planilha (ou a planta nova ainda não tem nome)? */
  const sujo = () => c.nova || c.versao !== c.versaoSalva;

  /* ------------------------------ estado ---------------------------------- */

  function contexto() {
    if (!c.ativo || !c.planta) return null;
    return {
      planta: c.planta, selecionado: c.selecionado, grade: c.grade, mostrarCiclo: c.mostrarCiclo,
      referencia: c.referencias[c.planta.id] || null,
    };
  }

  function aposDesenhar(r) {
    if (r && r.escala) c.escala = r.escala;
    posicionarBarra();
    ajustarAltura();
  }

  /** O menu lateral vai do topo dele até o fim da tela, para o rodapé (status e botões) ficar sempre à vista. */
  function ajustarAltura() {
    const painel = $('painelConstrutor');
    if (!c.ativo || painel.hidden) return;
    if (window.matchMedia('(max-width: 1100px)').matches) { painel.style.maxHeight = ''; return; }
    const topo = Math.max(0, painel.getBoundingClientRect().top);
    painel.style.maxHeight = Math.max(320, window.innerHeight - topo - 12) + 'px';
  }

  const movelSelecionado = () => (c.planta ? c.planta.moveis.find((m) => m.id === c.selecionado) : null);

  /** Guarda uma foto do estado ANTES de alterar (para o Desfazer). */
  function registrar() {
    c.historico.push(JSON.stringify({ planta: c.planta, selecionado: c.selecionado }));
    if (c.historico.length > MAX_HISTORICO) c.historico.shift();
    mudou();
  }

  /* -------------------------- salvamento automático ------------------------ */

  const ESPERA_SALVAR = 1200; // ms depois da última mudança

  /** Marca uma mudança (a alteração em si acontece logo depois, no mesmo passo) e agenda a gravação. */
  function mudou() {
    c.versao++;
    agendarSalvar(ESPERA_SALVAR);
    atualizarStatus();
  }

  function agendarSalvar(ms) {
    clearTimeout(c.timer);
    c.timer = setTimeout(salvarAuto, ms);
  }

  /**
   * Grava a planta da tela na aba Layout (salvarLayout), uma gravação por vez. A planta nova só é gravada
   * depois de ganhar um nome (Salvar como…). A planta salva também é atualizada nos dados do app.
   */
  async function salvarAuto() {
    clearTimeout(c.timer);
    c.timer = 0;
    if (!c.ativo || !c.planta || c.nova || c.versao === c.versaoSalva) return;
    if (c.arrastando) { agendarSalvar(400); return; }
    if (c.salvando) { c.repetir = true; return; }
    const sessao = c.sessao;
    const versao = c.versao;
    const planta = clonar(c.planta);
    c.salvando = true;
    c.erroSalvar = '';
    atualizarStatus();
    try {
      await app.chamar('salvarLayout', app.acesso(), planta.id, layoutDe(planta));
      if (sessao === c.sessao) c.versaoSalva = Math.max(c.versaoSalva, versao);
      const lista = app.estado.dados.plantas;
      const i = lista.findIndex((p) => p.id === planta.id);
      if (i >= 0) lista[i] = Object.assign({}, lista[i], { loja: planta.loja, moveis: planta.moveis });
    } catch (e) {
      if (sessao === c.sessao) c.erroSalvar = (e && e.message) || String(e);
    } finally {
      c.salvando = false;
      if (c.repetir || (sessao === c.sessao && c.versao !== c.versaoSalva && !c.erroSalvar)) {
        c.repetir = false;
        agendarSalvar(200);
      }
      atualizarStatus();
    }
  }

  /** Grava já o que estiver pendente (ao fechar o editor ou trocar de planta). */
  function salvarPendente() {
    if (c.timer || (c.versao !== c.versaoSalva && !c.salvando)) salvarAuto();
  }

  function desfazer() {
    const foto = c.historico.pop();
    if (!foto) return;
    const o = JSON.parse(foto);
    c.planta = o.planta;
    c.selecionado = o.selecionado;
    mudou();
    preencherTudo();
    app.desenhar();
  }

  function redesenhar() {
    cancelAnimationFrame(c.quadro);
    c.quadro = requestAnimationFrame(() => app.desenhar());
  }

  /**
   * Pode trocar de planta / sair? O que está pendente é gravado na hora; só pergunta se a gravação falhou
   * ou se a planta nova ainda não foi criada (sem nome).
   */
  function podeSair() {
    if (!c.ativo) return true;
    if (c.nova) return window.confirm('A planta nova ainda não foi criada (use Salvar como… para dar o nome). Descartar?');
    if (c.erroSalvar && c.versao !== c.versaoSalva) return window.confirm('As últimas mudanças não foram salvas (' + c.erroSalvar + '). Sair mesmo assim?');
    salvarPendente();
    return true;
  }

  /** Itens fora da planta (Cestinhas etc.) não são apagados ao começar vazio. */
  const ehExtra = (m) => m.tipo === 'EXTRA';

  /**
   * Carrega a planta no editor. vazia = true começa sem móveis (o layout salvo é substituído
   * na primeira mudança, pelo salvamento automático).
   */
  function carregarPlanta(planta, vazia) {
    c.planta = clonar(planta);
    c.inicial = clonar(planta);
    c.sessao++;
    c.versao = 0;
    c.versaoSalva = 0;
    c.erroSalvar = '';
    clearTimeout(c.timer);
    c.timer = 0;
    c.salvos = planta.moveis.filter((m) => !ehExtra(m)).length;
    c.vazia = !!vazia;
    if (c.vazia) c.planta.moveis = c.planta.moveis.filter(ehExtra);
    c.nova = false;
    c.historico = [];
    if (!c.planta.moveis.some((m) => m.id === c.selecionado)) c.selecionado = '';
    lerReferencia(c.planta.id);
    preencherTudo();
  }

  /** Chamado pelo App depois de recarregar os dados ou trocar de planta. */
  function sincronizar(planta) {
    if (!c.ativo || !planta) return;
    if (c.planta.id !== planta.id) carregarPlanta(planta, false); // trocou de planta: abre o modelo dela
    else if (!sujo()) carregarPlanta(planta, c.vazia);
  }

  /** Traz de volta os móveis salvos desta planta (pode desfazer). */
  function carregarSalvos() {
    const salva = app.estado.dados.plantas.find((p) => p.id === c.planta.id);
    if (!salva) return;
    registrar();
    c.planta.loja = clonar(salva.loja);
    c.planta.moveis = clonar(salva.moveis);
    c.vazia = false;
    c.selecionado = '';
    preencherTudo();
    app.desenhar();
  }

  /* ------------------------------ abrir/fechar ---------------------------- */

  function abrir() {
    const planta = app.plantaAtual();
    if (!planta) return;
    c.ativo = true;
    c.selecionado = '';
    carregarPlanta(planta, false); // abre com o modelo atual da planta, pronto para editar
    document.body.classList.add('construindo');
    $('painelConstrutor').hidden = false;
    $('btnConstruir').setAttribute('aria-pressed', 'true');
    app.desenhar();
    ajustarAltura();
  }

  function fechar() {
    if (!podeSair()) return;
    salvarPendente();
    c.ativo = false;
    c.historico = [];
    c.nova = false;
    document.body.classList.remove('construindo');
    $('painelConstrutor').hidden = true;
    $('cnsFlutuante').hidden = true;
    $('btnConstruir').setAttribute('aria-pressed', 'false');
    app.desenhar();
  }

  /* ------------------------------ painel ---------------------------------- */

  function preencherTudo() {
    const p = c.planta;
    $('cnsPlanta').textContent = p.nome + (c.nova ? ' · nova' : '');
    $('cnsLargura').value = p.loja.largura;
    $('cnsProfundidade').value = p.loja.profundidade;
    $('cnsAltura').value = p.loja.alturaParede;
    const ref = c.referencias[p.id];
    $('cnsOpacidade').value = Math.round((ref ? ref.opacidade : 0.45) * 100);
    $('cnsTirarImagem').disabled = !ref;
    $('cnsRefZoom').value = Math.round(((ref && ref.zoom) || 1) * 100);
    $('cnsRefX').value = (ref && ref.dx) || 0;
    $('cnsRefY').value = (ref && ref.dy) || 0;
    const temSalvos = c.vazia && c.salvos > 0;
    $('cnsSalvos').hidden = !temSalvos;
    if (temSalvos) $('cnsQtdSalvos').textContent = c.salvos;
    preencherLista();
    preencherFormulario();
    atualizarStatus();
  }

  function preencherLista() {
    const sel = $('cnsLista');
    sel.textContent = '';
    c.planta.moveis.forEach((m) => {
      const texto = (m.descricao || nomeTipo(m.tipo)) + ' · ' + m.id + (m.tipo === 'EXTRA' ? ' (fora da planta)' : '');
      sel.appendChild(new Option(texto, m.id, false, m.id === c.selecionado));
    });
    $('cnsQtd').textContent = '(' + c.planta.moveis.length + ')';
  }

  function preencherFormulario() {
    const m = movelSelecionado();
    $('cnsVazio').hidden = !!m;
    $('cnsCampos').hidden = !m;
    if (!m) return;
    $('cnsId').value = m.id;
    $('cnsDescricao').value = m.descricao || '';
    // Tipos antigos (layout padrão) continuam aparecendo só para o móvel que os usa.
    const selTipo = $('cnsTipo');
    selTipo.textContent = '';
    Object.keys(TIPOS).forEach((t) => selTipo.appendChild(new Option(TIPOS[t].nome, t)));
    if (!TIPOS[m.tipo]) selTipo.appendChild(new Option('Antigo: ' + nomeTipo(m.tipo), m.tipo));
    selTipo.value = m.tipo;
    const gondola = m.tipo === 'GONDOLA';
    $('cnsDivisao').hidden = !gondola;
    if (gondola) {
      const div = m.dividido || '';
      $('cnsDividirA').checked = div.indexOf('A') >= 0;
      $('cnsDividirB').checked = div.indexOf('B') >= 0;
      $('cnsEspacos').textContent = Render.espacos(m).map((e) => m.id + '/' + e.id).join('  ·  ');
    }
    ['x', 'y', 'z', 'w', 'd', 'h'].forEach((k) => { $('cnsForm').querySelector('[data-campo="' + k + '"]').value = m[k]; });
  }

  function atualizarStatus() {
    const st = $('cnsStatus');
    let texto;
    let classe = '';
    if (c.nova) { texto = '● Planta nova: use Salvar como… para dar o nome (depois, ela salva sozinha)'; classe = 'sujo'; }
    else if (c.erroSalvar) { texto = '⚠ Não salvou: ' + c.erroSalvar + ' (clique para tentar de novo)'; classe = 'erro'; }
    else if (c.salvando) { texto = '↻ Salvando na planilha…'; classe = 'salvando'; }
    else if (sujo()) { texto = '● Mudanças a salvar…'; classe = 'sujo'; }
    else texto = c.versao ? '✓ Salvo na planilha' : '✓ Tudo salvo (salva sozinho a cada mudança)';
    st.textContent = texto;
    st.className = classe;
    $('cnsDescartar').disabled = !c.historico.length;
    $('cnsDesfazer').disabled = !c.historico.length;
  }

  function selecionar(id) {
    c.selecionado = id || '';
    if (!c.selecionado) $('cnsFlutuante').hidden = true;
    $('cnsLista').value = c.selecionado;
    preencherFormulario();
    redesenhar();
  }

  /** Barra flutuante (Girar / Duplicar / Excluir) acima do móvel selecionado. */
  function posicionarBarra() {
    const barra = $('cnsFlutuante');
    const m = movelSelecionado();
    const partes = m ? Array.from(document.querySelectorAll('#slide g.movel.selecionado')) : [];
    if (!c.ativo || !partes.length) { barra.hidden = true; return; }
    const r = partes.map((g) => g.getBoundingClientRect()).reduce((a, b) => ({
      left: Math.min(a.left, b.left), right: Math.max(a.right, b.right), top: Math.min(a.top, b.top),
    }));
    const base = $('palco').getBoundingClientRect();
    barra.hidden = false;
    barra.style.left = (r.left + r.right) / 2 - base.left + 'px';
    barra.style.top = Math.max(r.top - base.top - 8, 40) + 'px';
  }

  /* ------------------------------ ações ----------------------------------- */

  /** "Móvel de fila" → "MOVEL DE FILA" (mesma regra de normId_ no Code.gs, sem os pontos). */
  const idDoNome = (nome) => String(nome).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\./g, '').toUpperCase().replace(/\s+/g, ' ').trim();

  /** Próximo número livre do tipo na planta: { id: "GONDOLA 3", descricao: "Gôndola 3" }. */
  function idLivre(tipo) {
    const nome = TIPOS[tipo] ? TIPOS[tipo].nome : nomeTipo(tipo);
    const prefixo = idDoNome(nome);
    const ids = new Set(c.planta.moveis.map((m) => m.id));
    for (let i = 1; ; i++) {
      if (!ids.has(prefixo + ' ' + i)) return { id: prefixo + ' ' + i, descricao: nome + ' ' + i };
    }
  }

  function adicionar(tipo) {
    const t = TIPOS[tipo];
    const L = c.planta.loja;
    registrar();
    const novo = idLivre(tipo);
    const m = {
      id: novo.id, descricao: novo.descricao, tipo, dividido: '',
      x: arred(Math.round((L.largura - t.tam[0]) / 2)), y: arred(Math.round((L.profundidade - t.tam[1]) / 2)), z: 0,
      w: t.tam[0], d: t.tam[1], h: t.tam[2], ajusteX: 0, ajusteY: 0,
    };
    // Se o centro já estiver ocupado, desloca na diagonal até achar um lugar livre.
    const ocupa = (a, o) => a.x < o.x + o.w && o.x < a.x + a.w && a.y < o.y + o.d && o.y < a.y + a.d;
    const piso = c.planta.moveis.filter((o) => !ehExtra(o));
    for (let i = 0; i < 12 && piso.some((o) => ocupa(m, o)); i++) {
      m.x = arred(Math.min(L.largura - m.w, m.x + 1));
      m.y = arred(Math.min(L.profundidade - m.d, m.y + 1));
    }
    c.planta.moveis.push(m);
    preencherLista();
    selecionar(m.id);
  }

  function duplicar() {
    const m = movelSelecionado();
    if (!m) return;
    registrar();
    const novo = idLivre(m.tipo);
    const copia = Object.assign(clonar(m), { id: novo.id, descricao: novo.descricao, x: arred(m.x + 1), y: arred(m.y + 1), ajusteX: 0, ajusteY: 0, ajustesEspacos: {} });
    c.planta.moveis.push(copia);
    preencherLista();
    selecionar(copia.id);
  }

  function excluir() {
    const m = movelSelecionado();
    if (!m) return;
    registrar();
    c.planta.moveis.splice(c.planta.moveis.indexOf(m), 1);
    preencherLista();
    selecionar('');
    app.toast('Móvel ' + m.id + ' excluído. Use Desfazer (Ctrl+Z) se foi engano.');
  }

  function girar() {
    const m = movelSelecionado();
    if (!m) return;
    registrar();
    if (m.tipo === 'VITRINE_L') {
      // Balcão em L (lados iguais): gira 90° mudando o canto onde os dois braços se encontram.
      m.giro = ((m.giro || 0) + 90) % 360;
      preencherFormulario();
      redesenhar();
      return;
    }
    // Gira em torno do centro: troca largura e fundo.
    const cx = m.x + m.w / 2;
    const cy = m.y + m.d / 2;
    const w = m.w;
    m.w = m.d;
    m.d = w;
    m.x = arred(cx - m.w / 2);
    m.y = arred(cy - m.d / 2);
    preencherFormulario();
    redesenhar();
  }

  function mover(dx, dy) {
    const m = movelSelecionado();
    if (!m || m.tipo === 'EXTRA') return;
    registrar();
    m.x = arred(m.x + dx);
    m.y = arred(m.y + dy);
    preencherFormulario();
    redesenhar();
  }

  function novaPlanta() {
    if (!podeSair()) return;
    const ids = app.estado.dados.plantas.map((p) => p.id);
    let n = ids.length + 1;
    let id = (n < 10 ? '0' : '') + n;
    while (ids.indexOf(id) >= 0) { n++; id = (n < 10 ? '0' : '') + n; }
    const base = c.planta;
    c.planta = {
      id, nome: nomePlanta(id),
      loja: { largura: 20, profundidade: 18, alturaParede: 4.6 },
      // Começa com as paredes e os extras da planta atual (ajuste depois).
      moveis: clonar(base.moveis.filter((m) => m.tipo === 'GONDOLA_PAREDE' || m.tipo === 'EXTRA')),
    };
    c.nova = true;
    c.historico = [];
    c.sessao++;
    c.versao = 0;
    c.versaoSalva = 0;
    c.erroSalvar = '';
    c.inicial = clonar(c.planta);
    c.selecionado = '';
    lerReferencia(id);
    preencherTudo();
    app.desenhar();
    app.toast('Planta nova: monte o layout e use Salvar como… para dar o nome.');
  }

  /** Layout de uma planta no formato do salvarLayout (Code.gs). */
  function layoutDe(p) {
    return {
      loja: p.loja,
      moveis: p.moveis.map((m) => ({
        id: m.id, descricao: m.descricao, tipo: m.tipo, x: m.x, y: m.y, z: m.z, w: m.w, d: m.d, h: m.h,
        ajusteX: m.ajusteX || 0, ajusteY: m.ajusteY || 0, dividido: m.dividido || '', giro: m.giro || 0,
        ajustesEspacos: m.ajustesEspacos || {},
      })),
    };
  }

  /**
   * Salvar como…: a planta da tela já salva sozinha; aqui o layout vai para uma planta nova (com nome) ou
   * substitui outra planta existente.
   */
  function salvar() {
    salvarPendente();
    const p = c.planta;
    const plantas = app.estado.dados.plantas;
    const existe = plantas.some((x) => x.id === p.id);
    const sel = $('spPlanta');
    sel.innerHTML = '';
    plantas.forEach((x) => sel.add(new Option(x.nome + (x.id === p.id ? ' (a que está na tela)' : ''), x.id)));
    if (existe) sel.value = p.id;
    $('formSalvarPlanta').querySelector('[value="nova"]').checked = true;
    $('spNome').value = '';
    $('spErro').hidden = true;
    atualizarDialogoSalvar();
    $('dlgSalvarPlanta').showModal();
    $('spNome').focus();
  }

  function destinoSalvar() {
    return $('formSalvarPlanta').querySelector('[name="spDestino"]:checked').value;
  }

  function atualizarDialogoSalvar() {
    const nova = destinoSalvar() === 'nova';
    $('spPlanta').disabled = nova;
    $('spNome').disabled = !nova;
    const alvo = app.estado.dados.plantas.find((x) => x.id === $('spPlanta').value);
    $('spAviso').textContent = nova
      ? 'A planta nova entra no fim da cascata, com o próximo número livre. Depois, ajuste a ordem e o nome em Desenvolvedor › Plantas.'
      : alvo && alvo.id !== c.planta.id
        ? 'O layout da ' + alvo.nome + ' será trocado pelo que está na tela (os ciclos dela continuam).'
        : 'O layout desta planta será trocado pelo que está na tela.';
    $('spSalvar').textContent = nova ? 'Criar planta' : 'Substituir';
  }

  async function confirmarSalvar(ev) {
    ev.preventDefault();
    const nova = destinoSalvar() === 'nova';
    const nome = $('spNome').value.trim();
    const destino = nova ? 'NOVA' : $('spPlanta').value;
    if (nova && !nome) {
      $('spErro').textContent = 'Dê um nome para a planta nova.';
      $('spErro').hidden = false;
      $('spNome').focus();
      return;
    }
    $('spSalvar').disabled = true;
    try {
      app.carregando(true, nova ? 'Criando a planta ' + nome + '…' : 'Salvando o layout…');
      const r = await app.chamar('salvarLayout', app.acesso(), destino, layoutDe(c.planta), nova ? nome : '');
      $('dlgSalvarPlanta').close();
      c.historico = [];
      c.nova = false;
      c.vazia = false;
      c.sessao++;
      c.versao = 0;
      c.versaoSalva = 0;
      c.planta.id = r.planta;
      await app.carregar({ planta: r.planta });
      app.toast((nova ? 'Planta criada: ' : 'Layout salvo: ') + r.nome + ' (' + r.moveis + ' móveis).');
    } catch (e) {
      $('spErro').textContent = (e && e.message) || String(e);
      $('spErro').hidden = false;
    } finally {
      $('spSalvar').disabled = false;
      app.carregando(false);
    }
  }

  /** Desfazer tudo: volta a planta ao que era quando abriu no editor (e salva). */
  function descartar() {
    if (!c.historico.length || !window.confirm('Voltar a planta ao que era quando você abriu o Construir loja?')) return;
    registrar();
    c.planta = clonar(c.inicial);
    c.selecionado = '';
    preencherTudo();
    app.desenhar();
  }

  /* --------------------------- imagem de referência ------------------------ */

  const chaveRef = (id) => 'planoVarejo.referencia.' + id;

  function lerReferencia(id) {
    if (c.referencias[id]) return;
    try {
      const salvo = JSON.parse(window.localStorage.getItem(chaveRef(id)));
      if (salvo && salvo.src) c.referencias[id] = salvo;
    } catch (e) { /* sem armazenamento */ }
  }

  function gravarReferencia(id) {
    try {
      if (c.referencias[id]) window.localStorage.setItem(chaveRef(id), JSON.stringify(c.referencias[id]));
      else window.localStorage.removeItem(chaveRef(id));
    } catch (e) { /* imagem grande demais para guardar: fica só nesta sessão */ }
  }

  /** Reduz a imagem para 1920 px (JPEG) para caber no armazenamento do navegador. */
  function carregarImagem(arquivo) {
    if (!arquivo) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1920 / img.width);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k);
        cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        const id = c.planta.id;
        c.referencias[id] = { src: cv.toDataURL('image/jpeg', 0.82), opacidade: Number($('cnsOpacidade').value) / 100, zoom: 1, dx: 0, dy: 0 };
        gravarReferencia(id);
        preencherTudo();
        app.desenhar();
      };
      img.onerror = () => app.erro(new Error('Não foi possível ler a imagem.'));
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
    $('cnsArquivoImagem').value = '';
  }

  /* ------------------------------ arraste --------------------------------- */

  function pontoSvg(svg, ev) {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function ligarArraste(svg) {
    // No toque, arrastar um móvel não pode rolar nem dar zoom na página (o piso vazio continua rolando).
    svg.addEventListener('touchstart', (ev) => {
      if (c.ativo && ev.target.closest && ev.target.closest('g.movel')) ev.preventDefault();
    }, { passive: false });
    svg.addEventListener('pointerdown', (ev) => {
      if (!c.ativo || ev.button !== 0) return;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // libera os atalhos
      const alvo = ev.target.closest('g.movel');
      if (!alvo) { selecionar(''); return; } // clique no piso vazio desmarca
      ev.preventDefault();
      selecionar(alvo.getAttribute('data-movel'));
      const m = movelSelecionado();
      if (!m) return;
      const inicio = pontoSvg(svg, ev);
      const orig = { x: m.x, y: m.y };
      let registrou = false;
      c.arrastando = true;
      $('cnsFlutuante').hidden = true;
      svg.setPointerCapture(ev.pointerId);
      const mover = (e) => {
        const p = pontoSvg(svg, e);
        // Converte o deslocamento na tela em deslocamento no piso (plano z = 0).
        const a = (p.x - inicio.x) / (COS30 * c.escala);
        const b = (2 * (p.y - inicio.y)) / c.escala;
        const passo = e.altKey ? 0.1 : c.passo;
        const encaixar = (v) => arred(Math.round(v / passo) * passo);
        const nx = encaixar(orig.x + (a + b) / 2);
        const ny = encaixar(orig.y + (b - a) / 2);
        if (nx === m.x && ny === m.y) return;
        if (!registrou) { registrar(); registrou = true; }
        m.x = nx;
        m.y = ny;
        preencherFormulario();
        redesenhar();
      };
      const soltar = () => {
        c.arrastando = false;
        if (registrou) mudou();
        svg.removeEventListener('pointermove', mover);
        svg.removeEventListener('pointerup', soltar);
        svg.removeEventListener('pointercancel', soltar);
        posicionarBarra();
      };
      svg.addEventListener('pointermove', mover);
      svg.addEventListener('pointerup', soltar);
      svg.addEventListener('pointercancel', soltar);
    });
  }

  /** Atalhos de teclado (o App só repassa quando o foco não está num campo). */
  function tecla(e) {
    const ctrl = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (ctrl && k === 'z') { e.preventDefault(); desfazer(); return; }
    if (ctrl && k === 'd') { e.preventDefault(); duplicar(); return; }
    if (ctrl || e.altKey) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); excluir(); return; }
    if (e.key === 'Escape') { selecionar(''); return; }
    if (k === 'r') { girar(); return; }
    const mapa = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] };
    const d = mapa[e.key];
    if (!d) return;
    e.preventDefault();
    const passo = c.passo * (e.shiftKey ? 5 : 1);
    mover(d[0] * passo, d[1] * passo);
  }

  /* ------------------------------ eventos --------------------------------- */

  /** Campo de formulário: a foto para o Desfazer é tirada ao focar e só entra no histórico se o valor mudar. */
  function campo(el, aplicar) {
    let foto = null;
    el.addEventListener('focus', () => { foto = JSON.stringify({ planta: c.planta, selecionado: c.selecionado }); });
    el.addEventListener('input', () => {
      if (!c.planta || aplicar(el.value) === false) return;
      if (foto) {
        c.historico.push(foto);
        if (c.historico.length > MAX_HISTORICO) c.historico.shift();
        foto = null;
      }
      mudou();
      redesenhar();
    });
  }

  function ligar() {
    ligarArraste($('slide'));

    const paleta = $('cnsPaleta');
    Object.keys(TIPOS).forEach((t) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.title = 'Adicionar ' + TIPOS[t].nome.toLowerCase();
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + TIPOS[t].icone + '"/></svg>';
      b.appendChild(document.createTextNode(TIPOS[t].nome));
      b.addEventListener('click', () => adicionar(t));
      paleta.appendChild(b);
    });
    ['cnsDividirA', 'cnsDividirB'].forEach((id) => {
      $(id).addEventListener('change', () => {
        const m = movelSelecionado();
        if (!m) return;
        registrar();
        m.dividido = ($('cnsDividirA').checked ? 'A' : '') + ($('cnsDividirB').checked ? 'B' : '');
        preencherFormulario();
        redesenhar();
      });
    });

    // Campos numéricos (loja e móvel).
    const numero = (v) => parseFloat(String(v).replace(',', '.'));
    const lojaCampos = { cnsLargura: 'largura', cnsProfundidade: 'profundidade', cnsAltura: 'alturaParede' };
    Object.keys(lojaCampos).forEach((id) => {
      campo($(id), (valor) => {
        const v = numero(valor);
        if (!isFinite(v) || v <= 0) return false;
        c.planta.loja[lojaCampos[id]] = v;
      });
    });
    $('cnsForm').querySelectorAll('[data-campo]').forEach((inp) => {
      const k = inp.getAttribute('data-campo');
      campo(inp, (valor) => {
        const m = movelSelecionado();
        const v = numero(valor);
        if (!m || !isFinite(v)) return false;
        m[k] = ['w', 'd', 'h'].indexOf(k) >= 0 ? Math.max(0.1, v) : v;
        if (m.tipo === 'VITRINE_L' && (k === 'w' || k === 'd')) {
          m.w = m[k]; // balcão recepção: os dois lados sempre do mesmo tamanho
          m.d = m[k];
          $('cnsForm').querySelector('[data-campo="' + (k === 'w' ? 'd' : 'w') + '"]').value = m[k];
        }
      });
    });
    $('cnsDescricao').addEventListener('change', (e) => {
      const m = movelSelecionado();
      if (!m || m.descricao === e.target.value) return;
      registrar();
      m.descricao = e.target.value;
      preencherLista();
    });
    $('cnsTipo').addEventListener('change', (e) => {
      const m = movelSelecionado();
      if (!m) return;
      registrar();
      m.tipo = e.target.value;
      if (m.tipo === 'VITRINE_L') m.d = m.w = Math.max(m.w, m.d);
      preencherFormulario();
      preencherLista();
      redesenhar();
    });
    $('cnsId').addEventListener('change', (e) => {
      const m = movelSelecionado();
      const novo = idDoNome(e.target.value);
      if (!m || novo === m.id) return;
      if (!novo || novo === 'LOJA' || c.planta.moveis.some((x) => x.id === novo)) {
        app.erro(new Error('ID vazio ou já usado nesta planta.'));
        e.target.value = m.id;
        return;
      }
      registrar();
      m.id = novo;
      c.selecionado = novo;
      preencherLista();
      redesenhar();
    });

    $('cnsLista').addEventListener('change', (e) => selecionar(e.target.value));
    $('cnsFlutuante').addEventListener('click', (e) => {
      const acao = e.target.getAttribute('data-acao');
      if (acao === 'girar') girar();
      else if (acao === 'duplicar') duplicar();
      else if (acao === 'excluir') excluir();
    });
    $('cnsNovaPlanta').addEventListener('click', novaPlanta);
    $('cnsCarregarSalvos').addEventListener('click', carregarSalvos);

    $('cnsImagem').addEventListener('click', () => $('cnsArquivoImagem').click());
    $('cnsArquivoImagem').addEventListener('change', (e) => carregarImagem(e.target.files[0]));
    $('cnsTirarImagem').addEventListener('click', () => {
      delete c.referencias[c.planta.id];
      gravarReferencia(c.planta.id);
      preencherTudo();
      app.desenhar();
    });
    $('cnsOpacidade').addEventListener('input', (e) => {
      const ref = c.referencias[c.planta.id];
      if (!ref) return;
      ref.opacidade = Number(e.target.value) / 100;
      redesenhar();
    });
    $('cnsOpacidade').addEventListener('change', () => gravarReferencia(c.planta.id));
    [['cnsRefZoom', 'zoom', 0.01], ['cnsRefX', 'dx', 1], ['cnsRefY', 'dy', 1]].forEach(([id, chave, fator]) => {
      $(id).addEventListener('input', (e) => {
        const ref = c.referencias[c.planta.id];
        const v = parseFloat(e.target.value);
        if (!ref || !isFinite(v) || (chave === 'zoom' && v <= 0)) return;
        ref[chave] = v * fator;
        redesenhar();
      });
      $(id).addEventListener('change', () => gravarReferencia(c.planta.id));
    });
    $('cnsGrade').addEventListener('change', (e) => { c.grade = e.target.checked; redesenhar(); });
    $('cnsMostrarCiclo').addEventListener('change', (e) => { c.mostrarCiclo = e.target.checked; redesenhar(); });
    $('cnsPasso').addEventListener('change', (e) => { c.passo = Number(e.target.value); });

    $('cnsDesfazer').addEventListener('click', desfazer);
    $('cnsSalvar').addEventListener('click', salvar);
    $('formSalvarPlanta').addEventListener('submit', confirmarSalvar);
    $('formSalvarPlanta').addEventListener('change', atualizarDialogoSalvar);
    $('spCancelar').addEventListener('click', () => $('dlgSalvarPlanta').close());
    $('cnsDescartar').addEventListener('click', descartar);
    $('cnsStatus').addEventListener('click', () => { if (c.erroSalvar) { c.erroSalvar = ''; salvarAuto(); } });
    // Fechar a página com uma gravação pendente: o navegador pergunta antes.
    window.addEventListener('beforeunload', (e) => {
      if (!c.ativo || !(c.timer || c.salvando || sujo())) return;
      salvarPendente();
      e.preventDefault();
      e.returnValue = '';
    });
    $('cnsFechar').addEventListener('click', fechar);
    window.addEventListener('resize', () => { posicionarBarra(); ajustarAltura(); });
  }

  function iniciar(api) {
    app = api;
    ligar();
  }

  return {
    iniciar,
    abrir,
    fechar,
    ativo: () => c.ativo,
    podeSair,
    contexto,
    aposDesenhar,
    sincronizar,
    tecla,
    layoutDe,
    novaPlanta,
  };
})();
</script>
